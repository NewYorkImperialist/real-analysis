# The canonical learning path through the problem bank.
#
# A learner starts at the first Foundations problem and presses "Next" through every problem to the
# end of Sequences & Series of Functions; the site orders every problem by its position here.
#
# - Topics appear in taxonomy order (data/taxonomy.yaml).
# - Within a topic the order is curated from the mathematics (see curation/CURRICULUM_BRIEF.md): a
#   problem comes after the definitions, theorems and techniques it uses, counterexamples after the
#   claims they test; difficulty only breaks ties.
# - Core problems come first; upper-tier problems (optional detours) follow all core problems of
#   their topic.
# - The "# group:" comments name the clusters of the path.
#
# To add a problem, insert its id here under its own topic at the right point. scripts/build-data.mjs
# checks that every problem appears exactly once, under its own topic, with core before upper tier.


- id: mit20-a11-5
  hints:
    - |
      All subintervals of $\underline{x}^{(r)}$ have the same length, and the tag in the $k$-th subinterval is its right endpoint. Write the Riemann sum out explicitly as a finite sum over $k$.
    - |
      After substituting $f(\xi_k) = \alpha\bigl(a + (b-a)\tfrac{k}{r}\bigr) + \beta$, the only nontrivial sum is $\sum_{k=1}^r k = \frac{r(r+1)}{2}$. Then let $r \to \infty$ and simplify.
  solution: |
    **(a)** The partition points are $x_k = a + (b-a)\frac{k}{r}$, so every subinterval has length $x_k - x_{k-1} = \frac{b-a}{r}$. The mesh is the largest subinterval length, so
    $$\|\underline{x}^{(r)}\| = \frac{b-a}{r}.$$

    **(b)** The tag in $[x_{k-1}, x_k]$ is $\xi_k = x_k = a + (b-a)\frac{k}{r}$, for $k = 1, \dots, r$. Then
    $$
    \begin{aligned}
    S_f\bigl(\underline{x}^{(r)}, \underline{\xi}^{(r)}\bigr)
    &= \sum_{k=1}^r f(\xi_k)\,\frac{b-a}{r}
     = \frac{b-a}{r}\sum_{k=1}^r \Bigl(\alpha a + \beta + \alpha(b-a)\frac{k}{r}\Bigr) \\
    &= (b-a)(\alpha a + \beta) + \frac{\alpha (b-a)^2}{r^2}\sum_{k=1}^r k
     = (b-a)(\alpha a + \beta) + \alpha (b-a)^2\,\frac{r(r+1)}{2r^2}.
    \end{aligned}
    $$
    Since $\frac{r(r+1)}{2r^2} = \frac12\bigl(1 + \frac1r\bigr) \to \frac12$, the algebraic limit laws give
    $$\lim_{r\to\infty} S_f\bigl(\underline{x}^{(r)}, \underline{\xi}^{(r)}\bigr) = (b-a)(\alpha a + \beta) + \frac{\alpha(b-a)^2}{2} = \alpha(b-a)\,\frac{2a + (b-a)}{2} + \beta(b-a).$$
    Since $(b-a)(a+b) = b^2 - a^2$, this equals $\alpha\,\dfrac{b^2-a^2}{2} + \beta(b-a)$. No antiderivatives were used. $\blacksquare$

- id: mit20-final-5b
  hints:
    - |
      The remainder integral contains $f''(t)$ multiplied by a polynomial in $t$. Integration by parts can move one derivative off $f''$.
    - |
      Integrate by parts with $u(t) = x - t$ and $v'(t) = f''(t)$, so $v = f'$. The boundary term at $t = x$ vanishes. The leftover integral of $f'$ is evaluated by the FTC.
  solution: |
    Fix $c < x$ and work on $[c,x]$ with variable $t$. Put $u(t) = x - t$ and $v(t) = f'(t)$. Both are continuously differentiable on $[c,x]$, with $u'(t) = -1$ and $v'(t) = f''(t)$, because $f$ is $C^2$. Integration by parts gives
    $$\int_c^x f''(t)(x-t)\,dt = \int_c^x u\,v' = \Bigl[u(t)v(t)\Bigr]_{t=c}^{t=x} - \int_c^x u'\,v = \bigl(0\cdot f'(x) - (x-c)f'(c)\bigr) + \int_c^x f'(t)\,dt.$$
    Since $f'$ is continuous with antiderivative $f$, the fundamental theorem of calculus gives $\int_c^x f'(t)\,dt = f(x) - f(c)$. Hence
    $$\int_c^x f''(t)(x-t)\,dt = -f'(c)(x-c) + f(x) - f(c).$$
    Rearranging gives $f(x) = f(c) + f'(c)(x-c) + \int_c^x f''(t)(x-t)\,dt$. $\blacksquare$

- id: mit20-final-6c
  hints:
    - |
      Following the given hint, integrate by parts. This produces a factor $\frac1n$ in front of everything.
    - |
      After integrating by parts you get a boundary term and an integral of $\cos(nx) f'(x)$. Bound each using $|\cos| \le 1$ and the fact that $f'$ is continuous on a closed interval, hence bounded.
  solution: |
    Fix $n \ge 1$. The functions $u = f$ and $v(x) = -\frac1n \cos(nx)$ are continuously differentiable on $[-\pi,\pi]$, with $v'(x) = \sin(nx)$. Integration by parts gives
    $$\int_{-\pi}^{\pi} \sin(nx) f(x)\,dx = \Bigl[-\tfrac1n\cos(nx) f(x)\Bigr]_{-\pi}^{\pi} + \frac1n\int_{-\pi}^{\pi} \cos(nx) f'(x)\,dx.$$
    Since $f'$ is continuous on the compact interval $[-\pi,\pi]$, the extreme value theorem gives $B$ with $|f'(x)| \le B$ for all $x$. Using $|\cos| \le 1$, the triangle inequality and $\bigl|\int g\bigr| \le \int |g|$,
    $$\left|\int_{-\pi}^{\pi} \sin(nx) f(x)\,dx\right| \le \frac{|f(\pi)| + |f(-\pi)|}{n} + \frac{1}{n}\int_{-\pi}^{\pi} B\,dx = \frac{|f(\pi)| + |f(-\pi)| + 2\pi B}{n}.$$
    The numerator does not depend on $n$, so the right side tends to $0$, and the squeeze theorem gives $\displaystyle\lim_{n\to\infty}\int_{-\pi}^{\pi}\sin(nx)f(x)\,dx = 0$. $\blacksquare$

- id: abbott-7.2.3
  hints:
    - |
      For (a), recall the chain $L(f,P) \le L(f) \le U(f) \le U(f,P)$, which holds for every partition $P$. What does it say when $U(f,P_n) - L(f,P_n) \to 0$?
    - |
      For the forward direction of (a), use the definitions of $U(f)$ as an infimum and $L(f)$ as a supremum to find, for each $n$, partitions within $\frac1{2n}$ of each. Then take a common refinement.
    - |
      For (b), $f(x) = x$ is increasing, so on each subinterval $\bigl[\frac{k-1}{n}, \frac kn\bigr]$ the supremum and infimum are attained at the endpoints.
  solution: |
    **(a)** *($\Leftarrow$)* Suppose $U(f,P_n) - L(f,P_n) \to 0$. For every $n$,
    $$L(f,P_n) \le L(f) \le U(f) \le U(f,P_n),$$
    so $0 \le U(f) - L(f) \le U(f,P_n) - L(f,P_n)$. Letting $n \to \infty$ gives $U(f) = L(f)$, so $f$ is integrable.

    *($\Rightarrow$)* Suppose $f$ is integrable and let $I = U(f) = L(f)$. Fix $n$. Since $U(f) = \inf_P U(f,P)$, there is a partition $Q_n$ with $U(f,Q_n) < I + \frac1{2n}$. Since $L(f) = \sup_P L(f,P)$, there is a partition $R_n$ with $L(f,R_n) > I - \frac1{2n}$. Let $P_n = Q_n \cup R_n$. Refining lowers upper sums and raises lower sums, so
    $$U(f,P_n) - L(f,P_n) \le U(f,Q_n) - L(f,R_n) < \tfrac1n \to 0.$$

    *(Value.)* In either case, if $U(f,P_n) - L(f,P_n) \to 0$ and $f$ is integrable, then $L(f,P_n) \le \int_a^b f \le U(f,P_n)$. Hence
    $$0 \le U(f,P_n) - \int_a^b f \le U(f,P_n) - L(f,P_n) \to 0, \qquad 0 \le \int_a^b f - L(f,P_n) \le U(f,P_n) - L(f,P_n) \to 0,$$
    so $\lim U(f,P_n) = \lim L(f,P_n) = \int_a^b f$.

    **(b)** $P_n = \{0, \frac1n, \frac2n, \dots, 1\}$. Since $f(x) = x$ is increasing, on $\bigl[\frac{k-1}n, \frac kn\bigr]$ we have $\sup f = \frac kn$ and $\inf f = \frac{k-1}n$. Each subinterval has length $\frac1n$, so
    $$U(f,P_n) = \sum_{k=1}^n \frac kn\cdot\frac1n = \frac{1}{n^2}\cdot\frac{n(n+1)}2 = \frac{n+1}{2n},\qquad L(f,P_n) = \sum_{k=1}^n \frac{k-1}{n}\cdot\frac1n = \frac{1}{n^2}\cdot\frac{(n-1)n}{2} = \frac{n-1}{2n}.$$

    **(c)** By (b), $U(f,P_n) - L(f,P_n) = \frac{2}{2n} = \frac1n \to 0$. By (a), $f$ is integrable on $[0,1]$ and
    $$\int_0^1 x\,dx = \lim_{n\to\infty}\frac{n+1}{2n} = \frac12.$$

- id: abbott-7.3.5
  hints:
    - |
      Abbott works with bounded functions throughout Chapter 7. Recall which kinds of limits preserve integrability and which do not.
    - |
      For (a), the rationals in $[0,1]$ can be listed as $r_1, r_2, \dots$. Turn them "on" one at a time.
    - |
      For (b), combine two facts: bounded functions with finitely many discontinuities are integrable, and a uniform limit of integrable functions is integrable. For (c), a tiny multiple of a badly non-integrable function is uniformly small.
  solution: |
    Throughout, as in Abbott's Chapter 7, the functions are assumed bounded on $[a,b]$. Without that assumption the questions become trivial in an uninteresting way; see the remark in (b).

    **(a) Possible.** Enumerate $\mathbb{Q}\cap[0,1] = \{r_1, r_2, r_3, \dots\}$ and define on $[0,1]$
    $$f_n(x) = \begin{cases} 1 & x \in \{r_1,\dots,r_n\} \\ 0 & \text{otherwise.}\end{cases}$$
    Each $f_n$ is discontinuous only at the $n$ points $r_1, \dots, r_n$. Pointwise, $f_n \to f$, where $f$ is Dirichlet's function: $f = 1$ on $\mathbb{Q}$ and $f = 0$ off $\mathbb{Q}$. Indeed, for irrational $x$, $f_n(x) = 0$ for all $n$. For $x = r_m$, $f_n(x) = 1$ for all $n \ge m$. Every subinterval of every partition contains both rationals and irrationals, so $U(f,P) = 1$ and $L(f,P) = 0$ for all $P$. Hence $U(f) = 1 \ne 0 = L(f)$, and $f$ is not integrable.

    **(b) Impossible.** Suppose each bounded $g_n$ has finitely many discontinuities and $g_n \to g$ uniformly on $[a,b]$. A bounded function with finitely many discontinuities is integrable (Abbott §7.3), so each $g_n$ is integrable. Then $g$ is integrable, because uniform limits of integrable functions are integrable. Briefly: given $\epsilon > 0$, choose $N$ with $|g_N - g| < \eta := \frac{\epsilon}{4(b-a)}$ on $[a,b]$. This also shows $g$ is bounded. Choose $P$ with $U(g_N,P) - L(g_N,P) < \frac\epsilon2$. On each subinterval, $\sup g \le \sup g_N + \eta$ and $\inf g \ge \inf g_N - \eta$, so
    $$U(g,P) - L(g,P) \le U(g_N,P) - L(g_N,P) + 2\eta(b-a) < \epsilon.$$
    *Remark.* If unbounded functions were allowed, the constant sequence $g_n = g$ with $g(x) = 1/x$ for $x \in (0,1]$ and $g(0) = 0$ would be a trivial "example". It has one discontinuity and is not integrable because it is unbounded. This is clearly not the intended reading.

    **(c) Possible.** On $[0,1]$ let $D$ be Dirichlet's function from (a) and put $h_n = \frac1n D$ and $h = 0$. Then $\sup_x |h_n(x) - h(x)| = \frac1n \to 0$, so $h_n \to 0$ uniformly, and $h = 0$ is integrable. But every subinterval contains rationals and irrationals, so $U(h_n,P) = \frac1n$ and $L(h_n,P) = 0$ for every $P$. Hence $U(h_n) = \frac1n \ne 0 = L(h_n)$, and no $h_n$ is integrable.

- id: abbott-7.3.7
  hints:
    - |
      For (a), write $g = f + (g - f)$. You only need to show that a bounded function that is zero except at finitely many points is integrable.
    - |
      If $h$ is nonzero only at $p_1, \dots, p_k$, each $p_j$ lies in at most two subintervals of a partition. Use partitions whose subintervals are all short.
    - |
      For (b), start from a very nice $f$ and change it on the rationals.
  solution: |
    **(a)** Let $h = g - f$. Then $h(x) = 0$ except at finitely many points $p_1, \dots, p_k$. If $k = 0$, then $g = f$ and there is nothing to prove, so assume $k \ge 1$. The function $h$ takes only finitely many nonzero values, so it is bounded. Let $M = 1 + \max_j |h(p_j)|$, so that $|h| \le M$ everywhere.

    **Claim.** $h$ is integrable. Given $\epsilon > 0$, let $\delta = \frac{\epsilon}{4kM}$, and let $P$ be any partition of $[a,b]$ all of whose subintervals have length less than $\delta$. On a subinterval containing none of the $p_j$, $h \equiv 0$, so $\sup h - \inf h = 0$. Each $p_j$ belongs to at most two subintervals, since subintervals overlap only at endpoints. So at most $2k$ subintervals contain some $p_j$, and on each of them $\sup h - \inf h \le 2M$. These subintervals (there is at least one, as $k \ge 1$) each have length $< \delta$, so
    $$U(h,P) - L(h,P) \le 2M\sum_{\text{such }i}\Delta x_i < 2M\cdot 2k\cdot\delta = \epsilon.$$
    By the integrability criterion (Theorem 7.2.8), $h$ is integrable. (In fact $\int h = 0$.)

    Since $f$ and $h$ are integrable, $g = f + h$ is integrable by linearity of the integral (Theorem 7.4.2).

    **(b)** On $[0,1]$ take $f \equiv 0$, which is integrable, and let $g(x) = 1$ for $x \in \mathbb{Q}$ and $g(x) = 0$ for $x \notin \mathbb{Q}$. Then $g$ differs from $f$ exactly on $\mathbb{Q}\cap[0,1]$, a countable set. Every subinterval of a partition contains both rationals and irrationals, so $U(g,P) = 1$ and $L(g,P) = 0$ for every $P$. Hence $U(g) = 1 \ne 0 = L(g)$, and $g$ is not integrable.

- id: abbott-7.5.2
  hints:
    - |
      Two of the three statements are false. For each one, ask whether a derivative or an integral can "ignore" bad behavior of the function at a single point.
    - |
      For (a), look for a differentiable function whose derivative oscillates near a point, with the oscillation damped enough that the function itself stays differentiable there. For (b), which theorem produces a function with a prescribed derivative? For (c), how sensitive is $H$ to the value of $h$ at a single point?
  solution: |
    **(a) False.** On $[-1,1]$ let $h(x) = x^2\sin(1/x)$ for $x \ne 0$ and $h(0) = 0$. For $x \ne 0$, $h'(x) = 2x\sin(1/x) - \cos(1/x)$ by the product and chain rules. At $0$,
    $$h'(0) = \lim_{x\to0}\frac{x^2\sin(1/x)}{x} = \lim_{x\to0} x\sin(1/x) = 0,$$
    because $|x\sin(1/x)| \le |x|$. So $g = h'$ exists on all of $[-1,1]$. But $g$ is not continuous at $0$. Along $x_n = \frac{1}{2\pi n} \to 0$ we get $g(x_n) = 0 - 1 = -1$, which does not converge to $g(0) = 0$.

    **(b) True.** If $g$ is continuous on $[a,b]$, it is integrable. Let $h(x) = \int_a^x g$. By part (ii) of the fundamental theorem of calculus, $h$ is differentiable at every point where $g$ is continuous, with $h' = g$ there (one-sided at the endpoints). Since $g$ is continuous everywhere on $[a,b]$, $h' = g$ on $[a,b]$.

    **(c) False.** On $[0,2]$ let $h(1) = 1$ and $h(x) = 0$ for $x \ne 1$, and take $c = 1$. Then $h$ is integrable, and for every $x$ the integral $\int_0^x h$ equals $0$. This is Exercise 7.3.7(a): $h$ differs from the zero function at one point. So $H \equiv 0$, which is differentiable at $c = 1$ (with $H'(1) = 0$). But $h$ is not continuous at $1$, since $h(x) = 0$ for $x \ne 1$ while $h(1) = 1$.

- id: abbott-7.5.10
  hints:
    - |
      For (a), part (ii) of the FTC turns every continuous function into a derivative. Check that both $f$ and $(f\circ g)g'$ are continuous.
    - |
      For (b), let $F$ be an antiderivative of $f$ and differentiate $F\circ g$ with the chain rule. Then apply part (i) of the FTC to both sides.
    - |
      Small technical point: $F$ lives on $[c,d]$, and $g(x)$ may land on an endpoint. Extending $f$ continuously to all of $\mathbb{R}$ (constant outside $[c,d]$) avoids one-sided derivatives in the chain rule.
  solution: |
    **(a)** $f$ is continuous on $[c,d]$, hence integrable on every subinterval. By part (ii) of the fundamental theorem of calculus, $F(t) = \int_c^t f$ satisfies $F'(t) = f(t)$ for every $t \in [c,d]$, so $f$ is a derivative. Similarly, $g$ is continuous on $[a,b]$ (being differentiable), so $f\circ g$ is continuous, and $g'$ is continuous by hypothesis. Hence the product $(f\circ g)g'$ is continuous on $[a,b]$, and by the same theorem it is the derivative of $x \mapsto \int_a^x (f\circ g)g'$.

    **(b)** Extend $f$ to $\tilde f\colon\mathbb{R}\to\mathbb{R}$ by $\tilde f(t) = f(c)$ for $t < c$, $\tilde f = f$ on $[c,d]$, and $\tilde f(t) = f(d)$ for $t > d$. Then $\tilde f$ is continuous on $\mathbb{R}$. Define $F(t) = \int_c^t \tilde f$ for $t \in \mathbb{R}$, with the usual convention $\int_c^t = -\int_t^c$ when $t < c$. By FTC (ii), applied on intervals $[-R, R]$ containing $t$ in their interior, $F$ is differentiable on $\mathbb{R}$ with $F' = \tilde f$.

    Since $g$ is differentiable on $[a,b]$ and $F$ is differentiable at every point of $\mathbb{R}$, the chain rule gives, for $x \in [a,b]$,
    $$(F\circ g)'(x) = F'(g(x))\,g'(x) = \tilde f(g(x))\,g'(x) = f(g(x))\,g'(x),$$
    where the last step uses $g(x) \in [c,d]$. The right-hand side is continuous, hence integrable, on $[a,b]$. Part (i) of the FTC therefore gives
    $$\int_a^b f(g(x))g'(x)\,dx = F(g(b)) - F(g(a)) = \int_c^{g(b)} f - \int_c^{g(a)} f = \int_{g(a)}^{g(b)} f(t)\,dt.$$
    The last equality is additivity of the integral, with the orientation convention $\int_u^v = -\int_v^u$, which covers the case $g(b) < g(a)$. $\blacksquare$

- id: lebl-5.1.15
  hints:
    - |
      Write $U(P,f) - L(P,f)$ as a sum over the subintervals of $P$. What sign does each term have?
    - |
      A sum of nonnegative terms is zero only if every term is zero. So $\sup$ and $\inf$ of $f$ agree on each subinterval. Then use the shared endpoints to link neighboring subintervals.
  solution: |
    Let $P = \{x_0, \dots, x_n\}$ with $a = x_0 < x_1 < \dots < x_n = b$. Let $m_i = \inf_{[x_{i-1},x_i]} f$ and $M_i = \sup_{[x_{i-1},x_i]} f$. Then
    $$0 = U(P,f) - L(P,f) = \sum_{i=1}^n (M_i - m_i)\,\Delta x_i.$$
    Each term is $\ge 0$, since $M_i \ge m_i$ and $\Delta x_i > 0$, so every term is $0$. Because $\Delta x_i > 0$, this gives $M_i = m_i$ for each $i$. Any $y \in [x_{i-1},x_i]$ then satisfies $m_i \le f(y) \le M_i = m_i$, so $f$ is constant on $[x_{i-1},x_i]$, say $f \equiv c_i$ there.

    For $1 \le i \le n-1$, the point $x_i$ lies in both $[x_{i-1},x_i]$ and $[x_i,x_{i+1}]$, so $c_i = f(x_i) = c_{i+1}$. Hence $c_1 = c_2 = \dots = c_n$, and $f$ is constant on $[a,b] = \bigcup_i [x_{i-1},x_i]$. $\blacksquare$

- id: lebl-5.3.9
  hints:
    - |
      Consider $F(x) = \int_a^x f$ as a function on all of $[a,b]$. What do you know about $F$ on the rationals, and what regularity does $F$ have?
    - |
      $F$ is continuous and $\mathbb{Q}\cap[a,b]$ is dense in $[a,b]$, so $F \equiv 0$. Then apply the FTC to read off $f$.
  solution: |
    Let $F(x) = \int_a^x f$ for $x \in [a,b]$. Since $f$ is continuous, the fundamental theorem of calculus (second form) says $F$ is differentiable on $[a,b]$, one-sided at the endpoints, with $F' = f$. In particular $F$ is continuous.

    **Claim.** $F \equiv 0$ on $[a,b]$. Let $x \in [a,b]$. By density of $\mathbb{Q}$, there is a sequence of rationals $q_n \in [a,b]$ with $q_n \to x$. For instance, pick $q_n$ rational in $(x - \frac1n, x)\cap[a,b]$ if $x > a$, and in $(x, x+\frac1n)\cap[a,b]$ if $x = a$; both sets are nonempty open intervals for large $n$ because $a < b$. By hypothesis $F(q_n) = 0$, so continuity gives $F(x) = \lim F(q_n) = 0$.

    Since $F$ is identically $0$, its derivative is $0$ at every point of $[a,b]$, one-sided at the endpoints. Hence $f(x) = F'(x) = 0$ for all $x \in [a,b]$. $\blacksquare$

- id: lebl-5.5.10
  hints:
    - |
      For $\int_0^\infty f$ to be finite you do not need $f$ small everywhere, only small on most of the space. Tall, very thin spikes cost little area.
    - |
      Following the book's hint, on $[k,k+1]$ put a triangular "tent" of height $k$ whose base is so narrow that its area is at most $2^{-k}$. For nonnegative $f$, $t \mapsto \int_0^t f$ is increasing, so bounding it suffices.
  solution: |
    **Construction.** For $k \in \mathbb{N} = \{1,2,3,\dots\}$, let $c_k = k + \frac12$ and $w_k = \frac{1}{k\,2^{k+1}}$. Define
    $$f(x) = \begin{cases} 0 & 0 \le x \le 1, \\ \max\Bigl\{0,\ k - \dfrac{k}{w_k}\,|x - c_k|\Bigr\} & k \le x \le k+1,\ k \in \mathbb{N}. \end{cases}$$
    On $[k,k+1]$ this is a tent of height $k$ at $c_k$ that vanishes outside $(c_k - w_k, c_k + w_k)$. Since $w_k \le \frac14$, the tent's support lies in $\bigl(k+\frac14, k+\frac34\bigr)$, and $f$ is $0$ near each integer. So the cases agree at the integers. The formula is a max of continuous functions on each piece, and $f$ vanishes on a neighborhood of each integer, so $f$ is continuous on $[0,\infty)$. Clearly $f \ge 0$.

    **Unbounded.** $f(c_k) = k$ for every $k$, so $f$ is not bounded.

    **Finite integral.** The tent on $[k,k+1]$ is a triangle with base $2w_k$ and height $k$, so
    $$\int_k^{k+1} f = \tfrac12\cdot 2w_k\cdot k = \frac{1}{2^{k+1}}.$$
    (Alternatively, compute $2\int_{c_k - w_k}^{c_k} \frac{k}{w_k}(x - c_k + w_k)\,dx = k w_k$ by the FTC.) For $t \ge 0$ let $G(t) = \int_0^t f$. Since $f \ge 0$, $G$ is increasing. For $t \le n+1$,
    $$G(t) \le G(n+1) = \sum_{k=1}^n \frac{1}{2^{k+1}} < \frac12.$$
    Thus $G$ is increasing and bounded above on $[0,\infty)$, so $\lim_{t\to\infty} G(t)$ exists and is at most $\frac12$ (it equals $\sup G$). Hence $\int_0^\infty f$ converges and is finite. As expected from Exercise 5.5.9, $\lim_{x\to\infty} f(x)$ does not exist: $f(k) = 0$ while $f(c_k) = k$.

- id: ross-32.2
  hints:
    - |
      Assume $b > 0$. On any subinterval of positive length, $f$ takes the value $0$ (at irrationals) and values arbitrarily close to the right endpoint (at rationals). What are $\inf f$ and $\sup f$ there?
    - |
      The lower sums are all $0$. Each upper sum is $\sum t_k(t_k - t_{k-1})$. Compare it with $\sum \frac{t_k + t_{k-1}}{2}(t_k - t_{k-1})$, which telescopes.
  solution: |
    Take $b > 0$ and let $P = \{0 = t_0 < t_1 < \dots < t_n = b\}$ be any partition.

    **(a)** *Infima.* On $[t_{k-1},t_k]$ we have $f \ge 0$, since $f(x) = x \ge 0$ at rationals and $f = 0$ at irrationals. The interval contains an irrational, where $f = 0$. So $m(f,[t_{k-1},t_k]) = 0$, hence $L(f,P) = 0$ for every $P$ and $L(f) = 0$.

    *Suprema.* For every $x \in [t_{k-1},t_k]$, $f(x) \le \max(x,0) \le t_k$. Conversely, rationals $q \in (t_{k-1},t_k)$ can be chosen arbitrarily close to $t_k$, and $f(q) = q$. Hence $M(f,[t_{k-1},t_k]) = t_k$, and
    $$U(f,P) = \sum_{k=1}^n t_k(t_k - t_{k-1}).$$
    Since $\sum_{k=1}^n \frac{t_k + t_{k-1}}{2}(t_k - t_{k-1}) = \frac12\sum_{k=1}^n (t_k^2 - t_{k-1}^2) = \frac{b^2}{2}$, we get
    $$U(f,P) - \frac{b^2}{2} = \sum_{k=1}^n \frac{t_k - t_{k-1}}{2}(t_k - t_{k-1}) = \frac12\sum_{k=1}^n (t_k - t_{k-1})^2.$$
    This is $\ge 0$, so $U(f,P) \ge \frac{b^2}{2}$ for every $P$. If every $t_k - t_{k-1} \le \delta$, it is at most $\frac{\delta}{2}\sum (t_k - t_{k-1}) = \frac{\delta b}{2}$. Taking the uniform partition with small mesh shows $\inf_P U(f,P) = \frac{b^2}{2}$. Therefore
    $$U(f) = \frac{b^2}{2}, \qquad L(f) = 0.$$

    **(b)** No. Since $b > 0$, $U(f) = \frac{b^2}{2} \ne 0 = L(f)$, so $f$ is not integrable on $[0,b]$.

- id: ross-33.4
  hints:
    - |
      Taking absolute values destroys sign information. Find a function that is badly non-integrable because of its sign, but whose absolute value is constant.
    - |
      Keep the rational/irrational split from Example 2, but change the two values so that they have the same absolute value while the upper and lower sums still disagree.
  solution: |
    On $[0,1]$ let
    $$f(x) = \begin{cases} 1 & x \in \mathbb{Q}, \\ -1 & x \notin \mathbb{Q}. \end{cases}$$

    *$f$ is not integrable.* Every subinterval $[t_{k-1},t_k]$ of positive length contains both rationals and irrationals, so $M(f,[t_{k-1},t_k]) = 1$ and $m(f,[t_{k-1},t_k]) = -1$. Hence for every partition $P$, $U(f,P) = 1$ and $L(f,P) = -1$. So $U(f) = 1 \ne -1 = L(f)$.

    *$|f|$ is integrable.* $|f(x)| = 1$ for all $x$, a constant function. For every partition, $U(|f|,P) = L(|f|,P) = 1$, so $|f|$ is integrable with $\int_0^1 |f| = 1$.

- id: ross-34.12
  hints:
    - |
      The hypothesis holds for every continuous $g$. Which particular $g$ makes the integrand obviously nonnegative?
    - |
      Take $g = f$. Then show that a continuous nonnegative function with zero integral must vanish, using continuity to find a small interval where it is bounded below by a positive constant.
  solution: |
    Since $f$ is continuous, we may take $g = f$, which gives $\int_a^b f(x)^2\,dx = 0$. Let $h = f^2$. Then $h$ is continuous and $h \ge 0$ on $[a,b]$.

    Suppose, for contradiction, that $h(x_0) = c > 0$ for some $x_0 \in [a,b]$. By continuity there is $\delta > 0$ such that $h(x) > c/2$ for all $x \in [a,b]$ with $|x - x_0| < \delta$. Choose a closed interval $[\alpha,\beta] \subseteq [a,b]\cap(x_0 - \delta, x_0 + \delta)$ with $\alpha < \beta$. This is possible since $a < b$. By additivity and monotonicity of the integral, using $h \ge 0$ on the rest of $[a,b]$,
    $$\int_a^b h = \int_a^\alpha h + \int_\alpha^\beta h + \int_\beta^b h \ge 0 + \frac c2(\beta - \alpha) + 0 > 0,$$
    which contradicts $\int_a^b h = 0$. Hence $f(x)^2 = 0$, so $f(x) = 0$, for every $x \in [a,b]$. $\blacksquare$

- id: ross-36.3
  hints:
    - |
      For (a), compute $\int_c^1 x^{-p}\,dx$ exactly for $0 < c < 1$ using the antiderivative $\frac{x^{1-p}}{1-p}$ ($p \ne 1$). Then let $c \to 0^+$. The sign of $1-p$ decides everything.
    - |
      For (b), split $(0,\infty)$ at $1$. Both pieces have a positive integrand, so the total is $+\infty$ as soon as one piece is. Check which piece diverges for $p < 1$, $p = 1$ and $p > 1$.
  solution: |
    **(a)** Let $p > 0$ with $p \ne 1$, and let $0 < c < 1$. The function $x^{-p}$ is continuous on $[c,1]$ with antiderivative $\frac{x^{1-p}}{1-p}$, so by the fundamental theorem of calculus
    $$\int_c^1 x^{-p}\,dx = \frac{1 - c^{1-p}}{1-p}.$$
    *Case $0 < p < 1$.* Then $1 - p > 0$, so $c^{1-p} \to 0$ as $c \to 0^+$, and
    $$\int_0^1 x^{-p}\,dx = \lim_{c\to0^+}\frac{1 - c^{1-p}}{1-p} = \frac{1}{1-p}.$$
    *Case $p > 1$.* Write the integral as $\frac{c^{-(p-1)} - 1}{p-1}$ with $p - 1 > 0$. As $c \to 0^+$, $c^{-(p-1)} \to +\infty$, so $\int_0^1 x^{-p}\,dx = +\infty$.

    (For completeness, when $p = 1$ we have $\int_c^1 x^{-1}\,dx = -\log c \to +\infty$, which is Example 1.)

    **(b)** By Definition 36.1, $\int_0^\infty x^{-p}\,dx = \int_0^1 x^{-p}\,dx + \int_1^\infty x^{-p}\,dx$, splitting at $\alpha = 1$. Both pieces are integrals of a positive continuous function, so each is a number in $[0,\infty]$, and the sum is $+\infty$ as soon as one piece is $+\infty$.

    - If $0 < p < 1$: $\int_1^\infty x^{-p}\,dx = \lim_{d\to\infty}\frac{d^{1-p} - 1}{1-p} = +\infty$ (Example 2).
    - If $p = 1$: $\int_1^\infty x^{-1}\,dx = \lim_{d\to\infty}\log d = +\infty$ (Example 1).
    - If $p > 1$: $\int_0^1 x^{-p}\,dx = +\infty$ by (a).

    In every case $\int_0^\infty x^{-p}\,dx = +\infty$. $\blacksquare$

- id: mit20-a12-1
  hints:
    - |
      For (a), argue by contradiction. If $f(x_0) > 0$, continuity keeps $f$ above a positive constant on a whole interval.
    - |
      For (b), multiply the equation by $u$ and integrate over $[a,b]$. The useful theorem is integration by parts, applied to $\int u''u$. The boundary conditions kill the boundary term.
    - |
      You should arrive at $\int_a^b \bigl((u')^2 + Vu^2\bigr) = 0$ with a continuous nonnegative integrand. Apply (a), then conclude from $u' \equiv 0$ and $u(a) = 0$.
  solution: |
    The source has a typo in (a) ("for all $f \in [a,b]$"); we prove the intended statement, $f(x) = 0$ for all $x \in [a,b]$.

    **(a)** Suppose $f(x_0) = c > 0$ for some $x_0 \in [a,b]$. By continuity there is $\delta > 0$ with $f(x) > c/2$ whenever $x \in [a,b]$ and $|x - x_0| < \delta$. Choose $[\alpha,\beta] \subseteq [a,b]\cap(x_0-\delta,x_0+\delta)$ with $\alpha < \beta$. Using $f \ge 0$, additivity and monotonicity of the integral,
    $$\int_a^b f = \int_a^\alpha f + \int_\alpha^\beta f + \int_\beta^b f \ge 0 + \frac c2(\beta - \alpha) + 0 > 0,$$
    a contradiction. Hence $f \equiv 0$.

    **(b)** Multiply the equation by $u$ and integrate. All functions involved are continuous on $[a,b]$:
    $$0 = \int_a^b \bigl(-u''u + Vu^2\bigr) = -\int_a^b u''u + \int_a^b Vu^2.$$
    Since $u$ and $u'$ are continuously differentiable, integration by parts gives
    $$\int_a^b u''u = \Bigl[u'u\Bigr]_a^b - \int_a^b (u')^2 = u'(b)\cdot0 - u'(a)\cdot0 - \int_a^b (u')^2 = -\int_a^b (u')^2.$$
    Therefore
    $$\int_a^b \bigl((u')^2 + Vu^2\bigr) = 0.$$
    The integrand $(u')^2 + Vu^2$ is continuous and nonnegative, because $V \ge 0$. By (a), $(u'(x))^2 + V(x)u(x)^2 = 0$ for all $x$. Both summands are $\ge 0$, so $(u'(x))^2 = 0$, that is, $u' \equiv 0$ on $[a,b]$. By the mean value theorem $u$ is constant, and $u(a) = 0$ gives $u \equiv 0$. $\blacksquare$

- id: abbott-7.3.9
  hints:
    - |
      For (a), split $[a,b]$ into two kinds of pieces: those inside the small cover of the discontinuity set, and the rest. On the rest $f$ is continuous; on the cover the total length is tiny and $f$ is bounded.
    - |
      Use the endpoints of the covering intervals (those lying in $[a,b]$), together with $a$ and $b$, as partition points. Each resulting piece is either inside some $O_n$ or disjoint from all of them. On a piece of the second kind $f$ is continuous, hence integrable, and you can refine there.
    - |
      For (c), the $n$-th stage $C_n$ of the Cantor construction is $2^n$ closed intervals of length $3^{-n}$. Enlarge each slightly to an open interval. For (d), what is $\inf h$ on any interval of positive length?
  solution: |
    **(a)** Let $|f| \le M$ on $[a,b]$ with $M > 0$, and let $D$ be the set of discontinuities of $f$. Fix $\epsilon > 0$. By hypothesis there are open intervals $O_1, \dots, O_N$ covering $D$ with $\sum_n |O_n| \le \frac{\epsilon}{4M}$.

    *A partition.* Let $P_0$ consist of $a$, $b$, and every endpoint of every $O_n$ that lies in $[a,b]$, listed in increasing order as $a = y_0 < y_1 < \dots < y_m = b$. No endpoint of any $O_n$ lies in an open gap $(y_{j-1},y_j)$. So each gap is either contained in some $O_n$, or disjoint from all $O_n$: an interval meeting $O_n$ without containing an endpoint of $O_n$ must lie inside $O_n$. Call the pieces $[y_{j-1},y_j]$ of the first kind *bad* and the others *good*.

    *Good pieces.* Let $J = [y_{j-1},y_j]$ be good. We claim $J$ is disjoint from every $O_n$. The open gap is disjoint from $O_n$. If an endpoint, say $y_j$, lay in the open set $O_n$, then points of the gap just to the left of $y_j$ would lie in $O_n$ too, a contradiction. So $J \cap D = \emptyset$, and $f$ is continuous at every point of $J$. In particular $f|_J$ is continuous, hence integrable on $J$ (Theorem 7.2.9). Let $g$ be the number of good pieces. For each good $J$ choose a partition of $J$ with upper minus lower sum less than $\frac{\epsilon}{2g}$.

    *Bad pieces.* Assign each bad piece to one $O_n$ containing its gap. The bad pieces assigned to a fixed $O_n$ have disjoint interiors and lie in the closure of $O_n$, so their lengths sum to at most $|O_n|$. Hence the total length of the bad pieces is at most $\sum_n |O_n| \le \frac{\epsilon}{4M}$. On each bad piece, $\sup f - \inf f \le 2M$.

    Let $P$ be $P_0$ together with all the points of the chosen partitions of the good pieces. Splitting $U(f,P) - L(f,P)$ over the pieces gives
    $$U(f,P) - L(f,P) < g\cdot\frac{\epsilon}{2g} + 2M\cdot\frac{\epsilon}{4M} = \epsilon.$$
    If there are no good pieces, the first term is simply absent. By the integrability criterion, $f$ is integrable.

    **(b)** Let $A = \{p_1,\dots,p_k\}$. If $k = 0$, any single open interval of length $\epsilon$ works. Otherwise the intervals $O_j = \bigl(p_j - \frac{\epsilon}{2k}, p_j + \frac{\epsilon}{2k}\bigr)$ cover $A$, and their lengths sum to $k\cdot\frac{\epsilon}{k} = \epsilon$.

    **(c)** Recall $C = \bigcap_{n\ge0} C_n$, where $C_n$ is a union of $2^n$ disjoint closed intervals, each of length $3^{-n}$. Given $\epsilon > 0$, choose $n$ with $(2/3)^n < \epsilon/2$, and let $\eta = \frac{\epsilon}{4\cdot 2^n}$. Replace each closed interval $[u,v]$ of $C_n$ by the open interval $(u - \eta, v + \eta)$. These $2^n$ open intervals cover $C_n \supseteq C$, and their lengths sum to
    $$2^n\bigl(3^{-n} + 2\eta\bigr) = \Bigl(\frac23\Bigr)^n + \frac\epsilon2 < \epsilon.$$
    Hence $C$ has content zero.

    **(d)** *Integrability.* If $x \notin C$, then $x$ lies in the open set $[0,1]\setminus C$ relative to $[0,1]$, since $C$ is closed. So $h = 0$ on a neighborhood of $x$ in $[0,1]$, and $h$ is continuous at $x$. Thus the discontinuity set of $h$ is a subset of $C$. Any subset of a content-zero set has content zero, using the same covers. Since $h$ is bounded by $1$, part (a) shows $h$ is integrable on $[0,1]$.

    *Value.* $C$ contains no interval of positive length $\ell$. Such an interval would lie in every $C_n$, and being connected it would lie in a single component interval of $C_n$, of length $3^{-n} < \ell$ for large $n$. Hence every subinterval of every partition contains a point outside $C$, where $h = 0$. Since $h \ge 0$, the infimum of $h$ on each subinterval is $0$, so $L(h,P) = 0$ for every $P$. Since $h$ is integrable,
    $$\int_0^1 h = L(h) = 0.$$

- id: abbott-7.4.6
  hints:
    - |
      For (a), factor a difference of squares.
    - |
      For (b), the quantity $\sup_I f^2 - \inf_I f^2$ on a subinterval $I$ equals $\sup_{x,y\in I}\bigl(f(x)^2 - f(y)^2\bigr)$. Use (a) to compare it with the oscillation of $f$ on $I$, then compare $U - L$ for $f^2$ and for $f$.
    - |
      For (c), express $fg$ using only sums, differences and squares of integrable functions.
  solution: |
    **(a)** For $x, y \in [a,b]$,
    $$|f(x)^2 - f(y)^2| = |f(x) + f(y)|\,|f(x) - f(y)| \le \bigl(|f(x)| + |f(y)|\bigr)|f(x) - f(y)| \le 2M|f(x) - f(y)|.$$

    **(b)** Let $|f| \le M$ with $M > 0$. First a general fact. For a bounded function $\varphi$ on an interval $I$,
    $$\sup_I \varphi - \inf_I \varphi = \sup_{x,y\in I}\bigl(\varphi(x) - \varphi(y)\bigr).$$
    "$\ge$" holds because $\varphi(x) - \varphi(y) \le \sup\varphi - \inf\varphi$. For "$\le$": given $\eta > 0$, pick $x$ with $\varphi(x) > \sup\varphi - \eta$ and $y$ with $\varphi(y) < \inf\varphi + \eta$; then $\varphi(x) - \varphi(y) > \sup\varphi - \inf\varphi - 2\eta$.

    Applying this to $\varphi = f^2$ and using (a), for any subinterval $I$,
    $$\sup_I f^2 - \inf_I f^2 = \sup_{x,y\in I}\bigl(f(x)^2 - f(y)^2\bigr) \le 2M\sup_{x,y\in I}|f(x) - f(y)| = 2M\bigl(\sup_I f - \inf_I f\bigr).$$
    The last equality is the general fact again, noting $\sup_{x,y}|f(x)-f(y)| = \sup_{x,y}(f(x)-f(y))$ by symmetry in $x,y$. Multiplying by the lengths and summing gives, for every partition $P$,
    $$U(f^2,P) - L(f^2,P) \le 2M\bigl(U(f,P) - L(f,P)\bigr).$$
    Given $\epsilon > 0$, choose $P$ with $U(f,P) - L(f,P) < \frac{\epsilon}{2M}$, which is possible since $f$ is integrable. Then $U(f^2,P) - L(f^2,P) < \epsilon$. Since $f^2$ is bounded by $M^2$, the integrability criterion shows $f^2$ is integrable.

    **(c)** By Theorem 7.4.2, $f + g$ is integrable. By (b), $(f+g)^2$, $f^2$ and $g^2$ are integrable. Since
    $$fg = \tfrac12\bigl((f+g)^2 - f^2 - g^2\bigr),$$
    linearity of the integral (Theorem 7.4.2 again) shows $fg$ is integrable. $\blacksquare$

- id: abbott-7.4.10
  hints:
    - |
      For $x \in [0,1)$, $x^n \to 0$, and $g$ is continuous at $0$. So $g(x^n)$ is close to $g(0)$ except near $x = 1$. Split $[0,1]$ into $[0,1-\delta]$ and $[1-\delta,1]$.
    - |
      On $[0,1-\delta]$ the convergence $x^n \le (1-\delta)^n \to 0$ is uniform. On $[1-\delta,1]$ only boundedness of $g$ is available, but that piece is short.
    - |
      Do not forget to justify that $x \mapsto g(x^n)$ is integrable at all. On $[c,1]$ with $c > 0$, the map $x \mapsto x^n$ has derivative bounded below, so partitions can be transported. Then use Theorem 7.3.2.
  solution: |
    Let $|g| \le M$ on $[0,1]$ with $M > 0$, and fix $n \ge 1$. Write $\varphi(x) = x^n$.

    **Step 1: $g\circ\varphi$ is integrable on $[0,1]$.** Fix $c \in (0,1)$. $\varphi$ is a continuous increasing bijection of $[c,1]$ onto $[c^n,1]$, and $\varphi'(x) = nx^{n-1} \ge nc^{n-1} =: \kappa > 0$ on $[c,1]$. Given $\epsilon > 0$, since $g$ is integrable on $[c^n,1]$ there is a partition $P = \{t_0,\dots,t_m\}$ of $[c^n,1]$ with $U(g,P) - L(g,P) < \kappa\epsilon$. Let $x_i = \varphi^{-1}(t_i)$, a partition $Q$ of $[c,1]$. Since $\varphi$ is an increasing bijection, $\varphi([x_{i-1},x_i]) = [t_{i-1},t_i]$, so $g\circ\varphi$ has the same sup and inf on $[x_{i-1},x_i]$ as $g$ on $[t_{i-1},t_i]$. By the mean value theorem, $t_i - t_{i-1} = \varphi'(\xi_i)(x_i - x_{i-1}) \ge \kappa\,\Delta x_i$. Hence
    $$U(g\circ\varphi,Q) - L(g\circ\varphi,Q) = \sum_i (M_i - m_i)\Delta x_i \le \frac1\kappa\sum_i (M_i - m_i)\Delta t_i < \epsilon.$$
    So $g\circ\varphi$ is integrable on $[c,1]$ for every $c \in (0,1)$. It is bounded by $M$, so by Theorem 7.3.2 it is integrable on $[0,1]$.

    **Step 2: the limit.** Let $\epsilon > 0$. By continuity of $g$ at $0$, choose $\rho > 0$ with $|g(t) - g(0)| < \frac\epsilon2$ for $0 \le t < \rho$. Let $\delta = \min\bigl(\frac12, \frac{\epsilon}{8M}\bigr)$. Since $0 < 1 - \delta < 1$, $(1-\delta)^n \to 0$, so there is $N$ with $(1-\delta)^n < \rho$ for $n \ge N$. Fix $n \ge N$. For $x \in [0,1-\delta]$ we have $0 \le x^n \le (1-\delta)^n < \rho$, so
    $$g(0) - \tfrac\epsilon2 < g(x^n) < g(0) + \tfrac\epsilon2 \quad (0 \le x \le 1-\delta), \qquad -M \le g(x^n) \le M \quad (1-\delta \le x \le 1).$$
    By additivity and monotonicity of the integral,
    $$\Bigl|\int_0^{1-\delta} g(x^n)\,dx - (1-\delta)g(0)\Bigr| \le (1-\delta)\frac\epsilon2 \le \frac\epsilon2, \qquad \Bigl|\int_{1-\delta}^1 g(x^n)\,dx\Bigr| \le M\delta.$$
    Writing $g(0) = (1-\delta)g(0) + \delta g(0)$ and using $|g(0)| \le M$,
    $$\Bigl|\int_0^1 g(x^n)\,dx - g(0)\Bigr| \le \frac\epsilon2 + M\delta + M\delta \le \frac\epsilon2 + 2M\cdot\frac{\epsilon}{8M} < \epsilon.$$
    Hence $\displaystyle\lim_{n\to\infty}\int_0^1 g(x^n)\,dx = g(0)$. $\blacksquare$

- id: lebl-5.2.11
  hints:
    - |
      The lower sums are easy: every subinterval contains an irrational. The real work is showing that upper sums can be made small.
    - |
      Fix $K$. Only finitely many points of $[0,1]$ have $f(x) \ge \frac1K$, namely the fractions with denominator at most $K$ (and $0$). Everywhere else $f < \frac1K$.
    - |
      Use a uniform partition with $n$ pieces. Only a bounded number of subintervals (at most twice the number of "big" points) can contain a big point. On those, bound $\sup f$ by $1$; on the rest, by $\frac1K$.
  solution: |
    Note $0 \le f \le 1$ on $[0,1]$.

    *Lower sums.* Every subinterval of positive length contains an irrational number, where $f = 0$, and $f \ge 0$. So the infimum of $f$ on every subinterval is $0$. Hence $L(P,f) = 0$ for every partition $P$, and the lower integral is $0$.

    *Upper sums.* Let $\epsilon > 0$. Choose $K \in \mathbb{N}$ with $\frac1K < \frac\epsilon2$. Let
    $$S = \{x \in [0,1] : f(x) \ge \tfrac1K\}.$$
    If $x \in S$ and $x > 0$, then $x$ is rational, $x = \frac mk$ in lowest terms with $\frac1k \ge \frac1K$, so $k \le K$ and $1 \le m \le k$. Together with $x = 0$, $S$ is finite. Let $N = |S|$. Take the uniform partition $P_n$ of $[0,1]$ into $n$ subintervals of length $\frac1n$, where $n$ is chosen with $\frac{2N}{n} < \frac\epsilon2$. Each point of $S$ lies in at most two subintervals of $P_n$. So at most $2N$ subintervals meet $S$, and on them $\sup f \le 1$. On every other subinterval $f < \frac1K$, so $\sup f \le \frac1K$. Therefore
    $$U(P_n,f) \le 2N\cdot1\cdot\frac1n + \frac1K\sum_{i=1}^n\frac1n < \frac\epsilon2 + \frac\epsilon2 = \epsilon.$$

    *Conclusion.* $0 = \underline{\int_0^1} f \le \overline{\int_0^1} f \le U(P_n,f) < \epsilon$ for every $\epsilon > 0$, so the upper integral is also $0$. Thus $f$ is Riemann integrable and $\int_0^1 f = 0$. Since $f$ is discontinuous at every rational of $[0,1]$ (Example 3.2.12), this gives a Riemann integrable function that is discontinuous on a dense set. $\blacksquare$

- id: lebl-5.2.14
  hints:
    - |
      An increasing function on $[a,b]$ is bounded by $f(a)$ and $f(b)$. On each subinterval its sup and inf sit at the endpoints.
    - |
      With the uniform partition into $n$ pieces, $U(P,f) - L(P,f)$ telescopes. For (b) and (c), use linearity of the integral.
  solution: |
    Recall that a bounded $f$ is Riemann integrable if for every $\epsilon > 0$ there is a partition $P$ with $U(P,f) - L(P,f) < \epsilon$. Indeed, $L(P,f) \le \underline{\int} f \le \overline{\int} f \le U(P,f)$, so the gap between the upper and lower integrals is less than every $\epsilon$.

    **a)** Let $f$ be increasing. Then $f(a) \le f(x) \le f(b)$, so $f$ is bounded. For $n \in \mathbb{N}$ let $x_i = a + i\frac{b-a}{n}$, $i = 0,\dots,n$. On $[x_{i-1},x_i]$, monotonicity gives $\sup f = f(x_i)$ and $\inf f = f(x_{i-1})$. Hence
    $$U(P,f) - L(P,f) = \sum_{i=1}^n \bigl(f(x_i) - f(x_{i-1})\bigr)\frac{b-a}{n} = \frac{(b-a)\bigl(f(b) - f(a)\bigr)}{n}.$$
    This is less than any given $\epsilon > 0$ once $n$ is large, so $f \in \mathscr{R}([a,b])$.

    **b)** If $f$ is decreasing, then $-f$ is increasing, so $-f \in \mathscr{R}([a,b])$ by a). By linearity of the integral, $f = (-1)\cdot(-f) \in \mathscr{R}([a,b])$.

    **c)** By a), $f, g \in \mathscr{R}([a,b])$. By linearity, $h = f - g \in \mathscr{R}([a,b])$. $\blacksquare$

- id: lebl-5.2.15
  hints:
    - |
      Show that on every subinterval the oscillation of $|f|$ is at most the oscillation of $f$. The reverse triangle inequality $\bigl||u| - |v|\bigr| \le |u - v|$ is the key.
    - |
      This gives $U(P,|f|) - L(P,|f|) \le U(P,f) - L(P,f)$ for every partition. For the inequality, use $-|f| \le f \le |f|$ and monotonicity of the integral.
  solution: |
    Since $f$ is bounded, so is $|f|$.

    *Oscillation.* For a bounded $\varphi$ on an interval $I$,
    $$\sup_I \varphi - \inf_I \varphi = \sup_{x,y\in I}\bigl(\varphi(x) - \varphi(y)\bigr).$$
    "$\ge$" is clear. For "$\le$", given $\eta > 0$ choose $x, y$ with $\varphi(x) > \sup\varphi - \eta$ and $\varphi(y) < \inf\varphi + \eta$; then $\varphi(x) - \varphi(y) > \sup\varphi - \inf\varphi - 2\eta$, and $\eta$ is arbitrary. For $x, y \in I$, the reverse triangle inequality gives
    $$|f(x)| - |f(y)| \le |f(x) - f(y)| \le \sup_I f - \inf_I f.$$
    Taking the sup over $x, y$ and applying the identity with $\varphi = |f|$ gives $\sup_I|f| - \inf_I|f| \le \sup_I f - \inf_I f$. Multiplying by $\Delta x_i$ and summing over the subintervals of a partition $P$,
    $$U(P,|f|) - L(P,|f|) \le U(P,f) - L(P,f).$$

    *Integrability of $|f|$.* Let $\epsilon > 0$ and $I = \int_a^b f$. Since $I$ is both the upper and the lower integral, there are partitions $P_1, P_2$ with $U(P_1,f) < I + \frac\epsilon2$ and $L(P_2,f) > I - \frac\epsilon2$. Their common refinement $P$ satisfies $U(P,f) - L(P,f) < \epsilon$, so $U(P,|f|) - L(P,|f|) < \epsilon$. Then $0 \le \overline{\int}|f| - \underline{\int}|f| \le U(P,|f|) - L(P,|f|) < \epsilon$ for every $\epsilon$, so $|f| \in \mathscr{R}([a,b])$.

    *The inequality.* Since $-|f(x)| \le f(x) \le |f(x)|$ for all $x$, and $f$, $|f|$, $-|f|$ are all integrable, monotonicity and linearity give
    $$-\int_a^b |f| \le \int_a^b f \le \int_a^b |f|, \qquad\text{that is,}\qquad \left|\int_a^b f\right| \le \int_a^b |f|. \qquad\blacksquare$$

- id: lebl-5.4.6
  hints:
    - |
      In Lebl, $\ln n = \int_1^n \frac{dt}{t}$. Split this integral over the intervals $[k-1,k]$ and compare $\frac1t$ with its values at the endpoints.
    - |
      For (b), let $a_n = \sum_{k=1}^n \frac1k - \ln n$. Part (a) gives a lower bound for $a_n$. Show $a_n$ is decreasing by writing $a_{n+1} - a_n$ in terms of $\int_n^{n+1}\frac{dt}t$. Then apply the monotone convergence theorem.
  solution: |
    Recall $\ln x = \int_1^x \frac{dt}{t}$ for $x > 0$.

    **a)** For $k \ge 2$ and $t \in [k-1,k]$, we have $\frac1k \le \frac1t \le \frac1{k-1}$, since $\frac1t$ is decreasing. By monotonicity of the integral over an interval of length $1$,
    $$\frac1k \le \int_{k-1}^k \frac{dt}{t} \le \frac1{k-1}.$$
    Summing over $k = 2,\dots,n$ and using additivity, $\int_1^n = \sum_{k=2}^n \int_{k-1}^k$, we get
    $$\sum_{k=2}^n \frac1k \le \ln n \le \sum_{k=2}^n \frac1{k-1} = \sum_{k=1}^{n-1}\frac1k.$$

    **b)** Let $a_n = \sum_{k=1}^n \frac1k - \ln n$ for $n \ge 1$.

    *Bounded below.* For $n \ge 2$, the right inequality in a) gives $\ln n \le \sum_{k=1}^{n-1}\frac1k = \sum_{k=1}^n\frac1k - \frac1n$, so $a_n \ge \frac1n > 0$. Also $a_1 = 1 > 0$.

    *Decreasing.* For $n \ge 1$, $\ln(n+1) - \ln n = \int_n^{n+1}\frac{dt}{t} \ge \frac{1}{n+1}$, because $\frac1t \ge \frac1{n+1}$ on $[n,n+1]$. Hence
    $$a_{n+1} - a_n = \frac{1}{n+1} - \bigl(\ln(n+1) - \ln n\bigr) \le 0.$$
    So $(a_n)$ is decreasing and bounded below by $0$. By the monotone convergence theorem, $\gamma = \lim_{n\to\infty} a_n$ exists, and $0 \le \gamma \le a_1 = 1$. $\blacksquare$

- id: ross-36.8
  hints:
    - |
      First handle an integral with only one improper endpoint. Then use Ross's definition for $(a,b)$, which splits at an interior point $\alpha$.
    - |
      For a nonnegative continuous function, $d \mapsto \int_\alpha^d$ is increasing, so its limit exists in $[0,\infty]$ and is finite exactly when it is bounded. Apply this to $f + |f|$, which lies between $0$ and $2|f|$.
    - |
      Then write $f = (f + |f|) - |f|$ and use the limit laws.
  solution: |
    By Definition 36.1, $\int_a^b f$ means $\int_a^\alpha f + \int_\alpha^b f$ for some $\alpha \in (a,b)$, where
    $$\int_\alpha^b f = \lim_{d\to b^-}\int_\alpha^d f, \qquad \int_a^\alpha f = \lim_{c\to a^+}\int_c^\alpha f.$$
    Here $d \to b^-$ means $d \to \infty$ if $b = +\infty$, and similarly for $c$. The same applies to $|f|$.

    **Step 1: both halves of $\int|f|$ are finite.** For a nonnegative continuous $g$ on $[\alpha,b)$, $G(d) = \int_\alpha^d g$ is increasing in $d$. An increasing function has a limit as $d \to b^-$, namely $\sup G \in [0,\infty]$, and the limit is finite iff $G$ is bounded. The same holds on the left half. So $\int_a^\alpha|f|$ and $\int_\alpha^b|f|$ both exist in $[0,\infty]$. Their sum is $\int_a^b|f| < \infty$, so each is finite.

    **Step 2: the right half of $\int f$.** Let $g = f + |f|$. It is continuous on $(a,b)$, and $0 \le g \le 2|f|$. For $\alpha \le d < b$,
    $$0 \le \int_\alpha^d g \le 2\int_\alpha^d|f| \le 2\int_\alpha^b|f| < \infty.$$
    The second inequality uses that $\int_\alpha^d |f|$ is increasing in $d$, so it is at most its limit. So $d \mapsto \int_\alpha^d g$ is increasing and bounded, and $\lim_{d\to b^-}\int_\alpha^d g$ exists and is finite. Since $\int_\alpha^d f = \int_\alpha^d g - \int_\alpha^d |f|$, and both terms have finite limits as $d \to b^-$, so does $\int_\alpha^d f$. Thus $\int_\alpha^b f$ exists and is finite.

    **Step 3: the left half.** The same argument with $c \mapsto \int_c^\alpha g$, which increases as $c$ decreases to $a$, shows $\int_a^\alpha f = \lim_{c\to a^+}\int_c^\alpha f$ exists and is finite.

    Therefore $\int_a^b f = \int_a^\alpha f + \int_\alpha^b f$ is a sum of two finite numbers, so it exists and is finite. (If $f$ is in fact continuous at an endpoint, so that the integral is improper at only one end, Step 2 or Step 3 alone suffices.) $\blacksquare$

- id: cummings-8.25
  hints:
    - |
      A continuous function on a closed interval is integrable. The only trouble is near $x_0$, where you have only boundedness to work with.
    - |
      Isolate $x_0$ inside a tiny interval $[x_0 - \eta, x_0 + \eta]$. Its contribution to $U - L$ is at most $2M\cdot 2\eta$. On the two remaining closed intervals, use partitions that work for the continuous function there.
  solution: |
    Let $|f(x)| \le M$ on $[a,b]$, with $M > 0$. Let $\epsilon > 0$. Choose $\eta > 0$ so small that $[x_0 - \eta, x_0 + \eta] \subseteq (a,b)$ and $4M\eta < \frac\epsilon3$.

    The restriction of $f$ to $[a, x_0 - \eta]$ is continuous, since $f$ is continuous at every point there. Hence it is integrable, and there is a partition $P_1$ of $[a, x_0-\eta]$ with $U(f,P_1) - L(f,P_1) < \frac\epsilon3$. Likewise there is a partition $P_2$ of $[x_0+\eta, b]$ with $U(f,P_2) - L(f,P_2) < \frac\epsilon3$.

    Let $P = P_1 \cup P_2$, a partition of $[a,b]$ whose subintervals are those of $P_1$, those of $P_2$, and $[x_0-\eta,x_0+\eta]$. On the middle interval, $\sup f - \inf f \le 2M$. Therefore
    $$U(f,P) - L(f,P) = \bigl(U(f,P_1) - L(f,P_1)\bigr) + \Bigl(\sup_{[x_0-\eta,x_0+\eta]} f - \inf_{[x_0-\eta,x_0+\eta]} f\Bigr)2\eta + \bigl(U(f,P_2) - L(f,P_2)\bigr) < \frac\epsilon3 + 4M\eta + \frac\epsilon3 < \epsilon.$$
    Since $\epsilon > 0$ was arbitrary, $f$ is integrable on $[a,b]$ by the Riemann (Darboux) criterion. $\blacksquare$

- id: cummings-8.27
  hints:
    - |
      For (a), bound the integral above and below using the bounds on $f$, then divide by $b - a$.
    - |
      For (b), a continuous $f$ attains its minimum and maximum (EVT) and every value in between (IVT). For (c), think of a step function.
    - |
      For (d), multiply $m \le f \le M$ by $g \ge 0$ and integrate. Treat the case $\int_a^b g = 0$ separately.
  solution: |
    Throughout $a < b$. In (d) the source's parenthetical says "Part (c)"; it means Part (b), as noted.

    **(a)** Since $m \le f \le M$, monotonicity of the integral gives
    $$m(b-a) = \int_a^b m\,dx \le \int_a^b f \le \int_a^b M\,dx = M(b-a).$$
    Let $\gamma = \frac{1}{b-a}\int_a^b f$. Then $m \le \gamma \le M$ and $\int_a^b f = (b-a)\gamma$.

    **(b)** $f$ is continuous, hence integrable. By the extreme value theorem there are $p, q \in [a,b]$ with $f(p) = m := \min f$ and $f(q) = M := \max f$. By (a), $\int_a^b f = (b-a)\gamma$ with $f(p) \le \gamma \le f(q)$. By the intermediate value theorem applied to $f$ on the closed interval between $p$ and $q$ (or trivially if $p = q$), there is $x_0$ between $p$ and $q$, hence in $[a,b]$, with $f(x_0) = \gamma$.

    **(c)** On $[0,1]$ let $f(x) = 0$ for $x < \frac12$ and $f(x) = 1$ for $x \ge \frac12$. $f$ is bounded with one discontinuity, hence integrable. On $[0,\frac12]$ it differs from $0$ only at $x = \frac12$, and on $[\frac12,1]$ it is constantly $1$, so
    $$\int_0^1 f = 0 + \tfrac12 = \tfrac12.$$
    But $(1-0)f(x_0) \in \{0,1\}$ for every $x_0$, so it never equals $\frac12$, and (b) fails.

    **(d)** By the EVT let $m = \min f = f(p)$ and $M = \max f = f(q)$. The product $fg$ is integrable, being a product of integrable functions. Since $g \ge 0$, we have $m\,g(x) \le f(x)g(x) \le M\,g(x)$ for all $x$, and integrating gives
    $$m\int_a^b g \le \int_a^b fg \le M\int_a^b g.$$
    Also $\int_a^b g \ge 0$.

    *Case $\int_a^b g = 0$.* Then $\int_a^b fg = 0$, and any $x_0 \in [a,b]$ works.

    *Case $\int_a^b g > 0$.* Then $\gamma := \dfrac{\int_a^b fg}{\int_a^b g}$ satisfies $f(p) = m \le \gamma \le M = f(q)$. By the IVT there is $x_0$ between $p$ and $q$ with $f(x_0) = \gamma$, that is, $\int_a^b fg = f(x_0)\int_a^b g$.

    Taking $g \equiv 1$ recovers (b). $\blacksquare$

- id: tao-11.9.3
  hints:
    - |
      One direction is exactly Theorem 11.9.1. For the other, a monotone function has one-sided limits $f(x_0^-) \le f(x_0) \le f(x_0^+)$ at every interior point. Discontinuity means a jump.
    - |
      Show that the right-hand difference quotient $\frac{F(x_0+h) - F(x_0)}{h}$ is trapped between $f(x_0^+)$ and $f(x_0+h)$, and similarly on the left. So the one-sided derivatives of $F$ are $f(x_0^+)$ and $f(x_0^-)$.
    - |
      Be careful at the endpoints $x_0 = a$ or $x_0 = b$. There "differentiable" only involves one side. Test the claim on $f = 0$ at $a$ and $f = 1$ on $(a,b]$.
  solution: |
    **A caveat about the statement.** The "only if" direction fails at the endpoints. Take $f(a) = 0$ and $f(x) = 1$ for $a < x \le b$. Then $f$ is increasing, and $F(x) = \int_{[a,x]} f = x - a$, because $f$ differs from $1$ at a single point. With Tao's definition of the derivative on $X = [a,b]$, which is one-sided at endpoints, $F$ is differentiable at $a$ with $F'(a) = 1$, yet $f$ is not continuous at $a$. So we prove: *for $x_0 \in (a,b)$, $F$ is differentiable at $x_0$ iff $f$ is continuous at $x_0$; and at $x_0 \in \{a,b\}$ the "if" direction still holds.*

    **($\Leftarrow$)** $f$ is monotone, hence Riemann integrable (Prop. 11.6.1). If $f$ is continuous at $x_0 \in [a,b]$, Theorem 11.9.1 gives that $F$ is differentiable at $x_0$ with $F'(x_0) = f(x_0)$.

    **($\Rightarrow$) for $x_0 \in (a,b)$.** Since $f$ is increasing, the one-sided limits
    $$f(x_0^-) = \sup_{a\le x<x_0} f(x), \qquad f(x_0^+) = \inf_{x_0<x\le b} f(x)$$
    exist and satisfy $f(x_0^-) \le f(x_0) \le f(x_0^+)$.

    *Right derivative.* Let $0 < h \le b - x_0$. By additivity, $F(x_0+h) - F(x_0) = \int_{[x_0,x_0+h]} f$. For $x \in (x_0, x_0+h]$, $f(x_0^+) \le f(x) \le f(x_0+h)$. Also $f(x_0) \le f(x_0+h)$, so $\int_{[x_0,x_0+h]} f \le h f(x_0+h)$. For a lower bound, fix $s \in (0,h)$. Using $f \ge f(x_0)$ on $[x_0,x_0+s]$ and $f \ge f(x_0^+)$ on $[x_0+s,x_0+h]$,
    $$\int_{[x_0,x_0+h]} f = \int_{[x_0,x_0+s]} f + \int_{[x_0+s,x_0+h]} f \ge s f(x_0) + (h-s) f(x_0^+).$$
    Letting $s \to 0^+$ gives $\int_{[x_0,x_0+h]} f \ge h f(x_0^+)$. Thus
    $$f(x_0^+) \le \frac{F(x_0+h) - F(x_0)}{h} \le f(x_0+h).$$
    As $h \to 0^+$, $f(x_0+h) \to f(x_0^+)$, because an increasing function converges to its infimum over $(x_0, b]$. So the right-hand limit of the difference quotient is $f(x_0^+)$.

    *Left derivative.* Symmetrically, for $0 < h \le x_0 - a$ and $s \in (0,h)$, we have $f(x_0-h) \le f \le f(x_0^-)$ on $[x_0-h, x_0-s]$ and $f \le f(x_0)$ on $[x_0-s,x_0]$. This gives
    $$h f(x_0-h) \le \int_{[x_0-h,x_0]} f \le (h-s)f(x_0^-) + s f(x_0) \xrightarrow{s\to0^+} h f(x_0^-),$$
    so $f(x_0-h) \le \frac{F(x_0) - F(x_0-h)}{h} \le f(x_0^-)$, and the left-hand limit of the difference quotient is $f(x_0^-)$.

    *Conclusion.* If $F$ is differentiable at the interior point $x_0$, the two one-sided limits agree: $f(x_0^-) = f(x_0^+)$. Combined with $f(x_0^-) \le f(x_0) \le f(x_0^+)$, all three are equal. Then $f$ is continuous at $x_0$. Given $\epsilon > 0$, choose $\delta > 0$ with $x_0 \pm \delta \in [a,b]$, $f(x_0+\delta) < f(x_0) + \epsilon$ and $f(x_0-\delta) > f(x_0) - \epsilon$. This is possible by the definitions of $f(x_0^\pm)$ as inf and sup. By monotonicity, $|f(x) - f(x_0)| < \epsilon$ whenever $|x - x_0| < \delta$. Contrapositively, if $f$ is discontinuous at $x_0$ (a jump $f(x_0^-) < f(x_0^+)$), then the left and right derivatives of $F$ differ, and $F$ is not differentiable at $x_0$. $\blacksquare$

- id: abbott-7.4.4
  hints:
    - |
      It is easy to see $\int_a^b f \ge 0$. Suppose the integral were $0$ and look for a point where $f$ fails to be positive.
    - |
      If $\int_I f = 0$ on a closed interval $I$, then some upper sum over $I$ is less than $|I|/n$. So some subinterval $J \subseteq I$ has $\sup_J f < \frac1n$. Also, since $f \ge 0$, the integral of $f$ over $J$ is still $0$.
    - |
      Iterate to build nested closed intervals $I_1 \supseteq I_2 \supseteq \cdots$ with $\sup_{I_n} f < \frac1n$, then use the Nested Interval Property.
  solution: |
    Since $f > 0$, every lower sum is $\ge 0$, so $\int_a^b f \ge 0$. Suppose, for contradiction, that $\int_a^b f = 0$. Integrability on subintervals and additivity hold for $f$. In particular, for any closed $[c,d] \subseteq [a,b]$,
    $$0 = \int_a^b f = \int_a^c f + \int_c^d f + \int_d^b f \ge \int_c^d f \ge 0,$$
    so $\int_c^d f = 0$.

    **Claim.** If $I \subseteq [a,b]$ is a closed interval of positive length with $\int_I f = 0$, and $n \in \mathbb{N}$, then there is a closed interval $J \subseteq I$ of positive length with $\sup_J f < \frac1n$.

    *Proof.* $\int_I f = 0$ is the infimum of upper sums over $I$, so there is a partition $P$ of $I$ with $U(f,P) < \frac{|I|}{n}$. If every subinterval $J$ of $P$ had $\sup_J f \ge \frac1n$, then $U(f,P) \ge \frac1n\sum|J| = \frac{|I|}{n}$, a contradiction. So some subinterval $J$ of $P$ has $\sup_J f < \frac1n$. $\square$

    Apply the claim with $I_0 = [a,b]$ and $n = 1$ to get $I_1$. Having $I_{n-1}$, which satisfies $\int_{I_{n-1}} f = 0$ by the first paragraph, apply the claim with $n$ to get a closed interval $I_n \subseteq I_{n-1}$ of positive length with $\sup_{I_n} f < \frac1n$. The intervals $I_1 \supseteq I_2 \supseteq \cdots$ are nested, closed, bounded and nonempty. By the Nested Interval Property there is $x \in \bigcap_n I_n$. Then $f(x) \le \sup_{I_n} f < \frac1n$ for every $n$, so $f(x) \le 0$. This contradicts $f(x) > 0$. Hence $\int_a^b f > 0$. $\blacksquare$

- id: lebl-5.1.13
  hints:
    - |
      Every Riemann sum lies between $L(P,f)$ and $U(P,f)$. So the forward direction reduces to Exercise 5.1.12: fine partitions have upper and lower sums close to the integral.
    - |
      For 5.1.12, fix one partition $Q$ with $U(Q,f) - L(Q,f)$ small. If $P$ has small mesh, adding the finitely many points of $Q$ to $P$ changes only a few subintervals of $P$, each short. So $U(P,f)$ is close to $U(P\cup Q,f) \le U(Q,f)$.
    - |
      For the converse, given a fine partition, choose tags where $f$ is nearly its sup on each subinterval. The Riemann sum then nearly equals $U(P,f)$, and similarly for $L(P,f)$. This pins both the upper and lower integrals to within $2\epsilon$ of $I$.
  solution: |
    Throughout, $f\colon[a,b]\to\mathbb{R}$ is bounded, as in Lebl's definition of $\mathscr{R}([a,b])$. We write "$P$ is $\delta$-fine" if $\Delta x_i < \delta$ for all $i$. We first prove Exercise 5.1.12 in the direction we need.

    **Step 1 (5.1.12, "$\Rightarrow$").** Let $f \in \mathscr{R}([a,b])$ and $I = \int_a^b f$. Then for every $\epsilon > 0$ there is $\delta > 0$ such that every $\delta$-fine $P$ satisfies $I \le U(P,f) < I + \epsilon$ and $I - \epsilon < L(P,f) \le I$.

    *Proof.* Let $|f| \le B$ with $B > 0$. As $I$ is both the upper and lower integral, there are partitions with $U < I + \frac\epsilon2$ and $L > I - \frac\epsilon2$. Their common refinement $Q = \{y_0 < \dots < y_m\}$ satisfies $U(Q,f) < I + \frac\epsilon2$ and $L(Q,f) > I - \frac\epsilon2$. Let $\delta = \frac{\epsilon}{4mB}$, and let $P = \{x_0,\dots,x_n\}$ be $\delta$-fine. Put $P' = P \cup Q$.

    The upper sums $U(P,f)$ and $U(P',f)$ differ only on subintervals $[x_{i-1},x_i]$ of $P$ whose interior contains some $y_j$. There are at most $m-1$ of these, since only $y_1,\dots,y_{m-1}$ can be interior points. On such a subinterval, $M_i\Delta x_i \le B\Delta x_i$, while the pieces of $P'$ inside it contribute at least $-B\Delta x_i$ to $U(P',f)$. So each contributes at most $2B\Delta x_i < 2B\delta$ to $U(P,f) - U(P',f)$. Since $P'$ refines $Q$,
    $$U(P,f) \le U(P',f) + 2(m-1)B\delta \le U(Q,f) + 2mB\delta < I + \frac\epsilon2 + \frac\epsilon2 = I + \epsilon.$$
    Also $U(P,f) \ge \overline{\int} f = I$. Symmetrically, $L(P,f) \ge L(Q,f) - 2mB\delta > I - \epsilon$, and $L(P,f) \le I$. $\square$

    **Step 2 ("$\Rightarrow$" of 5.1.13).** Let $f \in \mathscr{R}([a,b])$ and $I = \int_a^b f$. Given $\epsilon > 0$, take $\delta$ from Step 1. Let $P$ be $\delta$-fine and $c_i \in [x_{i-1},x_i]$ arbitrary. Since $m_i \le f(c_i) \le M_i$,
    $$I - \epsilon < L(P,f) \le \sum_{i=1}^n f(c_i)\Delta x_i \le U(P,f) < I + \epsilon,$$
    so $\bigl|\sum f(c_i)\Delta x_i - I\bigr| < \epsilon$. This is the Riemann-sum condition with $I = \int_a^b f$.

    **Step 3 ("$\Leftarrow$").** Suppose $I$ satisfies the Riemann-sum condition. Let $\epsilon > 0$, take the corresponding $\delta$, and fix one $\delta$-fine partition $P = \{x_0,\dots,x_n\}$, for example a uniform one with $n > (b-a)/\delta$. Let $M_i = \sup_{[x_{i-1},x_i]} f$ and $m_i = \inf_{[x_{i-1},x_i]} f$. For each $i$ choose $c_i$ with $f(c_i) > M_i - \frac{\epsilon}{b-a}$, by the definition of supremum. Then
    $$U(P,f) = \sum M_i\Delta x_i < \sum f(c_i)\Delta x_i + \epsilon < I + 2\epsilon.$$
    Choosing instead $c_i'$ with $f(c_i') < m_i + \frac{\epsilon}{b-a}$ gives $L(P,f) > \sum f(c_i')\Delta x_i - \epsilon > I - 2\epsilon$. Hence
    $$I - 2\epsilon < L(P,f) \le \underline{\int_a^b} f \le \overline{\int_a^b} f \le U(P,f) < I + 2\epsilon.$$
    Since $\epsilon > 0$ is arbitrary, $\underline{\int} f = \overline{\int} f = I$. So $f \in \mathscr{R}([a,b])$ and $\int_a^b f = I$.

    (Remark: the Riemann-sum condition by itself already forces $f$ to be bounded. Fix a $\delta$-fine $P$ for $\epsilon = 1$ and all tags but one. Moving the remaining tag $c_i$ around $[x_{i-1},x_i]$ keeps $f(c_i)\Delta x_i$ within a bounded range. So nothing is lost by assuming boundedness.)

    Steps 2 and 3 together show that $f \in \mathscr{R}([a,b])$ iff such an $I$ exists, and that then $I = \int_a^b f$. Step 1 together with Step 3 (whose argument also applies to the hypothesis of 5.1.12) proves Exercise 5.1.12 as well. $\blacksquare$

- id: ross-33.9
  source:
    key: ross
    chapter: 6 Integration
    section: §33 Properties of the Riemann Integral
    problemNumber: Exercise 33.9
    page: '290'
  topic: function-sequences
  subtopics:
  - uniform-convergence
  - interchange-integral
  skills:

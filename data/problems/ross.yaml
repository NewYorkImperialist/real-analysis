  curation:
    why: 'Which sets can be the set of subsequential limits of a sequence, and what closedness has to do with it.'
- id: ross-12.13
  source:
    key: ross
    chapter: 2 Sequences
    section: §12 lim sup's and lim inf's
    problemNumber: Exercise 12.13
    page: '83'
  topic: sequences
  subtopics:
  - limsup-liminf
  skills:
  - tail-sup
  - two-inequalities
  concept: 'liminf s_n = sup{a : s_n ≥ a eventually}, limsup = inf{b : s_n ≤ b eventually}'
  title: $\liminf$ and $\limsup$ via eventual bounds
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - limsup
  - liminf
  - characterization
  problemLatex: |
    Let $(s_n)$ be a bounded sequence in $\mathbb{R}$. Let $A$ be the set of $a \in \mathbb{R}$ such that $\{n \in \mathbb{N} : s_n < a\}$ is finite, i.e., all but finitely many $s_n$ are $\ge a$. Let $B$ be the set of $b \in \mathbb{R}$ such that $\{n \in \mathbb{N} : s_n > b\}$ is finite. Prove $\sup A = \liminf s_n$ and $\inf B = \limsup s_n$.
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      Proof of $\sup A = \liminf s_n$. Consider $N$ in $\mathbb{N}$ and observe $u_N = \inf\{s_n : n > N\}$ is a number in $A$, since $\{n \in \mathbb{N} : s_n < u_N\} \subseteq \{1, 2, \ldots, N\}$. So $u_N \le \sup A$ for all $N$ and consequently $\liminf s_n = \lim u_N \le \sup A$.
      Next consider $a \in A$. Let $N_0 = \max\{n \in \mathbb{N} : s_n < a\} < \infty$. Then $s_n \ge a$ for $n > N_0$. Thus for $N \ge N_0$ we have $u_N = \inf\{s_n : n > N\} \ge a$. It follows that $\liminf s_n = \lim u_N \ge a$. We have just shown that $\liminf s_n$ is an upper bound for the set $A$. Therefore $\liminf s_n \ge \sup A$.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: bookHint from PDF p. 384.
  curation:
    why: limsup as inf of ‘eventual upper bounds’ — the characterization most used in practice.
- id: ross-13.7
  source:
    key: ross
    chapter: 2 Sequences
    section: §13 Some Topological Concepts in Metric Spaces
    problemNumber: Exercise 13.7
    page: '93'
  topic: topology
  subtopics:
  - open-sets
  skills:
  - maximal-interval
  - countability-via-rationals
  concept: every open set in R is a countable disjoint union of open intervals
  title: Open sets in $\mathbb{R}$ as disjoint unions of open intervals
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - open-set
  - structure-theorem
  - intervals
  - countable
  problemLatex: |
    Show that every open set in $\mathbb{R}$ is the disjoint union of a finite or infinite sequence of open intervals.
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      Outline of Proof. Consider an open set $U \subseteq \mathbb{R}$. Let $(q_n)$ be an enumeration of the rationals in $U$. For each $n$, let
      $$a_n = \inf\{a \in \mathbb{R} : (a, q_n] \subseteq U\}, \quad b_n = \sup\{b \in \mathbb{R} : [q_n, b) \subseteq U\}.$$
      Show $(a_n, b_n) \subseteq U$ for each $n$ and $U = \bigcup_{n=1}^{\infty} (a_n, b_n)$. Show
      $$(a_n, b_n) \cap (a_m, b_m) \ne \varnothing \quad\text{implies}\quad (a_n, b_n) = (a_m, b_m).$$
      Now either there will be only finitely many distinct [and disjoint] intervals or else a subsequence $\{(a_{n_k}, b_{n_k})\}_{k=1}^{\infty}$ of $\{(a_n, b_n)\}$ will consist of disjoint intervals for which $\bigcup_{k=1}^{\infty} (a_{n_k}, b_{n_k}) = U$.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: Open intervals may be unbounded here (a_n, b_n can be ±∞), consistent with Ross's §5 conventions. bookHint from PDF p. 385 (union symbols verified against page image; text extraction showed '+').
  curation:
    why: Every open subset of ℝ is a countable disjoint union of open intervals — the structure theorem used in measure theory.

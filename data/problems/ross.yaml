  - darboux-sum-estimate
  - partition-estimate
  concept: uniform limit of Riemann integrable functions is integrable and integral of limit = limit of integrals
  title: Uniform limits of integrable functions are integrable
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - uniform-convergence
  - Riemann-integration
  - interchange-of-limits
  - machinery
  problemLatex: |
    Let $(f_n)$ be a sequence of integrable functions on $[a, b]$, and suppose $f_n \to f$ uniformly on $[a, b]$. Prove $f$ is integrable and
    $$\int_a^b f = \lim_{n\to\infty} \int_a^b f_n.$$
    Compare this result with Theorems 25.2 and 33.11.

    *(Theorem 25.2: Let $(f_n)$ be a sequence of continuous functions on $[a, b]$, and suppose $f_n \to f$ uniformly on $[a, b]$. Then $\lim_{n\to\infty} \int_a^b f_n(x)\,dx = \int_a^b f(x)\,dx$. Theorem 33.11 [Dominated Convergence Theorem]: Suppose $(f_n)$ is a sequence of integrable functions on $[a, b]$ and $f_n \to f$ pointwise where $f$ is an integrable function on $[a, b]$. If there exists an $M > 0$ such that $|f_n(x)| \le M$ for all $n$ and all $x$ in $[a, b]$, then $\lim_{n\to\infty} \int_a^b f_n(x)\,dx = \int_a^b \lim_{n\to\infty} f_n(x)\,dx$.)*
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      Select $m \in \mathbb{N}$ so that $|f(x) - f_m(x)| < \frac{\epsilon}{2(b-a)}$ for all $x \in [a, b]$. Then for any partition $P$
      $$-\frac{\epsilon}{2} \le L(f - f_m, P) \le U(f - f_m, P) \le \frac{\epsilon}{2}.$$
      Select a partition $P_0$ so that $U(f_m, P_0) - L(f_m, P_0) < \frac{\epsilon}{2}$. Since $f = (f - f_m) + f_m$, we can use inequalities from the proof of Theorem 33.3 to conclude $U(f, P_0) - L(f, P_0) < \epsilon$. Now Theorem 32.5 shows $f$ is integrable. To complete the exercise, proceed as in the proof of Theorem 25.2.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: Verified against page image. Theorems 25.2 and 33.11 quoted verbatim (equation labels dropped). bookHint from PDF p. 401 (printed 392). Theorem 33.3 gives U(f+g,P) <= U(f,P)+U(g,P), L(f+g,P) >= L(f,P)+L(g,P).
  curation:
    why: 'The interchange theorem itself: a uniform limit of integrable functions is integrable and its integral is the limit of the integrals.'

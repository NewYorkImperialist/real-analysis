  concept: smooth bump functions and smooth step functions from e^{-1/x}
  title: Smooth bump and step functions
  difficulty: easy
  category: canonical
  type: construction
  tags:
  - smooth-functions
  - bump-function
  - cutoff-function
  - e-to-minus-one-over-x
  problemLatex: |
    Consider $a, b$ in $\mathbb{R}$ where $a < b$. Show there exist infinitely differentiable functions $f_a$, $g_b$, $h_{a,b}$ and $h^*_{a,b}$ on $\mathbb{R}$ with the following properties. You may assume, without proof, that the sum, product, etc. of infinitely differentiable functions is again infinitely differentiable. The same applies to the quotient provided the denominator never vanishes.

    (a) $f_a(x) = 0$ for $x \le a$ and $f_a(x) > 0$ for $x > a$. *Hint*: Let $f_a(x) = f(x - a)$ where $f$ is the function in Example 3.

    (b) $g_b(x) = 0$ for $x \ge b$ and $g_b(x) > 0$ for $x < b$.

    (c) $h_{a,b}(x) > 0$ for $x \in (a, b)$ and $h_{a,b}(x) = 0$ for $x \notin (a, b)$.

    (d) $h^*_{a,b}(x) = 0$ for $x \le a$ and $h^*_{a,b}(x) = 1$ for $x \ge b$. *Hint*: Use the function $\frac{f_a}{f_a + g_b}$.

    *(Example 3: Let $f(x) = e^{-1/x}$ for $x > 0$ and $f(x) = 0$ for $x \le 0$. Clearly $f$ has derivatives of all orders at all $x \neq 0$. We will prove $f^{(n)}(0) = 0$ for $n = 0, 1, 2, 3, \ldots$. Hence the Taylor series for $f$ is identically zero, so $f$ does not agree with its Taylor series in any open interval containing 0.)*
  notes: Verified against page image. Example 3 of §31 (PDF 266, printed 257) quoted verbatim from its opening (the proof that follows is omitted); in particular f is C-infinity on R. No book hint.
  curation:
    why: Build smooth bump and step functions from e^{−1/x} — the standard construction behind partitions of unity.

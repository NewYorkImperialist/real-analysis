  problemLatex: |
    Let $g(x) = e^{-1/x^2}$ for $x \neq 0$ and $g(0) = 0$.

    (a) Show $g^{(n)}(0) = 0$ for all $n = 0, 1, 2, 3, \ldots$. *Hint*: Use Example 3.

    (b) Show the Taylor series for $g$ about 0 agrees with $g$ only at $x = 0$.

    *(Example 3: Let $f(x) = e^{-1/x}$ for $x > 0$ and $f(x) = 0$ for $x \le 0$. Clearly $f$ has derivatives of all orders at all $x \neq 0$. We will prove $f^{(n)}(0) = 0$ for $n = 0, 1, 2, 3, \ldots$. Hence the Taylor series for $f$ is identically zero, so $f$ does not agree with its Taylor series in any open interval containing 0.)*
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      (a) $g(x) = f(x^2)$ for $x \in \mathbb{R}$ where $f$ is as in Example 3. Use induction to prove there exist polynomials $p_{kn}$, $1 \le k \le n$, so that
      $$g^{(n)}(x) = \sum_{k=1}^n f^{(k)}(x^2)\, p_{kn}(x) \quad \text{for} \quad x \in \mathbb{R},\ n \ge 1.$$
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: Verified against page image. Example 3 quoted verbatim (opening only). bookHint from PDF p. 400 (printed 391). The fact used from Example 3 is that e^{-1/x} (extended by 0) has all derivatives 0 at 0.
  curation:
    why: 'e^{−1/x²}: smooth, every derivative vanishes at 0, so its Taylor series converges to the wrong function.'

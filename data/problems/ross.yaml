  problemLatex: |
    Let $f_n(x) = nx^n$ for $x \in [0, 1]$ and $n \in \mathbb{N}$. Show

    (a) $\lim f_n(x) = 0$ for $x \in [0, 1)$. *Hint*: Use Exercise 9.12.

    (b) However, $\lim_{n\to\infty} \int_0^1 f_n(x)\,dx = 1$.

    *(Exercise 9.12: Assume all $s_n \neq 0$ and that the limit $L = \lim \left|\frac{s_{n+1}}{s_n}\right|$ exists. (a) Show that if $L < 1$, then $\lim s_n = 0$. ... (b) Show that if $L > 1$, then $\lim |s_n| = +\infty$. ...)*
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      (a) Obviously $\lim f_n(0) = 0$. Consider $0 < x < 1$ and let $s_n = nx^n$. Then $s_{n+1}/s_n = (\frac{n+1}{n})x$, so $\lim |s_{n+1}/s_n| = x < 1$. Exercise 9.12(a) shows $0 = \lim s_n = \lim nx^n = \lim f_n(x)$.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: 'Verified against page image. Exercise 9.12 quoted verbatim (its internal hints elided with ''...''). Note: ''f_n(x) dx'' printed as an integral from 0 to 1. bookHint from PDF p. 395 (printed 386).'

  problemLatex: |
    (a) Show the closed interval $[a, b]$ is a closed set.
    (b) Is there a sequence $(s_n)$ such that $(0, 1)$ is its set of subsequential limits?

    *[Paraphrase, not verbatim — Ross's notion of closed set (§11, before Theorem 11.9): a set $S$ is called closed if it contains all limits of sequences from $S$.]*

    *(Theorem 11.9, quoted: Let $S$ denote the set of subsequential limits of a sequence $(s_n)$. Suppose $(t_n)$ is a sequence in $S \cap \mathbb{R}$ and that $t = \lim t_n$. Then $t$ belongs to $S$.)*
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      (a) To show $[a, b]$ is closed, we need to consider a limit $s$ of a convergent sequence $(s_n)$ from $[a, b]$ and show $s$ is also in $[a, b]$. But this was done in Exercise 8.9.
      (b) No! $(0, 1)$ is not closed, i.e., $(0, 1)$ does not have the property described in Theorem 11.9. For example, $t_n = \frac{1}{n}$ defines a sequence in $(0, 1)$ such that $t = \lim t_n$ does not belong to $(0, 1)$.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)

  concept: classifying uniform continuity of x^3, 1/x^3, sin(1/x^2), x^2 sin(1/x) on various sets
  title: Which functions are uniformly continuous?
  difficulty: medium
  category: canonical
  type: conceptual
  tags:
  - uniform-continuity
  - counterexample
  - extension
  - Cauchy
  problemLatex: |
    Which of the following continuous functions are uniformly continuous on the specified set? Justify your answers. Use any theorems you wish.
    (a) $f(x) = x^{17}\sin x - e^x \cos 3x$ on $[0, \pi]$,
    (b) $f(x) = x^3$ on $[0, 1]$,
    (c) $f(x) = x^3$ on $(0, 1)$,
    (d) $f(x) = x^3$ on $\mathbb{R}$,
    (e) $f(x) = \frac{1}{x^3}$ on $(0, 1]$,
    (f) $f(x) = \sin\frac{1}{x^2}$ on $(0, 1]$,
    (g) $f(x) = x^2 \sin\frac{1}{x}$ on $(0, 1]$.
  hints:
  - text: |
      Hints: To decide (a) and (b), use Theorem 19.2. Parts (c), (e), (f) and (g) can be settled using Theorem 19.5. Theorem 19.4 can also be used to decide (e) and (f); compare Example 6. One needs to resort to the definition to handle (d).
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: 'bookHint from PDF p.390 (printed 381). For reference: Theorem 19.2 = continuous on [a,b] implies uniformly continuous; Theorem 19.4 = uniformly continuous functions map Cauchy sequences to Cauchy sequences; Theorem 19.5 = f on (a,b) is uniformly continuous iff it extends continuously to [a,b]; Example 6 = 1/x^2 not uniformly continuous on (0,1) via s_n = 1/n. Verified against page image.'
  curation:
    why: Classify uniform continuity using the whole toolkit (compact domain, extension criterion, Cauchy preservation, unbounded domain).

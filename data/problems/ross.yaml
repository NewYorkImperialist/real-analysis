  problemLatex: |
    Consider $f_n(x) = nx^n(1 - x)$ for $x \in [0, 1]$.

    (a) Find $f(x) = \lim f_n(x)$.

    (b) Does $f_n \to f$ uniformly on $[0, 1]$? Justify.

    (c) Does $\int_0^1 f_n(x)\,dx$ converge to $\int_0^1 f(x)\,dx$? Justify.
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      (a) $f(x) = 0$ for $x \in [0, 1]$. For $x < 1$, $\lim_{n\to\infty} nx^n = 0$ as in Exercise 23.9(a).

      (b) Use calculus to show $f_n$ takes its maximum at $\frac{n}{n+1}$. Thus $\sup\{|f_n(x)| : x \in [0, 1]\} = f_n(\frac{n}{n+1}) = (\frac{n}{n+1})^{n+1}$. As in Example 8, it turns out $\lim f_n(\frac{n}{n+1}) = 1/e$. So Remark 24.4 shows $(f_n)$ does not converge uniformly to 0.

      (c) $\int_0^1 f_n(x)\,dx = \frac{n}{(n+1)(n+2)} \to 0 = \int_0^1 f(x)\,dx$.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: Verified against page image. bookHint verbatim from PDF pp. 395–396 (printed 386–387); it references Remark 24.4 (uniform convergence iff sup|f - f_n| -> 0; see ross-24.12).
  curation:
    why: 'n xⁿ(1−x): test uniform convergence and convergence of the integrals separately, and see how the two are related.'

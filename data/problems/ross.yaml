  problemLatex: |
    Let $(s_n)$ be a sequence of numbers in $(0, 1)$. Each $s_n$ has a decimal expansion $0.d_1^{(n)} d_2^{(n)} d_3^{(n)} \cdots$. For each $n$, let $e_n = 6$ if $d_n^{(n)} \ne 6$ and $e_n = 7$ if $d_n^{(n)} = 6$. Show $.e_1 e_2 e_3 \cdots$ is the decimal expansion for some number $y$ in $(0, 1)$ and $y \ne s_n$ for all $n$. *Remark*: This shows the elements of $(0, 1)$ cannot be listed as a sequence. In set-theoretic parlance, $(0, 1)$ is "uncountable." Since the set $\mathbb{Q} \cap (0, 1)$ can be listed as a sequence, there are a lot of irrational numbers in $(0, 1)$!

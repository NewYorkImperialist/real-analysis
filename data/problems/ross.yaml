  notes: Verified against page image. Ross's L'Hospital's Rule 30.2 includes the case lim |g(x)| = +infinity (no hypothesis on f). No book hint.
  curation:
    why: If f + f′ → L then f → L and f′ → 0 — a slick use of L'Hôpital with eˣ.
- id: ross-31.4
  source:
    key: ross

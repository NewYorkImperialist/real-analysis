  concept: sin x and e^x are not uniform limits of polynomials on R
  title: No polynomials converge uniformly to $\sin x$ or $e^x$ on $\mathbb{R}$
  difficulty: medium
  category: canonical
  type: counterexample
  tags:
  - Weierstrass-approximation
  - polynomials
  - unbounded-domain
  - counterexample
  problemLatex: |
    Show there does not exist a sequence of polynomials converging uniformly on $\mathbb{R}$ to $f$ if

    (a) $f(x) = \sin x$, $\qquad$ (b) $f(x) = e^x$.
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      (a) Assume a polynomial $p$ satisfies $|p(x) - \sin x| < 1$ for all $x \in \mathbb{R}$. Clearly $p$ cannot be a constant function. But if $p$ is nonconstant, then $p$ is unbounded on $\mathbb{R}$ and the same is true for $p(x) - \sin x$, a contradiction.

      (b) Assume $|e^x - \sum_{k=0}^{n-1} a_k x^k| < 1$ for all $x \in \mathbb{R}$. For $x > 0$ we have
      $$e^x - \sum_{k=0}^{n-1} a_k x^k \ge \frac{1}{n!}x^n - \sum_{k=0}^{n-1} |a_k| x^k$$
      and for large $x$ the right side will exceed 1.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: Verified against page image. bookHint from PDF p. 398 (printed 389).
  curation:
    why: 'sin x and eˣ are not uniform limits of polynomials on all of ℝ: Weierstrass approximation needs a compact interval.'

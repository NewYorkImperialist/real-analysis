- id: ross-8.7
  source:
    key: ross
    chapter: 2 Sequences
    section: §8 A Discussion about Proofs
    problemNumber: Exercise 8.7
    page: '44'
  topic: sequences
  subtopics:
  - divergence
  skills:
  - negate-definition
  - triangle-inequality
  - contradiction
  concept: proving a sequence does not converge
  title: Showing oscillating sequences diverge
  difficulty: easy
  category: canonical
  type: proof
  tags:
  - divergence
  - negation
  - triangle-inequality
  problemLatex: |
    Show the following sequences do not converge.
    (a) $\cos(\frac{n\pi}{3})$
    (b) $s_n = (-1)^n n$
    (c) $\sin(\frac{n\pi}{3})$
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      (a) Assume $\lim \cos(\frac{n\pi}{3}) = a$. Then there exists $N$ such that $n > N$ implies $|\cos(\frac{n\pi}{3}) - a| < 1$. Consider $n > N$ and $n + 3$ where $n$ is a multiple of 6; substituting these values in the inequality gives $|1 - a| < 1$ and $|-1 - a| < 1$. By the triangle inequality
      $$2 = |(1 - a) - (-1 - a)| \le |1 - a| + |-1 - a| < 1 + 1 = 2,$$
      a contradiction.
      (b) Assume $\lim (-1)^n n = a$. Then there exists $N$ such that $n > N$ implies $|(-1)^n n - a| < 1$. For an even $n > N$ and for $n + 2$ this tells us $|n - a| < 1$ and $|n + 2 - a| < 1$. So $2 = |n + 2 - a - (n - a)| \le |n + 2 - a| + |n - a| < 2$, a contradiction.
      (c) Note the sequence takes the values $\pm\frac{\sqrt{3}}{2}$ for large $n$. Assume $\lim \sin(\frac{n\pi}{3}) = a$. Then there is $N$ such that
      $$n > N \quad\text{implies}\quad \left|\sin\left(\frac{n\pi}{3}\right) - a\right| < \frac{\sqrt{3}}{2}.$$
      Substituting suitable $n > N$, we obtain $\left|\frac{\sqrt{3}}{2} - a\right| < \frac{\sqrt{3}}{2}$ and $\left|-\frac{\sqrt{3}}{2} - a\right| < \frac{\sqrt{3}}{2}$. By the triangle inequality
      $$\sqrt{3} = \left|\frac{\sqrt{3}}{2} - \left(-\frac{\sqrt{3}}{2}\right)\right| \le \left|\frac{\sqrt{3}}{2} - a\right| + \left|a - \left(-\frac{\sqrt{3}}{2}\right)\right| < \frac{\sqrt{3}}{2} + \frac{\sqrt{3}}{2} = \sqrt{3},$$
      a contradiction.
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: bookHint from PDF pp. 380–381.
  curation:
    why: 'Proving divergence means negating the definition: some ε works against every N.'

  concept: epsilon-delta continuity proofs (x^2, sqrt x at 0, x sin(1/x) at 0, x^3)
  title: Epsilon–delta continuity proofs for four functions
  difficulty: easy
  category: canonical
  type: proof
  tags:
  - continuity
  - epsilon-delta
  - machinery
  problemLatex: |
    Prove each of the following functions in continuous at $x_0$ by verifying the $\epsilon$–$\delta$ property of Theorem 17.2.
    *(Theorem 17.2: Let $f$ be a real-valued function whose domain is a subset of $\mathbb{R}$. Then $f$ is continuous at $x_0$ in $\operatorname{dom}(f)$ if and only if for each $\epsilon > 0$ there exists $\delta > 0$ such that $x \in \operatorname{dom}(f)$ and $|x - x_0| < \delta$ imply $|f(x) - f(x_0)| < \epsilon$.)*
    (a) $f(x) = x^2$, $x_0 = 2$;
    (b) $f(x) = \sqrt{x}$, $x_0 = 0$;
    (c) $f(x) = x \sin(\frac{1}{x})$ for $x \neq 0$ and $f(0) = 0$, $x_0 = 0$;
    (d) $g(x) = x^3$, $x_0$ arbitrary.
    *Hint for* (d): $x^3 - x_0^3 = (x - x_0)(x^2 + x_0 x + x_0^2)$.
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      (a) Discussion. Let $\epsilon > 0$. We want $|x^2 - 4| < \epsilon$ for $|x - 2|$ small, i.e., we want $|x - 2| \cdot |x + 2| < \epsilon$ for $|x - 2|$ small. If $|x - 2| < 1$, then $|x + 2| < 5$, so it suffices to get $|x - 2| \cdot 5 < \epsilon$. Set $\delta = \min\{1, \frac{\epsilon}{5}\}$.
      (c) For $\epsilon > 0$, let $\delta = \epsilon$ and observe
      $$|x - 0| < \delta \quad\text{implies}\quad \left|x \sin\left(\frac{1}{x}\right) - 0\right| < \epsilon.$$
    source: Ross, Elementary Analysis — Selected Hints and Answers (back of book)
    kind: textbook
  notes: Book typo 'in continuous' (for 'is continuous') kept verbatim. Theorem 17.2 quoted verbatim (condition (1)). bookHint from PDF p.388 (printed 379). Verified against page image.
  curation:
    why: 'Four ε–δ continuity proofs of increasing subtlety: bounding a factor near x₀, δ = ε², δ = ε, and a point-dependent δ.'

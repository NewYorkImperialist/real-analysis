  concept: Cauchy mean value theorem
  title: Cauchy mean value theorem
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - Cauchy-mean-value-theorem
  - Rolle
  - auxiliary-function
  - machinery
  problemLatex: |
    Prove the *Cauchy mean value theorem*, which says this:

    > If $f$ and $g$ are continuous on $[a,b]$ and differentiable on $(a,b)$, then there is a number $x \in (a,b)$ such that
    > $$[f(b) - f(a)] \cdot g'(x) = [g(b) - g(a)] \cdot f'(x).$$

    (Note that the mean value theorem (Theorem 7.22) is a special case of this, in which $g(x) = x$.)
  curation:
    why: The Cauchy Mean Value Theorem — the engine of L'Hôpital's rule.

  concept: mean value theorem for integrals (including weighted version)
  title: Mean value theorems for integrals
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - mean-value-theorem-for-integrals
  - IVT
  - integral-inequalities
  problemLatex: |
    (a) Prove that if $f$ is integrable on $[a,b]$ and $m \le f(x) \le M$ for all $x$ in $[a,b]$, then
    $$\int_a^b f(x)\,dx = (b-a)\cdot\gamma$$
    for some $\gamma$ with $m \le \gamma \le M$.

    (b) Prove that if $f$ is continuous on $[a,b]$, then
    $$\int_a^b f(x)\,dx = (b-a)\cdot f(x_0)$$
    for some $x_0 \in [a,b]$.

    (c) Show by example that (b) need not hold if $f$ is not continuous.

    (d) Prove the following more general result (Part (b) is the special case $g(x) = 1$ for all $x$.), known as the *general mean value theorem for integrals*: Suppose that $f$ is continuous on $[a,b]$ and $g$ is integrable and nonnegative on $[a,b]$. Prove that
    $$\int_a^b f(x) g(x)\,dx = f(x_0)\cdot\int_a^b g(x)\,dx$$
    for some $x_0 \in [a,b]$.
  notes: 'Typo fixed in (d): book says ''Part (c) is the special case g(x) = 1''; it is Part (b).'
  curation:
    why: Mean value theorem for integrals, including the weighted version.

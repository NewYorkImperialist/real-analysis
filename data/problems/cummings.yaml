- id: cummings-7.10
  source:
    key: cummings
    chapter: 7 Differentiation
    section: Chapter 7 Exercises
    problemNumber: Exercise 7.10
    page: '221'
  topic: differentiation
  subtopics:
  - rolle-mvt

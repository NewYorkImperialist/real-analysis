  concept: Rolle's theorem hypotheses are sharp (counterexamples)
  title: Why each hypothesis of Rolle's theorem is needed
  difficulty: easy
  category: canonical
  type: counterexample
  tags:
  - Rolle
  - hypotheses
  - counterexample
  problemLatex: |
    In this exercise you will explore why each of the three main assumptions in Rolle's theorem is necessary. To that end, give an example of a function $f$ which satisfies each of the following conditions, and yet $f'(c) \neq 0$ for all $c \in (a,b)$.

    (a) A function $f$ which is continuous on $[a,b]$ and differentiable on $(a,b)$ (but we don't assume $f(a) = f(b)$).

    (b) A function $f$ which is continuous on $[a,b]$ and $f(a) = f(b)$ (but we don't assume $f$ is differentiable on $(a,b)$).

    (c) A function $f$ which is differentiable on $(a,b)$ and $f(a) = f(b)$ (but we don't assume $f$ is continuous on $[a,b]$).
  notes: Book reads 'which satisfies of each of the following'; normalized to 'which satisfies each of the following'. In (b), f'(c) ≠ 0 should be read as 'f'(c) is never 0 where it exists'.
  curation:
    why: Each hypothesis of Rolle's theorem is necessary — find the counterexamples.
- id: cummings-7.14
  source:

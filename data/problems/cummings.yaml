  - limits
  - infinity
  problemLatex: |
    Prove the following "$\infty/\infty$" case of l'Hôpital's rule. Prove that if $f\colon (a,b) \to \mathbb{R}$ and $g\colon (a,b) \to \mathbb{R}$ are differentiable functions and $\lim_{x\to a} f(x) = \lim_{x\to a} g(x) = \infty$, then
    $$\lim_{x\to a} \frac{f'(x)}{g'(x)} = L \quad\text{implies}\quad \lim_{x\to a} \frac{f(x)}{g(x)} = L.$$
  notes: Since the domain is (a,b), the limits x -> a are one-sided (from the right). Hypothesis g' ≠ 0 near a is implicit.
  curation:
    why: 'L''Hôpital''s rule when both functions blow up: the Cauchy mean value theorem plus a two-stage estimate, since nothing can be evaluated at a.'

- id: cummings-8.28
  source:
    key: cummings
    chapter: 8 Integration
    section: Chapter 8 Exercises
    problemNumber: Exercise 8.28
    page: '274'
  topic: integration
  subtopics:
  - integrability-criteria
  skills:
  - partition-refinement
  concept: f integrable iff squeezed between step functions with integrals within ε
  title: Integrability by squeezing between step functions
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - Riemann-integration
  - step-function
  - Darboux-sums
  - characterization
  - bridge-to-measure-theory
  problemLatex: |
    A function $s\colon [a,b] \to \mathbb{R}$ is called a *step function* if there is a partition $P = \{x_0, x_1, \dots, x_n\}$ of $[a,b]$ such that $s$ is constant on each interval $(x_{i-1}, x_i)$.

    (a) Prove that if $f$ is integrable on $[a,b]$, then for any $\varepsilon > 0$ there is a pair of step functions $s_1$ and $s_2$ where $s_1(x) \le f(x) \le s_2(x)$ for all $x$, and
    $$\int_a^b [f(x) - s_1(x)]\,dx < \varepsilon \quad\text{and}\quad \int_a^b [s_2(x) - f(x)]\,dx < \varepsilon.$$

    (b) Suppose that for any $\varepsilon > 0$ there is a pair of step functions $s_1$ and $s_2$ where $s_1(x) \le f(x) \le s_2(x)$ for all $x$, and
    $$\int_a^b [f(x) - s_1(x)]\,dx < \varepsilon \quad\text{and}\quad \int_a^b [s_2(x) - f(x)]\,dx < \varepsilon.$$
    Prove that $f$ is integrable.
  notes: Book omits '< ε' after the second integral in both (a) and (b) (prints '∫[s_2(x) - f(x)] dx.'); restored as the evident intent. Note (b) as printed presupposes the integrals of f - s_1 and s_2 - f make sense; a cleaner reading is ∫(s_2 - s_1) < 2ε or using upper/lower integrals.
  curation:
    why: 'Riemann integrability is equivalent to being squeezed between step functions: the bridge from Darboux sums to general integration theory.'
  tier: upper

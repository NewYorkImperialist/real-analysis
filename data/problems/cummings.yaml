  concept: if a < b + ε for all ε>0 then a ≤ b; if |a−b|<ε for all ε then a=b
  title: If $a < b + \varepsilon$ for every $\varepsilon > 0$ then $a \le b$
  difficulty: introductory
  category: canonical
  type: proof
  tags:
  - epsilon
  - inequalities
  - ordered-field
  - machinery
  problemLatex: |
    Let $a, b$ and $\varepsilon$ be elements of an ordered field.
    (a) Show that if $a < b + \varepsilon$ for every $\varepsilon > 0$, then $a \le b$.
    (b) Use part (a) to show that if $|a-b| < \varepsilon$ for all $\varepsilon > 0$, then $a = b$.
    Note whenever you use an axiom.
  notes: Verbatim from page image.
  curation:
    why: 'If a < b + ε for every ε > 0 then a ≤ b: the basic way analysts prove inequalities and equalities.'

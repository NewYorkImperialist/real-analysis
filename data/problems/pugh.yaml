  concept: Mertens' theorem (one series absolutely convergent suffices) and divergent Cauchy square of (-1)^n/sqrt(n+1)
  title: Mertens' theorem and Cauchy products
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - Cauchy-product
  - Mertens-theorem
  - absolute-convergence
  - conditional-convergence
  - counterexample
  - hypothesis-removal
  problemLatex: |
    With reference to Exercise 72,

    (a) Reduce the hypothesis that both series $\sum a_i$ and $\sum b_j$ are absolutely convergent to merely one being absolutely convergent and the other convergent. (Exercises 72 and 73(a) are known as **Mertens' Theorem**.)

    (b) Find an example to show that the Cauchy product of two conditionally convergent series may diverge.

    *(Exercise 72: Absolutely convergent series can be multiplied in a natural way, the result being their **Cauchy product**,*
    $$\Big(\sum_{i=0}^\infty a_i\Big)\Big(\sum_{j=0}^\infty b_j\Big) = \sum_{k=0}^\infty c_k$$
    *where $c_k = a_0b_k + a_1b_{k-1} + \cdots + a_kb_0$. (a) Prove that $\sum c_k$ converges absolutely. The hint to 72 says: letting $A_n, B_n, C_n$ be the $n$th partial sums of $\sum a_i, \sum b_j, \sum c_k$, "you are asked to prove that $(\lim A_n)(\lim B_n) = \lim C_n$.")*
  notes: Checked against the page image. The relevant content of Exercise 72 is quoted (the definition, part (a), and the sentence from its hint that states the intended conclusion), since 73(a) asks for the conclusion of 72 under the weaker hypothesis. Pugh marks this exercise **.
  curation:
    why: 'Mertens'' theorem on Cauchy products, and why its absolute-convergence hypothesis cannot simply be dropped.'
  tier: upper

- id: pugh-3.68
  source:
    key: pugh
    chapter: 3 Functions of a Real Variable
    section: Chapter 3 Exercises
    problemNumber: Exercise 68
    page: '209'
  topic: series
  subtopics:
  - conditional-convergence
  skills:
  - taylor-estimate
  - grouping-terms
  - logarithm-trick
  - construct-counterexample
  concept: sum a_k and prod(1+a_k) can converge/diverge independently when a_k changes sign ((-1)^k/sqrt k examples)
  title: Infinite products versus series with sign changes
  difficulty: medium
  category: synthesis
  type: counterexample
  tags:
  - infinite-product
  - conditional-convergence
  - logarithm
  - Taylor
  - counterexample
  - alternating-series
  problemLatex: |
    Show that conditional convergence of the series $\sum a_k$ and the product $\prod(1+a_k)$ can be unrelated to each other:

    (a) Set $a_k = (-1)^k/\sqrt{k}$. The series $\sum a_k$ converges but the corresponding product $\prod(1+a_k)$ diverges. [Hint: Group the terms in the product two at a time.]

    (b) Let $e_k = 0$ when $k$ is odd and $e_k = 1$ when $k$ is even. Set $b_k = e_k/k + (-1)^k/\sqrt{k}$. The series $\sum b_k$ diverges while the corresponding product $\prod_{k\ge 2}(1+b_k)$ converges.

    *(Exercise 67: An **infinite product** is an expression $\prod c_k$ where $c_k > 0$. The $n$th **partial product** is $C_n = c_1\cdots c_n$. If $C_n$ converges to a limit $C\ne 0$ then the product converges to $C$.)*
  notes: 'Checked against the page image. The definitions from Exercise 67 are quoted. In (a), 1 + a_1 = 0, so the k = 1 factor violates c_k > 0. That is the book''s own sloppiness; part (b) starts at k >= 2, and (a) is presumably meant from k = 2 as well. Exercise 67 itself (constant-sign a_k: sum converges iff product converges) is canonical and the bank has no infinite products. The curator may want to add it as a core-gap companion (see skipped).'
  curation:
    why: 'Infinite products: without a sign condition, convergence of a series and of the matching product are unrelated.'
  tier: upper

- id: pugh-2.44
  source:
    key: pugh

- id: pugh-3.23
  source:
    key: pugh
    chapter: 3 Functions of a Real Variable
    section: Chapter 3 Exercises
    problemNumber: Exercises 23–25 (merged)
    page: '201'
  topic: function-sequences
  subtopics:
  - pointwise-convergence
  skills:
  - baire-category-argument
  - closed-set-decomposition
  - contradiction
  - oscillation-argument
  - difference-quotient-approximation
  concept: 'Baire class 1 ⇒ continuity points are dense (the sets {osc ≥ 1/k} are closed and nowhere dense); hence every derivative is continuous on a dense set'
  title: Continuity points of a Baire class 1 function are dense
  difficulty: very-hard
  category: challenge
  type: proof
  tags:
  - Baire-class-1
  - Baire-category
  - pointwise-convergence
  - oscillation
  - nowhere-dense
  - discontinuity-set
  - derivative
  - continuity-points
  problemLatex: |
    *(Facts and definitions from the text, which you may use.)* The **oscillation** of a function $f\colon[a,b]\to\mathbb{R}$ at $x$ is
    $$\operatorname{osc}_x f = \limsup_{t\to x} f(t) - \liminf_{t\to x} f(t),$$
    equivalently $\operatorname{osc}_x f = \lim_{r\to 0} \operatorname{diam} f([x-r,x+r])$ (with $r>0$, and $[x-r,x+r]$ intersected with $[a,b]$; the value $+\infty$ is allowed). The function $f$ is continuous at $x$ if and only if $\operatorname{osc}_x f = 0$. For $k \in \mathbb{N}$ let $D_k = \{x\in[a,b] : \operatorname{osc}_x f \ge 1/k\}$; each $D_k$ is closed (Exercise 19(a)). **Baire's Theorem:** if a complete metric space is the countable union of closed subsets then at least one of them has nonempty interior.

    Suppose that $f_n\colon[a,b]\to\mathbb{R}$ is a sequence of continuous functions that converges pointwise to a limit function $f\colon[a,b]\to\mathbb{R}$. Such an $f$ is said to be of **Baire class 1**. (Pointwise convergence means: for each $x$, $f_n(x)$ converges to $f(x)$ as $n\to\infty$.)

    Prove that the set $D_k$ of discontinuity points with oscillation $\ge 1/k$ is nowhere dense, as follows. To arrive at a contradiction, suppose that $D_k$ is dense in some interval $(\alpha,\beta)\subset[a,b]$. Since $D_k$ is closed, it contains $(\alpha,\beta)$. Cover $\mathbb{R}$ by countably many intervals $(a_\ell, b_\ell)$ of length $< 1/k$ and set
    $$H_\ell = f^{\mathrm{pre}}(a_\ell, b_\ell).$$

    (a) Why does $\bigcup_\ell H_\ell = [a,b]$?

    (b) Show that no $H_\ell$ contains a subinterval of $(\alpha,\beta)$.

    (c) Why are
    $$F_{\ell mn} = \left\{x\in[a,b] : a_\ell + \frac{1}{m} \le f_n(x) \le b_\ell - \frac{1}{m}\right\}, \qquad E_{\ell mN} = \bigcap_{n\ge N} F_{\ell mn}$$
    closed?

    (d) Show that
    $$H_\ell = \bigcup_{m,N\in\mathbb{N}} E_{\ell mN}.$$

    (e) Use (a) and Baire's Theorem to deduce that some $E_{\ell mN}$ contains a subinterval of $(\alpha,\beta)$.

    (f) Why does (e) contradict (b) and complete the proof that $D_k$ is nowhere dense?

    (g) *(Exercise 24.)* Combine the closedness of $D_k$, the result of (a)–(f), and Baire's Theorem to show that a Baire class 1 function has a dense set of continuity points.

    (h) *(Exercise 25(a).)* Suppose that $g\colon[a,b]\to\mathbb{R}$ is differentiable. Prove that $g'$ is of Baire class 1. [Hint: Extend $g$ to a differentiable function defined on a larger interval and consider
    $$f_n(x) = \frac{g(x+1/n) - g(x)}{1/n}$$
    for $x\in[a,b]$. Is $f_n(x)$ continuous? Does $f_n(x)$ converge pointwise to $g'(x)$ as $n\to\infty$?]

    (i) *(Exercise 25(b).)* Infer from (g) that *a derivative cannot be everywhere discontinuous*. It must be continuous on a dense subset of its domain of definition.
  notes: 'Merged at curation: Pugh''s Exercises 23, 24 and 25 form one item. Parts (a)–(f) are Exercise 23, (g) is Exercise 24 and (h)–(i) are Exercise 25(a)–(b), all checked against the page images (printed pp. 201–202). Edits: Pugh''s long parenthetical on Baire class r and the Boas reference are condensed to the definition of pointwise convergence; "By Exercise 19, D_k is closed" became "Since D_k is closed", with that fact quoted in the opening paragraph; Exercise 24''s "Combine Exercises 19, 23, and Baire''s Theorem" and 25(b)''s "Infer from Exercise 24" are reworded to refer to the parts of this item. The oscillation definitions (both forms), the fact that continuity at x is equivalent to zero oscillation, and Exercise 19(a) are quoted from Section 3.2 and Exercise 19; Baire''s Theorem is quoted as stated in Exercise 20 (Pugh cites it as page 256 in Ex. 20 and page 243 in Ex. 23). f^pre is Pugh''s notation for preimage. At an endpoint of [a,b], "differentiable" means one-sided differentiable. Pugh marks Exercise 23 **.'
  curation:
    why: 'Baire category applied to functions: where a pointwise limit of continuous functions must be continuous, and what that says about derivatives.'
  tier: upper


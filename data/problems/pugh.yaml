  problemLatex: |
    *(Definition, quoted from Exercise 30.)* A function $f\colon (a,b) \to \mathbb{R}$ is a **convex function** if for all $x, y \in (a,b)$ and all $s, t \in [0,1]$ with $s + t = 1$ we have

    (a) *(Exercise 30(c).)* Suppose that $f$ is convex and $a < x < u < b$. The slope $\sigma$ of the line through $(x, f(x))$ and $(u, f(u))$ depends on $x$ and $u$, say $\sigma = \sigma(x,u)$. Prove that $\sigma$ increases when $x$ increases, and $\sigma$ increases when $u$ increases.


- id: pugh-3.29
  source:
    key: pugh
    chapter: 3 Functions of a Real Variable
    section: Chapter 3 Exercises
    problemNumber: Exercise 29
    page: '203'
  topic: topology
  subtopics:
  - compactness
  skills:

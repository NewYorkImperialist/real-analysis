  concept: closed graph / compact graph vs continuity
  title: Closed and compact graphs versus continuity
  difficulty: medium
  category: synthesis
  type: proof
  tags:
  - graph
  - closed-set
  - compactness
  - continuity
  - counterexample
  - closed-graph
  problemLatex: |
    Consider a function $f\colon M \to \mathbb{R}$. Its graph is the set
    $$\{(p, y) \in M \times \mathbb{R} : y = fp\}.$$
    (a) Prove that if $f$ is continuous then its graph is closed (as a subset of $M \times \mathbb{R}$).
    (b) Prove that if $f$ is continuous and $M$ is compact then its graph is compact.
    (c) Prove that if the graph of $f$ is compact then $f$ is continuous.
    (d) What if the graph is merely closed? Give an example of a discontinuous function $f\colon \mathbb{R} \to \mathbb{R}$ whose graph is closed.
  notes: Pugh writes fp for f(p).
  curation:
    why: 'How continuity relates to topological properties of the graph, in both directions.'
  tier: upper


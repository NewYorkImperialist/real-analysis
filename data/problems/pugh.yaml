  - well-ordering
  concept: '[a,b] is not a zero set (measure zero): proof via minimal bad finite cover'
  title: The interval $[a,b]$ is not a zero set
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - zero-set
  - measure-zero
  - Heine-Borel
  - compactness
  - open-cover
  - minimal-counterexample
  - bridge-to-measure-theory
  problemLatex: |
    Prove that the interval $[a,b]$ is not a zero set.

    (a) Explain why the following observation is not a solution to the problem: "Every open interval that contains $[a,b]$ has length $> b-a$."

    (b) Instead, suppose there is a "bad" covering of $[a,b]$ by open intervals $\{I_i\}$ whose total length is $< b-a$, and justify the following steps.

    (i) It is enough to deal with finite bad coverings.

    (ii) Let $\mathcal{B} = \{I_1,\dots,I_n\}$ be a bad covering such that $n$ is minimal among all bad coverings.

    (iii) Show that no bad covering has $n=1$ so we have $n\ge 2$.

    (iv) Show that it is no loss of generality to assume $a\in I_1$ and $I_1\cap I_2 \ne \emptyset$.

    (v) Show that $I = I_1\cup I_2$ is an open interval and $|I| < |I_1| + |I_2|$.

    (vi) Show that $\mathcal{B}' = \{I, I_3,\dots,I_n\}$ is a bad covering of $[a,b]$ with fewer intervals, a contradiction to minimality of $n$.

    *(Definition from the text: a set $Z\subset\mathbb{R}$ is a **zero set** if for each $\epsilon>0$ there is a countable covering of $Z$ by open intervals $(a_i,b_i)$ such that $\sum_{i=1}^\infty b_i - a_i \le \epsilon$.)*
  notes: Checked against the page image. The zero-set definition is quoted from Section 3.2. The book writes the coverings with calligraphic B.
  curation:
    why: 'Bridge to measure theory: proving that an interval does not have measure zero, which is less obvious than it sounds.'
  tier: upper


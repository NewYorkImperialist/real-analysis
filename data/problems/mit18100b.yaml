  concept: C[a,b] with the L^1 metric is not complete (ramp functions converging to a step)
  title: Completeness of $C[-1,1]$ under the $L^1$ metric
  difficulty: medium
  category: canonical
  type: counterexample
  tags:
  - metric-space
  - completeness
  - L1-metric
  - Cauchy
  - Riemann-integration
  - function-space
  problemLatex: |
    *(Inlined from Problem 4: let $\mathscr{C}[a,b]$ denote the set of continuous real functions on $[a,b]$, and for $f, g \in \mathscr{C}[a,b]$ put*
    $$d_1(f,g) = \int_a^b |f - g|.$$
    *Problem 4(d) shows that $\mathscr{C}[a,b]$ is a metric space under the metric $d_1$; you may use this.)*

    Consider the metric space $(\mathscr{C}[-1,1], d_1)$ from 4(d) (here $a = -1$, $b = 1$).
    (a) Let $f_n$ denote the function
    $$f_n(x) = \begin{cases} 1, & x > \frac{1}{n}, \\ nx, & 0 \le x \le \frac{1}{n}, \\ 0, & x < 0. \end{cases}$$
    Show that $f_n \in \mathscr{C}[-1,1]$, and calculate $\int_0^1 f_n$.
    (b) Show that the sequence $(f_n)$ is a Cauchy sequence in terms of the metric $d_1$.
    (c) Does $f_n$ converge in $\mathscr{C}[-1,1]$? Is this metric space complete?
  notes: 'Verified against the rendered page. The marked parenthetical inlines the definition of d_1 from Problem 4 (formula verbatim) and the conclusion of 4(d) that d_1 is a metric on continuous functions (the bank covers that fact in abbott-8.2.2); the routine parts of Problem 4 about R^1[a,b] and pseudometrics are omitted. Problem 5 itself is verbatim. No solutions posted for F10 homework.'
  curation:
    why: 'C[−1,1] is not complete under the L¹ metric, a first glimpse of why Lebesgue integration is needed.'

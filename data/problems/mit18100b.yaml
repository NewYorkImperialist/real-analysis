  concept: pointwise convergence on C[0,1] is not induced by any norm or metric
  title: No metric on $C[0,1]$ gives pointwise convergence
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - pointwise-convergence
  - metric-space
  - norm
  - impossibility

  problemLatex: |
    Let $K$ be a compact subset of a metric space $M$, and let $\{\mathcal{U}_\alpha\}_{\alpha\in I}$ be an open cover of $K$. Show that there is a positive real number $\delta$ with the property that for every $x \in K$ there is some $\alpha \in I$ with
    $$B_\delta(x) \subseteq \mathcal{U}_\alpha.$$
  notes: 'Verified against the rendered page. Typo fixed: the original says ''some alpha in A'' although the index set is named I. Solution posted in mit18_100b_2006_pset3sol.pdf (Problem 7).'
  curation:
    why: 'The Lebesgue number lemma, the standard tool behind open-cover arguments.'

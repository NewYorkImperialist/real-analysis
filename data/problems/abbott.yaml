  problemLatex: |
    (a) Let $(a_n)$ be a bounded (not necessarily convergent) sequence, and assume $\lim b_n = 0$. Show that $\lim(a_n b_n) = 0$. Why are we not allowed to use the Algebraic Limit Theorem to prove this?
    (b) Can we conclude anything about the convergence of $(a_n b_n)$ if we assume that $(b_n)$ converges to some nonzero limit $b$?
    (c) Use (a) to prove Theorem 2.3.3, part (iii), for the case when $a = 0$.

    *(Theorem 2.3.3 (Algebraic Limit Theorem): Let $\lim a_n = a$, and $\lim b_n = b$. Then, (i) $\lim(ca_n) = ca$, for all $c \in \mathbb{R}$; (ii) $\lim(a_n + b_n) = a + b$; (iii) $\lim(a_n b_n) = ab$; (iv) $\lim(a_n/b_n) = a/b$, provided $b \neq 0$.)*
  notes: Theorem 2.3.3 quoted verbatim from p. 50.
  curation:
    why: Bounded × null → 0, with a counterexample when boundedness fails.

    *(Summary, not verbatim — setup assembled from Section 5.4: Define $h(x) = |x|$ on the interval $[-1,1]$ and extend the definition of $h$ to all of $\mathbb{R}$ by requiring that $h(x+2) = h(x)$. Define*
    $$g(x) = \sum_{n=0}^\infty h_n(x) = \sum_{n=0}^\infty \frac{1}{2^n} h(2^n x).$$
    *Assume $x$ is not a dyadic number. For a fixed value of $m \in \mathbb{N}\cup\{0\}$, $x$ falls between two adjacent dyadic points, $\frac{p_m}{2^m} < x < \frac{p_m+1}{2^m}$. Set $x_m = p_m/2^m$ and $y_m = (p_m+1)/2^m$. Repeating this for each $m$ yields two sequences $(x_m)$ and $(y_m)$ satisfying $\lim x_m = \lim y_m = x$ and $x_m < x < y_m$.)*

    (a) First prove the following general lemma: Let $f$ be defined on an open interval $J$ and assume $f$ is differentiable at $a \in J$. If $(a_n)$ and $(b_n)$ are sequences satisfying $a_n < a < b_n$ and $\lim a_n = \lim b_n = a$, show
    $$f'(a) = \lim_{n\to\infty} \frac{f(b_n) - f(a_n)}{b_n - a_n}.$$

    (b) Now use this lemma to show that $g'(x)$ does not exist.
  notes: Definitions of h, g and the dyadic sequences quoted from pp. 163–165 (pdf 174–176). Continuity of g is established elsewhere (Exercise 6.4.3/M-test). Part (a) alone is a self-contained lemma of medium difficulty.

  problemLatex: |
    **(Dirichlet's Test).** Dirichlet's Test for convergence states that if the partial sums of $\sum_{k=1}^{\infty} x_k$ are bounded (but not necessarily convergent), and if $(y_k)$ is a sequence satisfying $y_1 \ge y_2 \ge y_3 \ge \cdots \ge 0$ with $\lim y_k = 0$, then the series $\sum_{k=1}^{\infty} x_k y_k$ converges.
    (a) Point out how the hypothesis of Dirichlet's Test differs from that of Abel's Test in Exercise 2.7.13, but show that essentially the same strategy can be used to provide a proof.
    (b) Show how the Alternating Series Test (Theorem 2.7.7) can be derived as a special case of Dirichlet's Test.

    *(Summary, not verbatim — Exercise 2.7.13 (Abel's Test): if the series $\sum_{k=1}^{\infty} x_k$ converges, and if $(y_k)$ satisfies $y_1 \ge y_2 \ge y_3 \ge \cdots \ge 0$, then $\sum_{k=1}^{\infty} x_k y_k$ converges; the strategy there uses the summation-by-parts identity $\sum_{k=1}^{n} x_k y_k = s_n y_{n+1} + \sum_{k=1}^{n} s_k (y_k - y_{k+1})$ with $s_n = x_1 + \cdots + x_n$.)*

    *(Theorem 2.7.7 (Alternating Series Test): Let $(a_n)$ be a sequence satisfying, (i) $a_1 \ge a_2 \ge a_3 \ge \cdots \ge a_n \ge a_{n+1} \ge \cdots$ and (ii) $(a_n) \to 0$. Then, the alternating series $\sum_{n=1}^{\infty} (-1)^{n+1} a_n$ converges.)*
  notes: Abel's Test statement and identity quoted from Exercise 2.7.13; 'the strategy there uses' is my framing (marked). Theorem 2.7.7 quoted (p. 74).
  curation:
    why: Dirichlet's test via summation by parts; the alternating series test is a special case.

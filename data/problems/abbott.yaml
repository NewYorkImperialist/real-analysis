  problemLatex: |
    **(Abel's Test).** Abel's Test for convergence states that if the series $\sum_{k=1}^{\infty} x_k$ converges, and if $(y_k)$ is a sequence satisfying
    $$y_1 \ge y_2 \ge y_3 \ge \cdots \ge 0,$$
    then the series $\sum_{k=1}^{\infty} x_k y_k$ converges.
    (a) Use Exercise 2.7.12 to show that
    $$\sum_{k=1}^{n} x_k y_k = s_n y_{n+1} + \sum_{k=1}^{n} s_k (y_k - y_{k+1}),$$
    where $s_n = x_1 + x_2 + \cdots + x_n$.
    (b) Use the Comparison Test to argue that $\sum_{k=1}^{\infty} s_k (y_k - y_{k+1})$ converges absolutely, and show how this leads directly to a proof of Abel's Test.

    *(Exercise 2.7.12 (Summation-by-parts): Let $(x_n)$ and $(y_n)$ be sequences, let $s_n = x_1 + x_2 + \cdots + x_n$ and set $s_0 = 0$. Use the observation that $x_j = s_j - s_{j-1}$ to verify the formula $\sum_{j=m}^{n} x_j y_j = s_n y_{n+1} - s_{m-1} y_m + \sum_{j=m}^{n} s_j (y_j - y_{j+1})$.)*
  notes: Statement verified symbol-by-symbol against the page image (printed p. 79, PDF 91). Exercise 2.7.12 quoted verbatim from p. 78 (PDF 90); its displayed formula is set inline here so the closing parenthesis and italics wrap correctly (previously the ')' sat inside the display math).
  curation:
    why: 'Bridge problem: Abel''s test by summation by parts, the technique Dirichlet''s test (abbott-2.7.14) reuses.'


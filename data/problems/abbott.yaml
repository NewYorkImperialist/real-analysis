  problemLatex: |
    Prove that the only type of discontinuity a monotone function can have is a jump discontinuity.

    *(From the text: Generally speaking, discontinuities can be divided into three categories: (i) If $\lim_{x\to c} f(x)$ exists but has a value different from $f(c)$, the discontinuity at $c$ is called removable. (ii) If $\lim_{x\to c^+} f(x) \neq \lim_{x\to c^-} f(x)$, then $f$ has a jump discontinuity at $c$. (iii) If $\lim_{x\to c} f(x)$ does not exist for some other reason, then the discontinuity at $c$ is called an essential discontinuity.)*

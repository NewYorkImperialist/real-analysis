  concept: C + C = [0,2] for the Cantor set
  title: 'The sum of the Cantor set with itself is $[0,2]$'
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - Cantor-set
  - compactness
  - sumset
  - subsequence
  problemLatex: |
    As some more evidence of the surprising nature of the Cantor set, follow these steps to show that the sum $C + C = \{x + y : x, y \in C\}$ is equal to the closed interval $[0, 2]$. (Keep in mind that $C$ has zero length and contains no intervals.)

    Because $C \subseteq [0, 1]$, $C + C \subseteq [0, 2]$, so we only need to prove the reverse inclusion $[0, 2] \subseteq \{x + y : x, y \in C\}$. Thus, given $s \in [0, 2]$, we must find two elements $x, y \in C$ satisfying $x + y = s$.

    (a) Show that there exist $x_1, y_1 \in C_1$ for which $x_1 + y_1 = s$. Show in general that, for an arbitrary $n \in \mathbb{N}$, we can always find $x_n, y_n \in C_n$ for which $x_n + y_n = s$.

    (b) Keeping in mind that the sequences $(x_n)$ and $(y_n)$ do not necessarily converge, show how they can nevertheless be used to produce the desired $x$ and $y$ in $C$ satisfying $x + y = s$.

    *(Abridged quote, not fully verbatim — Section 3.1: Let $C_0$ be the closed interval $[0,1]$, and define $C_1$ to be the set that results when the open middle third is removed; that is, $C_1 = C_0 \setminus \left(\frac{1}{3}, \frac{2}{3}\right) = \left[0, \frac{1}{3}\right] \cup \left[\frac{2}{3}, 1\right]$. ... If we continue this process inductively, then for each $n = 0, 1, 2, \ldots$ we get a set $C_n$ consisting of $2^n$ closed intervals each having length $1/3^n$. Finally, we define the Cantor set $C$ to be the intersection $C = \bigcap_{n=0}^\infty C_n$.)*
  notes: Cantor set definition quoted (abridged with ellipsis) from Section 3.1, p. 85 (PDF 97).
  curation:
    why: The Cantor set has length zero, yet C + C = [0,2]. A nested-interval argument on a famous set.

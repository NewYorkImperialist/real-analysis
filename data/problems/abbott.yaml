  problemLatex: |
    **(Infinite Limits).** The statement $\lim_{x\to 0} 1/x^2 = \infty$ certainly makes intuitive sense. To construct a rigorous definition in the challenge–response style of Definition 4.2.1 for an infinite limit statement of this form, we replace the (arbitrarily small) $\epsilon > 0$ challenge with an (arbitrarily large) $M > 0$ challenge:

    *Definition:* $\lim_{x\to c} f(x) = \infty$ means that for all $M > 0$ we can find a $\delta > 0$ such that whenever $0 < |x - c| < \delta$, it follows that $f(x) > M$.

    (a) Show $\lim_{x\to 0} 1/x^2 = \infty$ in the sense described in the previous definition.

    (b) Now, construct a definition for the statement $\lim_{x\to\infty} f(x) = L$. Show $\lim_{x\to\infty} 1/x = 0$.

    (c) What would a rigorous definition for $\lim_{x\to\infty} f(x) = \infty$ look like? Give an example of such a limit.

    *(Definition 4.2.1 (Functional Limit): Let $f \colon A \to \mathbb{R}$, and let $c$ be a limit point of the domain $A$. We say that $\lim_{x\to c} f(x) = L$ provided that, for all $\epsilon > 0$, there exists a $\delta > 0$ such that whenever $0 < |x - c| < \delta$ (and $x \in A$) it follows that $|f(x) - L| < \epsilon$.)*
  notes: Statement verified against the page images (printed pp. 121–122, PDF 132–133); no transcription errors. Definition 4.2.1 quoted verbatim from p. 116, as in abbott-4.2.10.
  curation:
    why: 'Infinite limits and limits at infinity from the definition: the ε-challenge becomes an M-challenge.'


  problemLatex: |
    Assume $f_n \to f$ on a set $A$. Theorem 6.2.6 is an example of a typical type of question which asks whether a trait possessed by each $f_n$ is inherited by the limit function. Provide an example to show that all of the following propositions are false if the convergence is only assumed to be pointwise on $A$. Then go back and decide which are true under the stronger hypothesis of uniform convergence.

    (a) If each $f_n$ is uniformly continuous, then $f$ is uniformly continuous.

    (b) If each $f_n$ is bounded, then $f$ is bounded.

    (c) If each $f_n$ has a finite number of discontinuities, then $f$ has a finite number of discontinuities.

    (d) If each $f_n$ has fewer than $M$ discontinuities (where $M \in \mathbb{N}$ is fixed), then $f$ has fewer than $M$ discontinuities.

    (e) If each $f_n$ has at most a countable number of discontinuities, then $f$ has at most a countable number of discontinuities.

    *(Theorem 6.2.6 (Continuous Limit Theorem): Let $(f_n)$ be a sequence of functions defined on $A \subseteq \mathbb{R}$ that converges uniformly on $A$ to a function $f$. If each $f_n$ is continuous at $c \in A$, then $f$ is continuous at $c$.)*
  notes: Theorem 6.2.6 quoted verbatim.
  curation:
    why: Which properties pass to uniform limits but not pointwise limits — boundedness, continuity, uniform continuity.

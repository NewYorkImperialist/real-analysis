  title: 'Constructing the Cantor function'
  difficulty: hard
  category: challenge
  type: construction
  tags:
  - Cantor-function
  - Cantor-set
  - uniform-convergence
  - construction
  problemLatex: |
    **(Cantor Function).** Review the construction of the Cantor set $C \subseteq [0,1]$ from Section 3.1. This exercise makes use of results and notation from this discussion.

    (a) Define $f_0(x) = x$ for all $x \in [0,1]$. Now, let
    $$f_1(x) = \begin{cases} (3/2)x & \text{for } 0 \le x \le 1/3 \\ 1/2 & \text{for } 1/3 < x < 2/3 \\ (3/2)x - 1/2 & \text{for } 2/3 \le x \le 1. \end{cases}$$
    Sketch $f_0$ and $f_1$ over $[0,1]$ and observe that $f_1$ is continuous, increasing, and constant on the middle third $(1/3, 2/3) = [0,1]\setminus C_1$.

    (b) Construct $f_2$ by imitating this process of flattening out the middle third of each nonconstant segment of $f_1$. Specifically, let
    $$f_2(x) = \begin{cases} (1/2)f_1(3x) & \text{for } 0 \le x \le 1/3 \\ f_1(x) & \text{for } 1/3 < x < 2/3 \\ (1/2)f_1(3x - 2) + 1/2 & \text{for } 2/3 \le x \le 1. \end{cases}$$
    If we continue this process, show that the resulting sequence $(f_n)$ converges uniformly on $[0,1]$.

    (c) Let $f = \lim f_n$. Prove that $f$ is a continuous, increasing function on $[0,1]$ with $f(0) = 0$ and $f(1) = 1$ that satisfies $f'(x) = 0$ for all $x$ in the open set $[0,1]\setminus C$. Recall that the "length" of the Cantor set $C$ is 0. Somehow, $f$ manages to increase from 0 to 1 while remaining constant on a set of "length 1."
  notes: 'Uses the standard middle-thirds Cantor set: C_0=[0,1], C_1=[0,1/3]∪[2/3,1], C = ∩ C_n (Section 3.1).'
  curation:
    why: 'Construct the Cantor function as a uniform limit: continuous, increasing, constant off the Cantor set.'

  concept: iterated limits vs double limit (m/(m+n), mn/(m^2+n^2))
  title: 'Iterated limits versus double limits'
  difficulty: medium
  category: synthesis
  type: proof
  tags:
  - iterated-limits
  - double-limit
  - interchange-of-limits
  - counterexample
  problemLatex: |
    **(Iterated Limits).** Given a doubly indexed array $a_{mn}$ where $m, n \in \mathbb{N}$, what should $\lim_{m,n\to\infty} a_{mn}$ represent?
    (a) Let $a_{mn} = m/(m+n)$ and compute the iterated limits
    $$\lim_{n\to\infty}\left(\lim_{m\to\infty} a_{mn}\right) \quad\text{and}\quad \lim_{m\to\infty}\left(\lim_{n\to\infty} a_{mn}\right).$$
    Define $\lim_{m,n\to\infty} a_{mn} = a$ to mean that for all $\epsilon > 0$ there exists an $N \in \mathbb{N}$ such that if both $m, n \ge N$, then $|a_{mn} - a| < \epsilon$.
    (b) Let $a_{mn} = 1/(m+n)$. Does $\lim_{m,n\to\infty} a_{mn}$ exist in this case? Do the two iterated limits exist? How do these three values compare? Answer these same questions for $a_{mn} = mn/(m^2+n^2)$.
    (c) Produce an example where $\lim_{m,n\to\infty} a_{mn}$ exists but where neither iterated limit can be computed.
    (d) Assume $\lim_{m,n\to\infty} a_{mn} = a$, and assume that for each fixed $m \in \mathbb{N}$, $\lim_{n\to\infty}(a_{mn}) \to b_m$. Show $\lim_{m\to\infty} b_m = a$.
    (e) Prove that if $\lim_{m,n\to\infty} a_{mn}$ exists and the iterated limits both exist, then all three limits must be equal.
  notes: Part (d) notation '$\lim_{n\to\infty}(a_{mn}) \to b_m$' is as printed.
  curation:
    why: 'Iterated limits vs. a double limit: the first warning that limits cannot always be interchanged.'

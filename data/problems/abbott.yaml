    $$h(x) - h(a) = l(x)(x-a) \quad \text{for all } x \in A.$$

    (b) Use this criterion for differentiability (in both directions) to prove Theorem 5.2.5.

    *(Theorem 5.2.5 (Chain Rule): Let $f\colon A \to \mathbb{R}$ and $g\colon B \to \mathbb{R}$ satisfy $f(A) \subseteq B$ so that the composition $g \circ f$ is defined. If $f$ is differentiable at $c \in A$ and if $g$ is differentiable at $f(c) \in B$, then $g\circ f$ is differentiable at $c$ with $(g\circ f)'(c) = g'(f(c))\cdot f'(c)$.)*

  concept: countable union of countable sets is countable
  title: 'A countable union of countable sets is countable'
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - countable
  - cardinality
  - countable-union
  - induction
  problemLatex: |
    Use the following outline to supply proofs for the statements in Theorem 1.5.8.
    (a) First, prove statement (i) for two countable sets, $A_1$ and $A_2$. Example 1.5.3 (ii) may be a useful reference. Some technicalities can be avoided by first replacing $A_2$ with the set $B_2 = A_2 \setminus A_1 = \{x \in A_2 : x \notin A_1\}$. The point of this is that the union $A_1 \cup B_2$ is equal to $A_1 \cup A_2$ and the sets $A_1$ and $B_2$ are disjoint. (What happens if $B_2$ is finite?)

    Now, explain how the more general statement in (i) follows.
    (b) Explain why induction *cannot* be used to prove part (ii) of Theorem 1.5.8 from part (i).
    (c) Show how arranging $\mathbb{N}$ into the two-dimensional array
    $$\begin{array}{cccccc} 1 & 3 & 6 & 10 & 15 & \cdots \\ 2 & 5 & 9 & 14 & \cdots & \\ 4 & 8 & 13 & \cdots & & \\ 7 & 12 & \cdots & & & \\ 11 & \cdots & & & & \\ \vdots & & & & & \end{array}$$
    leads to a proof of Theorem 1.5.8 (ii).

    *(Theorem 1.5.8: (i) If $A_1, A_2, \ldots, A_m$ are each countable sets, then the union $A_1 \cup A_2 \cup \cdots \cup A_m$ is countable. (ii) If $A_n$ is a countable set for each $n \in \mathbb{N}$, then $\bigcup_{n=1}^{\infty} A_n$ is countable.)*

    *(Summary, not verbatim — Example 1.5.3 (ii): although $\mathbb{N}$ is contained in $\mathbb{Z}$ as a proper subset, $\mathbb{N} \sim \mathbb{Z}$ via $f(n) = (n-1)/2$ if $n$ is odd, $f(n) = -n/2$ if $n$ is even.)*
  notes: 'Theorem 1.5.8 quoted verbatim (p. 29). Example 1.5.3(ii) condensed from p. 26 (the formula is verbatim). Note: in Abbott, ''countable'' means N ~ A (countably infinite); finite sets are not called countable.'
  curation:
    why: 'Countable unions of countable sets: the array enumeration, and why induction cannot reach the infinite union.'

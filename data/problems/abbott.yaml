  concept: Arzelà–Ascoli theorem on [0,1]
  title: 'Arzelà–Ascoli theorem'
  difficulty: very-hard
  category: challenge
  type: proof
  tags:
  - Arzela-Ascoli
  - equicontinuity
  - uniform-convergence
  - compactness
  - diagonal-argument
  problemLatex: |
    **(Arzela–Ascoli Theorem).** For each $n \in \mathbb{N}$, let $f_n$ be a function defined on $[0,1]$. If $(f_n)$ is bounded on $[0,1]$—that is, there exists an $M > 0$ such that $|f_n(x)| \le M$ for all $n \in \mathbb{N}$ and $x \in [0,1]$—and if the collection of functions $(f_n)$ is equicontinuous (Exercise 6.2.14), follow these steps to show that $(f_n)$ contains a uniformly convergent subsequence.

    *(Exercise 6.2.14: A sequence of functions $(f_n)$ defined on a set $E \subseteq \mathbb{R}$ is called equicontinuous if for every $\epsilon > 0$ there exists a $\delta > 0$ such that $|f_n(x) - f_n(y)| < \epsilon$ for all $n \in \mathbb{N}$ and $|x - y| < \delta$ in $E$. Exercise 6.2.13 (summary, not verbatim): if $A$ is countable and $|f_n(x)| \le M$ for all $n$ and $x \in A$, then some subsequence of $(f_n)$ converges pointwise on $A$.)*

    (a) Use Exercise 6.2.13 to produce a subsequence $(f_{n_k})$ that converges at every rational point in $[0,1]$. To simplify the notation, set $g_k = f_{n_k}$. It remains to show that $(g_k)$ converges uniformly on all of $[0,1]$.

    (b) Let $\epsilon > 0$. By equicontinuity, there exists a $\delta > 0$ such that
    $$|g_k(x) - g_k(y)| < \frac{\epsilon}{3}$$
    for all $|x - y| < \delta$ and $k \in \mathbb{N}$. Using this $\delta$, let $r_1, r_2, \ldots, r_m$ be a finite collection of rational points with the property that the union of the neighborhoods $V_\delta(r_i)$ contains $[0,1]$.

    Explain why there must exist an $N \in \mathbb{N}$ such that
    $$|g_s(r_i) - g_t(r_i)| < \frac{\epsilon}{3}$$
    for all $s, t \ge N$ and $r_i$ in the finite subset of $[0,1]$ just described. Why does having the set $\{r_1, r_2, \ldots, r_m\}$ be finite matter?

    (c) Finish the argument by showing that, for an arbitrary $x \in [0,1]$,
    $$|g_s(x) - g_t(x)| < \epsilon$$
    for all $s, t \ge N$.
  notes: Definition of equicontinuity quoted verbatim from Exercise 6.2.14; result of Exercise 6.2.13 summarized (marked) from its statement.
  curation:
    why: 'Arzelà–Ascoli on [0,1]: equicontinuity + boundedness ⇒ a uniformly convergent subsequence (diagonal argument).'

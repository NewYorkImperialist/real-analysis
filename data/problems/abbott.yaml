  problemLatex: |
    What happens if we reverse the order of the quantifiers in Definition 2.2.3?

    **Definition:** A sequence $(x_n)$ *verconges* to $x$ if there exists an $\epsilon > 0$ such that for all $N \in \mathbb{N}$ it is true that $n \ge N$ implies $|x_n - x| < \epsilon$.

    Give an example of a vercongent sequence. Is there an example of a vercongent sequence that is divergent? Can a sequence verconge to two different values? What exactly is being described in this strange definition?

    *(Definition 2.2.3 (Convergence of a Sequence): A sequence $(a_n)$ converges to a real number $a$ if, for every positive number $\epsilon$, there exists an $N \in \mathbb{N}$ such that whenever $n \ge N$ it follows that $|a_n - a| < \epsilon$.)*
  notes: Definition 2.2.3 quoted verbatim from p. 43.
  curation:
    why: 'Swap the quantifiers in the definition of convergence and identify what you get. Quantifier order is the whole definition.'

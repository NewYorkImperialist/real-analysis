    (a) Prove that a bounded function $f$ is integrable on $[a,b]$ if and only if there exists a sequence of partitions $(P_n)_{n=1}^\infty$ satisfying
    $$\lim_{n\to\infty} [U(f,P_n) - L(f,P_n)] = 0,$$
    and in this case $\int_a^b f = \lim_{n\to\infty} U(f,P_n) = \lim_{n\to\infty} L(f,P_n)$.

    (b) For each $n$, let $P_n$ be the partition of $[0,1]$ into $n$ equal subintervals. Find formulas for $U(f,P_n)$ and $L(f,P_n)$ if $f(x) = x$. The formula $1 + 2 + 3 + \cdots + n = n(n+1)/2$ will be useful.


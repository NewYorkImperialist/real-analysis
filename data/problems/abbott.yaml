  problemLatex: |
    (a) Verify the triangle inequality in the special case where $a$ and $b$ have the same sign.
    (b) Find an efficient proof for all the cases at once by first demonstrating $(a+b)^2 \le (|a|+|b|)^2$.
    (c) Prove $|a-b| \le |a-c| + |c-d| + |d-b|$ for all $a$, $b$, $c$, and $d$.
    (d) Prove $||a|-|b|| \le |a-b|$. (The unremarkable identity $a = a - b + b$ may be useful.)
  notes: 'Triangle inequality in the book: $|a+b| \le |a|+|b|$.'
  curation:
    why: Triangle and reverse triangle inequalities — used in nearly every ε argument.

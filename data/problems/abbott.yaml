  title: 'Disjoint sets and nested intervals: examples or impossibility'
  difficulty: easy
  category: canonical
  type: counterexample
  tags:
  - nested-intervals
  - counterexample
  - supremum
  - example-or-impossible
  problemLatex: |
    Give an example of each or state that the request is impossible. When a request is impossible, provide a compelling argument for why this is the case.
    (a) Two sets $A$ and $B$ with $A \cap B = \emptyset$, $\sup A = \sup B$, $\sup A \notin A$ and $\sup B \notin B$.
    (b) A sequence of nested open intervals $J_1 \supseteq J_2 \supseteq J_3 \supseteq \cdots$ with $\bigcap_{n=1}^{\infty} J_n$ nonempty but containing only a finite number of elements.
    (c) A sequence of nested unbounded closed intervals $L_1 \supseteq L_2 \supseteq L_3 \supseteq \cdots$ with $\bigcap_{n=1}^{\infty} L_n = \emptyset$. (An unbounded closed interval has the form $[a, \infty) = \{x \in \mathbb{R} : x \ge a\}$.)
    (d) A sequence of closed (not necessarily nested) intervals $I_1, I_2, I_3, \ldots$ with the property that $\bigcap_{n=1}^{N} I_n \neq \emptyset$ for all $N \in \mathbb{N}$, but $\bigcap_{n=1}^{\infty} I_n = \emptyset$.
  curation:
    why: Why every hypothesis of the Nested Interval Property (closed, bounded, nested) is needed.
- id: abbott-1.5.3
  source:
    key: abbott
    chapter: 1 The Real Numbers
    section: 1.5 Cardinality
    problemNumber: Exercise 1.5.3

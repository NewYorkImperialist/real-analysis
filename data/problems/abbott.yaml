  problemLatex: |
    **(Content Zero).** A set $A \subseteq [a,b]$ has *content zero* if for every $\epsilon > 0$ there exists a finite collection of open intervals $\{O_1, O_2, \ldots, O_N\}$ that contain $A$ in their union and whose lengths sum to $\epsilon$ or less. Using $|O_n|$ to refer to the length of each interval, we have
    $$A \subseteq \bigcup_{n=1}^N O_n \quad\text{and}\quad \sum_{n=1}^N |O_n| \le \epsilon.$$

    (a) Let $f$ be bounded on $[a,b]$. Show that if the set of discontinuous points of $f$ has content zero, then $f$ is integrable.

    (b) Show that any finite set has content zero.

    (c) Content zero sets do not have to be finite. They do not have to be countable. Show that the Cantor set $C$ defined in Section 3.1 has content zero.

    (d) Prove that
    $$h(x) = \begin{cases} 1 & \text{if } x \in C \\ 0 & \text{if } x \notin C. \end{cases}$$
    is integrable, and find the value of the integral.
  curation:
    why: Discontinuities on a set of content zero do not obstruct integrability (e.g. the Cantor set's indicator).

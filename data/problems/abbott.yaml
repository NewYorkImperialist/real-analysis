  concept: 'diagonal subsequence: uniformly bounded sequence converges pointwise on countable set'
  title: 'Diagonal subsequence on a countable set'
  difficulty: medium
  category: canonical
  type: construction
  tags:
  - diagonal-argument
  - Bolzano-Weierstrass
  - subsequence
  - pointwise-convergence
  problemLatex: |
    Recall that the Bolzano–Weierstrass Theorem (Theorem 2.5.5) states that every bounded sequence of real numbers has a convergent subsequence. An analogous statement for bounded sequences of functions is not true in general, but under stronger hypotheses several different conclusions are possible. One avenue is to assume the common domain for all of the functions in the sequence is countable. (Another is explored in the next two exercises.)

    Let $A = \{x_1, x_2, x_3, \ldots\}$ be a countable set. For each $n \in \mathbb{N}$, let $f_n$ be defined on $A$ and assume there exists an $M > 0$ such that $|f_n(x)| \le M$ for all $n \in \mathbb{N}$ and $x \in A$. Follow these steps to show that there exists a subsequence of $(f_n)$ that converges pointwise on $A$.

    (a) Why does the sequence of real numbers $f_n(x_1)$ necessarily contain a convergent subsequence $(f_{n_k})$? To indicate that the subsequence of functions $(f_{n_k})$ is generated by considering the values of the functions at $x_1$, we will use the notation $f_{n_k} = f_{1,k}$.

    (b) Now, explain why the sequence $f_{1,k}(x_2)$ contains a convergent subsequence.

    (c) Carefully construct a nested family of subsequences $(f_{m,k})$, and show how this can be used to produce a single subsequence of $(f_n)$ that converges at every point of $A$.
  notes: Statement verified symbol-by-symbol against the page images (printed pp. 182–183, PDF 192–193); no transcription errors. Theorem 2.5.5 is already restated in the exercise itself. 'The next two exercises' are 6.2.14 (equicontinuity) and 6.2.15 (Arzelà–Ascoli).
  curation:
    why: 'Bridge problem: the diagonal-extraction step of Arzelà–Ascoli (abbott-6.2.15), whose part (a) uses this exercise.'


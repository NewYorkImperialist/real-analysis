  concept: 'metrics on C[0,1]: sup metric and L^1 metric are metrics; evaluation at 1 is not'
  title: 'Which functions are metrics on $C[0,1]$?'
  difficulty: easy
  category: canonical
  type: definition
  tags:
  - metric-space
  - sup-norm
  - function-space
  - C01
  problemLatex: |
    *(Definition 8.2.1: Given a set $X$, a function $d\colon X \times X \to \mathbb{R}$ is a metric on $X$ if for all $x, y \in X$: (i) $d(x,y) \ge 0$ with $d(x,y) = 0$ if and only if $x = y$, (ii) $d(x,y) = d(y,x)$, and (iii) for all $z \in X$, $d(x,y) \le d(x,z) + d(z,y)$.)*

    Let $C[0,1]$ be the collection of continuous functions on the closed interval $[0,1]$. Decide which of the following are metrics on $C[0,1]$.

    (a) $d(f,g) = \sup\{|f(x) - g(x)| : x \in [0,1]\}$.

    (b) $d(f,g) = |f(1) - g(1)|$.

    (c) $d(f,g) = \int_0^1 |f - g|$.
  notes: Definition 8.2.1 quoted verbatim from p. 258.
  curation:
    why: Check the metric axioms on C[0,1] for the sup and L¹ distances, and see one candidate fail.

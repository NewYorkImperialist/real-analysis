  concept: negating quantified statements (Archimedean / density)
  title: 'Negating quantified statements about real numbers'
  difficulty: easy
  category: canonical
  type: definition
  tags:
  - quantifiers
  - negation
  - logic
  - Archimedean-property
  - density
  problemLatex: |
    Form the logical negation of each claim. One trivial way to do this is to simply add "It is not the case that..." in front of each assertion. To make this interesting, fashion the negation into a positive statement that avoids using the word "not" altogether. In each case, make an intuitive guess as to whether the claim or its negation is the true statement.
    (a) For all real numbers satisfying $a < b$, there exists an $n \in \mathbb{N}$ such that $a + 1/n < b$.
    (b) There exists a real number $x > 0$ such that $x < 1/n$ for all $n \in \mathbb{N}$.
    (c) Between every two distinct real numbers there is a rational number.
  curation:
    why: Negate nested-quantifier statements into positive form — the skill behind every proof by contradiction and every counterexample.

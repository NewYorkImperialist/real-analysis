    *(Theorem 6.2.5 (Cauchy Criterion for Uniform Convergence): A sequence of functions $(f_n)$ defined on a set $A \subseteq \mathbb{R}$ converges uniformly on $A$ if and only if for every $\epsilon > 0$ there exists an $N \in \mathbb{N}$ such that $|f_n(x) - f_m(x)| < \epsilon$ whenever $m, n \ge N$ and $x \in A$. Theorem 2.6.4 (Cauchy Criterion): A sequence converges if and only if it is a Cauchy sequence.)*
  notes: Theorems 6.2.5 and 2.6.4 quoted verbatim.
  curation:
    why: The Cauchy criterion for uniform convergence — how you prove uniform convergence without knowing the limit.

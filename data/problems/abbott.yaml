  problemLatex: |
    *(Context; summary, not verbatim — the theorem statement is quoted, the opening of its proof is condensed: Theorem 5.2.7 (Darboux's Theorem). If $f$ is differentiable on an interval $[a,b]$, and if $\alpha$ satisfies $f'(a) < \alpha < f'(b)$ (or $f'(a) > \alpha > f'(b)$), then there exists a point $c \in (a,b)$ where $f'(c) = \alpha$. Proof begins: define $g(x) = f(x) - \alpha x$ on $[a,b]$. Notice that $g$ is differentiable on $[a,b]$ with $g'(x) = f'(x) - \alpha$. In terms of $g$, our hypothesis states that $g'(a) < 0 < g'(b)$, and we hope to show that $g'(c) = 0$ for some $c \in (a,b)$.)*

    Assume that $g$ is differentiable on $[a,b]$ and satisfies $g'(a) < 0 < g'(b)$.

    (a) Show that there exists a point $x \in (a,b)$ where $g(a) > g(x)$, and a point $y \in (a,b)$ where $g(y) < g(b)$.

    (b) Now complete the proof of Darboux's Theorem started earlier.
  notes: Theorem 5.2.7 and the opening of its proof quoted (lightly condensed connective words) from p. 152 so part (b) is self-contained.
  curation:
    why: 'Darboux''s theorem: derivatives have the intermediate value property even when discontinuous.'

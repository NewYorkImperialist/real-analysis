  problemLatex: |
    Follow these steps to prove the final implication in Theorem 3.3.8.

    *(Theorem 3.3.8 (Heine–Borel Theorem): Let $K$ be a subset of $\mathbb{R}$. All of the following statements are equivalent in the sense that any one of them implies the two others: (i) $K$ is compact. (ii) $K$ is closed and bounded. (iii) Every open cover for $K$ has a finite subcover.)*

    Assume $K$ satisfies (i) and (ii), and let $\{O_\lambda : \lambda \in \Lambda\}$ be an open cover for $K$. For contradiction, let's assume that no finite subcover exists. Let $I_0$ be a closed interval containing $K$.

    (a) Show that there exists a nested sequence of closed intervals $I_0 \supseteq I_1 \supseteq I_2 \supseteq \cdots$ with the property that, for each $n$, $I_n \cap K$ cannot be finitely covered and $\lim |I_n| = 0$.

    (b) Argue that there exists an $x \in K$ such that $x \in I_n$ for all $n$.

    (c) Because $x \in K$, there must exist an open set $O_{\lambda_0}$ from the original collection that contains $x$ as an element. Explain how this leads to the desired contradiction.
  notes: Theorem 3.3.8 quoted verbatim from p. 98 (PDF 110). 'Compact' in (i) means sequentially compact (Definition 3.3.1).
  curation:
    why: 'Heine–Borel: closed and bounded ⇒ every open cover has a finite subcover, by bisection.'

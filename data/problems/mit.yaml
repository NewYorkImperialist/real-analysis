  concept: "closed sets in R: [a,b], Z closed; Q not closed"
  difficulty: introductory
  category: canonical
  type: definition
  tags: [closed-set, open-set, topology, definition, density]
  problemLatex: |
    We say a set $F \subset \mathbb{R}$ is *closed* if its complement $F^c := \mathbb{R} \setminus F$ is open (see Assignment 3 for a discussion of open sets). Since $\emptyset$ and $\mathbb{R}$ are open, it follows that $\emptyset$ and $\mathbb{R}$ are closed as well.

    (a) Let $a, b \in \mathbb{R}$ with $a < b$. Prove that $[a, b]$ is closed.

    (b) Is the set $\mathbb{Z} \subset \mathbb{R}$ closed? Provide a proof to substantiate your claim.

    (c) Is the set of rationals $\mathbb{Q} \subset \mathbb{R}$ closed? Provide a proof to substantiate your claim.
  notes: "“Assignment 3” refers to MIT 18.100A (2020) Assignment 3, Problem 5 (definition of open set: for every $x \\in U$ there is $\\epsilon > 0$ with $(x-\\epsilon, x+\\epsilon) \\subset U$)."
  curation:
    why: "Closedness via the complement; together with Problem 5 of Assignment 3, shows Q is neither open nor closed."


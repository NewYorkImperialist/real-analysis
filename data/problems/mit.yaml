- id: mit20-a11-5
  source:
    key: mit
    chapter: "Assignment 11"
    section: "Reading: Lebl §4.3; Riemann Integral lecture notes"
    problemNumber: "Problem 5"
    page: "1"
  topic: integration
  subtopics: [partitions-darboux-sums]
  skills: [riemann-sum-computation, telescoping]
  concept: "Riemann sums of a linear function without the FTC"
  title: Riemann sums of a linear function without the FTC
  difficulty: easy
  category: canonical
  type: computation
  tags: [Riemann-integration, Riemann-sum, partition, computation]
  problemLatex: |
    Let $a < b$, and define a sequence of tagged partitions by
    $$\underline{x}^{(r)} := \left\{ a + (b - a)\frac{k}{r} : k = 0, \ldots, r \right\},$$
    $$\underline{\xi}^{(r)} := \left\{ a + (b - a)\frac{k}{r} : k = 1, \ldots, r \right\}.$$

    *[Summary, not verbatim — notation of the course's Riemann Integral lecture notes (not in the source set): a tagged partition of $[a,b]$ is a partition $\underline{x} = \{x_0, x_1, \ldots, x_n\}$ with $a = x_0 < x_1 < \cdots < x_n = b$ together with tags $\underline{\xi} = \{\xi_1, \ldots, \xi_n\}$ satisfying $x_{k-1} \le \xi_k \le x_k$. The norm of the partition is $\|\underline{x}\| := \max_{1 \le k \le n} (x_k - x_{k-1})$, and the Riemann sum of $f$ is $S_f(\underline{x}, \underline{\xi}) := \sum_{k=1}^{n} f(\xi_k)(x_k - x_{k-1})$.]*

    (a) Compute $\|\underline{x}^{(r)}\|$.

    (b) Let $f(x) = \alpha x + \beta$. Prove that
    $$\lim_{r \to \infty} S_f\!\left(\underline{x}^{(r)}, \underline{\xi}^{(r)}\right) = \alpha \frac{b^2 - a^2}{2} + \beta(b - a).$$
    You may not use the fundamental theorem of calculus.
  notes: "Notation from the course's Riemann Integral lecture notes: $\\|\\underline{x}\\|$ is the norm (mesh) of the partition and $S_f(\\underline{x}, \\underline{\\xi})$ the Riemann sum with tags $\\underline{\\xi}$. The lecture notes are not in the source set, so the definitions were added to the statement as a labelled summary (standard definitions, consistent with this problem's indexing)."
  curation:
    why: "Computing an integral straight from Riemann sums once, by hand, is part of understanding what the integral is."

- id: mit20-a12-1
  source:
    key: mit
    chapter: "Assignment 12"
    section: "Reading: Riemann Integral lecture notes; Lebl §6.1"
    problemNumber: "Problem 1"
    page: "1"
  topic: integration
  subtopics: [integral-properties]
  skills: [continuity-sign-preservation, integration-by-parts, contradiction]
  concept: "nonnegative continuous function with zero integral vanishes; energy uniqueness argument"
  title: 'Vanishing integrals and uniqueness for $-u''''+Vu=0$'
  difficulty: medium
  category: synthesis
  type: proof
  tags: [Riemann-integration, continuity, integration-by-parts, ODE, uniqueness]
  problemLatex: |
    (a) Suppose that $f \in C([a, b])$, $f(x) \ge 0$ for all $x \in [a, b]$. Prove that if
    $$\int_a^b f = 0,$$
    then $f(x) = 0$ for all $x \in [a, b]$.

    (b) Suppose that $u \in C([a, b])$ is twice continuously differentiable, $V \in C([a, b])$, $V(x) \ge 0$ for all $x \in [a, b]$ and
    $$-u''(x) + V(x)u(x) = 0, \quad x \in [a, b], \qquad u(a) = u(b) = 0.$$
    Prove that $u(x) = 0$ for all $x \in [a, b]$. *Hint: What's one of the most useful theorems in analysis mentioned in Lecture 22?*

    *[Summary, not verbatim — the theorem meant is integration by parts (Lecture 22 of the course covers the fundamental theorem of calculus and integration by parts): if $f, g$ are continuously differentiable on $[a,b]$, then $\int_a^b f g' = f(b)g(b) - f(a)g(a) - \int_a^b f' g$.]*
  notes: "Typo corrected: the source reads “$f(x) = 0$ for all $f \\in [a,b]$” in (a); intended “$x \\in [a,b]$”. The hint in (b) refers to a course lecture and does not name the theorem; the lecture notes are not in the source set. A labelled summary naming the theorem (integration by parts, the step the intended energy argument needs: multiply by $u$ and integrate $u''u$ by parts) was added after the hint."
  curation:
    why: "(a) is a basic positivity lemma; (b) multiplies by u and integrates by parts — the energy method behind graduate PDE uniqueness proofs."


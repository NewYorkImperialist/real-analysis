  type: theorem-application
  tags: [Taylor, remainder, exponential, estimate]
  problemLatex: |
    Let $R > 0$. Prove that for all $x \in [-R, R]$,
    $$\left| e^x - \sum_{j=0}^{n} \frac{x^j}{j!} \right| \le \frac{e^R R^{n+1}}{(n+1)!}.$$

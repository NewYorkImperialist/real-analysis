  concept: "uncountable sets via a bijection with the power set of N"
  title: Cardinality of decimals using only the digits 1 and 2
  difficulty: medium
  category: canonical
  type: proof
  tags: [cardinality, uncountable, power-set, decimal-representation]
  problemLatex: |
    Let $E \subset (0, 1)$ be the set of all real numbers with decimal representation using only the digits 1 and 2:
    $$E := \{x \in (0, 1) : \forall j \in \mathbb{N},\ \exists d_{-j} \in \{1, 2\} \text{ such that } x = 0.d_{-1}d_{-2}\ldots\}$$
    Prove that $|E| = |\wp(\mathbb{N})|$. *Hint:* Consider the function $f \colon E \to \wp(\mathbb{N})$ such that if $x \in E$, $x = 0.d_{-1}d_{-2}\ldots$,
    $$f(x) = \{j \in \mathbb{N} : d_{-j} = 2\}.$$
  curation:
    why: "Shows how to identify a concrete set of reals with ℘(ℕ); the subtle point is that decimal expansions using only 1s and 2s are unique."


  tags: [supremum, completeness, least-upper-bound, roots, machinery, canonical]
  problemLatex: |
    Let
    $$E = \{x \in \mathbb{R} : x > 0 \text{ and } x^3 < 2\}.$$
    (a) Prove that $E$ is bounded above.

    (b) Let $r = \sup E$ (which exists by part (a)). Prove that $r > 0$ and $r^3 = 2$.

    *Hint:* Adapt the proof used in Example 1.2.3.
  notes: "The hint refers to Lebl, Basic Analysis I, Example 1.2.3 (existence of $\\sqrt{2}$ via the supremum)."

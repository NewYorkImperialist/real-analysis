- id: mit20-a4-7
  source:
    key: mit
    chapter: "Assignment 4"
    section: "Reading: Lebl §2.1, §2.2"
    problemNumber: "Problem 7"
    page: "1–2"
  topic: topology
  subtopics: [limit-points, closed-sets]
  skills: [sequential-characterization, epsilon-ball-argument, triangle-inequality]
  concept: "cluster points: sequential characterization; the derived set is closed"
  difficulty: medium
  category: canonical
  type: proof
  tags: [cluster-point, limit-point, closed-set, sequence, machinery]
  problemLatex: |
    Let $E \subset \mathbb{R}$ be a nonempty set of real numbers. We say $x \in \mathbb{R}$ is a *cluster point* of $E$ if for every $\epsilon > 0$
    $$(x - \epsilon, x + \epsilon) \cap E \setminus \{x\} \neq \emptyset.$$
    Said less formally, $x$ is a cluster point of $E$ if every interval containing $x$ contains at least one element of $E$ other than $x$.

    (a) Prove that $x$ is a cluster point of $E$ if and only if there exists a sequence $\{x_n\}$ of elements of $E \setminus \{x\}$ such that $\lim_{n \to \infty} x_n = x$.

    *Hint:* If $x$ is a cluster point of $E$, then for all $n \in \mathbb{N}$ there exists $x_n \in E$ with $x_n \neq x$ such that
    $$x - \frac{1}{n} < x_n < x + \frac{1}{n}.$$

    (b) Prove that the set of all cluster points of $E$ is closed.
  curation:
    why: "Part (b) is a genuine two-layer ε argument (a cluster point of cluster points is a cluster point)."


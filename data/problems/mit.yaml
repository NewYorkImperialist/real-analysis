  problemLatex: |
    A subset of real numbers $U \subset \mathbb{R}$ is *open* if for all $x \in U$, there exists $\epsilon > 0$ such that $(x - \epsilon, x + \epsilon) \subset U$. A subset of real numbers $F \subset \mathbb{R}$ is *closed* if $F^c$ is open.

    (a) State what it means to say $U$ is not open.

    (b) Prove that if $U$ is not open, then there exists $x \in U$ and a sequence $\{x_n\}_n$ of elements of $U^c$ such that
    $$\lim_{n \to \infty} x_n = x.$$

    (c) Suppose $F \subset \mathbb{R}$ has the following property: for every convergent sequence $\{x_n\}_n$ of elements of $F$ we have $\lim_{n \to \infty} x_n \in F$. Prove that $F$ is closed.

    *Hint:* Argue by contradiction using (b).
  curation:
    why: "Negate a ∀∃ definition, then turn the negation into a sequence. With Assignment 4 Problem 3 this proves closed ⇔ sequentially closed."


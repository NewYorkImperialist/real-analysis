  concept: "bounded derivative ⇒ Lipschitz ⇒ translates converge uniformly"
  title: Lipschitz bounds and uniform convergence of translates
  difficulty: easy
  category: synthesis
  type: proof
  tags: [uniform-convergence, Lipschitz, mean-value-theorem]
  problemLatex: |
    Suppose $f \colon \mathbb{R} \to \mathbb{R}$ is a differentiable function and there exists $L > 0$ such that
    $$|f'(c)| \le L, \quad \forall c \in \mathbb{R}.$$

    (i) Prove that $f \colon \mathbb{R} \to \mathbb{R}$ is Lipschitz continuous on $\mathbb{R}$.

    (ii) Define a sequence of functions $f_n \colon \mathbb{R} \to \mathbb{R}$ by
    $$f_n(x) := f\left(x + \frac{1}{n}\right).$$
    Prove that $\{f_n\}_n$ converges to $f$ uniformly on $\mathbb{R}$.
  curation:
    why: "Uniform convergence via an x-independent bound — the sup-norm estimate in its simplest form."

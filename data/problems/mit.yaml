  tags: [Riemann-integration, Riemann-sum, partition, computation]
  problemLatex: |
    Let $a < b$, and define a sequence of tagged partitions by
    $$\underline{x}^{(r)} := \left\{ a + (b - a)\frac{k}{r} : k = 0, \ldots, r \right\},$$
    $$\underline{\xi}^{(r)} := \left\{ a + (b - a)\frac{k}{r} : k = 1, \ldots, r \right\}.$$

    (a) Compute $\|\underline{x}^{(r)}\|$.

    (b) Let $f(x) = \alpha x + \beta$. Prove that
    $$\lim_{r \to \infty} S_f\!\left(\underline{x}^{(r)}, \underline{\xi}^{(r)}\right) = \alpha \frac{b^2 - a^2}{2} + \beta(b - a).$$
    You may not use the fundamental theorem of calculus.
  notes: "Notation from the course's Riemann Integral lecture notes: $\\|\\underline{x}\\|$ is the norm (mesh) of the partition and $S_f(\\underline{x}, \\underline{\\xi})$ the Riemann sum with tags $\\underline{\\xi}$."
  curation:
    why: "Computing an integral straight from Riemann sums once, by hand, is part of understanding what the integral is."


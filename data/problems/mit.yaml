  tags: [Holder, uniform-continuity, derivative, difference-quotient]
  problemLatex: |
    Let $I$ be an interval. A function $f \colon I \to \mathbb{R}$ is said to satisfy a *Hölder condition with exponent $\alpha > 0$* if there exists a constant $C > 0$ such that if $x, y \in I$ then
    $$|f(x) - f(y)| \le C|x - y|^{\alpha}.$$

    (a) Prove that if $f \colon I \to \mathbb{R}$ satisfies a Hölder condition with exponent $\alpha > 0$, then $f$ is uniformly continuous on $I$.

    (b) Prove that if $f \colon I \to \mathbb{R}$ satisfies a Hölder condition with exponent $\alpha > 1$, then $f$ is constant.
  curation:
    why: "Part (b) is a nice derivative-from-the-definition argument: the difference quotient is squeezed to 0."


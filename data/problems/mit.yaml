- id: mit20-a1-6
  source:
    key: mit
    chapter: "Assignment 1"
    section: "Reading: Lebl §0.3"
    problemNumber: "Problem 6"
    page: "1"
  topic: foundations
  subtopics: [cardinality, functions]
  skills: [construct-bijection, injectivity-surjectivity, unique-factorization]
  concept: "Q is countable (explicit bijection via prime factorizations)"
  title: Countability of the positive rationals via prime factorizations
  difficulty: medium
  category: canonical
  type: proof
  tags: [cardinality, countable, bijection, rationals, machinery]
  problemLatex: |
    In this exercise, you will prove that
    $$|\{q \in \mathbb{Q} : q > 0\}| = |\mathbb{N}|.$$
    In what follows, we will use the following theorem without proof:

    **Theorem.** *Let $q \in \mathbb{Q}$ with $q > 0$. Then*

    1) *if $q \in \mathbb{N}$ and $q \neq 1$, then there exists unique prime numbers $p_1 < p_2 < \cdots < p_N$ and unique exponents $r_1, \ldots, r_N \in \mathbb{N}$ such that*
    $$q = p_1^{r_1} p_2^{r_2} \cdots p_N^{r_N}, \qquad (\dagger)$$

    2) *if $q \notin \mathbb{N}$, then there exist unique prime numbers $p_1 < p_2 < \ldots < p_N$, $q_1 < q_2 < \cdots < q_M$ with $p_i \neq q_j$ for all $i \in \{1, \ldots, N\}$, $j \in \{1, \ldots, M\}$, and unique exponents $r_1, \ldots, r_N, s_1, \ldots, s_M \in \mathbb{N}$ such that*
    $$q = \frac{p_1^{r_1} p_2^{r_2} \cdots p_N^{r_N}}{q_1^{s_1} q_2^{s_2} \cdots q_M^{s_M}}. \qquad (\ddagger)$$

    Define $f \colon \{q \in \mathbb{Q} : q > 0\} \to \mathbb{N}$ as follows: $f(1) = 1$, if $q \in \mathbb{N} \setminus \{1\}$ is given by $(\dagger)$, then
    $$f(q) = p_1^{2r_1} \cdots p_N^{2r_N},$$
    and if $q \in \mathbb{Q} \setminus \mathbb{N}$ is given by $(\ddagger)$, then
    $$f(q) = p_1^{2r_1} \cdots p_N^{2r_N} q_1^{2s_1 - 1} \cdots q_M^{2s_M - 1}.$$

    (a) Compute $f(4/15)$. Find $q$ such that $f(q) = 108$.

    (b) Use the **Theorem** to prove that $f$ is a bijection.
  notes: "Transcribed from the assignment PDF; layout of the theorem lightly reformatted."
  curation:
    why: "Countability of Q done by an explicit bijection rather than a picture — forces you to verify injectivity and surjectivity honestly."

- id: mit20-a2-7
  source:
    key: mit
    chapter: "Assignment 2"
    section: "Reading: Lebl §0.3, §1.1, §1.2"
    problemNumber: "Problem 7"
    page: "1"
  topic: real-numbers
  subtopics: [completeness, supremum-infimum]
  skills: [sup-approximation, contradiction, algebraic-estimate]
  concept: "existence of roots via the least upper bound property"
  title: Existence of $\sqrt[3]{2}$ via the least upper bound property
  difficulty: medium
  category: canonical
  type: proof
  tags: [supremum, completeness, least-upper-bound, roots, machinery, canonical]
  problemLatex: |
    Let
    $$E = \{x \in \mathbb{R} : x > 0 \text{ and } x^3 < 2\}.$$
    (a) Prove that $E$ is bounded above.

    (b) Let $r = \sup E$ (which exists by part (a)). Prove that $r > 0$ and $r^3 = 2$.

    *Hint:* Adapt the proof used in Example 1.2.3.

    *[Summary, not verbatim — Lebl, Example 1.2.3 proves that there is a unique positive $r \in \mathbb{R}$ with $r^2 = 2$. Take $A := \{x \in \mathbb{R} : x^2 < 2\}$; it is nonempty ($1 \in A$) and bounded above ($x \ge 2$ implies $x^2 \ge 4$), so $r := \sup A$ exists, and $r \ge 1 > 0$. To show $r^2 \ge 2$: for any $s > 0$ with $s^2 < 2$, choose $0 < h < 1$ with $h < \frac{2 - s^2}{2s + 1}$; then $(s+h)^2 - s^2 = h(2s + h) < h(2s+1) < 2 - s^2$, so $s + h \in A$ and $s < r$. To show $r^2 \le 2$: for any $s > 0$ with $s^2 > 2$, let $h := \frac{s^2 - 2}{2s}$; then $s - h > 0$ and $s^2 - (s-h)^2 = 2sh - h^2 < 2sh = s^2 - 2$, so $(s-h)^2 > 2$, hence $s - h$ is an upper bound for $A$ and $s > r$. Together, $r^2 = 2$.]*
  notes: "The hint refers to Lebl, Basic Analysis I, Example 1.2.3 (existence of $\\sqrt{2}$ via the supremum, p. 29–30); a labelled summary of that example was added after the hint for self-containedness."
  curation:
    why: "The archetypal use of completeness: rule out r³ < 2 and r³ > 2 by perturbing r. Every later sup argument has this shape."


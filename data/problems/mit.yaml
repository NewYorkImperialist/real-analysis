  problemLatex: |
    Let $S \subset \mathbb{R}$, let $c$ be a cluster point of $S$, and let $f \colon S \to \mathbb{R}$.

    (a) Assume $\lim_{x \to c} f(x)$ exists. Prove that there exist $B \ge 0$ and $\delta > 0$ such that if $x \in S$ and $0 < |x - c| < \delta$ then $|f(x)| \le B$.


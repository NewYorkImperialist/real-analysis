    Let $f \colon [-\pi, \pi] \to \mathbb{R}$ be a continuously differentiable function. Prove that
    $$\lim_{n \to \infty} \int_{-\pi}^{\pi} \sin(nx) f(x)\,dx = 0.$$
    *Hint:* $\sin(nx) = \left[-\frac{1}{n}\cos(nx)\right]'$
  curation:
    why: "A first look at the Riemann–Lebesgue lemma: integrate by parts and bound with the EVT."


  problemLatex: |
    Suppose $f \colon \mathbb{R} \to \mathbb{R}$ is twice continuously differentiable. Prove that for all $c, x \in \mathbb{R}$ with $c < x$,
    $$f(x) = f(c) + f'(c)(x - c) + \int_c^x f''(t)(x - t)\,dt.$$

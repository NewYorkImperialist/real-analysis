    problemNumber: "Problem 6"
    page: "1"
  topic: continuity
  subtopics: [limits-at-infinity]
  skills: [epsilon-M-proof, sequential-criterion-for-divergence]
  concept: "limits at infinity: proof and non-existence"
  title: Limits at infinity of $x^2/(x^2+1)$ and $\sin x$
  difficulty: introductory
  category: canonical
  type: definition
  tags: [limit-at-infinity, definition, sequences, divergence]
  problemLatex: |
    Let $R \in \mathbb{R}$, and let $f \colon [R, \infty) \to \mathbb{R}$. We say that $f(x)$ *converges to $L$ as $x \to \infty$* if for every $\epsilon > 0$ there exists $M \ge R$ such that for all $x \ge M$ we have $|f(x) - L| < \epsilon$. We write $f(x) \to L$ as $x \to \infty$ or
    $$\lim_{x \to \infty} f(x) = L.$$
    [A similar definition can be formulated for limits as $x \to -\infty$ but we will not do so here.]

    (a) Prove that
    $$\lim_{x \to \infty} \frac{x^2}{x^2 + 1} = 1.$$

    (b) Prove that
    $$\lim_{x \to \infty} \sin x$$
    does not exist.
  curation:
    why: "Applying a new definition directly, and proving non-existence with two sequences."


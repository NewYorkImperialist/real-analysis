- id: mit20-a1-6
  source:
    key: mit
    chapter: "Assignment 1"
    section: "Reading: Lebl §0.3"
    problemNumber: "Problem 6"
    page: "1"
  topic: foundations
  subtopics: [cardinality, functions]
  skills: [construct-bijection, injectivity-surjectivity, unique-factorization]
  concept: "Q is countable (explicit bijection via prime factorizations)"
  difficulty: medium
  category: canonical
  type: proof
  tags: [cardinality, countable, bijection, rationals, machinery]
  problemLatex: |
    In this exercise, you will prove that
    $$|\{q \in \mathbb{Q} : q > 0\}| = |\mathbb{N}|.$$
    In what follows, we will use the following theorem without proof:

    **Theorem.** *Let $q \in \mathbb{Q}$ with $q > 0$. Then*

    1) *if $q \in \mathbb{N}$ and $q \neq 1$, then there exists unique prime numbers $p_1 < p_2 < \cdots < p_N$ and unique exponents $r_1, \ldots, r_N \in \mathbb{N}$ such that*
    $$q = p_1^{r_1} p_2^{r_2} \cdots p_N^{r_N}, \qquad (\dagger)$$

    2) *if $q \notin \mathbb{N}$, then there exist unique prime numbers $p_1 < p_2 < \ldots < p_N$, $q_1 < q_2 < \cdots < q_M$ with $p_i \neq q_j$ for all $i \in \{1, \ldots, N\}$, $j \in \{1, \ldots, M\}$, and unique exponents $r_1, \ldots, r_N, s_1, \ldots, s_M \in \mathbb{N}$ such that*
    $$q = \frac{p_1^{r_1} p_2^{r_2} \cdots p_N^{r_N}}{q_1^{s_1} q_2^{s_2} \cdots q_M^{s_M}}. \qquad (\ddagger)$$

    Define $f \colon \{q \in \mathbb{Q} : q > 0\} \to \mathbb{N}$ as follows: $f(1) = 1$, if $q \in \mathbb{N} \setminus \{1\}$ is given by $(\dagger)$, then
    $$f(q) = p_1^{2r_1} \cdots p_N^{2r_N},$$
    and if $q \in \mathbb{Q} \setminus \mathbb{N}$ is given by $(\ddagger)$, then
    $$f(q) = p_1^{2r_1} \cdots p_N^{2r_N} q_1^{2s_1 - 1} \cdots q_M^{2s_M - 1}.$$

    (a) Compute $f(4/15)$. Find $q$ such that $f(q) = 108$.

    (b) Use the **Theorem** to prove that $f$ is a bijection.
  notes: "Transcribed from the assignment PDF; layout of the theorem lightly reformatted."
  curation:
    why: "Countability of Q done by an explicit bijection rather than a picture — forces you to verify injectivity and surjectivity honestly."

- id: mit20-a2-7
  source:

  problemLatex: |
    If $S \subset \mathbb{R}$ is a set, then $x \in \mathbb{R}$ is a *cluster point* if for every $\epsilon > 0$, the set $(x - \epsilon, x + \epsilon) \cap S \setminus \{x\}$ is not empty. That is, if there are points of $S$ arbitrarily close to $x$. For example, $S := \{1/n : n \in \mathbb{N}\}$ has a unique cluster point $0$, but $0 \notin S$. Prove the following version of the Bolzano–Weierstrass theorem:
    **Theorem.** Let $S \subset \mathbb{R}$ be a bounded infinite set, then there exists at least one cluster point of $S$.
    Hint: If $S$ is infinite, then $S$ contains a countably infinite subset. That is, there is a sequence $\{x_n\}_{n=1}^\infty$ of distinct numbers in $S$.
  curation:
    why: 'Bolzano–Weierstrass for sets: a bounded infinite set has a cluster point.'

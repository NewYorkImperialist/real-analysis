    Prove the following stronger version of one direction of Lemma 3.1.7: Let $S \subset \mathbb{R}$, $c$ be a cluster point of $S$, and $f\colon S \to \mathbb{R}$ be a function. Suppose that for every sequence $\{x_n\}_{n=1}^\infty$ in $S \setminus \{c\}$ such that $\lim_{n\to\infty} x_n = c$ the sequence $\bigl\{f(x_n)\bigr\}_{n=1}^\infty$ is convergent. Then show that the limit of $f(x)$ as $x \to c$ exists.

    *(Lemma 3.1.7: Let $S \subset \mathbb{R}$, let $c$ be a cluster point of $S$, let $f\colon S \to \mathbb{R}$ be a function, and let $L \in \mathbb{R}$. Then $f(x) \to L$ as $x \to c$ if and only if for every sequence $\{x_n\}_{n=1}^\infty$ such that $x_n \in S \setminus \{c\}$ for all $n$, and such that $\lim_{n\to\infty} x_n = c$, we have that the sequence $\bigl\{f(x_n)\bigr\}_{n=1}^\infty$ converges to $L$.)*
  notes: Lemma 3.1.7 quoted verbatim from p. 116 for context.
  curation:
    why: 'The sequential criterion with only convergence assumed: interleaving two sequences forces a common limit — a standard trick worth owning.'

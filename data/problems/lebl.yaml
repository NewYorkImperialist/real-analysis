- id: lebl-0.3.27
  source:
    key: lebl
    chapter: 0 Introduction
    section: 0.3 Basic set theory
    problemNumber: Exercise 0.3.27
    page: '21'
  topic: foundations
  subtopics:
  - functions
  - sets
  skills:
  - element-chasing
  - double-inclusion
  concept: preimage preserves arbitrary unions/intersections; image preserves unions, only ⊂ for intersections
  title: Images and preimages of unions and intersections
  difficulty: easy
  category: canonical
  type: proof
  tags:
  - preimage
  - image
  - indexed-families
  - set-identities
  problemLatex: |
    Suppose $f \colon A \to B$ is a function and for $\lambda \in I$, we have a collection of subsets $C_\lambda \subset A$ and $D_\lambda \subset B$. Prove
    $$f^{-1}\Bigl(\bigcup_{\lambda \in I} D_\lambda\Bigr) = \bigcup_{\lambda \in I} f^{-1}(D_\lambda), \qquad f^{-1}\Bigl(\bigcap_{\lambda \in I} D_\lambda\Bigr) = \bigcap_{\lambda \in I} f^{-1}(D_\lambda),$$
    and
    $$f\Bigl(\bigcup_{\lambda \in I} C_\lambda\Bigr) = \bigcup_{\lambda \in I} f(C_\lambda), \qquad f\Bigl(\bigcap_{\lambda \in I} C_\lambda\Bigr) \subset \bigcap_{\lambda \in I} f(C_\lambda).$$
  notes: Exercise is entirely at the bottom of p. 21 (p. 22 is blank).
  curation:
    why: Preimages respect all set operations, images only unions — why topology is phrased with preimages.

  concept: Darboux integrable iff Riemann integrable (mesh definition), same value
  title: Darboux and Riemann-sum definitions of the integral agree
  difficulty: hard
  category: synthesis
  type: proof
  tags:
  - Riemann-integration
  - Darboux-sums
  - Riemann-sums
  - mesh
  - equivalence-of-definitions
  problemLatex: |
    Using Exercise 5.1.12 and the idea of the proof in Exercise 5.1.7, show that Darboux integral is the same as the standard definition of Riemann integral, which you have most likely seen in calculus. That is, show that $f \in \mathscr{R}\bigl([a,b]\bigr)$ if and only if there exists an $I \in \mathbb{R}$, such that for every $\epsilon > 0$ there exists a $\delta > 0$ such that if $P = \{x_0, x_1, \ldots, x_n\}$ is a partition with $\Delta x_i < \delta$ for all $i$, then $\left| \sum_{i=1}^n f(c_i)\Delta x_i - I \right| < \epsilon$ for every set $\{c_1, c_2, \ldots, c_n\}$ with $c_i \in [x_{i-1}, x_i]$. If $f \in \mathscr{R}\bigl([a,b]\bigr)$, then $I = \int_a^b f$.

    *(Exercise 5.1.12: Show that $f \in \mathscr{R}\bigl([a,b]\bigr)$ if and only if there exists an $I \in \mathbb{R}$, such that for every $\epsilon > 0$ there exists a $\delta > 0$ such that if $P$ is a partition with $\Delta x_i < \delta$ for all $i$, then $\left|L(P,f) - I\right| < \epsilon$ and $\left|U(P,f) - I\right| < \epsilon$. If $f \in \mathscr{R}\bigl([a,b]\bigr)$, then $I = \int_a^b f$.)*

    *(Exercise 5.1.7: Suppose $f\colon [a,b] \to \mathbb{R}$ is Riemann integrable. Let $\epsilon > 0$ be given. Then show that there exists a partition $P = \{x_0, x_1, \ldots, x_n\}$ such that for every set of numbers $\{c_1, c_2, \ldots, c_n\}$ with $c_k \in [x_{k-1}, x_k]$ for all $k$, we have $\left| \int_a^b f - \sum_{k=1}^n f(c_k)\Delta x_k \right| < \epsilon$.)*
  notes: Referenced Exercises 5.1.12 (Challenging) and 5.1.7 quoted verbatim from p. 190 and p. 189 (5.1.12's opening 'Generalize the previous exercise.' omitted). The essential hard step is the content of 5.1.12; the curator may prefer to present 5.1.12+5.1.13 as one item.
  curation:
    why: Darboux integrability equals the mesh/tagged-sum definition (the one used in MIT's lecture notes).

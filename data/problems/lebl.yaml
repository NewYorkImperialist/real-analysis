  problemLatex: |
    Let $f \colon D \to \mathbb{R}$ and $g \colon D \to \mathbb{R}$ be functions ($D$ nonempty).
    a) Suppose $f(x) \leq g(y)$ for all $x \in D$ and $y \in D$. Show that
    $$\sup_{x \in D} f(x) \leq \inf_{x \in D} g(x).$$
    b) Find a specific $D$, $f$, and $g$, such that $f(x) \leq g(x)$ for all $x \in D$, but
    $$\sup_{x \in D} f(x) > \inf_{x \in D} g(x).$$
  curation:
    why: f(x) ≤ g(y) for all x, y gives sup f ≤ inf g, but pointwise f ≤ g does not — a quantifier lesson.

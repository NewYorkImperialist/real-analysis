  problemLatex: |
    Prove the second part of Proposition 5.2.4. Let $f$ and $g$ be in $\mathscr{R}\bigl([a,b]\bigr)$. Prove, without using Proposition 5.2.5, that $f+g$ is in $\mathscr{R}\bigl([a,b]\bigr)$ and
    $$\int_a^b \bigl(f(x)+g(x)\bigr)\,dx = \int_a^b f(x)\,dx + \int_a^b g(x)\,dx.$$
    Hint: One way to do it is to use Proposition 5.1.7 to find a single partition $P$ such that $U(P,f) - L(P,f) < \epsilon/2$ and $U(P,g) - L(P,g) < \epsilon/2$.

    *(Proposition 5.2.4 (ii), the part to prove: if $f, g \in \mathscr{R}\bigl([a,b]\bigr)$, then $f+g \in \mathscr{R}\bigl([a,b]\bigr)$ and $\int_a^b (f+g) = \int_a^b f + \int_a^b g$.)*

    *(Proposition 5.2.5: Let $f\colon [a,b] \to \mathbb{R}$ and $g\colon [a,b] \to \mathbb{R}$ be bounded functions. Then $\overline{\int_a^b}(f+g) \le \overline{\int_a^b} f + \overline{\int_a^b} g$ and $\underline{\int_a^b}(f+g) \ge \underline{\int_a^b} f + \underline{\int_a^b} g$.)*

    *(Proposition 5.1.7: Let $f\colon [a,b] \to \mathbb{R}$ be a bounded function, and let $P$ be a partition of $[a,b]$. Let $\widetilde{P}$ be a refinement of $P$. Then $L(P,f) \le L(\widetilde{P},f)$ and $U(\widetilde{P},f) \le U(P,f)$.)*
  notes: Verbatim. Proposition 5.2.5 and Proposition 5.1.7 quoted verbatim; Proposition 5.2.4 (ii) summarized from the exercise's own displayed statement. Text extraction lost the word 'without'; verified on page image.
  curation:
    why: Linearity of the Riemann integral proved from upper and lower sums, a property the bank used everywhere but never proved.


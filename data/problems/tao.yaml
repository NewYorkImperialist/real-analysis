  concept: x^n diverges for x>1; fallacy of assuming the limit exists
  difficulty: easy
  category: canonical
  type: conceptual
  tags:
  - divergence
  - geometric-sequence
  - limit-laws
  - fallacy
  problemLatex: |
    Explain why Proposition 6.3.10 fails when $x > 1$. In fact, show that the sequence $(x^n)_{n=1}^\infty$ diverges when $x > 1$. (Hint: prove by contradiction and use the identity $(1/x)^n x^n = 1$ and the limit laws in Theorem 6.1.19.) Compare this with the argument in Example 1.2.3; can you now explain the flaws in the reasoning in that example?

    *(Proposition 6.3.10: Let $0 < x < 1$. Then we have $\lim_{n\to\infty} x^n = 0$.)*

    *(Example 1.2.3 (Divergent sequences): Here is a slight variation of the previous example. Let $x$ be a real number, and let $L$ be the limit* $$L = \lim_{n\to\infty} x^n.$$ *Changing variables $n = m + 1$, we have* $$L = \lim_{m+1\to\infty} x^{m+1} = \lim_{m+1\to\infty} x \times x^m = x \lim_{m+1\to\infty} x^m.$$ *But if $m + 1 \to \infty$, then $m \to \infty$, thus* $$\lim_{m+1\to\infty} x^m = \lim_{m\to\infty} x^m = \lim_{n\to\infty} x^n = L,$$ *and thus* $$xL = L.$$ *At this point we could cancel the $L$'s and conclude that $x = 1$ for an arbitrary real number $x$, which is absurd. But since we are already aware of the division by zero problem, we could be a little smarter and conclude instead that either $x = 1$, or $L = 0$. In particular we seem to have shown that* $$\lim_{n\to\infty} x^n = 0 \text{ for all } x \ne 1.$$ *But this conclusion is absurd if we apply it to certain values of $x$, for instance by specializing to the case $x = 2$ we could conclude that the sequence $1, 2, 4, 8, \ldots$ converges to zero, and by specializing to the case $x = -1$ we conclude that the sequence $1, -1, 1, -1, \ldots$ also converges to zero. These conclusions appear to be absurd; what is the problem with the above argument? (See Exercise 6.3.4 for an answer.))*
  notes: Proposition 6.3.10 (p.138) and Example 1.2.3 (pp.4-5) quoted verbatim. The book's proof of Prop 6.3.10 (monotone convergence gives existence of L, then xL = L) is what 'fails' for x>1; not quoted.
  curation:
    why: Why you must prove a limit exists before manipulating it — the classic xL = L fallacy.
- id: tao-6.4.3
  source:
    key: tao
    chapter: 6 Limits of sequences
    section: 6.4 Limsup, liminf, and limit points
    problemNumber: Exercise 6.4.3
    page: '147'
  topic: sequences
  subtopics:
  - limsup-liminf
  skills:
  - sup-approximation
  - epsilon-N-proof
  - unwrap-definition
  concept: limsup/liminf are the largest/smallest limit points; a_n → c iff limsup = liminf = c
  difficulty: medium
  category: canonical
  type: proof
  tags:
  - limsup
  - liminf
  - limit-point
  - convergence
  - machinery
  problemLatex: |
    Prove parts (c),(d),(e),(f) of Proposition 6.4.12. (Hint: you can use earlier parts of the proposition to prove later ones.)

    *(Definition 6.4.6 (Limit superior and limit inferior): Suppose that $(a_n)_{n=m}^\infty$ is a sequence. We define a new sequence $(a_N^+)_{N=m}^\infty$ by the formula $a_N^+ := \sup(a_n)_{n=N}^\infty$. ... We then define the limit superior of the sequence $(a_n)_{n=m}^\infty$, denoted $\limsup_{n\to\infty} a_n$, by the formula $\limsup_{n\to\infty} a_n := \inf(a_N^+)_{N=m}^\infty$. Similarly, we can define $a_N^- := \inf(a_n)_{n=N}^\infty$ and define the limit inferior of the sequence $(a_n)_{n=m}^\infty$, denoted $\liminf_{n\to\infty} a_n$, by the formula $\liminf_{n\to\infty} a_n := \sup(a_N^-)_{N=m}^\infty$.)*

    *(Limit point, from the text after Definition 6.4.1: $x$ is a limit point of $(a_n)_{n=m}^\infty$ if, for every $\varepsilon > 0$ and every $N \ge m$, there exists an $n \ge N$ such that $|a_n - x| \le \varepsilon$.)*

    *(Proposition 6.4.12: Let $(a_n)_{n=m}^\infty$ be a sequence of real numbers, let $L^+$ be the limit superior of this sequence, and let $L^-$ be the limit inferior of this sequence (thus both $L^+$ and $L^-$ are extended real numbers).*

    *(a) For every $x > L^+$, there exists an $N \ge m$ such that $a_n < x$ for all $n \ge N$. (In other words, for every $x > L^+$, the elements of the sequence $(a_n)_{n=m}^\infty$ are eventually less than $x$.) Similarly, for every $y < L^-$ there exists an $N \ge m$ such that $a_n > y$ for all $n \ge N$.*

    *(b) For every $x < L^+$, and every $N \ge m$, there exists an $n \ge N$ such that $a_n > x$. (In other words, for every $x < L^+$, the elements of the sequence $(a_n)_{n=m}^\infty$ exceed $x$ infinitely often.) Similarly, for every $y > L^-$ and every $N \ge m$, there exists an $n \ge N$ such that $a_n < y$.*

    *(c) We have $\inf(a_n)_{n=m}^\infty \le L^- \le L^+ \le \sup(a_n)_{n=m}^\infty$.*

    *(d) If $c$ is any limit point of $(a_n)_{n=m}^\infty$, then we have $L^- \le c \le L^+$.*

    *(e) If $L^+$ is finite, then it is a limit point of $(a_n)_{n=m}^\infty$. Similarly, if $L^-$ is finite, then it is a limit point of $(a_n)_{n=m}^\infty$.*

    *(f) Let $c$ be a real number. If $(a_n)_{n=m}^\infty$ converges to $c$, then we must have $L^+ = L^- = c$. Conversely, if $L^+ = L^- = c$, then $(a_n)_{n=m}^\infty$ converges to $c$.)*
  notes: Proposition 6.4.12 (pp.143-144) and Definition 6.4.6 (p.141) quoted verbatim; the '...' in Def 6.4.6 omits one informal sentence ('More informally, a_N^+ is the supremum of all the elements in the sequence from a_N onwards.'). Sups/infs are taken in the extended reals, so a_N^+ may be +∞. Parts (a),(b) are proved in the book and may be used.
  curation:
    why: 'The core facts: liminf ≤ limsup, they are the extreme limit points, and convergence ⇔ they agree.'

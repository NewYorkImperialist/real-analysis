  tags:
  - derivative
  - linear-approximation
  - epsilon-delta
  problemLatex: |
    Prove Proposition 10.1.7. (Hint: the cases $x = x_0$ and $x \neq x_0$ have to be treated separately.)

    *(Proposition 10.1.7 (Newton's approximation), quoted: Let $X$ be a subset of $\mathbf{R}$, let $x_0 \in X$ be a limit point of $X$, let $f : X \to \mathbf{R}$ be a function, and let $L$ be a real number. Then the following statements are logically equivalent:*
    *(a) $f$ is differentiable at $x_0$ on $X$ with derivative $L$.*
    *(b) For every $\varepsilon > 0$, there exists a $\delta > 0$ such that $f(x)$ is $\varepsilon|x - x_0|$-close to $f(x_0) + L(x - x_0)$ whenever $x \in X$ is $\delta$-close to $x_0$, i.e., we have*
    $$|f(x) - (f(x_0) + L(x - x_0))| \le \varepsilon |x - x_0|$$
    *whenever $x \in X$ and $|x - x_0| \le \delta$.)*

    *(Definition 10.1.1, quoted in part: Let $X$ be a subset of $\mathbf{R}$, and let $x_0 \in X$ be an element of $X$ which is also a limit point of $X$. Let $f : X \to \mathbf{R}$ be a function. If the limit $\lim_{x\to x_0; x\in X-\{x_0\}} \frac{f(x) - f(x_0)}{x - x_0}$ converges to some real number $L$, then we say that $f$ is differentiable at $x_0$ on $X$ with derivative $L$, and write $f'(x_0) := L$.)*
  curation:
    why: Differentiability as linear approximation with o(|x − x₀|) error — the definition that generalizes to several variables.

  - Fermat
  - local-extremum
  - derivative
  problemLatex: |
    Prove Proposition 10.2.6.

    *(Proposition 10.2.6 (Local extrema are stationary), quoted: Let $a < b$ be real numbers, and let $f : (a, b) \to \mathbf{R}$ be a function. If $x_0 \in (a, b)$, $f$ is differentiable at $x_0$, and $f$ attains either a local maximum or local minimum at $x_0$, then $f'(x_0) = 0$.)*

    *(Definition 10.2.1, quoted: Let $f : X \to \mathbf{R}$ be a function, and let $x_0 \in X$. We say that $f$ attains a local maximum at $x_0$ iff there exists a $\delta > 0$ such that the restriction $f|_{X\cap(x_0-\delta,x_0+\delta)}$ of $f$ to $X \cap (x_0 - \delta, x_0 + \delta)$ attains a maximum at $x_0$. We say that $f$ attains a local minimum at $x_0$ iff there exists a $\delta > 0$ such that the restriction $f|_{X\cap(x_0-\delta,x_0+\delta)}$ of $f$ to $X \cap (x_0 - \delta, x_0 + \delta)$ attains a minimum at $x_0$.)*
  curation:
    why: 'Fermat''s theorem: interior extrema of differentiable functions have f′ = 0. Behind Rolle''s theorem.'

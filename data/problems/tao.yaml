    *(Lemma 7.3.3 (Geometric series): Let $x$ be a real number. If $|x| \ge 1$, then the series $\sum_{n=0}^\infty x^n$ is divergent. If however $|x| < 1$, then the series is absolutely convergent and* $$\sum_{n=0}^\infty x^n = 1/(1 - x).\ )$$

    *(Lemma 6.5.2: Let $x$ be a real number. Then the limit $\lim_{n\to\infty} x^n$ exists and is equal to zero when $|x| < 1$, exists and is equal to 1 when $x = 1$, and diverges when $x = -1$ or when $|x| > 1$.)*
  notes: Lemma 7.3.3 (p.171) and Lemma 6.5.2 (p.148) quoted verbatim. 'Zero test' = Corollary 7.2.6 (terms of a convergent series tend to 0).
  curation:
    why: The geometric series, with exactly when it converges — the comparison series behind most tests.

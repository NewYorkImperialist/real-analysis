    Let $A, B, C$ be sets such that $A \subseteq B \subseteq C$, and suppose that there is a injection $f\colon C \to A$. Define the sets $D_0, D_1, D_2, \ldots$ recursively by setting $D_0 := B \setminus A$, and then $D_{n+1} := f(D_n)$ for all natural numbers $n$. Prove that the sets $D_0, D_1, \ldots$ are all disjoint from each other (i.e., $D_n \cap D_m = \emptyset$ whenever $n \ne m$). Also show that if $g\colon A \to B$ is the function defined by setting $g(x) := f^{-1}(x)$ when $x \in \bigcup_{n=1}^\infty D_n$, and $g(x) := x$ when $x \notin \bigcup_{n=1}^\infty D_n$, then $g$ does indeed map $A$ to $B$ and is a bijection between the two. In particular, $A$ and $B$ have the same cardinality.

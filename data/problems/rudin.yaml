  - interval-stepping
  concept: differential inequality |f'| ≤ A|f|, f(a) = 0 ⇒ f ≡ 0 (Gronwall-type uniqueness)
  title: Uniqueness from the inequality $|f'| \le A|f|$
  difficulty: medium
  category: synthesis
  type: proof
  tags:
  - Gronwall
  - uniqueness
  - differential-inequality
  - mean-value-theorem
  - ODE-uniqueness
  problemLatex: |
    Suppose $f$ is differentiable on $[a, b]$, $f(a) = 0$, and there is a real number $A$ such that $|f'(x)| \le A|f(x)|$ on $[a, b]$. Prove that $f(x) = 0$ for all $x \in [a, b]$. *Hint:* Fix $x_0 \in [a, b]$, let
    $$M_0 = \sup |f(x)|, \qquad M_1 = \sup |f'(x)|$$
    for $a \le x \le x_0$. For any such $x$,
    $$|f(x)| \le M_1(x_0 - a) \le A(x_0 - a)M_0.$$
    Hence $M_0 = 0$ if $A(x_0 - a) < 1$. That is, $f = 0$ on $[a, x_0]$. Proceed.
  notes: Note M_1 could a priori be +∞ if f' is unbounded; the inequality |f'| ≤ A|f| with f continuous makes it finite. Transcribed as printed.
  curation:
    why: 'A differential inequality that forces uniqueness (Gronwall type).'
  tier: upper


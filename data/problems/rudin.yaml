  concept: 'condensation points of an uncountable E ⊂ R^k form a perfect set P with E \ P countable; Cantor–Bendixson: closed = perfect ∪ countable' 
  title: Condensation points and perfect sets
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - condensation-point
  - perfect-set
  - countable-base
  - uncountable
  - R^k
  - cantor-bendixson
  - isolated-point
  problemLatex: |
    Define a point $p$ in a metric space $X$ to be a *condensation point* of a set $E \subset X$ if every neighborhood of $p$ contains uncountably many points of $E$.

    (a) Suppose $E \subset R^k$, $E$ is uncountable, and let $P$ be the set of all condensation points of $E$. Prove that $P$ is perfect and that at most countably many points of $E$ are not in $P$. In other words, show that $P^c \cap E$ is at most countable. *Hint:* Let $\{V_n\}$ be a countable base of $R^k$, let $W$ be the union of those $V_n$ for which $E \cap V_n$ is at most countable, and show that $P = W^c$.

    (b) **(Exercise 28, restricted to $R^k$.)** Prove that every closed set in $R^k$ is the union of a (possibly empty) perfect set and a set which is at most countable. (*Corollary:* Every countable closed set in $R^k$ has isolated points.) *Hint:* Use part (a).

    *(Rudin: a collection $\{V_\alpha\}$ of open subsets of $X$ is a base for $X$ if for every $x \in X$ and every open set $G \subset X$ with $x \in G$, we have $x \in V_\alpha \subset G$ for some $\alpha$. $E$ is perfect if $E$ is closed and every point of $E$ is a limit point of $E$.)*
  notes: 'Definitions of base (Exercise 2.23) and perfect (Definition 2.18(h)) quoted. That R^k has a countable base follows from Exercises 2.22–2.23. Part (b) is Exercise 2.28 (printed p. 45, pdf 54) with "separable metric space" replaced by $R^k$ and "Exercise 27" by "part (a)"; otherwise verbatim.' 
  curation:
    why: 'Condensation points and the Cantor–Bendixson decomposition of closed sets.'
  tier: upper


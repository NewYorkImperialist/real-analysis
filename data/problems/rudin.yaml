  problemLatex: |
    Suppose $f$ is a real function with domain $R^1$ which has the intermediate value property: If $f(a) < c < f(b)$, then $f(x) = c$ for some $x$ between $a$ and $b$.

    Suppose also, for every rational $r$, that the set of all $x$ with $f(x) = r$ is closed.

    Prove that $f$ is continuous.

    *Hint:* If $x_n \to x_0$ but $f(x_n) > r > f(x_0)$ for some $r$ and all $n$, then $f(t_n) = r$ for some $t_n$ between $x_0$ and $x_n$; thus $t_n \to x_0$. Find a contradiction. (N. J. Fine, *Amer. Math. Monthly*, vol. 73, 1966, p. 782.)
  curation:
    why: 'Recovering continuity from the intermediate value property plus a closedness condition (Fine''s theorem).'
  tier: upper



- id: rudin-3.14
  source:
    key: rudin
    chapter: 3 Numerical Sequences and Series
    section: Exercises
    problemNumber: Exercise 3.14 (c)–(e)
    page: '80'
  topic: sequences
  subtopics:
  - convergence
  - limsup-liminf
  skills:
  - epsilon-N-proof
  - construct-counterexample
  - block-estimate
  - limsup-argument
  concept: 'Cesàro means: a positive unbounded Cesàro-null sequence; Tauberian converses (n a_n → 0, and Hardy''s n a_n bounded)'
  title: Cesàro means and Tauberian converses
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - Cesaro-means
  - tauberian
  - limsup
  - counterexample
  - sequence
  problemLatex: |
    If $\{s_n\}$ is a complex sequence, define its arithmetic means $\sigma_n$ by
    $$\sigma_n = \frac{s_0 + s_1 + \cdots + s_n}{n+1} \qquad (n = 0, 1, 2, \ldots).$$

    *(Rudin's parts (a)–(b), omitted here: if $\lim s_n = s$ then $\lim \sigma_n = s$; and there are divergent sequences $\{s_n\}$ with $\lim \sigma_n = 0$.)*

    (c) Can it happen that $s_n > 0$ for all $n$ and that $\limsup s_n = \infty$, although $\lim \sigma_n = 0$?

    (d) Put $a_n = s_n - s_{n-1}$, for $n \ge 1$. Show that
    $$s_n - \sigma_n = \frac{1}{n+1} \sum_{k=1}^{n} k a_k.$$
    Assume that $\lim (n a_n) = 0$ and that $\{\sigma_n\}$ converges. Prove that $\{s_n\}$ converges. [This gives a converse of the fact that $\lim s_n = s$ implies $\lim \sigma_n = s$, but under the additional assumption that $n a_n \to 0$.]

    (e) Derive the last conclusion from a weaker hypothesis: Assume $M < \infty$, $|n a_n| \le M$ for all $n$, and $\lim \sigma_n = \sigma$. Prove that $\lim s_n = \sigma$, by completing the following outline:

    If $m < n$, then
    $$s_n - \sigma_n = \frac{m+1}{n-m}(\sigma_n - \sigma_m) + \frac{1}{n-m} \sum_{i=m+1}^{n} (s_n - s_i).$$
    For these $i$,
    $$|s_n - s_i| \le \frac{(n-i)M}{i+1} \le \frac{(n-m-1)M}{m+2}.$$
    Fix $\varepsilon > 0$ and associate with each $n$ the integer $m$ that satisfies
    $$m \le \frac{n - \varepsilon}{1 + \varepsilon} < m + 1.$$
    Then $(m+1)/(n-m) \le 1/\varepsilon$ and $|s_n - s_i| < M\varepsilon$. Hence
    $$\limsup_{n\to\infty} |s_n - \sigma| \le M\varepsilon.$$
    Since $\varepsilon$ was arbitrary, $\lim s_n = \sigma$.
  notes: 'Trimmed to Rudin''s parts (c)–(e), keeping Rudin''s labels; Rudin''s (a)–(b) duplicate abbott-2.3.11 and are summarized in the marked parenthetical. The bracketed remark in (d) originally read "a converse of (a)" and was reworded to name the fact. The definitions of sigma_n and a_n are kept verbatim.'
  curation:
    why: 'Beyond ''Cesàro means are regular'': how badly Cesàro convergence can fail to imply convergence, and Hardy''s Tauberian theorem.'
  tier: upper

- id: rudin-4.17
  source:
    key: rudin
    chapter: 4 Continuity
    section: Exercises
    problemNumber: Exercise 4.17
    page: '100'
  topic: continuity
  subtopics:
  - discontinuities
  - functional-limits
  skills:
  - injection-into-countable-set
  - rational-approximation
  - case-analysis
  concept: any real function has at most countably many simple (first-kind) discontinuities
  title: Simple discontinuities are at most countable
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - simple-discontinuity
  - one-sided-limits
  - countable
  - jump-discontinuity
  - rationals
  problemLatex: |
    Let $f$ be a real function defined on $(a, b)$. Prove that the set of points at which $f$ has a simple discontinuity is at most countable.

    *(Rudin, Definition 4.26, quoted: Let $f$ be defined on $(a, b)$. If $f$ is discontinuous at a point $x$, and if $f(x+)$ and $f(x-)$ exist, then $f$ is said to have a discontinuity of the first kind, or a simple discontinuity, at $x$. Otherwise the discontinuity is said to be of the second kind. There are two ways in which a function can have a simple discontinuity: either $f(x+) \ne f(x-)$ [in which case the value $f(x)$ is immaterial], or $f(x+) = f(x-) \ne f(x)$.)*

    *(Here $f(x+)$ and $f(x-)$ are the right- and left-hand limits of $f$ at $x$.)*
  textbookHintsLast: true  # printed hint gives most of the solution away
  hints:
  - text: |
      Let $E$ be the set on which $f(x-) < f(x+)$. With each point $x$ of $E$, associate a triple $(p, q, r)$ of rational numbers such that

      (a) $f(x-) < p < f(x+)$,
      (b) $a < q < t < x$ implies $f(t) < p$,
      (c) $x < t < r < b$ implies $f(t) > p$.

      The set of all such triples is countable. Show that each triple is associated with at most one point of $E$. Deal similarly with the other possible types of simple discontinuities.
    source: Rudin, Principles of Mathematical Analysis (3rd ed.), hint to Exercise 4.17
    kind: textbook
  notes: 'Stated bare per curation; Rudin''s printed hint (the rational triples) moved verbatim into the hints. Definition 4.26 (simple discontinuity) quoted verbatim from printed p. 94 (pdf 103).'
  curation:
    why: 'Jump and removable discontinuities of an arbitrary function form a countable set.'
  tier: upper


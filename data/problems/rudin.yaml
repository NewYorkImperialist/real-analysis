  problemLatex: |
    Assume that $\{f_n\}$ is a sequence of monotonically increasing functions on $R^1$ with $0 \le f_n(x) \le 1$ for all $x$ and all $n$.

    (a) Prove that there is a function $f$ and a sequence $\{n_k\}$ such that
    $$f(x) = \lim_{k\to\infty} f_{n_k}(x)$$
    for every $x \in R^1$. (The existence of such a pointwise convergent subsequence is usually called *Helly's selection theorem*.)

    (b) If, moreover, $f$ is continuous, prove that $f_{n_k} \to f$ uniformly on compact sets.

    *Hint:* (i) Some subsequence $\{f_{n_i}\}$ converges at all rational points $r$, say, to $f(r)$. (ii) Define $f(x)$, for any $x \in R^1$, to be $\sup f(r)$, the sup being taken over all $r \le x$. (iii) Show that $f_{n_i}(x) \to f(x)$ at every $x$ at which $f$ is continuous. (This is where monotonicity is strongly used.) (iv) A subsequence of $\{f_{n_i}\}$ converges at every point of discontinuity of $f$ since there are at most countably many such points. This proves (a). To prove (b), modify your proof of (iii) appropriately.
  notes: 'Transcribed from the page image; hint is Rudin''s own. $R^1$ is Rudin''s notation for the real line. (Note: in (a) the f obtained is the limit along a further subsequence; the problem statement is as printed.)'
  curation:
    why: 'Helly''s selection theorem for uniformly bounded monotone functions.'
  tier: upper


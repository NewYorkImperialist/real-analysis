- id: rudin-5.15
  source:
    key: rudin
    chapter: 5 Differentiation
    section: Exercises
    problemNumber: Exercise 5.15 (with Exercise 5.16)
    page: '115'
  topic: differentiation
  subtopics:
  - taylor
  skills:
  - taylor-estimate
  - optimize-free-parameter
  - verify-extremal-example
  - tail-argument
  concept: 'Landau–Kolmogorov inequality M_1^2 ≤ 4 M_0 M_2 on a half-line; consequence: f → 0 and f'''' bounded ⇒ f'' → 0'
  title: Landau's inequality $M_1^2 \le 4M_0M_2$ on a half-line
  difficulty: hard
  category: challenge
  type: proof
  tags:
  - Landau-inequality
  - Taylor
  - derivative-bounds
  - sharp-inequality
  - prelim
  problemLatex: |
    Suppose $a \in R^1$, $f$ is a twice-differentiable real function on $(a, \infty)$, and $M_0, M_1, M_2$ are the least upper bounds of $|f(x)|$, $|f'(x)|$, $|f''(x)|$, respectively, on $(a, \infty)$. Prove that
    $$M_1^2 \le 4 M_0 M_2.$$
    *Hint:* If $h > 0$, Taylor's theorem shows that
    $$f'(x) = \frac{1}{2h}\left[f(x + 2h) - f(x)\right] - h f''(\xi)$$
    for some $\xi \in (x, x + 2h)$. Hence
    $$|f'(x)| \le h M_2 + \frac{M_0}{h}.$$
    To show that $M_1^2 = 4 M_0 M_2$ can actually happen, take $a = -1$, define
    $$f(x) = \begin{cases} 2x^2 - 1 & (-1 < x < 0), \\ \dfrac{x^2 - 1}{x^2 + 1} & (0 \le x < \infty), \end{cases}$$
    and show that $M_0 = 1$, $M_1 = 4$, $M_2 = 4$.

    **(Exercise 16.)** Suppose $f$ is twice-differentiable on $(0, \infty)$, $f''$ is bounded on $(0, \infty)$, and $f(x) \to 0$ as $x \to \infty$. Prove that $f'(x) \to 0$ as $x \to \infty$.

    *Hint:* Let $a \to \infty$ in Exercise 15.
  notes: |
    Exercise 15 spans printed pp. 115-116; its closing question about vector-valued functions is dropped. Exercise 16 (printed p. 116, pdf 125) is appended verbatim as the final part; "Exercise 15" in its hint means the inequality above. In the extremal example f is twice differentiable at 0 as well: f'(0) = 0 and both one-sided limits of f''(x) at 0 equal 4, so f''(0) = 4 (an earlier note claiming otherwise was wrong).

  curation:
    why: 'Landau''s inequality bounding f'' by f and f'''', with its sharp constant.'
  tier: upper

- id: rudin-5.17
  source:
    key: rudin
    chapter: 5 Differentiation
    section: Exercises

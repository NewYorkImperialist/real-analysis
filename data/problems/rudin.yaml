  concept: f(−1)=f(0)=0, f(1)=1, f'(0)=0 ⇒ f'''(x) ≥ 3 for some x ∈ (−1,1)
  title: Some third derivative is at least 3
  difficulty: medium
  category: challenge
  type: theorem-application
  tags:
  - Taylor
  - third-derivative
  - sharp-bound
  - Putnam-style
  problemLatex: |
    Suppose $f$ is a real, three times differentiable function on $[-1, 1]$, such that
    $$f(-1) = 0, \qquad f(0) = 0, \qquad f(1) = 1, \qquad f'(0) = 0.$$
    Prove that $f^{(3)}(x) \ge 3$ for some $x \in (-1, 1)$.

    Note that equality holds for $\frac{1}{2}(x^3 + x^2)$.

    *Hint:* Use Theorem 5.15, with $\alpha = 0$ and $\beta = \pm 1$, to show that there exist $s \in (0, 1)$ and $t \in (-1, 0)$ such that
    $$f^{(3)}(s) + f^{(3)}(t) = 6.$$

    *Theorem 5.15 (Taylor's theorem), quoted:* Suppose $f$ is a real function on $[a, b]$, $n$ is a positive integer, $f^{(n-1)}$ is continuous on $[a, b]$, $f^{(n)}(t)$ exists for every $t \in (a, b)$. Let $\alpha, \beta$ be distinct points of $[a, b]$, and define $$P(t) = \sum_{k=0}^{n-1} \frac{f^{(k)}(\alpha)}{k!}(t - \alpha)^k.$$ Then there exists a point $x$ between $\alpha$ and $\beta$ such that $$f(\beta) = P(\beta) + \frac{f^{(n)}(x)}{n!}(\beta - \alpha)^n.$$
  notes: Theorem 5.15 quoted verbatim from printed pp. 110-111 (pdf 119-120). The book prints '½(x³ + x²)'.
  curation:
    why: 'A sharp lower bound on a third derivative from four conditions on f.'
  tier: upper


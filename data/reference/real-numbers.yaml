- before: lebl-1.1.1
  items:
    - kind: definition
      name: Ordered set
      latex: |
        An **ordered set** is a set $S$ with a relation $<$ such that for all $x,y,z\in S$: exactly one of
        $x<y$, $x=y$, $y<x$ holds (**trichotomy**), and if $x<y$ and $y<z$ then $x<z$ (**transitivity**).
        We write $x\le y$ if $x<y$ or $x=y$.
    - kind: definition
      name: Ordered field
      latex: |
        An **ordered field** is a field $F$ that is also an ordered set such that for all $x,y,z\in F$:
        if $x<y$ then $x+z<y+z$; and if $x>0$ and $y>0$ then $xy>0$.
      note: $\mathbb{Q}$ and $\mathbb{R}$ are ordered fields.

- before: abbott-1.2.6
  items:
    - kind: definition
      name: Absolute value
      latex: |
        For $a\in\mathbb{R}$, the **absolute value** is $|a|=a$ if $a\ge 0$ and $|a|=-a$ if $a<0$.
        The number $|a-b|$ is the distance between $a$ and $b$.

- before: lebl-1.1.5
  items:
    - kind: definition
      name: Upper and lower bounds
      latex: |
        Let $S$ be an ordered set and $A\subseteq S$. An element $b\in S$ is an **upper bound** for $A$ if
        $a\le b$ for all $a\in A$, and a **lower bound** if $b\le a$ for all $a\in A$. The set $A$ is
        **bounded above** (**below**) if it has an upper (lower) bound, and **bounded** if it is both.
    - kind: definition
      name: Supremum and infimum
      latex: |
        An element $s\in S$ is the **supremum** (least upper bound) of $A$, $s=\sup A$, if $s$ is an upper
        bound for $A$ and $s\le b$ for every upper bound $b$ of $A$. Dually, $t=\inf A$ (greatest lower
        bound) if $t$ is a lower bound for $A$ and $b\le t$ for every lower bound $b$ of $A$.
      note: A supremum, when it exists, is unique, but it need not belong to $A$.

- before: lebl-1.1.14
  items:
    - kind: definition
      name: Least-upper-bound property and the Axiom of Completeness
      latex: |
        An ordered set $S$ has the **least-upper-bound property** if every nonempty subset of $S$ that is
        bounded above has a supremum in $S$. **Axiom of Completeness:** $\mathbb{R}$ is an ordered field with
        the least-upper-bound property; that is, every nonempty set $A\subseteq\mathbb{R}$ that is bounded
        above has a supremum $\sup A\in\mathbb{R}$.
      note: An axiom in Abbott; a theorem about the constructed $\mathbb{R}$ in Lebl and Rudin.

- before: lebl-1.3.5
  items:
    - kind: definition
      name: Supremum of a function
      latex: |
        For $f\colon D\to\mathbb{R}$ with $D\ne\emptyset$, write
        $\sup_{x\in D}f(x)=\sup f(D)$ and $\inf_{x\in D}f(x)=\inf f(D)$, where $f(D)=\{f(x):x\in D\}$.
        The function $f$ is **bounded** if $f(D)$ is a bounded set.

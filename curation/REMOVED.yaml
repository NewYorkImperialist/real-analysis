- id: lebl-0.3.15
  reason: "off-topic: number theory (divisibility by induction); induction is trained elsewhere"
  problem: |
    - id: lebl-0.3.15
      source:
        key: lebl
        chapter: 0 Introduction
        section: 0.3 Basic set theory
        problemNumber: Exercise 0.3.15
        page: '21'
      assignedIn:
      - MIT 18.100A (Fall 2020) Assignment 1, Problem 4
      topic: foundations
      subtopics:
      - induction
      skills:
      - induction
      concept: 6 divides n^3 + 5n by induction
      title: '$n^3 + 5n$ is divisible by 6'
      difficulty: introductory
      category: canonical
      type: proof
      tags:
      - induction
      - divisibility
      problemLatex: |
        Prove that $n^3 + 5n$ is divisible by $6$ for all $n \in \mathbb{N}$.
      notes: Topically consistent with the MIT reading (0.3).
      curation:
        why: Induction for a divisibility statement.
  solution: |
    - id: lebl-0.3.15
      hints:
        - |
          Use induction on $n$. Expand $(n+1)^3 + 5(n+1)$ and look for the expression $n^3 + 5n$ inside it.
        - |
          The leftover terms are $3n^2 + 3n + 6 = 3n(n+1) + 6$. Why is $3n(n+1)$ divisible by $6$? Think about the parity of a product of two consecutive integers.
      solution: |
        **Proof.** We use induction on $n \in \mathbb{N} = \{1, 2, 3, \ldots\}$.

        *Base case.* For $n = 1$: $1^3 + 5 \cdot 1 = 6$, which is divisible by $6$.

        *Induction step.* Suppose $6 \mid n^3 + 5n$. Then
        $$(n+1)^3 + 5(n+1) = n^3 + 3n^2 + 3n + 1 + 5n + 5 = (n^3 + 5n) + 3n(n+1) + 6.$$
        The first term is divisible by $6$ by hypothesis. The last term is $6$. For the middle term: one of the consecutive integers $n$, $n+1$ is even. (If $n$ is odd, then $n + 1$ is even.) So $n(n+1) = 2k$ for some integer $k$, and $3n(n+1) = 6k$. A sum of three multiples of $6$ is a multiple of $6$, so $6 \mid (n+1)^3 + 5(n+1)$.

        By induction, $6 \mid n^3 + 5n$ for every $n \in \mathbb{N}$. $\blacksquare$

- id: abbott-7.2.5
  reason: "near-duplicate: contained in ross-33.9 (which also proves the integrals converge)"
  problem: |
    - id: abbott-7.2.5
      source:
        key: abbott
        chapter: 7 The Riemann Integral
        section: 7.2 The Definition of the Riemann Integral
        problemNumber: Exercise 7.2.5
        page: '223'
      topic: function-sequences
      subtopics:
      - interchange-integral
      skills:
      - epsilon-over-3
      - sup-norm-estimate
      concept: uniform limit of integrable functions is integrable
      title: 'Uniform limits of integrable functions are integrable'
      difficulty: medium
      category: canonical
      type: proof
      tags:
      - Riemann-integration
      - uniform-convergence
      - integrability-criterion
      problemLatex: |
        Assume that, for each $n$, $f_n$ is an integrable function on $[a,b]$. If $(f_n) \to f$ uniformly on $[a,b]$, prove that $f$ is also integrable on this set. (We will see that this conclusion does not necessarily follow if the convergence is pointwise.)
      curation:
        why: A uniform limit of integrable functions is integrable.
  solution: |
    - id: abbott-7.2.5
      hints:
        - |
          Use the criterion: $f$ is integrable if for every $\epsilon > 0$ some partition has $U(f,P) - L(f,P) < \epsilon$. Also check that $f$ is bounded, which Darboux sums require.
        - |
          Pick one $f_N$ uniformly within $\eta$ of $f$, and a partition that works for $f_N$. Compare the sup and inf of $f$ and $f_N$ on each subinterval.
      solution: |
        Let $\epsilon > 0$ and set $\eta = \frac{\epsilon}{4(b-a)}$. By uniform convergence, choose $N$ with $|f_N(x) - f(x)| < \eta$ for all $x \in [a,b]$.

        *$f$ is bounded.* $f_N$ is integrable, hence bounded, say $|f_N| \le B$. Then $|f| \le B + \eta$ on $[a,b]$.

        *Small oscillation.* Since $f_N$ is integrable, there is a partition $P = \{x_0,\dots,x_n\}$ with $U(f_N,P) - L(f_N,P) < \frac\epsilon2$. On each $I_k = [x_{k-1},x_k]$ and for every $x \in I_k$,
        $$f(x) < f_N(x) + \eta \le \sup_{I_k} f_N + \eta, \qquad f(x) > f_N(x) - \eta \ge \inf_{I_k} f_N - \eta.$$
        Hence $\sup_{I_k} f - \inf_{I_k} f \le \sup_{I_k} f_N - \inf_{I_k} f_N + 2\eta$. Multiplying by $\Delta x_k$ and summing,
        $$U(f,P) - L(f,P) \le U(f_N,P) - L(f_N,P) + 2\eta(b-a) < \frac\epsilon2 + \frac\epsilon2 = \epsilon.$$
        Since $\epsilon$ was arbitrary, the integrability criterion (Theorem 7.2.8) shows that $f$ is integrable on $[a,b]$. $\blacksquare$

- id: tao-8.3.4
  reason: "near-duplicate: superseded by pugh-1.38 (Cantor's theorem, proved)"
  problem: |
    - id: tao-8.3.4
      source:
        key: tao
        chapter: 8 Infinite sets
        section: 8.3 Uncountable sets
        problemNumber: Exercise 8.3.4
        page: '198'
      topic: foundations
      subtopics:
      - cardinality
      skills:
      - theorem-reuse
      - contradiction
      concept: '|X| < |2^X|; transitivity of strict cardinality'
      title: Cantor's theorem and strict cardinality
      difficulty: easy
      category: canonical
      type: proof
      tags:
      - Cantor
      - power-set
      - cardinality
      - Schroeder-Bernstein
      problemLatex: |
        Let us say that a set $A$ has *strictly lesser cardinality* than a set $B$ if $A$ has lesser than or equal cardinality to $B$ (in the sense of Exercise 3.6.7) but $A$ does not have equal cardinality to $B$. Show that for any set $X$, that $X$ has strictly lesser cardinality than $2^X$. Also, show that if $A$ has strictly lesser cardinality than $B$, and $B$ has strictly lesser cardinality than $C$, then $A$ has strictly lesser cardinality than $C$.

        *(Exercise 3.6.7 sense: $A$ has lesser or equal cardinality to $B$ if there exists an injection $f\colon A \to B$ from $A$ to $B$.)*

        *(Theorem 8.3.1 (Cantor's theorem): Let $X$ be an arbitrary set (finite or infinite). Then the sets $X$ and $2^X$ cannot have equal cardinality.)*

        *(Exercise 8.3.3 (the Schröder–Bernstein theorem): if $A, B$ are sets such that $A$ has lesser or equal cardinality to $B$ and $B$ has lesser or equal cardinality to $A$, then $A$ and $B$ have equal cardinality.)*
      notes: "Exercise statement verified against the page (printed p. 198, pdf 215). Cantor's theorem (Theorem 8.3.1, p. 195), the definition from Exercise 3.6.7 and the statement of Exercise 8.3.3 (Schröder–Bernstein, same page) are quoted, the last lightly trimmed from 'Using Exercise 8.3.2, show that if …'. $2^X$ is the power set of $X$. The exercise uses Cantor's theorem rather than asking for its diagonal proof."
      curation:
        why: Cantor's theorem turned into the strict inequality |X| < |2^X|, plus transitivity of strict cardinality via Schröder–Bernstein; the bank only had |P(A)| = 2^n for finite A.
  solution: |
    - id: tao-8.3.4
      hints:
        - |
          "Strictly lesser cardinality" has two parts: an injection exists, and no bijection exists. For the first claim, which part is supplied by Cantor's theorem, and which part do you still have to build by hand?
        - |
          For $X \to 2^X$, every element $x$ determines a very simple subset of $X$. For transitivity, composing injections handles "lesser or equal"; the real work is ruling out a bijection between $A$ and $C$.
        - |
          Suppose $A$ and $C$ had equal cardinality. Combine a bijection $C \to A$ with the injection $A \to B$ to get an injection $C \to B$, and then invoke Schröder–Bernstein on $B$ and $C$.
      solution: |
        **Part 1: $X$ has strictly lesser cardinality than $2^X$.** Define $f\colon X \to 2^X$ by $f(x) = \{x\}$. This is well defined, since $\{x\} \subseteq X$ for every $x \in X$. It is injective: if $\{x\} = \{y\}$ then $x \in \{y\}$, so $x = y$. Thus $X$ has lesser or equal cardinality to $2^X$. By Cantor's theorem (Theorem 8.3.1), $X$ and $2^X$ do not have equal cardinality. Hence $X$ has strictly lesser cardinality than $2^X$.

        **Part 2: transitivity.** Suppose $A$ has strictly lesser cardinality than $B$, and $B$ has strictly lesser cardinality than $C$. Then there are injections $f\colon A \to B$ and $g\colon B \to C$.

        *Lesser or equal.* The composition $g \circ f\colon A \to C$ is injective: if $g(f(a)) = g(f(a'))$, then $f(a) = f(a')$ because $g$ is injective, and then $a = a'$ because $f$ is injective. So $A$ has lesser or equal cardinality to $C$.

        *Not equal.* Suppose, for contradiction, that $A$ and $C$ have equal cardinality, so there is a bijection $h\colon C \to A$. Then $f \circ h\colon C \to B$ is a composition of injections, hence injective, so $C$ has lesser or equal cardinality to $B$. We also have the injection $g\colon B \to C$, so $B$ has lesser or equal cardinality to $C$. By the Schröder–Bernstein theorem (Exercise 8.3.3), $B$ and $C$ have equal cardinality. This contradicts the assumption that $B$ has strictly lesser cardinality than $C$.

        Therefore $A$ and $C$ do not have equal cardinality, and $A$ has strictly lesser cardinality than $C$. $\blacksquare$

- id: lebl-2.6.13
  reason: "near-duplicate: exactly part (b) of cummings-4.5"
  problem: |
    - id: lebl-2.6.13
      source:
        key: lebl
        chapter: 2 Sequences and Series
        section: 2.6 More on series
        problemNumber: Exercise 2.6.13
        page: '111'
      assignedIn:
      - MIT 18.100A (Fall 2020) Assignment 6, Problem 5
      topic: series
      subtopics:
      - conditional-convergence
      - alternating-series
      skills:
      - construct-counterexample
      concept: ∑x_n converges but ∑x_n^2 diverges (e.g. (-1)^n/sqrt n)
      title: A convergent series $\sum x_n$ with $\sum x_n^2$ divergent
      difficulty: easy
      category: canonical
      type: counterexample
      tags:
      - conditional-convergence
      - counterexample
      - alternating-series
      problemLatex: |
        Find a series $\sum_{n=1}^\infty x_n$ that converges, but $\sum_{n=1}^\infty x_n^2$ diverges. Hint: Compare Exercise 2.5.14.
        *(Exercise 2.5.14: Suppose $\sum_{n=1}^\infty x_n$ converges and $x_n \geq 0$ for all $n$. Prove that $\sum_{n=1}^\infty x_n^2$ converges.)*
      notes: Exercise 2.5.14 quoted verbatim for the hint. Topically consistent with the MIT reading (2.5/2.6).
      curation:
        why: Conditional convergence vs nonlinear operations on terms.
  solution: |
    - id: lebl-2.6.13
      hints:
        - |
          Exercise 2.5.14 shows that the example cannot have nonnegative terms. So the convergence must come from cancellation, as in an alternating series.
        - |
          Choose $|x_n|$ so that $x_n^2$ is the harmonic series.
      solution: |
        Let $x_n = \frac{(-1)^n}{\sqrt{n}}$.

        **$\sum x_n$ converges.** The sequence $\frac{1}{\sqrt n}$ is positive and decreasing, and it tends to $0$: $\frac{1}{\sqrt n} < \varepsilon$ once $n > \varepsilon^{-2}$. By the alternating series test, $\sum_{n=1}^\infty \frac{(-1)^n}{\sqrt n}$ converges.

        **$\sum x_n^2$ diverges.** $x_n^2 = \frac{1}{n}$, so $\sum x_n^2$ is the harmonic series, which diverges.

        This is consistent with Exercise 2.5.14, which needs $x_n \ge 0$. Here the series converges only conditionally.

- id: mit20-a7-4
  reason: "no technique: restatement of the density of the irrationals (mit20-a3-1)"
  problem: |
    - id: mit20-a7-4
      source:
        key: mit
        chapter: "Assignment 7"
        section: "Reading: Lebl §2.5, §2.6, §3.1"
        problemNumber: "Problem 4"
        page: "1"
      topic: topology
      subtopics: [limit-points, dense-sets]
      skills: [density-argument]
      concept: "every real is a cluster point of the irrationals"
      title: Every real number is a cluster point of the irrationals
      difficulty: introductory
      category: canonical
      type: proof
      tags: [cluster-point, density, irrationals]
      problemLatex: |
        Prove that every real number is a cluster point of the set of irrational numbers.
      curation:
        why: "Short link between density and cluster points; needed for limits of functions on ℝ∖ℚ."
  solution: |
    - id: mit20-a7-4
      hints:
        - |
          Unwind the definition: for a fixed real $x$ and any $\epsilon > 0$, you must find an irrational number in $(x-\epsilon, x+\epsilon)$ that is different from $x$.
        - |
          The irrationals are dense: between any two reals there is an irrational (for instance, $q\sqrt 2$ for a suitable rational $q$, or $r + \sqrt 2$ with $r$ rational).
        - |
          To guarantee the point is different from $x$, look in the half-interval $(x, x+\epsilon)$ rather than the whole interval.
      solution: |
        Let $x \in \mathbb{R}$ and $\epsilon > 0$. We must show $(x-\epsilon, x+\epsilon)$ contains an irrational number other than $x$.

        By the density of $\mathbb{Q}$, there is a rational $r$ with $x - \sqrt 2 < r < x - \sqrt 2 + \epsilon$. Then $y := r + \sqrt 2$ satisfies $x < y < x + \epsilon$. The number $y$ is irrational: if $y$ were rational then $\sqrt2 = y - r$ would be rational, which is false. Since $y > x$, we have $y \neq x$, and $y \in (x-\epsilon,x+\epsilon)$.

        Thus $(x-\epsilon, x+\epsilon) \cap (\mathbb{R}\setminus\mathbb{Q}) \setminus\{x\} \neq \emptyset$ for every $\epsilon > 0$, so $x$ is a cluster point of the irrationals. Since $x$ was arbitrary, every real number is a cluster point of the set of irrationals.

- id: mit20-a9-4
  reason: "near-duplicate: the alpha = 1 case of mit20-a10-1 (Hölder implies uniformly continuous)"
  problem: |
    - id: mit20-a9-4
      source:
        key: mit
        chapter: "Assignment 9"
        section: "Reading: Lebl §3.3–3.5"
        problemNumber: "Problem 4"
        page: "1"
      topic: continuity
      subtopics: [uniform-continuity, lipschitz-holder]
      skills: [choose-delta]
      concept: "Lipschitz implies uniformly continuous"
      title: Lipschitz functions are uniformly continuous
      difficulty: introductory
      category: canonical
      type: proof
      tags: [Lipschitz, uniform-continuity, definition]
      problemLatex: |
        Let $S \subset \mathbb{R}$. We say that $f \colon S \to \mathbb{R}$ is *Lipschitz continuous* on $S$ if there exists $L \ge 0$ such that for all $x, y \in S$,
        $$|f(x) - f(y)| \le L|x - y|.$$
        Prove that if $f \colon S \to \mathbb{R}$ is Lipschitz continuous on $S$ then $f$ is uniformly continuous on $S$.
      curation:
        why: "The cleanest uniform-continuity proof: δ = ε/L, independent of the point."
  solution: |
    - id: mit20-a9-4
      hints:
        - |
          Write down what uniform continuity requires: given $\epsilon > 0$, a single $\delta > 0$ that works for all pairs $x, y \in S$ at once.
        - |
          The Lipschitz inequality already bounds $|f(x) - f(y)|$ by a multiple of $|x - y|$, with no dependence on where $x$ and $y$ are. How small must $|x-y|$ be to make $L|x-y| < \epsilon$? Remember that $L$ could be $0$.
      solution: |
        **Proof.** Let $L \ge 0$ be a Lipschitz constant for $f$ on $S$, and let $\epsilon > 0$. Put
        $$\delta = \frac{\epsilon}{L + 1} > 0.$$
        (We use $L+1$ rather than $L$ so that the formula also makes sense when $L = 0$.) Note that $\delta$ depends only on $\epsilon$ and $L$, not on any point of $S$. If $x, y \in S$ with $|x - y| < \delta$, then
        $$|f(x) - f(y)| \le L|x - y| \le L\delta = \frac{L}{L+1}\,\epsilon < \epsilon.$$
        (When $L = 0$ the middle quantity is $0 < \epsilon$.) Hence $f$ is uniformly continuous on $S$. $\blacksquare$

- id: lebl-3.2.11
  reason: "near-duplicate: special case of mit20-a7-6(b) (sign preservation)"
  problem: |
    - id: lebl-3.2.11
      source:
        key: lebl
        chapter: 3 Continuous Functions
        section: 3.2 Continuous functions
        problemNumber: Exercise 3.2.11
        page: '128'
      assignedIn:
      - MIT 18.100A (Fall 2020) Assignment 8, Problem 3
      topic: continuity
      subtopics:
      - epsilon-delta-continuity
      skills:
      - epsilon-delta-proof
      - choose-epsilon
      concept: continuous f with f(c)>0 is positive on a neighborhood of c
      title: A continuous function stays positive near a positive value
      difficulty: introductory
      category: canonical
      type: proof
      tags:
      - continuity
      - sign-preservation
      - epsilon-delta
      - machinery
      problemLatex: |
        Let $f\colon \mathbb{R} \to \mathbb{R}$ be continuous. Suppose $f(c) > 0$. Show that there exists an $\alpha > 0$ such that for all $x \in (c-\alpha, c+\alpha)$, we have $f(x) > 0$.
      notes: 'Topic matches MIT reading (3.1, 3.2): consistent.'
      curation:
        why: 'Sign preservation: choose epsilon = f(c) in the definition of continuity.'
  solution: |
    - id: lebl-3.2.11
      hints:
        - |
          Continuity at $c$ lets you keep $f(x)$ within any prescribed distance $\epsilon$ of $f(c)$. Which $\epsilon$ guarantees that $f(x)$ stays positive?
        - |
          Unpack $|f(x) - f(c)| < \epsilon$ as $f(c) - \epsilon < f(x) < f(c) + \epsilon$. Only the lower bound matters here: how large may $\epsilon$ be so that it is still at least $0$? Then take $\alpha$ to be the $\delta$ that continuity gives for that $\epsilon$.
      solution: |
        **Proof.** Let $\epsilon = f(c) > 0$. Since $f$ is continuous at $c$, there is $\delta > 0$ such that $|x - c| < \delta$ implies $|f(x) - f(c)| < f(c)$. Set $\alpha = \delta$. For $x \in (c-\alpha, c+\alpha)$ we have $|x - c| < \delta$, so
        $$f(x) > f(c) - f(c) = 0.$$
        $\blacksquare$

- id: pugh-prelim-56
  reason: "near-duplicate (upper tier): ross-30.6 with F = integral of f"
  problem: |
    - id: pugh-prelim-56
      source:
        key: pugh
        chapter: 4 Function Spaces
        section: More Prelim Problems
        problemNumber: Prelim Problem 56
        page: '275'
      topic: integration
      subtopics:
      - fundamental-theorem
      - improper-integrals
      skills:
      - integrating-factor
      - lhopital-infinity-over-infinity
      - epsilon-estimate
      concept: if f + ∫_0^x f has a finite limit then f → 0 (F' + F → L ⇒ F → L)
      title: If $f(x) + \int_0^x f$ converges then $f \to 0$
      difficulty: hard
      category: challenge
      type: proof
      tags:
      - limits-at-infinity
      - fundamental-theorem
      - integrating-factor
      - lhopital
      - prelim
      problemLatex: |
        Let $f$ be a continuous real-valued function on $[0,\infty)$ such that
        $$\lim_{x\to\infty} \Bigl( f(x) + \int_0^x f(t)\, dt \Bigr)$$
        exists (and is finite). Prove that $\lim_{x\to\infty} f(x) = 0$.
      notes: Verified against page image.
      curation:
        why: 'A limit-at-infinity problem whose tool is not named.'
      tier: upper
  solution: |
    - id: pugh-prelim-56
      hints:
        - |
          Name the integral: $F(x) = \int_0^x f(t)\,dt$. What is $F'$, and what does the hypothesis say in terms of $F$ and $F'$?
        - |
          The hypothesis is $F' + F \to L$, a first-order linear differential expression. Which integrating factor turns $F' + F$ into an exact derivative?
        - |
          Since $(e^x F)' = e^x (F + F')$, you can write $F(x) = e^{-x}\int_0^x e^t g(t)\,dt$ with $g = F + F' \to L$. Show this weighted average tends to $L$; then $f = g - F \to 0$.
      solution: |
        **Proof.** Let $F(x) = \int_0^x f(t)\,dt$. Since $f$ is continuous, the FTC gives that $F$ is differentiable with $F' = f$, and $F(0) = 0$. Let $g = f + F = F' + F$. By hypothesis $g(x) \to L$ for some real $L$. Note $g$ is continuous.

        *Integrating factor.* $(e^x F(x))' = e^x(F'(x) + F(x)) = e^x g(x)$. This derivative is continuous, so by the FTC, $e^x F(x) - e^0 F(0) = \int_0^x e^t g(t)\,dt$, that is,
        $$F(x) = e^{-x} \int_0^x e^t g(t)\,dt .$$
        Since $e^{-x}\int_0^x e^t L\,dt = L(1 - e^{-x})$,
        $$F(x) - L = e^{-x}\int_0^x e^t\big(g(t) - L\big)\,dt \;-\; L e^{-x}.$$

        *$F \to L$.* Let $\epsilon > 0$ and choose $X$ with $|g(t) - L| < \epsilon$ for $t \ge X$. For $x > X$ split the integral at $X$:
        $$|F(x) - L| \le e^{-x}\left|\int_0^X e^t (g(t) - L)\,dt\right| + e^{-x}\int_X^x e^t \epsilon\,dt + |L|e^{-x} \le K e^{-x} + \epsilon + |L|e^{-x},$$
        where $K = \left|\int_0^X e^t(g - L)\right|$ does not depend on $x$, and we used $e^{-x}(e^x - e^X) \le 1$. Letting $x \to \infty$ gives $\limsup_{x\to\infty} |F(x) - L| \le \epsilon$. As $\epsilon$ was arbitrary, $F(x) \to L$.

        *Conclusion.* $f(x) = g(x) - F(x) \to L - L = 0$. $\blacksquare$

- id: mit20-mid-1a
  reason: "near-duplicate: special case of lebl-0.3.27"
  problem: |
    - id: mit20-mid-1a
      source:
        key: mit
        chapter: "Midterm Exam (October 16, 2020)"
        problemNumber: "Problem 1(a)"
        page: "2"
      topic: foundations
      subtopics: [functions, sets]
      skills: [element-chasing]
      concept: "preimages commute with intersections"
      title: Preimages commute with intersections
      difficulty: introductory
      category: canonical
      type: proof
      tags: [preimage, sets, functions, element-chasing]
      problemLatex: |
        Let $f \colon A \to B$, and let $C, D$ be subsets of $B$. Prove
        $$f^{-1}(C \cap D) = f^{-1}(C) \cap f^{-1}(D).$$
      curation:
        why: "Element-chasing with preimages; the reason preimages, not images, appear in the topological definition of continuity."
  solution: |
    - id: mit20-mid-1a
      hints:
        - |
          To prove two sets are equal, show each one is contained in the other. Equivalently, show that $x$ belongs to the left side exactly when it belongs to the right side.
        - |
          Unwind the definition: $x \in f^{-1}(E)$ means exactly $f(x) \in E$. Then apply the definition of intersection.
      solution: |
        **Proof.** Recall that $f^{-1}(E) = \{x \in A : f(x) \in E\}$ for $E \subset B$. For $x \in A$ we have the chain of equivalences
        $$x \in f^{-1}(C \cap D) \iff f(x) \in C \cap D \iff \bigl(f(x) \in C \text{ and } f(x) \in D\bigr) \iff \bigl(x \in f^{-1}(C) \text{ and } x \in f^{-1}(D)\bigr) \iff x \in f^{-1}(C) \cap f^{-1}(D).$$
        Every element of $A$ lies in the left side exactly when it lies in the right side, and both sides are subsets of $A$. So
        $$f^{-1}(C \cap D) = f^{-1}(C) \cap f^{-1}(D). \qquad \blacksquare$$


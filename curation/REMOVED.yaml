        Prove that
        $$\lim_{n \to \infty} \frac{1}{20n^2 + 20n + 2020} = 0.$$
      curation:
        why: "A first ε–N proof where you should bound crudely (denominator ≥ 20n) rather than solve exactly."
  solution: |
    - id: mit20-a3-6
      hints:
        - |
          You need: for every $\varepsilon > 0$ an $N$ with $\left|\frac{1}{20n^2+20n+2020}\right| < \varepsilon$ for all $n \ge N$. You do not need the exact $N$, just one that works.
        - |
          Throw away most of the denominator: compare the fraction with something simpler like $\frac{1}{n}$, then use the Archimedean property.
      solution: |
        **Proof.** For every $n \in \mathbb{N}$ the denominator satisfies $20n^2 + 20n + 2020 > n > 0$, so

        $$0 < \frac{1}{20n^2+20n+2020} < \frac{1}{n}.$$

        Let $\varepsilon > 0$. By the Archimedean property choose $N \in \mathbb{N}$ with $N > 1/\varepsilon$. Then for all $n \ge N$,

        $$\left|\frac{1}{20n^2+20n+2020} - 0\right| < \frac{1}{n} \le \frac{1}{N} < \varepsilon.$$

        Hence $\lim_{n\to\infty} \frac{1}{20n^2+20n+2020} = 0$. $\blacksquare$

- id: mit20-mid-3a
  reason: "near-duplicate: same epsilon-N rational-limit drill as abbott-2.2.2"
  problem: |
    - id: mit20-mid-3a
      source:
        key: mit
        chapter: "Midterm Exam (October 16, 2020)"
        problemNumber: "Problem 3(a)"
        page: "6"
      topic: sequences
      subtopics: [convergence]
      skills: [epsilon-N-proof, crude-bound]
      concept: "ε–N proof of a rational-function limit"
      title: $\varepsilon$–$N$ proof that $10n^2/(n^2+16n+1)\to 10$
      difficulty: introductory
      category: canonical
      type: proof
      tags: [epsilon-N, convergence, definition]
      problemLatex: |
        Use the definition of convergence to prove that
        $$\lim_{n \to \infty} \frac{10n^2}{n^2 + 16n + 1} = 10.$$
      curation:
        why: "An ε–N proof where the difference must be simplified and bounded — the standard exam-level drill."
  solution: |
    - id: mit20-mid-3a
      hints:
        - |
          Compute $\frac{10n^2}{n^2+16n+1} - 10$ over a common denominator before estimating anything.
        - |
          The difference is $\frac{-(160n+10)}{n^2+16n+1}$. Bound the numerator above and the denominator below by simple powers of $n$ to get something like $\frac{C}{n}$.
      solution: |
        **Proof.** For $n \in \mathbb{N}$,

        $$\frac{10n^2}{n^2+16n+1} - 10 = \frac{10n^2 - 10n^2 - 160n - 10}{n^2+16n+1} = -\frac{160n+10}{n^2+16n+1}.$$

        Since $160n + 10 \le 170n$ and $n^2 + 16n + 1 > n^2$, we get

        $$\left|\frac{10n^2}{n^2+16n+1} - 10\right| = \frac{160n+10}{n^2+16n+1} < \frac{170n}{n^2} = \frac{170}{n}.$$

        Let $\varepsilon > 0$ and, by the Archimedean property, choose $N \in \mathbb{N}$ with $N > 170/\varepsilon$. For $n \ge N$,

        $$\left|\frac{10n^2}{n^2+16n+1} - 10\right| < \frac{170}{n} \le \frac{170}{N} < \varepsilon.$$

        Hence the limit is $10$. $\blacksquare$

- id: mit20-mid-4a
  reason: "near-duplicate: mirror image of lebl-2.3.7"
  problem: |
    - id: mit20-mid-4a
      source:
        key: mit
        chapter: "Midterm Exam (October 16, 2020)"
        problemNumber: "Problem 4(a)"
        page: "8"
      topic: sequences
      subtopics: [limsup-liminf, bounded-sequences]
      skills: [tail-sup-argument, limit-of-inequality]
      concept: "subadditivity of limsup"
      title: Subadditivity of $\limsup$
      difficulty: easy
      category: canonical
      type: proof
      tags: [limsup, inequality, bounded-sequence, machinery, canonical]
      problemLatex: |
        Let $\{x_n\}$ and $\{y_n\}$ be bounded sequences of real numbers.

        (i) Prove that the sequence $\{x_n + y_n\}$ is bounded.

        (ii) Prove that
        $$\limsup_{n \to \infty} (x_n + y_n) \le \limsup_{n \to \infty} x_n + \limsup_{n \to \infty} y_n.$$
      curation:
        why: "Work with limsup as lim of tail sups: sup of a sum ≤ sum of sups, then take limits."
  solution: |
    - id: mit20-mid-4a
      hints:
        - |
          Part (i) is the triangle inequality. For (ii), work with the tail suprema $\sup_{k \ge n}$ before taking any limit.
        - |
          For each fixed $n$ and every $k \ge n$, compare $x_k + y_k$ with $\sup_{j\ge n} x_j + \sup_{j \ge n} y_j$. This number is an upper bound for the tail of $(x_k + y_k)$.
        - |
          Then let $n \to \infty$, using that limits preserve $\le$ and that the limit of a sum is the sum of the limits.
      solution: |
        **(i)** Choose $M_1, M_2$ with $|x_n| \le M_1$ and $|y_n| \le M_2$ for all $n$. Then $|x_n + y_n| \le |x_n| + |y_n| \le M_1 + M_2$ for all $n$, so $\{x_n + y_n\}$ is bounded.

        **(ii)** All the suprema below are finite by boundedness. Let

        $$a_n = \sup_{k \ge n} x_k,\qquad b_n = \sup_{k\ge n} y_k,\qquad c_n = \sup_{k\ge n}(x_k + y_k).$$

        Fix $n$. For every $k \ge n$ we have $x_k \le a_n$ and $y_k \le b_n$, so $x_k + y_k \le a_n + b_n$. Thus $a_n + b_n$ is an upper bound of $\{x_k + y_k : k \ge n\}$, and so $c_n \le a_n + b_n$.

        Each of $(a_n), (b_n), (c_n)$ is a decreasing bounded sequence, so it converges, and its limit is the corresponding $\limsup$. Since limits preserve non-strict inequalities, and the limit of a sum is the sum of the limits,

        $$\limsup_{n\to\infty}(x_n + y_n) = \lim c_n \le \lim (a_n + b_n) = \limsup_{n\to\infty} x_n + \limsup_{n\to\infty} y_n. \qquad \blacksquare$$

- id: mit20-final-4b
  reason: "near-duplicate: exactly part (b) of ross-28.4"
  problem: |
    - id: mit20-final-4b
      source:
        key: mit
        chapter: "Final Assignment (December 6, 2020)"
        problemNumber: "Problem 4(b)"
        page: "9"
      topic: differentiation
      subtopics: [derivative-definition]
      skills: [difference-quotient-estimate, squeeze]
      concept: "x² sin(1/x) is differentiable at 0"
      title: Differentiability of $x^2\sin(1/x)$ at 0
      difficulty: introductory
      category: canonical
      type: proof
      tags: [derivative, definition, x2-sin-1-over-x, squeeze]
      problemLatex: |
        Let
        $$f(x) = \begin{cases} x^2 \sin\left(\frac{1}{x}\right) & \text{if } x \neq 0, \\ 0 & \text{if } x = 0. \end{cases}$$
        Use the definition of the derivative to prove that $f$ is differentiable at $0$.
      curation:
        why: "The derivative straight from the limit of difference quotients, on the most important example in the subject."
  solution: |
    - id: mit20-final-4b
      hints:
        - |
          Write down the difference quotient $\frac{f(h) - f(0)}{h}$ for $h \ne 0$ and simplify it.
        - |
          The simplified quotient is $h$ times a bounded factor. Use $|\sin t| \le 1$ and the squeeze theorem.
      solution: |
        **Proof.** For $h \neq 0$,
        $$\frac{f(h) - f(0)}{h - 0} = \frac{h^2 \sin(1/h)}{h} = h \sin(1/h).$$
        Since $|\sin(1/h)| \le 1$, we have
        $$\left|\frac{f(h)-f(0)}{h} - 0\right| = |h|\,|\sin(1/h)| \le |h|.$$
        Given $\varepsilon > 0$, let $\delta = \varepsilon$. Then $0 < |h| < \delta$ implies $\left|\frac{f(h)-f(0)}{h}\right| < \varepsilon$. Hence
        $$f'(0) = \lim_{h\to 0}\frac{f(h)-f(0)}{h} = 0,$$
        so $f$ is differentiable at $0$ with $f'(0) = 0$. $\blacksquare$

- id: mit20-final-6a
  reason: "no technique: antiderivative and L'Hopital computation"
  problem: |
    - id: mit20-final-6a
      source:
        key: mit
        chapter: "Final Assignment (December 6, 2020)"
        problemNumber: "Problem 6(a)"
        page: "11"
      topic: integration
      subtopics: [improper-integrals]
      skills: [FTC, integration-by-parts, lhopital]
      concept: "improper integral ∫₀¹ x log x as a limit"
      title: The improper integral $\int_0^1 x\log x\,dx$
      difficulty: easy
      category: canonical
      type: computation
      tags: [improper-integral, FTC, L-Hopital, computation]
      problemLatex: |
        Compute
        $$\int_0^1 x \log x \, dx := \lim_{a \to 0^+} \int_a^1 x \log x \, dx.$$
        You may use without proof the following version of **L'Hôpital's rule**: if $f, g \colon (0, 1) \to \mathbb{R}$, $g(x) \neq 0$ for all $x$, $f(x) \to -\infty$, $g(x) \to \infty$ as $x \to 0^+$, and $L = \lim_{x \to 0^+} f'(x)/g'(x)$ exists, then $\lim_{x \to 0^+} f(x)/g(x) = L$.
      curation:
        why: "An improper integral treated honestly as a limit of proper integrals."
  solution: |
    - id: mit20-final-6a
      hints:
        - |
          First compute $\int_a^1 x\log x\,dx$ for fixed $a \in (0,1)$, then send $a \to 0^+$. Integrate by parts, differentiating $\log x$ and integrating $x$.
        - |
          After integrating, you will need $\lim_{a\to 0^+} a^2 \log a$. To use the given L'Hôpital rule, write it as a quotient $\frac{\log a}{a^{-2}}$ of a function tending to $-\infty$ by one tending to $+\infty$.
      solution: |
        **Answer:** $-\tfrac14$.

        On $(0,\infty)$ let $G(x) = \frac{x^2}{2}\log x - \frac{x^2}{4}$. Then
        $$G'(x) = x\log x + \frac{x^2}{2}\cdot\frac1x - \frac{x}{2} = x\log x.$$
        For $0 < a < 1$, the function $x\log x$ is continuous on $[a,1]$, so by the fundamental theorem of calculus
        $$\int_a^1 x\log x\,dx = G(1) - G(a) = -\frac14 - \frac{a^2}{2}\log a + \frac{a^2}{4}.$$
        (This $G$ is exactly what integration by parts with $u = \log x$, $dv = x\,dx$ produces.)

        Next we show $a^2\log a \to 0$ as $a \to 0^+$. Write $a^2 \log a = \frac{f(a)}{g(a)}$ with $f(a) = \log a$ and $g(a) = a^{-2}$ on $(0,1)$. Here $g(a) \ne 0$, $f(a) \to -\infty$ and $g(a) \to +\infty$ as $a \to 0^+$, and
        $$\frac{f'(a)}{g'(a)} = \frac{1/a}{-2a^{-3}} = -\frac{a^2}{2} \to 0.$$
        By the stated L'Hôpital rule, $a^2 \log a \to 0$. Also $a^2/4 \to 0$. Therefore
        $$\int_0^1 x\log x\,dx = \lim_{a\to 0^+}\Bigl(-\frac14 - \frac{a^2}{2}\log a + \frac{a^2}{4}\Bigr) = -\frac14.$$

- id: mit20-final-6b
  reason: "no technique: one-line bound; abbott-7.4.10 is the version with technique"
  problem: |
    - id: mit20-final-6b
      source:
        key: mit
        chapter: "Final Assignment (December 6, 2020)"
        problemNumber: "Problem 6(b)"
        page: "12"
      topic: integration
      subtopics: [integral-inequalities]
      skills: [integral-estimate, squeeze]
      concept: "lim ∫₀¹ xⁿ sin x dx = 0 by direct estimate"
      title: $\int_0^1 x^n \sin x\,dx$ tends to 0
      difficulty: introductory
      category: canonical
      type: proof
      tags: [Riemann-integration, estimate, limits-of-integrals]
      problemLatex: |
        Prove
        $$\lim_{n \to \infty} \int_0^1 x^n \sin(x)\,dx = 0.$$
      curation:
        why: "Estimating an integral (|∫| ≤ ∫ xⁿ = 1/(n+1)) instead of computing it; contrast with the non-uniform convergence of xⁿ."
  solution: |
    - id: mit20-final-6b
      hints:
        - |
          You do not need to compute the integral. It is enough to trap it between $0$ and something that tends to $0$.
        - |
          On $[0,1]$ you have $0 \le \sin x \le 1$. Compare $x^n \sin x$ with $x^n$ and use monotonicity of the integral.
      solution: |
        For $x \in [0,1]$ we have $0 \le \sin x \le 1$ (since $0 \le x \le 1 < \pi$) and $x^n \ge 0$, so
        $$0 \le x^n \sin x \le x^n \qquad (0 \le x \le 1).$$
        All three functions are continuous, hence integrable, and monotonicity of the integral gives
        $$0 \le \int_0^1 x^n \sin x\,dx \le \int_0^1 x^n\,dx = \frac{1}{n+1},$$
        where the last integral is computed with the fundamental theorem of calculus, $\frac{d}{dx}\frac{x^{n+1}}{n+1} = x^n$.

        Since $\frac{1}{n+1} \to 0$, the squeeze theorem gives $\displaystyle\lim_{n\to\infty}\int_0^1 x^n \sin x\,dx = 0$. $\blacksquare$

- id: mit20-final-7a
  reason: "near-duplicate: covered by abbott-6.2.1 and lebl-6.1.2"
  problem: |
    - id: mit20-final-7a
      source:
        key: mit
        chapter: "Final Assignment (December 6, 2020)"
        problemNumber: "Problem 7(a)"
        page: "14"
      topic: function-sequences
      subtopics: [pointwise-convergence, uniform-convergence]
      skills: [construct-counterexample]
      concept: "pointwise but not uniform convergence to a continuous limit"
      title: Pointwise but not uniform convergence to a continuous limit
      difficulty: introductory
      category: canonical
      type: counterexample
      tags: [uniform-convergence, pointwise-convergence, counterexample]
      problemLatex: |
        Give an explicit example of a sequence of continuous functions on $(0, 1)$ that converges pointwise to a continuous function on $(0, 1)$ but the convergence is not uniform. Explanation, but not a formal proof, is required. Feel free to use pictures.
      curation:
        why: "Shows that a continuous limit does not imply uniform convergence (the ‘moving bump’ / xⁿ examples)."
  solution: |
    - id: mit20-final-7a
      hints:
        - |
          Uniform convergence fails exactly when, for every $n$, some point of the domain still has $|f_n(x) - f(x)|$ not small. On an open interval you can push such points toward an endpoint.
        - |
          Recall a familiar sequence of continuous functions on $[0,1]$ whose pointwise limit jumps at $x = 1$. What happens to its pointwise limit when you delete the endpoint and work on $(0,1)$ only?
        - |
          For each $n$, find a point $x_n \in (0,1)$, close to $1$, where $|f_n(x_n) - f(x_n)|$ is still at least a fixed amount such as $\tfrac12$.
      solution: |
        **Example.** $f_n(x) = x^n$ on $(0,1)$.

        *Pointwise limit.* For each fixed $x \in (0,1)$ we have $x^n \to 0$, so $f_n \to f$ pointwise, where $f \equiv 0$. The limit is continuous (it is constant), and every $f_n$ is continuous.

        *Not uniform.* Picture the graphs: each $x^n$ is a curve that hugs $0$ for most of the interval but rises steeply to height (almost) $1$ near the right endpoint. As $n$ grows the rise moves closer to $x = 1$, but it never disappears, because $x = 1$ is not in the domain. Concretely, $x_n = 2^{-1/n} \in (0,1)$ satisfies
        $$|f_n(x_n) - f(x_n)| = x_n^n = \tfrac12 ,$$
        so $\sup_{x\in(0,1)} |f_n(x) - f(x)| \ge \tfrac12$ for every $n$ (in fact the supremum is $1$). Hence no single $N$ makes $|f_n(x) - 0| < \tfrac12$ for all $x$ at once, and the convergence is not uniform.

- id: mit20-mid-4b
  reason: "near-duplicate: one instance of rudin-2.17's \"is E perfect?\" (every point a limit point); limit points are covered by six other canonical problems"
  problem: |
    - id: mit20-mid-4b
      source:
        key: mit
        chapter: "Midterm Exam (October 16, 2020)"
        problemNumber: "Problem 4(b)"
        page: "9"
      topic: topology
      subtopics: [limit-points]
      skills: [construct-sequence, decimal-expansions]
      concept: "cluster point of a digit-restricted set"
      title: $0.111\ldots$ is a cluster point of a digit-restricted set
      difficulty: easy
      category: canonical
      type: proof
      tags: [cluster-point, decimal-representation, sequence]
      problemLatex: |
        Let $E$ denote the set of all real numbers in $(0, 1)$ with decimal expansion involving only 1's and 2's:
        $$E = \{x \in (0, 1) : \forall j \in \mathbb{N},\ \exists d_{-j} \in \{1, 2\}, \text{ such that } x = 0.d_{-1}d_{-2}\ldots\}.$$
        Note that $0.2 \notin E$ but $0.222222\ldots \in E$. Prove that $0.1111111\ldots$ is a cluster point of $E$.
      curation:
        why: "Constructing points of a set that approach a given point, with an honest estimate on the distance."
  solution: |
    - id: mit20-mid-4b
      hints:
        - |
          You need points of $E$, different from $0.111\ldots$, arbitrarily close to it. Which elements of $E$ agree with $0.111\ldots$ in many leading digits?
        - |
          Consider $x_n = 0.\underbrace{11\ldots1}_{n}222\ldots$ and compute $x_n - 0.111\ldots$ as a geometric series.
      solution: |
        Let $x = 0.111\ldots = \sum_{j=1}^\infty 10^{-j} = \tfrac19$. For $n \in \mathbb{N}$ let $x_n$ be the number whose first $n$ decimal digits are $1$ and all later digits are $2$:
        $$x_n = \sum_{j=1}^n 10^{-j} + \sum_{j=n+1}^\infty 2\cdot 10^{-j}.$$
        Its decimal expansion uses only the digits $1$ and $2$, and $0 < x_n < 1$ (since $x_n \le \sum_j 2\cdot 10^{-j} = \tfrac29$), so $x_n \in E$. Moreover
        $$x_n - x = \sum_{j=n+1}^\infty 10^{-j} = \frac{10^{-(n+1)}}{1 - 1/10} = \frac{10^{-n}}{9} > 0,$$
        so $x_n \ne x$ and $|x_n - x| = 10^{-n}/9$.

        Now let $\epsilon > 0$. Choose $n$ with $10^{-n} < 9\epsilon$ (possible since $10^{-n} \le 1/n \to 0$). Then $x_n \in (x-\epsilon, x+\epsilon) \cap E \setminus \{x\}$. As $\epsilon$ was arbitrary, $0.111\ldots$ is a cluster point of $E$.

- id: lebl-3.4.3
  reason: "near-duplicate: ross-19.2(c) has the same estimate for 1/x"
  problem: |
    - id: lebl-3.4.3
      source:
        key: lebl
        chapter: 3 Continuous Functions
        section: 3.4 Uniform continuity
        problemNumber: Exercise 3.4.3
        page: '143'
      assignedIn:
      - MIT 18.100A (Fall 2020) Assignment 9, Problem 2
      topic: continuity
      subtopics:
      - lipschitz-holder
      skills:
      - algebraic-estimate
      concept: 1/x is Lipschitz on (c, infinity) for c > 0
      title: '$1/x$ is Lipschitz on $(c, \infty)$'
      difficulty: introductory
      category: canonical
      type: proof
      tags:
      - Lipschitz
      - 1-over-x
      - estimate
      problemLatex: |
        Show that $f\colon (c, \infty) \to \mathbb{R}$ for some $c > 0$ and defined by $f(x) := 1/x$ is Lipschitz continuous.
      notes: 'Topic matches MIT reading (3.3, 3.4, 3.5): consistent. Pairs naturally with Exercise 3.4.4 (not Lipschitz on (0,∞)).'
      curation:
        why: Lipschitz estimate |1/x - 1/y| = |x-y|/(xy) with xy bounded below.
  solution: |
    - id: lebl-3.4.3
      hints:
        - |
          Put $\frac1x - \frac1y$ over a common denominator.
        - |
          You get $|x - y|$ divided by $xy$. On $(c,\infty)$, how small can $xy$ be?
      solution: |
        **Proof.** For $x, y \in (c, \infty)$,
        $$\left|\frac1x - \frac1y\right| = \frac{|y - x|}{xy}.$$
        Since $x > c > 0$ and $y > c > 0$, we have $xy > c^2$, so
        $$\left|\frac1x - \frac1y\right| \le \frac{1}{c^2}\,|x - y|.$$
        Thus $f$ is Lipschitz continuous on $(c,\infty)$ with constant $L = 1/c^2$. $\blacksquare$

        (The constant blows up as $c \to 0$. This matches the fact that $1/x$ is not Lipschitz on $(0,\infty)$.)

- id: lebl-3.3.14
  reason: "near-duplicate: abbott-4.4.8(a) is the same compactness argument without assuming injectivity"
  problem: |
    - id: lebl-3.3.14
      source:
        key: lebl
        chapter: 3 Continuous Functions
        section: 3.3 Extreme and intermediate value theorems
        problemNumber: Exercise 3.3.14
        page: '137'
      topic: continuity
      subtopics:
      - EVT
      - continuity-and-topology
      skills:
      - contradiction
      - EVT-application
      concept: no continuous bijection [0,1] -> (0,1)
      title: No continuous bijection from $[0,1]$ to $(0,1)$
      difficulty: easy
      category: canonical
      type: proof
      tags:
      - EVT
      - bijection
      - compactness
      - contradiction
      problemLatex: |
        Suppose $f\colon [0,1] \to (0,1)$ is a bijection. Prove that $f$ is not continuous.
      curation:
        why: A one-line consequence of the EVT (and compactness) that rules out a continuous bijection [0,1] → (0,1).
  solution: |
    - id: lebl-3.3.14
      hints:
        - |
          Suppose $f$ were continuous. What does the Extreme Value Theorem say about $f$ on $[0,1]$?
        - |
          A maximum value $M$ of $f$ would be a number in $(0,1)$. Use surjectivity onto $(0,1)$ to find a value of $f$ that is larger.
      solution: |
        **Proof.** Suppose, for contradiction, that $f$ is continuous. By the Extreme Value Theorem, $f$ attains an absolute maximum on $[0,1]$: there is $x_0$ with $f(x) \le M := f(x_0)$ for all $x \in [0,1]$. Since $f$ maps into $(0,1)$, $M < 1$, so $\frac{M+1}{2} \in (0,1)$. Because $f$ is onto $(0,1)$, there is $x_1 \in [0,1]$ with $f(x_1) = \frac{M+1}{2} > M$, contradicting maximality. Hence $f$ is not continuous. $\blacksquare$

        (Only surjectivity was used. Injectivity is not needed.)

- id: lebl-1.2.7
  reason: "near-duplicate: abbott-2.4.6(a) asks for AM-GM and then uses it"
  problem: |
    - id: lebl-1.2.7
      source:
        key: lebl
        chapter: 1 Real Numbers
        section: 1.2 The set of real numbers
        problemNumber: Exercise 1.2.7
        page: '34'
      assignedIn:
      - MIT 18.100A (Fall 2020) Assignment 2, Problem 5
      topic: real-numbers
      subtopics:
      - inequalities
      skills:
      - algebraic-manipulation
      - squares-nonnegative
      concept: AM-GM inequality for two numbers
      title: The AM-GM inequality for two numbers
      difficulty: introductory
      category: canonical
      type: proof
      tags:
      - AM-GM
      - inequality
      problemLatex: |
        Prove the arithmetic-geometric mean inequality. For two positive real numbers $x, y$,
        $$\sqrt{xy} \leq \frac{x+y}{2}.$$
        Furthermore, equality occurs if and only if $x = y$.
      notes: Topically consistent with the MIT reading (1.2).
      curation:
        why: Basic real inequality manipulation including the equality case.
  solution: |
    - id: lebl-1.2.7
      hints:
        - |
          Both sides are positive, so it suffices to compare squares. Which expression that is obviously $\ge 0$ could produce $x + y - 2\sqrt{xy}$ or $(x+y)^2 - 4xy$?
        - |
          Consider $(x - y)^2 \ge 0$ and rewrite it in terms of $(x+y)^2$ and $xy$.
        - |
          For the equality case, track exactly when each step is an equality; the only non-equality step is $(x-y)^2 \ge 0$.
      solution: |
        Let $x, y > 0$. Then
        $$(x+y)^2 - 4xy = x^2 - 2xy + y^2 = (x - y)^2 \ge 0,$$
        so $4xy \le (x+y)^2$, i.e. $xy \le \left(\frac{x+y}{2}\right)^2$. Both $\sqrt{xy}$ and $\frac{x+y}{2}$ are positive, and for nonnegative $u, v$ we have $u \le v$ if and only if $u^2 \le v^2$ (if $u > v \ge 0$ then $u^2 > uv \ge v^2$; conversely $u \le v$ gives $u^2 \le uv \le v^2$). Applying this with $u = \sqrt{xy}$, $v = \frac{x+y}{2}$, we get
        $$\sqrt{xy} \le \frac{x+y}{2}.$$

        **Equality.** By the same equivalence (for nonnegative $u,v$, $u = v$ iff $u^2 = v^2$), equality $\sqrt{xy} = \frac{x+y}{2}$ holds iff $xy = \frac{(x+y)^2}{4}$, iff $(x+y)^2 - 4xy = 0$, iff $(x - y)^2 = 0$, iff $x = y$. $\blacksquare$


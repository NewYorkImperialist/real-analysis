      problemLatex: |
        Let $f(x) = x^2 \sin(\frac1x) + \frac{x}{2}$ for $x \neq 0$ and $f(0) = 0$.

        (a) Show $f'(0) > 0$; see Exercise 28.4.

        (b) Show $f$ is not increasing on any open interval containing 0.

        (c) Compare this example with Corollary 29.7(i).

        *(Corollary 29.7(i): Let $f$ be a differentiable function on an interval $(a, b)$. Then $f$ is strictly increasing if $f'(x) > 0$ for all $x \in (a, b)$.)*
      notes: Verified against page image. Corollary 29.7 stem and part (i) quoted verbatim (assembled). Exercise 28.4 is x^2 sin(1/x) (ross-28.4). Ross's 'increasing' means non-decreasing (Definition 29.6). No book hint.

    problemLatex: |
      Consider the letter T.

      (a) Prove that there is no way to place uncountably many copies of the letter T disjointly in the plane. [Hint: First prove this when the unit square replaces the plane.]

      (b) Prove that there is no way to place uncountably many homeomorphic copies of the letter T disjointly in the plane.

      (c) For which other letters of the alphabet is this true?

      (d) Let $U$ be a set in $\mathbb{R}^3$ formed like an umbrella: It is a disc with a perpendicular segment attached to its center. Prove that uncountably many copies of $U$ cannot be placed disjointly in $\mathbb{R}^3$.

      (e) What if the perpendicular segment is attached to the boundary of the disc?

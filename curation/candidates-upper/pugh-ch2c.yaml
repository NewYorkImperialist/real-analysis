    problemLatex: |
      Let $M$ be an uncountable compact metric space.

      (a) Prove that $M$ contains a homeomorphic copy of the Cantor set. [Hint: Imitate the construction of the standard Cantor set $C$.]

      (b) Infer that Cantor sets are ubiquitous. There is a continuous surjection $\sigma : C \to M$ and there is a continuous injection $i : C \to M$.

      (c) Infer that every uncountable closed set $S \subset \mathbb{R}$ has $\#S = \#\mathbb{R}$, and hence that the Continuum Hypothesis is valid for closed sets in $\mathbb{R}$. [Hint: Cupcake and Exercise 112.]

      (d) Is the same true if $M$ is separable, uncountable, and complete?

      *(Theorem 70, Cantor Surjection Theorem: Given a compact nonempty metric space $M$, there is a continuous surjection of $C$ onto $M$.)*
      *(Exercise 112: Prove that $\#C = \#\mathbb{R}$.)*
      *(Cupcake Theorem, Exercise 150: Let $M$ be a complete, separable metric space such as $\mathbb{R}^m$. Each closed set $K \subset M$ can be expressed uniquely as the disjoint union of a countable set and a perfect closed set.)*

    problemLatex: |
      Start with a set $S \subset \mathbb{R}$ and successively take its closure, the complement of its closure, the closure of that, and so on: $S$, $\operatorname{cl}(S)$, $(\operatorname{cl}(S))^c, \ldots$. Do the same to $S^c$. In total, how many distinct subsets of $\mathbb{R}$ can be produced this way? In particular decide whether each chain $S, \operatorname{cl}(S), \ldots$ consists of only finitely many sets. For example, if $S = \mathbb{Q}$ then we get $\mathbb{Q}, \mathbb{R}, \emptyset, \emptyset, \mathbb{R}, \mathbb{R}, \ldots$ and $\mathbb{Q}^c, \mathbb{R}, \emptyset, \emptyset, \mathbb{R}, \mathbb{R}, \ldots$ for a total of four sets.
    transcriptionNotes: "Verbatim; double-starred in the book. 'How many' is to be read as the maximum over S (the answer depends on S)."


    problemLatex: |
      Let $M$ be a complete, separable metric space such as $\mathbb{R}^m$. Prove the **Cupcake Theorem**: Each closed set $K \subset M$ can be expressed uniquely as the disjoint union of a countable set and a perfect closed set,
      $$C \sqcup P = K.$$

      *(Book definition: A metric space $M$ is perfect if $M' = M$, i.e., each $p \in M$ is a cluster point of $M$ — each $r$-neighborhood $M_r p$ contains infinitely many points of $M$. A metric space is separable if it contains a countable dense subset.)*
    transcriptionNotes: "Verbatim; double-starred. Definitions of perfect (Ch. 2 'Perfect Metric Spaces') and separable (Exercise 127) quoted from the book. Overlaps pugh-2.137 (ch2b), which is essentially the uniqueness lemma; the curator should pick one (150 is the fuller result) or pair them."


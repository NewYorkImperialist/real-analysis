    closestExisting: [ross-25.11, abbott-6.2.12, abbott-3.3.7]
    machinery: "Weierstrass M-test for continuity of a series, ternary/binary expansions, the Cantor set."
    standardResult: "Schoenberg space-filling curve: continuous map of [0,1] (even of the Cantor set) onto the unit square"
    topic: function-sequences
    subtopics: [series-of-functions, weierstrass-m-test, cantor-set]
    skills: [M-test, digit-expansion-coding, construction-verification]
    difficulty: hard
    difficultyRationale: "Continuity is an M-test; the substance is verifying f(3^k t_0)=a_k from the ternary expansion and periodicity — a genuine construction, made tractable by the hint."
    category: challenge
    type: construction
    tags: [space-filling-curve, Cantor-set, M-test, uniform-convergence, pathological, construction]
    references: []
    problemLatex: |
      Let $f$ be a continuous real function on $R^1$ with the following properties: $0 \le f(t) \le 1$, $f(t+2) = f(t)$ for every $t$, and
      $$f(t) = \begin{cases} 0 & (0 \le t \le \tfrac{1}{3}) \\ 1 & (\tfrac{2}{3} \le t \le 1). \end{cases}$$
      Put $\Phi(t) = (x(t), y(t))$, where
      $$x(t) = \sum_{n=1}^{\infty} 2^{-n} f(3^{2n-1} t), \qquad y(t) = \sum_{n=1}^{\infty} 2^{-n} f(3^{2n} t).$$
      Prove that $\Phi$ is *continuous* and that $\Phi$ maps $I = [0,1]$ *onto* the unit square $I^2 \subset R^2$. In fact, show that $\Phi$ maps the Cantor set onto $I^2$.

      *Hint:* Each $(x_0, y_0) \in I^2$ has the form
      $$x_0 = \sum_{n=1}^{\infty} 2^{-n} a_{2n-1}, \qquad y_0 = \sum_{n=1}^{\infty} 2^{-n} a_{2n}$$
      where each $a_i$ is 0 or 1. If
      $$t_0 = \sum_{i=1}^{\infty} 3^{-i-1}(2a_i)$$
      show that $f(3^k t_0) = a_k$, and hence that $x(t_0) = x_0$, $y(t_0) = y_0$.

      (This simple example of a so-called "space-filling curve" is due to I. J. Schoenberg, Bull. A.M.S., vol. 44, 1938, pp. 519.)
    transcriptionNotes: "Transcribed from the page image. The book prints 'If fact' (typo) — corrected to 'In fact'. The exponent in t_0 is printed as 3^{-i-1}, transcribed exactly as printed. Output is in R^2 but continuity is coordinatewise, so it stays within single-variable/metric-space analysis."


    tags: [metric-completion, isometry, Kuratowski-embedding, sup-norm, complete-metric-space]
    references: ["Definition 7.14 (C(X) and sup norm, quoted)", "Theorem 7.15 (C(X) is complete, quoted)"]
    problemLatex: |
      Let $X$ be a metric space, with metric $d$. Fix a point $a \in X$. Assign to each $p \in X$ the function $f_p$ defined by
      $$f_p(x) = d(x,p) - d(x,a) \qquad (x \in X).$$
      Prove that $|f_p(x)| \le d(a,p)$ for all $x \in X$, and that therefore $f_p \in \mathscr{C}(X)$.

      Prove that
      $$\|f_p - f_q\| = d(p,q)$$
      for all $p, q \in X$.

      If $\Phi(p) = f_p$ it follows that $\Phi$ is an *isometry* (a distance-preserving mapping) of $X$ onto $\Phi(X) \subset \mathscr{C}(X)$.

      Let $Y$ be the closure of $\Phi(X)$ in $\mathscr{C}(X)$. Show that $Y$ is complete.

      *Conclusion: $X$ is isometric to a dense subset of a complete metric space $Y$.*

      *(Definition 7.14: If $X$ is a metric space, $\mathscr{C}(X)$ will denote the set of all complex-valued, continuous, bounded functions with domain $X$. ... We associate with each $f \in \mathscr{C}(X)$ its supremum norm $\|f\| = \sup_{x\in X} |f(x)|$. Theorem 7.15: The above metric [$\|f-g\|$] makes $\mathscr{C}(X)$ into a complete metric space.)*
    transcriptionNotes: "Transcribed from the page image. The book's closing parenthetical '(Exercise 24, Chap. 3 contains a different proof of this.)' is omitted as a cross-reference. Definition 7.14 and Theorem 7.15 quoted verbatim from printed pp. 150-151 (with an ellipsis and a bracketed clarification), marked as quoted. Note that with Theorem 7.15 available, completeness of Y is immediate; the substance is the isometry."

  - cid: rudin-7.25
    chapter: "7 Sequences and Series of Functions"
    section: "Exercises"
    number: "Exercise 7.25"
    page: "170"
    pdfPage: 179
    verdict: strong
    tier: upper
    newExperience: "A guided proof of the Peano existence theorem: Euler polygons, equicontinuity, Arzelà–Ascoli extraction, and uniform continuity to pass to the limit in an integral equation — a long proof chain combining four tools."
    closestExisting: [abbott-6.2.15, ross-29.18, lebl-7.6.11]
    machinery: "Arzelà–Ascoli, uniform continuity on compact rectangles, interchange of uniform limit and integral, fundamental theorem of calculus."
    standardResult: "Peano existence theorem for y' = φ(x,y) via Euler polygons and Arzelà–Ascoli"
    topic: function-sequences
    subtopics: [uniform-convergence, interchange-integral, approximation]
    skills: [arzela-ascoli-extraction, uniform-continuity-estimate, integral-equation, epsilon-management]
    difficulty: hard
    difficultyRationale: "Step-by-step guidance is given, but verifying (a)-(f) requires Arzelà–Ascoli, a uniform-continuity estimate for Δ_n, and passing the limit through the integral; a long synthesis chain."
    category: synthesis
    type: proof
    tags: [Peano-existence, ODE, Arzela-Ascoli, equicontinuity, uniform-convergence, Euler-polygon, long-proof-chain]
    references: ["Exercise 27, Chap. 5 (cross-reference only, not needed)"]
    problemLatex: |
      Suppose $\phi$ is a continuous bounded real function in the strip defined by $0 \le x \le 1$, $-\infty < y < \infty$. Prove that the initial-value problem
      $$y' = \phi(x, y), \qquad y(0) = c$$
      has a solution. (Note that the hypotheses of this existence theorem are less stringent than those of the corresponding uniqueness theorem; see Exercise 27, Chap. 5.)

      *Hint:* Fix $n$. For $i = 0, \ldots, n$, put $x_i = i/n$. Let $f_n$ be a continuous function on $[0,1]$ such that $f_n(0) = c$,
      $$f_n'(t) = \phi(x_i, f_n(x_i)) \qquad \text{if } x_i < t < x_{i+1},$$
      and put
      $$\Delta_n(t) = f_n'(t) - \phi(t, f_n(t)),$$
      except at the points $x_i$, where $\Delta_n(t) = 0$. Then
      $$f_n(x) = c + \int_0^x [\phi(t, f_n(t)) + \Delta_n(t)]\,dt.$$
      Choose $M < \infty$ so that $|\phi| \le M$. Verify the following assertions.

      (a) $|f_n'| \le M$, $|\Delta_n| \le 2M$, $\Delta_n \in \mathscr{R}$, and $|f_n| \le |c| + M = M_1$, say, on $[0,1]$, for all $n$.

      (b) $\{f_n\}$ is equicontinuous on $[0,1]$, since $|f_n'| \le M$.

      (c) Some $\{f_{n_k}\}$ converges to some $f$, uniformly on $[0,1]$.

      (d) Since $\phi$ is uniformly continuous on the rectangle $0 \le x \le 1$, $|y| \le M_1$,
      $$\phi(t, f_{n_k}(t)) \to \phi(t, f(t))$$
      uniformly on $[0,1]$.

      (e) $\Delta_n(t) \to 0$ uniformly on $[0,1]$, since
      $$\Delta_n(t) = \phi(x_i, f_n(x_i)) - \phi(t, f_n(t))$$
      in $(x_i, x_{i+1})$.

      (f) Hence
      $$f(x) = c + \int_0^x \phi(t, f(t))\,dt.$$
      This $f$ is a solution of the given problem.
    transcriptionNotes: "Transcribed from the page images (printed pp. 170-171). The hint is Rudin's own. $\\mathscr{R}$ denotes the Riemann-integrable functions. Step (c) implicitly uses Arzelà–Ascoli (Rudin's Theorem 7.25). φ is a function of two variables only through continuity on a rectangle; no multivariable calculus is needed. Exercise 7.26 (vector-valued version) skipped."


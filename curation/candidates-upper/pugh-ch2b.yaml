  - cid: pugh-2.147
    chapter: "2 A Taste of Topology"
    section: "Exercises"
    number: "Exercise 147"
    page: "144"
    pdfPage: 155
    verdict: strong
    tier: upper
    newExperience: "Topology of a space whose points are sets: the Hausdorff metric, density of finite sets, and compactness of the hyperspace (Blaschke-type selection) — a long multi-part chain."
    closestExisting: [lebl-7.1.8, lebl-7.4.12]
    machinery: "Metric axioms with infima, total boundedness / sequential compactness, epsilon-nets, connectedness."
    standardResult: "Hausdorff metric on nonempty compact subsets; finite sets dense; hyperspace of a compact space is compact"
    topic: topology
    subtopics: [metric-spaces, compactness, connectedness]
    skills: [epsilon-net, verify-metric-axioms, total-boundedness, subsequence-extraction]
    difficulty: hard
    difficultyRationale: "(a),(b) are medium; (c) compactness of the hyperspace is a substantial argument (hardest essential part); (e) is double-starred and optional."
    category: challenge
    type: proof
    tags: [Hausdorff-metric, hyperspace, compactness, total-boundedness, connectedness, metric-space]
    references: []
    problemLatex: |
      Let $M$ be a metric space and let $\mathcal{K}$ denote the class of nonempty compact subsets of $M$. The $r$-neighborhood of $A \in \mathcal{K}$ is
      $$M_r A = \{x \in M : \exists a \in A \text{ and } d(x,a) < r\} = \bigcup_{a \in A} M_r a.$$
      For $A, B \in \mathcal{K}$ define
      $$D(A,B) = \inf\{r > 0 : A \subset M_r B \text{ and } B \subset M_r A\}.$$

      (a) Show that $D$ is a metric on $\mathcal{K}$. (It is called the **Hausdorff metric** and $\mathcal{K}$ is called the **hyperspace** of $M$.)

      (b) Denote by $\mathcal{F}$ the collection of finite nonempty subsets of $M$ and prove that $\mathcal{F}$ is dense in $\mathcal{K}$. That is, given $A \in \mathcal{K}$ and given $\epsilon > 0$ show there exists $F \in \mathcal{F}$ such that $D(A,F) < \epsilon$.

      *(c) If $M$ is compact prove that $\mathcal{K}$ is compact.

      (d) If $M$ is connected prove that $\mathcal{K}$ is connected.

      **(e) If $M$ is path-connected is $\mathcal{K}$ path-connected?

      (f) Do homeomorphic metric spaces have homeomorphic hyperspaces?

      **Remark** The converse to (f), $\mathcal{K}(M) \cong \mathcal{K}(N) \Rightarrow M \cong N$ is false. The hyperspace of every Peano space is the Hilbert cube. This is a difficult result but a good place to begin reading about hyperspaces is Sam Nadler's book *Continuum Theory*.
    transcriptionNotes: "Verbatim; (c) starred, (e) double-starred in the book. The curator may wish to trim to (a)-(d). Closest bank item lebl-7.1.8 only does the pseudometric on bounded sets."


    closestExisting: [ross-21.5, ross-18.4, lebl-7.4.10]
    machinery: "Sequential compactness, construction of continuous functions from the metric, disjoint neighborhoods of a non-clustering sequence."
    standardResult: "M compact iff every continuous real function is bounded / attains max / has compact range iff nested closed sets have nonempty intersection (metric space)"
    topic: topology
    subtopics: [compactness, sequential-compactness, continuity-and-topology]
    skills: [contrapositive, construct-counterexample, bump-function-construction]
    difficulty: hard
    difficultyRationale: "Even with the hint, choosing radii and spike parameters so f is continuous and unbounded (or bounded without max) is a substantial construction; (d) needs its own argument."
    category: synthesis
    type: proof
    tags: [compactness, equivalent-definitions, continuous-functions, construction, metric-space, counterexample]
    references: ["Theorems 63 and 65 (mentioned only in a remark; not needed for the statement)"]
    problemLatex: |
      The implications of compactness are frequently equivalent to it. Prove

      (a) If every continuous function $f\colon M \to \mathbb{R}$ is bounded then $M$ is compact.

      (b) If every continuous bounded function $f\colon M \to \mathbb{R}$ achieves a maximum or minimum then $M$ is compact.

      (c) If every continuous function $f\colon M \to \mathbb{R}$ has compact range $fM$ then $M$ is compact.

      (d) If every nested decreasing sequence of nonempty closed subsets of $M$ has nonempty intersection then $M$ is compact.

      Together with Theorems 63 and 65, (a)–(d) give seven equivalent definitions of compactness. [Hint: Reason contrapositively. If $M$ is not compact then it contains a sequence $(p_n)$ that has no convergent subsequence. It is fair to assume that the points $p_n$ are distinct. Find radii $r_n > 0$ such that the neighborhoods $M_{r_n}(p_n)$ are disjoint and no sequence $q_n \in M_{r_n}(p_n)$ has a convergent subsequence. Using the metric define a function $f_n\colon M_{r_n}(p_n) \to \mathbb{R}$ with a spike at $p_n$, such as
      $$f_n(x) = \frac{r_n - d(x, p_n)}{a_n + d(x, p_n)}$$
      where $a_n > 0$. Set $f(x) = f_n(x)$ if $x \in M_{r_n}(p_n)$, and $f(x) = 0$ if $x$ belongs to no $M_{r_n}(p_n)$. Show that $f$ is continuous. With the right choice of $a_n$ show that $f$ is unbounded. With a different choice of $a_n$, it is bounded but achieves no maximum, and so on.]
    transcriptionNotes: "Starred in the book. Verbatim including the book's in-exercise hint. M is a metric space; Pugh's 'compact' means sequentially compact (every sequence has a subsequence converging in M), and M_r(p) is the r-neighborhood of p. Spans PDF pp. 149-150."


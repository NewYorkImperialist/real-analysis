      (b) Conversely, prove that if $f\circ\psi$ is Riemann integrable for each Riemann integrable $f$ on $[a,b]$, then the critical points of $\psi$ form a zero set. [Hint: Think in terms of Exercise 34.]

      (c) Prove (a) and (b) under the weaker assumption that $\psi$ is continuously differentiable except at finitely many points of $[c,d]$.

      (d) Derive part (a) of Exercise 35 from (c).

      (e) Weaken the assumption further to $\psi$ being continuously differentiable on an open subset of $[c,d]$ whose complement is a zero set.

      *(From the text: a set $Z\subset\mathbb{R}$ is a **zero set** if for each $\epsilon>0$ there is a countable covering of $Z$ by open intervals $(a_i,b_i)$ with $\sum b_i - a_i \le \epsilon$. **Riemann–Lebesgue Theorem:** $f\colon[a,b]\to\mathbb{R}$ is Riemann integrable if and only if it is bounded and its set of discontinuity points is a zero set. A **critical point** of $\psi$ is an $x$ with $\psi'(x)=0$. Exercise 34(a): the set of critical values of a continuously differentiable $\psi\colon[a,b]\to\mathbb{R}$ is a zero set. Exercise 35: let $F\subset[0,1]$ be the fat Cantor set obtained by removing from $[0,1]$ the middle interval of length $1/4$, then from each of the remaining two intervals the middle interval of length $1/16$, then from each of the remaining four the middle interval of length $1/64$, and so on; define $\psi(x) = \int_0^x \operatorname{dist}(t,F)\,dt$; (a) Why is $\psi$ a continuously differentiable homeomorphism from $[0,1]$ onto $[0,L]$ where $L = \psi(1)$?)*
    transcriptionNotes: "Checked against the page image. Quoted for self-containedness: the zero-set definition, Theorem 23, the critical-point definition and Exercise 34(a), and the fat Cantor set construction (Exercise 31) with Exercise 35(a). Part (d) is a minor add-on. If the bracket is too heavy, the curator could keep (a)–(b) as the core. Pugh marks this exercise *."


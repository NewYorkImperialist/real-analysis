    tags: [Baire-class-1, Baire-category, pointwise-convergence, oscillation, nowhere-dense, discontinuity-set]
    references: ["Exercise 19(a) (quoted)", "Baire's Theorem (quoted)"]
    problemLatex: |
      Suppose that $f_n\colon[a,b]\to\mathbb{R}$ is a sequence of continuous functions that converges pointwise to a limit function $f\colon[a,b]\to\mathbb{R}$. Such an $f$ is said to be of **Baire class 1**. (Pointwise convergence means: for each $x$, $f_n(x)$ converges to $f(x)$ as $n\to\infty$.)

      Prove that the set $D_k$ of discontinuity points with oscillation $\ge 1/k$ is nowhere dense, as follows. To arrive at a contradiction, suppose that $D_k$ is dense in some interval $(\alpha,\beta)\subset[a,b]$. By Exercise 19, $D_k$ is closed, so it contains $(\alpha,\beta)$. Cover $\mathbb{R}$ by countably many intervals $(a_\ell, b_\ell)$ of length $< 1/k$ and set
      $$H_\ell = f^{\mathrm{pre}}(a_\ell, b_\ell).$$

      (a) Why does $\bigcup_\ell H_\ell = [a,b]$?

      (b) Show that no $H_\ell$ contains a subinterval of $(\alpha,\beta)$.

      (c) Why are
      $$F_{\ell mn} = \left\{x\in[a,b] : a_\ell + \frac{1}{m} \le f_n(x) \le b_\ell - \frac{1}{m}\right\}, \qquad E_{\ell mN} = \bigcap_{n\ge N} F_{\ell mn}$$
      closed?

      (d) Show that
      $$H_\ell = \bigcup_{m,N\in\mathbb{N}} E_{\ell mN}.$$

      (e) Use (a) and Baire's Theorem to deduce that some $E_{\ell mN}$ contains a subinterval of $(\alpha,\beta)$.

      (f) Why does (e) contradict (b) and complete the proof that $D_k$ is nowhere dense?

      *(From the text: the oscillation of $f$ at $x$ is $\operatorname{osc}_x f = \limsup_{t\to x} f(t) - \liminf_{t\to x} f(t)$. Exercise 19(a) asks the reader to prove that $D_k$ is closed. Baire's Theorem: if a complete metric space is the countable union of closed subsets then at least one of them has nonempty interior.)*
    transcriptionNotes: "Checked against the page image. Two things are condensed: Pugh's long parenthetical on Baire class r and the Boas reference (only the definition of pointwise convergence is kept), and the page reference for Baire's Theorem. The book cites it as page 256 in Ex. 20 and page 243 in Ex. 23, so the statement given in Ex. 20 is quoted instead. f^pre is Pugh's notation for preimage. The definitions of oscillation and Exercise 19(a) are quoted. Pugh marks this exercise **."


    chapter: "4 Function Spaces"
    section: "Exercises"
    number: "Exercise 4.38"
    page: "268"
    pdfPage: 279
    verdict: strong
    tier: upper
    newExperience: "Upgrades the bank's local identity theorem for a power series to a global identity theorem on an interval (a connectedness/sup argument), probes where it fails, and ends with a characterization of all zero sets of analytic functions."
    closestExisting: [abbott-6.5.10, abbott-6.6.6, lebl-5.4.11]
    machinery: "Power series identity theorem, connectedness of an interval (open-closed argument), smooth nonanalytic functions, classification of zero sets."

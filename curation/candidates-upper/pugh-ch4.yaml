    references: ["Completion Theorem 2.80 (quoted)", "C_b^0(M,R) = bounded continuous functions with sup metric (glossed)"]
    problemLatex: |
      Let $M$ be any metric space with metric $d$. Fix a point $p \in M$ and for each $q \in M$ define the function $f_q(x) = d(q, x) - d(p, x)$.
      (a) Prove that $f_q$ is a bounded, continuous function of $x \in M$, and that the map $q \mapsto f_q$ sends $M$ isometrically onto a subset $M_0$ of $C^0_b(M, \mathbb{R})$.
      (b) Since $C^0_b(M, \mathbb{R})$ is complete, infer that an isometric copy of $M$ is dense in a complete metric space, namely the closure of $M_0$, and hence that we have a second proof of the Completion Theorem 2.80.

      *(Here $C^0_b(M,\mathbb{R})$ is the space of bounded continuous functions $M \to \mathbb{R}$ with the sup metric. Completion Theorem 2.80, from the text: "Every metric space can be completed." This means that we can take any metric space $M$ and find a complete metric space $\widehat{M}$ containing $M$ whose metric extends the metric of $M$.)*
    transcriptionNotes: "Theorem 2.80 quoted from p. 119 (lightly trimmed: the comparison with R completing Q omitted). C_b^0 glossed in my own words since the book's definition is spread across Section 4.1."


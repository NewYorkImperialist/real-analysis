    topic: function-sequences
    subtopics: [power-series, taylor-series]
    skills: [connectedness-argument, sup-argument, construct-counterexample, characterization]
    difficulty: hard
    difficultyRationale: "(a) needs the local identity theorem plus a global connectedness step; (b),(c) need counterexamples; (d) (double-starred) is a full characterization."
    category: synthesis
    type: proof
    tags: [analytic-functions, identity-theorem, power-series, smooth-functions, zero-set, connectedness]
    references: ["Definition of analytic function (Pugh p. 158, quoted)"]
    problemLatex: |
      *(Definition, from the text: the function $f\colon (a,b) \to \mathbb{R}$ is analytic if for each $x \in (a,b)$ there exist a power series $\sum a_r h^r$ and a $\delta > 0$ such that if $|h| < \delta$ then the series converges and $f(x+h) = \sum_{r=0}^{\infty} a_r h^r$.)*

      Suppose that $T \subset (a,b)$ clusters at some point of $(a,b)$ and that $f, g\colon (a,b) \to \mathbb{R}$ are analytic. Assume that for all $t \in T$ we have $f(t) = g(t)$.
      (a) Prove that $f = g$ everywhere in $(a,b)$.
      (b) What if $f$ and $g$ are only $C^\infty$?
      (c) What if $T$ is an infinite set but its only cluster points are $a$ and $b$?
      (d) Find a necessary and sufficient condition for a subset $Z \subset (a,b)$ to be the **zero locus** of an analytic function $f$ defined on $(a,b)$, $Z = \{x \in (a,b) : f(x) = 0\}$. [Hint: Think Taylor. The result in (a) is known as the **Identity Theorem**. It states that if an equality between analytic functions is known to hold for points of $T$ then it is an "identity," an equality that holds everywhere.]
    transcriptionNotes: "Starred (*), part (d) double-starred (**) in the book. Definition of analytic quoted from p. 158. 'havef(t)' spacing typo fixed. Verified against page image."


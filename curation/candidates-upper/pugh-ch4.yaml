sectionsCovered:
  - "Chapter 4 Exercises (Function Spaces) — 43 exercises (uniform convergence, equicontinuity/Arzela-Ascoli, Stone-Weierstrass, contractions and ODEs, analytic/smooth functions, Baire, sigma-compactness)"
scopeNote: >
  Equicontinuity on [a,b] is kept only where it is reachable in an undergraduate course that covers
  uniform convergence (Rudin Ch. 7 level) and the problem stands on its own without the Arzela-Ascoli
  theorem itself (4.9, 4.21). Problems that are applications or reformulations of Arzela-Ascoli
  (4.13, 4.18, 4.23), Stone-Weierstrass (4.32), Picard/ODE theory (4.33-4.36), the Hausdorff metric
  space K(R^2) (4.7), and local compactness / sigma*-compactness (4.40) are skipped as beyond the
  undergraduate single-variable/metric-space scope of the bank.

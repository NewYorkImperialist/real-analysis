    problemLatex: |
      Associate to each sequence $a = \{\alpha_n\}$, in which $\alpha_n$ is 0 or 2, the real number
      $$x(a) = \sum_{n=1}^{\infty} \frac{\alpha_n}{3^n}.$$
      Prove that the set of all $x(a)$ is precisely the Cantor set described in Sec. 2.44.

      *(Sec. 2.44: Let $E_0$ be the interval $[0,1]$. Remove the segment $(\frac13, \frac23)$, and let $E_1$ be the union of the intervals $[0, \frac13]$, $[\frac23, 1]$. Remove the middle thirds of these intervals, and let $E_2$ be the union of the intervals $[0, \frac19]$, $[\frac29, \frac39]$, $[\frac69, \frac79]$, $[\frac89, 1]$. Continuing in this way, we obtain a sequence of compact sets $E_n$, such that (a) $E_1 \supset E_2 \supset E_3 \supset \cdots$; (b) $E_n$ is the union of $2^n$ intervals, each of length $3^{-n}$. The set $P = \bigcap_{n=1}^{\infty} E_n$ is called the Cantor set.)*
    transcriptionNotes: "Construction from Sec. 2.44 (p. 41) quoted verbatim. Tier core-gap is a judgment call: modest difficulty, but it supplies the characterization other bank Cantor-set problems quietly rely on."

  - cid: rudin-3.24
    chapter: "3 Numerical Sequences and Series"
    section: "Exercises"

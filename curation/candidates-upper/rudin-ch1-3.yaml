    closestExisting: [lebl-2.4.3, lebl-7.4.16, abbott-8.2.5]
    machinery: "Cauchy sequences, equivalence relations, well-definedness, completeness, density, isometries."
    standardResult: "completion of a metric space via equivalence classes of Cauchy sequences"
    topic: topology
    subtopics: [complete-metric-spaces, cauchy-sequences, metric-spaces]
    skills: [well-definedness, diagonal-argument, epsilon-over-3, triangle-inequality]
    difficulty: hard
    difficultyRationale: "Part (c) (completeness of X*) needs approximating each Cauchy class by constant classes and extracting a representative Cauchy sequence; the full chain is long."
    category: challenge
    type: construction
    tags: [completion, cauchy-sequence, equivalence-class, metric-space, isometry, density]
    references: ["Exercise 3.23 (quoted)"]
    problemLatex: |
      Let $X$ be a metric space.

      (a) Call two Cauchy sequences $\{p_n\}$, $\{q_n\}$ in $X$ *equivalent* if
      $$\lim_{n\to\infty} d(p_n, q_n) = 0.$$
      Prove that this is an equivalence relation.

      (b) Let $X^*$ be the set of all equivalence classes so obtained. If $P \in X^*$, $Q \in X^*$, $\{p_n\} \in P$, $\{q_n\} \in Q$, define
      $$\Delta(P, Q) = \lim_{n\to\infty} d(p_n, q_n);$$
      by Exercise 23, this limit exists. Show that the number $\Delta(P,Q)$ is unchanged if $\{p_n\}$ and $\{q_n\}$ are replaced by equivalent sequences, and hence that $\Delta$ is a distance function in $X^*$.

      (c) Prove that the resulting metric space $X^*$ is complete.

      (d) For each $p \in X$, there is a Cauchy sequence all of whose terms are $p$; let $P_p$ be the element of $X^*$ which contains this sequence. Prove that
      $$\Delta(P_p, P_q) = d(p, q)$$
      for all $p, q \in X$. In other words, the mapping $\varphi$ defined by $\varphi(p) = P_p$ is an isometry (i.e., a distance-preserving mapping) of $X$ into $X^*$.

      (e) Prove that $\varphi(X)$ is dense in $X^*$, and that $\varphi(X) = X^*$ if $X$ is complete. By (d), we may identify $X$ and $\varphi(X)$ and thus regard $X$ as embedded in the complete metric space $X^*$. We call $X^*$ the *completion* of $X$.

      *(Exercise 23: Suppose $\{p_n\}$ and $\{q_n\}$ are Cauchy sequences in a metric space $X$. Show that the sequence $\{d(p_n, q_n)\}$ converges.)*
    transcriptionNotes: "Exercise 3.23 statement quoted (its hint omitted). Exercise 3.25 (completion of Q) is a one-line follow-up and is skipped."


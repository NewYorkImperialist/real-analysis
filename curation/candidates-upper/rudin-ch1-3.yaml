      (c) Prove that $\lim x_n = \sqrt{\alpha}$.

      (d) Compare the rapidity of convergence of this process with the one described in Exercise 16.

      *(Exercise 16: Fix a positive number $\alpha$. Choose $x_1 > \sqrt{\alpha}$, and define $x_2, x_3, x_4, \ldots$ by the recursion formula $x_{n+1} = \frac{1}{2}\left(x_n + \frac{\alpha}{x_n}\right)$; there $\varepsilon_n = x_n - \sqrt\alpha$ satisfies $\varepsilon_{n+1} < \beta(\varepsilon_1/\beta)^{2^n}$ with $\beta = 2\sqrt\alpha$.)*
    transcriptionNotes: "Exercise 16's recursion quoted verbatim; the error bound from 16(b) is summarized in Rudin's notation (not a full quote of 16) so (d) is meaningful."


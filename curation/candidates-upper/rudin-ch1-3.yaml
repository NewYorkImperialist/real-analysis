  - cid: rudin-3.14
    chapter: "3 Numerical Sequences and Series"
    section: "Exercises"
    number: "Exercise 3.14"
    page: "80"
    pdfPage: 89
    verdict: strong
    tier: upper
    newExperience: "Goes beyond 'Cesàro is regular' (well covered) to an unbounded-positive Cesàro-null example and Hardy's Tauberian theorem (|n a_n| ≤ M plus Cesàro convergence ⇒ convergence) via a carefully chosen moving block m(n)."
    closestExisting: [abbott-2.3.11, ross-12.12, lebl-2.6.11, cummings-4.14]
    machinery: "Cesàro means, limsup estimates, choosing an auxiliary index depending on ε and n, Tauberian conditions."
    standardResult: "Cesàro means: regularity, counterexamples, and Hardy's Tauberian theorem (n a_n bounded)"
    topic: sequences
    subtopics: [convergence, limsup-liminf]
    skills: [epsilon-N-proof, construct-counterexample, block-estimate, limsup-argument]
    difficulty: hard
    difficultyRationale: "(a)–(b) are standard; (c) needs a sparse-spike construction and (e) a delicate Tauberian estimate, even with Rudin's outline."
    category: challenge
    type: proof
    tags: [cesaro-means, tauberian, limsup, counterexample, sequences]
    references: []
    problemLatex: |
      If $\{s_n\}$ is a complex sequence, define its arithmetic means $\sigma_n$ by
      $$\sigma_n = \frac{s_0 + s_1 + \cdots + s_n}{n+1} \qquad (n = 0, 1, 2, \ldots).$$

      (a) If $\lim s_n = s$, prove that $\lim \sigma_n = s$.

      (b) Construct a sequence $\{s_n\}$ which does not converge, although $\lim \sigma_n = 0$.

      (c) Can it happen that $s_n > 0$ for all $n$ and that $\limsup s_n = \infty$, although $\lim \sigma_n = 0$?

      (d) Put $a_n = s_n - s_{n-1}$, for $n \ge 1$. Show that
      $$s_n - \sigma_n = \frac{1}{n+1} \sum_{k=1}^{n} k a_k.$$
      Assume that $\lim (n a_n) = 0$ and that $\{\sigma_n\}$ converges. Prove that $\{s_n\}$ converges. [This gives a converse of (a), but under the additional assumption that $n a_n \to 0$.]

      (e) Derive the last conclusion from a weaker hypothesis: Assume $M < \infty$, $|n a_n| \le M$ for all $n$, and $\lim \sigma_n = \sigma$. Prove that $\lim s_n = \sigma$, by completing the following outline:

      If $m < n$, then
      $$s_n - \sigma_n = \frac{m+1}{n-m}(\sigma_n - \sigma_m) + \frac{1}{n-m} \sum_{i=m+1}^{n} (s_n - s_i).$$
      For these $i$,
      $$|s_n - s_i| \le \frac{(n-i)M}{i+1} \le \frac{(n-m-1)M}{m+2}.$$
      Fix $\varepsilon > 0$ and associate with each $n$ the integer $m$ that satisfies
      $$m \le \frac{n - \varepsilon}{1 + \varepsilon} < m + 1.$$
      Then $(m+1)/(n-m) \le 1/\varepsilon$ and $|s_n - s_i| < M\varepsilon$. Hence
      $$\limsup_{n\to\infty} |s_n - \sigma| \le M\varepsilon.$$
      Since $\varepsilon$ was arbitrary, $\lim s_n = \sigma$.
    transcriptionNotes: "Parts (a)–(b) duplicate bank items; the upper-tier value is (c)–(e). Curator could present only (c)–(e) but the brief forbids trimming, so all parts are transcribed."


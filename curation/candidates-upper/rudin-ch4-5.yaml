    references: []
    problemLatex: |
      Suppose $a \in R^1$, $f$ is a twice-differentiable real function on $(a, \infty)$, and $M_0, M_1, M_2$ are the least upper bounds of $|f(x)|$, $|f'(x)|$, $|f''(x)|$, respectively, on $(a, \infty)$. Prove that
      $$M_1^2 \le 4 M_0 M_2.$$
      *Hint:* If $h > 0$, Taylor's theorem shows that
      $$f'(x) = \frac{1}{2h}\left[f(x + 2h) - f(x)\right] - h f''(\xi)$$
      for some $\xi \in (x, x + 2h)$. Hence
      $$|f'(x)| \le h M_2 + \frac{M_0}{h}.$$
      To show that $M_1^2 = 4 M_0 M_2$ can actually happen, take $a = -1$, define
      $$f(x) = \begin{cases} 2x^2 - 1 & (-1 < x < 0), \\ \dfrac{x^2 - 1}{x^2 + 1} & (0 \le x < \infty), \end{cases}$$
      and show that $M_0 = 1$, $M_1 = 4$, $M_2 = 4$.

      Does $M_1^2 \le 4 M_0 M_2$ hold for vector-valued functions too?
    transcriptionNotes: "Exercise spans printed pp. 115-116. In the extremal example, f'' fails to exist at 0 in the classical sense (one-sided second derivatives 4 and −2); transcribed exactly as printed."


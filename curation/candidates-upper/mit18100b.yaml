    tags: [series, primes, divergence, counting, contradiction]
    references: []
    problemLatex: |
      Let $(p_k) = (2, 3, 5, 7, 11, \dots)$ be the sequence of prime numbers. Prove that the series
      $$\sum_{k=1}^{\infty} \frac{1}{p_k}$$
      diverges, for instance, by working out the details of the following argument.

      Suppose $\sum \frac{1}{p_k}$ converges. Then, there is an integer $\ell$ such that
      $$\sum_{k=\ell+1}^{\infty} \frac{1}{p_k} = \sum_{k=1}^{\infty} \frac{1}{p_{k+\ell}} < \frac{1}{2}.$$
      Next, for any given $x \ge 0$, we let $N(x)$ be the number of positive integers $n \le x$ that are not divisible by any prime $p_k$ with $k > \ell$. By writing $n = km^2$ with $k$ square-free (which can be done with any integer), prove that
      $$N(x) \le 2^{\ell}\sqrt{x} \quad \text{and conclude that} \quad \frac{x}{2} < N(x) < 2^{\ell}\sqrt{x}.$$
      This is a contradiction whenever $x \ge 2^{2\ell+2}$ holds.
    transcriptionNotes: "Verified against the rendered page. The 'Trivia' paragraph on Brun's constant that follows the problem is omitted (it is commentary). The letter k is reused (prime index and square-free part), as printed. This is an extra problem, so no posted solution (pset6sol covers Problems 1-7 only). Borderline scope: a number-theory flavour, but the content is series divergence."

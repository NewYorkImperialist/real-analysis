    topic: sequences
    subtopics: [subsequences, bolzano-weierstrass, density-of-Q]
    skills: [pigeonhole, subsequence-extraction, sup-approximation, contradiction]
    difficulty: medium
    difficultyRationale: "Hardest part is (3): combining the pigeonhole hint with irrationality (a_m > 0) and part (2); the hints lay out the route."
    category: synthesis
    type: proof
    tags: [subsequence, pigeonhole, fractional-part, irrational, Bolzano-Weierstrass, density]
    references: ["Lemma 1 printed after the problem (statement quoted; MIT also prints its proof)"]
    problemLatex: |
      For any real number $x \in \mathbb{R}$, let $\lfloor x \rfloor$ be the largest integer which is less or equal to $x$. Equivalently, $\lfloor x \rfloor$ is the integer such that
      $$0 \le x - \lfloor x \rfloor < 1.$$
      For example $\lfloor 1.3 \rfloor = 1$, $\lfloor -3 \rfloor = -3$ and $\lfloor \sqrt{5} \rfloor = 2$. Define a sequence
      $$a_n = \sqrt{2}\,n - \lfloor \sqrt{2}\,n \rfloor.$$
      (1) Show that $a_n$ has a convergent subsequence.
      (2) Let $N \in \mathbb{N}$ be an integer. Suppose $0 < a_m < 1/N$ for some integer $m$. Show that there exists $n \in \mathbb{N}$ such that
      $$a_n > 1 - \frac{1}{N}.$$
      Hint: Consider $n = km$ for integers $k$.
      (3) Show that for all $N \in \mathbb{N}$, there exists $n \in \mathbb{N}$ such that
      $$a_n > 1 - \frac{1}{N}.$$
      Hint: Applying the following fact to $a_n$. Suppose $a_1, a_2, \dots, a_{N+1}$ are $N+1$ numbers contained in $[0,1)$. Then there exist two distinct numbers $k$ and $\ell$ such that $|a_k - a_\ell| < \frac{1}{N}$.
      (4) Let $E := \{a_n \mid n \in \mathbb{N}\}$. Show that there exists a sequence $b_k \in E$ such that $\lim_{k\to\infty} b_k = 1$.
      We remark that $b_k$ is **not** required to be a subsequence of $a_n$ and that $b_k$ are **not** required to be distinct between different $k$'s.

      The purpose of (2), (3) and (4) is to prepare ingredients that eventually show that $a_n$ has a subsequence which converges to 1. The last piece of ingredient is the following lemma.
      **Lemma 1.** Let $a_n$ be a sequence of real numbers and $E := \{a_n \mid n \in \mathbb{N}\}$. Suppose there exists a sequence $b_k \in E$ such that $\lim_{k\to\infty} b_k = L$. Further assume that $L \notin E$. Then $a_n$ has a subsequence $a_{n_k}$ such that $\lim_{k\to\infty} a_{n_k} = L$.
    transcriptionNotes: "Verified against the rendered page. The handout prints a proof of Lemma 1 on page 3 (omitted here; it is a given tool, not part of the exercise). The pigeonhole fact in the hint has a small index clash (it reuses a_k for arbitrary numbers); kept as printed. No solutions posted for S25."

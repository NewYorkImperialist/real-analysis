    problemLatex: |
      Suppose $(f_n)$ is a sequence of real-valued functions that are Riemann-integrable on all compact subintervals of $[0,\infty)$. Assume further that:
      a) $f_n \to 0$ uniformly on every compact subset of $[0,\infty)$;
      b) $0 \le f_n(t) \le e^{-t}$ for all $t \ge 0$ and $n \in \mathbb{N}$.
      Prove that
      $$\lim_{n\to\infty} \int_0^\infty f_n(t)\,dt = 0,$$
      where the improper integral $\int_0^\infty f_n(t)\,dt$ is defined as $\lim_{b\to\infty} \int_0^b f_n(t)\,dt$. Moreover, give an explicit example for a sequence $(f_n)$, so that condition b) does not hold and the conclusion above fails.

      *Remark:* In fact, one can relax condition a) to "$f_n \to 0$ pointwise on $[0,\infty)$." But then the proof (of this "dominated convergence theorem") becomes by far more involved when using Riemann's theory of integration.

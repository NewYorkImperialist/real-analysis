  - cid: mit18100b-2006-ps10-x1
    chapter: "MIT 18.100B Fall 2006"
    section: "Problem Set 10, Extra problems (mit18_100b_2006_pset10.pdf)"
    number: "Extra problem 1"
    page: "2"
    pdfPage: 2
    verdict: strong
    tier: upper
    newExperience: "An impossibility theorem about metrics: no metric (or norm) on C[0,1] induces pointwise convergence. The student turns a hypothetical metric into a diagonal construction that contradicts it; nothing in the bank asks to rule out every possible metric."
    closestExisting: [abbott-8.2.2, abbott-8.2.6, ross-22.6]
    machinery: "Sequences in metric spaces (neighborhood characterization of convergence), scaling to defeat a norm, diagonal choice of points/indices, pointwise vs uniform convergence."
    standardResult: "pointwise convergence on C[0,1] is not induced by any norm or metric"
    topic: function-sequences
    subtopics: [pointwise-convergence, uniform-convergence]
    skills: [contradiction, diagonal-argument, construct-counterexample]
    difficulty: hard
    difficultyRationale: "Theorem 2 (norm) is a clever scaling argument; Theorem 1 (metric) needs a nested/diagonal choice of x_0 and indices to manufacture a pointwise-null sequence of bumps that stays away from 0, even with the hints."
    category: challenge
    type: proof
    tags: [pointwise-convergence, metric-space, norm, impossibility, diagonal-argument, function-space]
    references: []
    problemLatex: |
      In class, we have seen that uniform convergence of a sequence of bounded functions on a set $E$ can be equivalently formulated in terms of the metric $d(f,g) = \sup_{x\in E} |f(x) - g(x)|$. That is, we have $d(f_n, f) \to 0$ if and only if $f_n \to f$ uniformly on $E$.

      Having this in mind, we could ask whether an analogous statement holds with respect to pointwise convergence. More specifically, is there a metric $d(f,g)$ such that $d(f_n, f) \to 0$ if and only if $f_n \to f$ pointwise on $E$? Surprisingly, it turns out that the answer is NO when, for example, $E = [0,1]$. We therefore cordially invite you to prove the following theorem.

      **Theorem 1.** *There is no metric $d(f,g)$ defined on $C([0,1])$ such that $d(f_n, f) \to 0$ if and only if $f_n \to f$ pointwise on $[0,1]$.*

      Before proving this theorem, you may first show the following weaker statement whose proof requires less effort.

      **Theorem 2.** *There is no norm $\|\cdot\|$ defined on $C([0,1])$ such that $\|f_n\| \to 0$ if and only if $f_n \to 0$ pointwise on $[0,1]$.*

      *Hint (for proof of Theorem 2).* Consider $f_n \in C([0,1])$, with $n = 1, 2, 3, \dots$, such that
      i) For every $x \in [0,1]$, there exists $n_0 = n_0(x)$ such that $f_n(x) = 0$ if $n \ge n_0$.
      ii) $f_n \not\equiv 0$ for every $n \ge 1$.
      (A possible choice is, for instance, given by $f_n(x) = \sin(n\pi x)$ if $x \in [0, 1/n]$, and $f_n(x) = 0$ if $x \in [1/n, 1]$.) By clever choice of a sequence of real-valued numbers $(c_n)$, prove the claim by considering the sequence $(c_nf_n)$.

      *Hint (for proof of Theorem 1).* Assume there is such a metric $d(f,g)$ on $C([0,1])$. Then $f_n \to 0$ if and only if, for every $k \in \mathbb{N}$, we have that $f_n \in N_{1/k}(0) = \{y \in C([0,1]) : d(y, 0) < 1/k\}$, except for finitely many $f_n$. Use this fact and the specific choice $g_n(x) = e^{-n|x - x_0|}$ for suitable $x_0 \in [0,1]$ to show that $g_n \to 0$ pointwise on $[0,1]$, which is false! (Since $g(x_0) = 1$ for all $n$.)
    transcriptionNotes: "Verified against the rendered page. Kept as printed: the last hint writes g(x_0) for g_n(x_0), and its 'show that g_n -> 0 pointwise' means 'derive that a suitable sequence built from the g_n would converge pointwise to 0, which is false'. The hint for Theorem 1 is terse, and the curator may want to trim or rephrase the hints. Extra problem: no posted solution."
    mitAssigned: "MIT 18.100B (Fall 2006) Problem Set 10, Extra problem 1"

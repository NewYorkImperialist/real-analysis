  - cid: mit18100b-f10-ps8-5
    chapter: "MIT 18.100B Fall 2010"
    section: "Homework 8 (mit18_100bf10_pset8.pdf)"
    number: "Problem 5"
    page: "2"
    pdfPage: 2
    verdict: consider
    tier: upper
    newExperience: "Treats the best delta as a function of x and epsilon, so pointwise and uniform continuity become statements about that function (positive vs. positive infimum), and computes it exactly for x^2."
    closestExisting: [ross-19.2, abbott-4.3.2, mit20-final-1]
    machinery: "Quantifier structure of continuity vs uniform continuity; sup/inf in the extended reals; an exact computation of the optimal delta."
    standardResult: "optimal delta function delta_f(x, epsilon): continuity iff positive, uniform continuity iff inf over x positive; x^2 on [0,infinity)"
    topic: continuity
    subtopics: [uniform-continuity, epsilon-delta-continuity, continuity-metric-spaces]
    skills: [negate-definition, sup-approximation, epsilon-delta-proof]
    difficulty: easy
    difficultyRationale: "(a),(b) unwind definitions with care about the supremum; (c),(d) are a guided computation."
    category: canonical
    type: definition
    tags: [uniform-continuity, epsilon-delta, quantifiers, supremum, metric-space]
    references: []
    problemLatex: |
      Let $(X, d_X)$ and $(Y, d_Y)$ be metric spaces. For any continuous map $f\colon X \to Y$ define a function $\delta_f\colon X \times (0,\infty) \to (0,\infty) \cup \{\infty\}$ as follows:
      $$\delta_f(x,\epsilon) = \sup\{\delta > 0 \mid \forall t \in X\ \ d_X(x,t) < \delta \Rightarrow d_Y(f(x), f(t)) < \epsilon\}.$$
      Note that this supremum may be $\infty$ if the continuity condition holds for all $\delta > 0$; e.g. for $f$ constant. In the following, we use the definition of order $<$ and infimum in the extended reals.
      (a) Show that the statement "$f$ is continuous at $x$" is equivalent to "$\delta_f(x,\epsilon) > 0$ for each $\epsilon > 0$".
      (b) Show that $f$ is uniformly continuous on $X$ iff $\inf_{x\in X} \delta_f(x,\epsilon) > 0$.
      (c) Consider the function $f(x) = x^2$ defined on the metric space $X = [0,\infty)$. Show that for each $x \in X$
      $$\sup_{t\in X,\ d_X(x,t)<\delta} |f(x) - f(t)| = 2x\delta + \delta^2.$$
      (d) Use part (c) to show that $\delta_f(x,\epsilon) = \sqrt{x^2+\epsilon} - x$. Show that, for fixed $\epsilon > 0$, $\lim_{x\to\infty}[\sqrt{x^2+\epsilon} - x] = 0$. Conclude that $f$ is *not* uniformly continuous on $X$. [*Hint*: you can use Calculus here, but you needn't. Set $\varphi(x) = \sqrt{x^2+\epsilon} - x$. Show that $\varphi(x) \ge 0$, and that $\varphi(x)^2 + 2x\,\varphi(x) = \epsilon$ for every $x$. Hence $0 \le \varphi(x) \le \epsilon/2x$.]
    transcriptionNotes: "Verified against the rendered page. As printed, (a) is stated for a map already assumed continuous in the definition of delta_f; the definition makes sense for any map. (b) is meant 'for each epsilon > 0'. Kept as printed. A related 2006 item (PS7 extra #3(b): delta(x) is continuous, hence attains a positive minimum on [a,b]) gives another proof of Heine-Cantor; skipped in favour of this one. No solutions posted for F10 homework."
    mitAssigned: "MIT 18.100B (Fall 2010) Homework 8, Problem 5"

      Let $\mathbb{M}$ be the set of polynomials with integer coefficients,
      $$\mathbb{M} := \{f(x) = a_0 + a_1x + a_2x^2 + \dots + a_nx^n \mid a_i \in \mathbb{Z}\}.$$
      Define the relation $0 \prec f$ if $0 < f(x)$ for $x$ large enough. To be more precise, we say $0 \prec f$ if there exists $M > 0$ such that $f(x) > 0$ for all $x > M$. Then define $f \prec g$ if $0 \prec g - f$.
      *(Problem 4 of the same set: show that $(\mathbb{M}, \prec)$ is an ordered set. You may use without proof: if $f(x) = a_0 + a_1x + \dots + a_nx^n$ with $0 < a_n$, then $0 < f(x)$ for $x$ large enough.)*

      Show that $(\mathbb{M}, \prec)$ doesn't satisfy the Archimedean property.

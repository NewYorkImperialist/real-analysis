    problemLatex: |
      In this problem, we concern the uniqueness of the continuous solution of the equation
      $$y'(x) = y(x)^2, \text{ for all } x \in [0,1], \qquad y(0) = a. \qquad (\star)$$
      (1) Let $y(x)$ be a continuous function on $[0,1]$. Show that $y(x)$ solves $(\star)$ if and only if
      $$y(x) = a + \int_0^x y(t)^2\,dt \quad \text{for all } x \in [0,1]. \qquad (\star\star)$$
      (2) Let $y_1(x)$ and $y_2(x)$ be two continuous functions on $[0,1]$. Show that there exists $1 > b > 0$ such that the following holds. Suppose $y_1(x)$ and $y_2(x)$ both satisfy $(\star\star)$ and $y_1(x_0) = y_2(x_0)$ for some $x_0 \in [0, 1-b]$. Then
      $$y_1(x) = y_2(x) \text{ for all } x \in [x_0, x_0 + b].$$
      Hint: Pick a suitable $b$ to deduce
      $$\max_{x\in[x_0,x_0+b]} |y_1(x) - y_2(x)| \le \frac{1}{2} \max_{x\in[x_0,x_0+b]} |y_1(x) - y_2(x)|.$$
      (3) Let $y_1(x)$ and $y_2(x)$ be two continuous functions on $[0,1]$. Suppose $y_1(x)$ and $y_2(x)$ both solve $(\star)$. Show that $y_1(x) = y_2(x)$ for all $x \in [0,1]$.
    transcriptionNotes: "Verified against the rendered page. In (2) b may depend on y1, y2 (it is chosen after them), as the quantifier order printed indicates. No solutions posted for S25."

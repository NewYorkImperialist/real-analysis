    chapter: "MIT 18.100B Spring 2025"
    section: "Problem Set 4 (mit18_100b_s25_pset04.pdf)"
    number: "Problem 5"
    page: "2"
    pdfPage: 2
    verdict: strong
    tier: upper
    newExperience: "A pigeonhole (Dirichlet approximation) argument to show fractional parts of sqrt(2) n come arbitrarily close to 1; the bank has no pigeonhole or Kronecker-type density argument."
    closestExisting: [lebl-2.1.17, cummings-3.5, abbott-2.5.1]
    machinery: "Bolzano-Weierstrass, pigeonhole principle, irrationality, building a subsequence converging to a non-attained limit."

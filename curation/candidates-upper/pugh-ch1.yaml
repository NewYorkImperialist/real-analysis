    problemLatex: |
      A function $f\colon (a,b) \to \mathbb{R}$ is a **convex function** if for all $x, y \in (a,b)$ and all $s, t \in [0,1]$ with $s + t = 1$ we have
      $$f(sx + ty) \le s f(x) + t f(y).$$

      (a) Prove that $f$ is convex if and only if the set $S$ of points above its graph is convex in $\mathbb{R}^2$. The set $S$ is $\{(x,y) : f(x) \le y\}$.

      *(b) Prove that every convex function is continuous.

      (c) Suppose that $f$ is convex and $a < x < u < b$. The slope $\sigma$ of the line through $(x, f(x))$ and $(u, f(u))$ depends on $x$ and $u$, say $\sigma = \sigma(x,u)$. Prove that $\sigma$ increases when $x$ increases, and $\sigma$ increases when $u$ increases.

      (d) Suppose that $f$ is second-order differentiable. That is, $f$ is differentiable and its derivative $f'$ is also differentiable. As is standard, we write $(f')' = f''$. Prove that $f$ is convex if and only if $f''(x) \ge 0$ for all $x \in (a,b)$.

      (e) Formulate a definition of convexity for a function $f\colon M \to \mathbb{R}$ where $M \subset \mathbb{R}^m$ is a convex set. [Hint: Start with $m = 2$.]
    transcriptionNotes: "Verified against page image. The star on (b) is the book's difficulty marker. (a) uses 'convex set' in R^2 (a set containing the segment between any two of its points, defined in Pugh's text); part (e) is a brief multivariable aside a curator may drop."


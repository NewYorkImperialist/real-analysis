    problemLatex: |
      Assume that $V$ is an inner product space whose inner product induces a norm as $|x| = \sqrt{\langle x, x\rangle}$.

      (a) Show that $|\ |$ obeys the **parallelogram law**
      $$|x + y|^2 + |x - y|^2 = 2|x|^2 + 2|y|^2$$
      for all $x, y \in V$.

      *(b) Show that any norm obeying the parallelogram law arises from a unique inner product. [Hints: Define the prospective inner product as
      $$\langle x, y\rangle = \left|\frac{x+y}{2}\right|^2 - \left|\frac{x-y}{2}\right|^2$$
      Checking that $\langle\ ,\ \rangle$ satisfies the inner product properties of symmetry and positive definiteness is easy. Also, it is immediate that $|x|^2 = \langle x, x\rangle$, so $\langle\ ,\ \rangle$ induces the given norm. Checking bilinearity is another story.

      (i) Let $x, y, z \in V$ be arbitrary. Show that the parallelogram law implies
      $$\langle x + y, z\rangle + \langle x - y, z\rangle = 2\langle x, z\rangle,$$
      and infer that $\langle 2x, z\rangle = 2\langle x, z\rangle$. For arbitrary $u, v \in V$ set $x = \frac12(u+v)$ and $y = \frac12(u - v)$, plug in to the previous equation, and deduce
      $$\langle u, z\rangle + \langle v, z\rangle = \langle u + v, z\rangle,$$
      which is additive bilinearity in the first variable. Why does it now follow at once that $\langle\ ,\ \rangle$ is also additively bilinear in the second variable?

      (ii) To check multiplicative bilinearity, prove by induction that if $m \in \mathbb{Z}$ then $m\langle x, y\rangle = \langle mx, y\rangle$, and if $n \in \mathbb{N}$ then $\frac1n\langle x, y\rangle = \langle \frac1n x, y\rangle$. Infer that $r\langle x, y\rangle = \langle rx, y\rangle$ when $r$ is rational. Is $\lambda \mapsto \langle \lambda x, y\rangle - \lambda\langle x, y\rangle$ a continuous function of $\lambda \in \mathbb{R}$, and does this give multiplicative bilinearity?]
    transcriptionNotes: "Verified against page images (pp. 53–54). Typo fixed: the book prints '⟨x + y, z⟩ + ⟨x − y, z⟩ = 2⟨x, y⟩' in hint (i); the right side must be 2⟨x, z⟩ (setting y = x then gives ⟨2x,z⟩ = 2⟨x,z⟩ as the hint says). Scope caution: this is normed/inner-product-space material (linear algebra flavour); the analysis content is the Q-to-R continuity step. Real vector space V is implicit."

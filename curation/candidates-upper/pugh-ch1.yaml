    problemLatex: |
      Prove that real numbers correspond bijectively to decimal expansions not terminating in an infinite strings of nines, as follows. The decimal expansion of $x \in \mathbb{R}$ is $N.x_1x_2\ldots$, where $N$ is the largest integer $\le x$, $x_1$ is the largest integer $\le 10(x - N)$, $x_2$ is the largest integer $\le 100(x - (N + x_1/10))$, and so on.

      (a) Show that each $x_k$ is a digit between $0$ and $9$.

      (b) Show that for each $k$ there is an $\ell \ge k$ such that $x_\ell \ne 9$.

      (c) Conversely, show that for each such expansion $N.x_1x_2\ldots$ not terminating in an infinite string of nines, the set
      $$\left\{N,\ N + \frac{x_1}{10},\ N + \frac{x_1}{10} + \frac{x_2}{100},\ \ldots\right\}$$
      is bounded and its least upper bound is a real number $x$ with decimal expansion $N.x_1x_2\ldots$.

      (d) Repeat the exercise with a general base in place of $10$.
    transcriptionNotes: "Verified against page image. 'infinite strings of nines' is the book's wording. Pugh constructs R by Dedekind cuts, but the exercise only uses the l.u.b. property and is self-contained."


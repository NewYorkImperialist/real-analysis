  why: "limsup and liminf exist for bounded sequences, and lim exists iff they agree."
- cid: tao-6.4.3
  why: "The core facts: liminf ≤ limsup, they are the extreme limit points, and convergence ⇔ they agree."
- cid: ross-12.13

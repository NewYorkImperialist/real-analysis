# Checks run on the hardest three (no findings):
# rudin-3.14: (a) recomputed the cube example: s_0 = 1, non-cube mass <= 2, cube mass K(K+1)/2 <= K^2 <= n^{2/3} for K >= 1,
#   so sigma_n <= 2/n + n^{-1/3}. (b) re-derived the telescoping identity term by term. (c) checked m(n) >= 0 needs n >= eps,
#   m < n, both cleared-denominator equivalences, the monotonicity of (n-i)/(i+1) in i, and that m(n) -> infinity.
# ross-22.14: checked the first-crossing index r (r-1 >= p > K >= N, so the step bound applies), the strict/non-strict
#   bounds a + (c-a) = c, and that closedness of S (Ross Thm 11.9) gives the endpoints; singleton S is covered.
# tao-6.4.3: checked the extended-real cases (L^+ = -inf in (d), L^+ = +inf impossible when c > L^+), the indexing
#   max(N, N_1) in (e), and that (f) forward direction shows L^+- are finite before concluding.
# Also verified numerically: ross-14.10 sequence/ratios (2,1,8,4,32,16; ratios 1/2, 8), cummings-3.25 closed form at n = 1, 2

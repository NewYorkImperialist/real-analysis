batch: b09-continuity-easy
reviewed: [mit20-a9-4, mit20-a9-6, mit20-final-2a, lebl-3.2.11, lebl-3.3.11, lebl-3.4.3, lebl-7.5.2, ross-19.2, mit20-a7-6, mit20-a8-2, mit20-a9-5, mit20-final-2b, abbott-4.3.6, abbott-4.3.12, abbott-4.4.2, abbott-4.4.8, abbott-4.4.10, abbott-4.5.7, lebl-3.1.3, lebl-3.1.13, lebl-3.2.10, lebl-3.2.14, lebl-3.3.14, lebl-3.4.8, lebl-3.4.15, lebl-7.5.5, ross-17.9, ross-18.4, ross-18.12, cummings-6.33]
findings:
  - id: lebl-3.3.11
    severity: hint
    where: "hint 2"
    quote: |
      Try $\arctan x$, or, to avoid trigonometric facts, a rational expression in $x$ and $|x|$ that tends to $\pm 1$.
    issue: |
      The problem asks only for an example; this hint states a complete answer ($\arctan x$) and describes the
      solution's own example ($x/(1+|x|)$). Nothing is left for the student to find.
    evidence: |
      The solution's $f(x) = x/(1+|x|)$ is exactly "a rational expression in $x$ and $|x|$ that tends to $\pm1$",
      and its closing remark confirms that $\arctan x$ works.
    suggested_fix: |
      Look for a continuous function whose graph has horizontal asymptotes in both directions but never reaches them.
  - id: ross-18.4
    severity: hint
    where: "hint 2"
    quote: |
      Try $f(x) = \frac{1}{|x - x_0|}$. Why is it defined and continuous on $S$, and what happens along the sequence $(x_n)$?
    issue: |
      The construction is the whole problem, and this hint gives the exact function used in the solution, along
      with the two checks to make.
    evidence: |
      The solution's first line is "Define $f(x) = \dfrac{1}{|x - x_0|}$", and the rest is the two checks the hint lists.
    suggested_fix: |
      Use the distance $|x - x_0|$, which is positive on $S$ but can be made as small as you like. Which simple
      continuous operation turns small positive numbers into large ones?
  - id: lebl-3.2.11
    severity: hint
    where: "hint 2"
    quote: |
      Take $\epsilon = f(c)$ (or $f(c)/2$) in the $\epsilon$–$\delta$ definition and let $\alpha$ be the resulting $\delta$.
    issue: |
      This is the entire proof. The solution only restates it.
    evidence: |
      Solution: "Let $\epsilon = f(c) > 0$ ... Set $\alpha = \delta$."
    suggested_fix: |
      If $|f(x) - f(c)| < \epsilon$, how large can $\epsilon$ be and still force $f(x) > 0$?
  - id: abbott-4.5.7
    severity: hint
    where: "hint 2"
    quote: |
      Apply the Intermediate Value Theorem to $g(x) = f(x) - x$. What are the signs of $g(0)$ and $g(1)$?
    issue: |
      This gives the auxiliary function, the theorem and the endpoint check, which together are the whole proof.
      It also answers hint 1's question outright.
    evidence: |
      The solution consists of defining $g(x) = f(x) - x$, computing $g(0) \ge 0 \ge g(1)$, and applying the IVT.
    suggested_fix: |
      Compare $f(0)$ with $0$ and $f(1)$ with $1$. Which continuous function of $x$ changes sign (weakly) between $0$ and $1$?
  - id: mit20-a7-6
    severity: hint
    where: "hint 2"
    quote: |
      For (a), $\epsilon = 1$ keeps $f(x)$ within $1$ of $L$. For (b), choose $\epsilon$ so that the interval $(L - \epsilon, L + \epsilon)$ lies in $(0, \infty)$.
    issue: |
      Both parts are a single choice of $\epsilon$. This hint makes that choice for (a) and practically for (b),
      which leaves only the triangle inequality.
    evidence: |
      Solution (a): "Applying the definition with $\epsilon = 1$ ... $B = 1 + |L|$". Solution (b): "$\epsilon = L$".
    suggested_fix: |
      For (a), any fixed $\epsilon$ will do. Once $f(x)$ is within $\epsilon$ of $L$, how big can $|f(x)|$ be? For (b), how large may $\epsilon$ be if $L - \epsilon$ must stay $\ge 0$?

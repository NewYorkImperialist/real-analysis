notes: |
  - fixed-point is last in the taxonomy but its two problems need only Cauchy sequences, continuity
    and (for lebl-7.6.6) metric spaces from Topology. They do not depend on anything else in this
    topic. Keeping them near the end works, but they would also fit at the end of Continuity
    (abbott-4.3.11) and Topology/complete metric spaces (lebl-7.6.6).
  - taylor-series is used only by the upper-tier pugh-4.37 (Borel's lemma), so there is no
    taylor-series content in the core.
  - uniform-cauchy is listed before the interchange subtopics. That is correct here: abbott-6.3.7
    (differentiable limit theorem) and abbott-6.4.1 (M-test) both rely on the Cauchy criterion
    proved in abbott-6.2.5.

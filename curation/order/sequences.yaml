notes: |
  The taxonomy order (subsequences, Bolzano–Weierstrass, then Cauchy) fits: the Cauchy criterion
  (Cauchy => convergent) is proved through Bolzano–Weierstrass in Abbott, and abbott-2.6.2 asks about
  Cauchy subsequences. So Cauchy follows BW here, although the curator's selection placed it before.
  "bounded-sequences" has no problems of its own. Its content (convergent => bounded, abbott-2.2.1)
  belongs with convergence and limit laws, which is where those problems sit.
  limsup/liminf as a definition (abbott-2.4.7) needs only monotone convergence and could follow it
  directly, but most limsup problems here (ross-12.13, tao-6.4.3, ross-22.14, lebl-2.3.7's hint)
  use subsequential limits, so keeping limsup last is right.

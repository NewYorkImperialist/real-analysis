notes: |
  - Taxonomy lists alternating-series after absolute/conditional convergence, but most of the bank's
    conditional-convergence problems (abbott-2.7.4, abbott-2.7.8, cummings-4.5(b), lebl-2.6.13) take
    their examples from the alternating series test, so the AST group is placed before them.
  - Rearrangements are placed last in the core (after power series and Cauchy products), so the core
    ends on the Riemann rearrangement theorem. Nothing in the power-series or product problems uses
    rearrangements.
  - ross-15.3 is kept in the core after Cauchy condensation, which settles it without integrals;
    Ross's own hint and the stored solution use the integral test (a soft forward reference).
  - ross-14.10 uses continuity of t -> 2^t in its solution, but divergence is also immediate since
    a_n -> infinity; not treated as a forward reference.

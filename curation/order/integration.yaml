notes: |
  - log-exp is listed after improper-integrals, but the improper-integral problems use log
    (ross-36.3 for p = 1, mit20-final-6a computes the integral of x log x). Lebl defines ln as the
    integral of 1/t in §5.4, before improper integrals in §5.5. log-exp should precede
    improper-integrals; lebl-5.4.6 is placed accordingly.
  - integral-properties (linearity) must come before most of integrability-criteria: abbott-7.3.7,
    lebl-5.2.14(b,c) and abbott-7.4.6 all build integrability from linearity. The order here puts
    linearity (lebl-5.2.2) right after the first Darboux-sum problems.
  - integral-inequalities and fundamental-theorem are interleaved, not sequential: some inequality
    problems (mit20-final-6b, mit20-final-6c) need the FTC or integration by parts.

notes: |
  Cardinality sits before Real Numbers in data/taxonomy.yaml, but several cardinality problems lean on
  real-number facts: abbott-1.5.6 uses density of Q, abbott-1.5.8 the Archimedean property, and
  ross-16.8 and mit20-a3-2 use decimal expansions (and convergence of their series). Abbott covers all
  of these (1.4 and 1.6 informally) before these exercises, so they stay here and are not forward refs,
  but on the bank's own path they precede the real-numbers problems on density, Archimedes and decimal
  representation. Moving the "uncountable reals" and counting-argument groups to the end of Real Numbers
  (Abbott's own order: 1.4 then 1.5–1.6) would remove that tension.

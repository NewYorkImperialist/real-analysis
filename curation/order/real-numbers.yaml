notes: |
  - taxonomy lists archimedean-property before supremum-infimum and completeness, but in Abbott and
    Lebl the Archimedean property is proved from completeness; it should come after completeness.
  - absolute-value and inequalities are listed last, but they are elementary ordered-field material
    used in every later epsilon argument; they belong right after ordered-fields. AM-GM (lebl-1.2.7) is
    the exception: it uses square roots, whose existence needs completeness, so it sits after mit20-a2-7.
  - decimal-representation currently has no problems in this topic (ross-16.8 lives in foundations).

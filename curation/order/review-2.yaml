ok_notes: |
  I read every statement and solution in series, topology and continuity in path order, and
  checked each against the earlier topics (foundations, real-numbers, sequences) and the problems
  before it.

  Series: the Cauchy criterion, absolute convergence, the AST (abbott-2.7.1) and the ratio test
  (abbott-2.7.9) are proved before they are used, and the rearrangement/Cauchy-product order is
  sound. Divergence of the harmonic series and convergence of p-series are never proved on the path
  (condensation, lebl-2.5.15, comes after many uses, e.g. lebl-2.5.3, lebl-2.6.1(c), abbott-2.7.4).
  Abbott proves these in §2.4, so I let that pass. The root test is never proved on the path either
  (ross-14.10, lebl-2.6.1(d)). Abbott does not cover it, but Ross and Lebl do in their text, so I
  noted it here rather than as a violation. ross-14.10 also cites continuity of 2^t, which is
  avoidable via 2^(1/n) → 1. mit20-mid-5a (limit comparison) placed before plain comparison examples
  is a matter of taste.

  Topology: the order open → closed → sequentially closed → limit points (mit20-a4-7 gives the
  sequential characterization that abbott-3.2.7 and abbott-3.4.6 rely on) is sound. Sequential
  compactness (cummings-5.7) comes before the Heine–Borel uses. The Cantor set is used in
  abbott-3.2.6(e) before the Cantor group, but Abbott defines it in §3.1, so that is fine.
  lebl-7.4.16 comes before lebl-7.4.12, which uses it. The metric-space problems assume
  "compact ⇔ sequentially compact" and "compact ⇒ closed" (Lebl's text). Neither is proved on the
  path; that is acceptable but worth knowing. lebl-7.4.19 needs continuity of x/(1+|x|) and its
  inverse, but it is already labelled as a forward reference. pugh-prelim-43 (upper tier) uses Baire
  for complete metric spaces, while the path only has Abbott's R-version (abbott-3.5.4). That is
  minor, and it is upper tier.

  Continuity: functional limits → sequential criterion → ε–δ → algebra/composition → the dense-set
  extension (it needs the sequential criterion from mit20-a8-2/abbott-4.3.7, which come first) →
  open preimages → compact image/EVT → uniform continuity. abbott-4.4.14 (UC on compact) comes
  before abbott-4.4.2(c), lebl-3.4.15, abbott-4.4.13(b⇐) and ross-19.1, which use it.
  abbott-4.4.13(a) (UC preserves Cauchy) comes before ross-19.4 and ross-19.1. IVT/EVT
  counterexamples (lebl-3.3.11, mit20-final-2a) come after the compact-image result and after the
  first IVT use. Metric continuity uses only results proved just before it (lebl-7.5.5 before
  ross-22.4; topology's cummings-5.8 and lebl-7.4.x before lebl-7.5.8). mit20-a9-5 mentions the MVT
  and the compact⇒UC theorem only as alternatives, so I did not flag it.

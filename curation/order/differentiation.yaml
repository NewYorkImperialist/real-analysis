notes: |
  - lhopital is listed after taylor in data/taxonomy.yaml, but L'Hôpital is the immediate corollary of the
    Cauchy MVT (itself a Rolle argument), while Taylor's theorem with Lagrange remainder is a further
    generalisation. Placing L'Hôpital first also lets abbott-5.3.12 (a 0/0 L'Hôpital argument) and the
    limit computations in mit20-a11-3 follow naturally. Suggest swapping the two subtopics.
  - darboux-property does not depend on the MVT (it uses the extreme value theorem and Fermat), so it
    could sit right after local-extrema; its position after mvt-applications is harmless.
  - inverse-functions is last in the taxonomy, but abbott-5.2.12 and lebl-4.4.6 use only the definition,
    the derivative rules and continuity of the inverse/IVT, so they come right after the derivative rules.

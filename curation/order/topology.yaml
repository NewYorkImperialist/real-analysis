notes: |
  - sequential-compactness is listed after compactness, but Abbott (and MIT 18.100A) define compactness
    sequentially, so in R the sequential version (cummings-5.7) comes first and the open-cover form
    (lebl-7.4.2, abbott-3.3.9) follows as Heine-Borel.
  - connectedness is listed before metric-spaces, but the bank's connectedness problems split: two are in R
    (abbott-3.2.13, abbott-3.4.6) and two are in general metric spaces (lebl-7.2.10, 7.2.11), which must
    follow the metric-space definitions. The path treats them as two groups.
  - interior-closure-boundary's metric problems (lebl-7.2.7, 7.2.13) are stated in metric spaces, so they
    sit after metric-spaces despite the taxonomy listing them early; the R-based closure work is in the
    limit-points group.
  - cantor-set, perfect-sets and baire-category are R-only in the core and follow Abbott's chapter 3 order,
    so they come before metric-spaces rather than after complete-metric-spaces.
  - Many of the metric-space problems (function spaces C[0,1], L1 metric) need continuity, integration or
    uniform convergence; the topic sits too early in the path for them.

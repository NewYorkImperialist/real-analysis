notes: |
  - EVT before uniform continuity/Lipschitz: the taxonomy lists uniform-continuity and lipschitz-holder
    before EVT, but the uniform-continuity problems lean on "continuous on compact ⇒ uniformly
    continuous" and on continuous images of compact sets, which sit with the EVT (Abbott 4.4). The
    compactness/EVT group should come first.
  - continuity-metric-spaces is listed 5th, but its problems (connected images, compact domain ⇒
    continuous inverse) generalise the IVT/EVT material and read best at the end of the topic.
  - limits-at-infinity is listed last, but it is a variant of the functional-limit definition and
    belongs with functional limits at the start.
  - monotone-functions after IVT is right: the inverse-function and "monotone + IVP ⇒ continuous"
    problems need the IVT or the intermediate value property.

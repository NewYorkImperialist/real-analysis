      $$|f(x)| \le |f(x) - f_n(x)| + |f_n(x)| \le d(f, f_n) + 1.$$
      Since $\lim d(f, f_n) = 0$, we have $|f(x)| \le 1$.
      (b) It suffices to show $C(S)$ is path-connected. So use Exercise 22.9.

    problemLatex: |
      Consider $C(S)$ where $S \subseteq \mathbb{R}$, and let $\mathcal{E}$ consist of all $f$ in $C(S)$ such that $\sup\{|f(x)| : x \in S\} \le 1$.
      (a) Show $\mathcal{E}$ is closed in $C(S)$.
      (b) Show $C(S)$ is connected.
      (c) Show $\mathcal{E}$ is connected.
      *(Definition 22.6: Let $S$ be a subset of $\mathbb{R}$. Let $C(S)$ be the set of all bounded continuous real-valued functions on $S$ and, for $f, g \in C(S)$, let $d(f, g) = \sup\{|f(x) - g(x)| : x \in S\}$.)*
    bookHint: |

  - cid: ross-20.17
    chapter: "3 Continuity"
    section: "§20 Limits of Functions"
    number: "Exercise 20.17"
    page: "163"
    pdfPage: 174
    verdict: strong
    machinery: "Squeeze lemma for one-sided function limits, including infinite limits, without assuming the middle limit exists."
    standardResult: "squeeze theorem for functional limits"
    topic: continuity
    subtopics: [functional-limits]
    skills: [epsilon-delta-proof, sequential-characterization]
    difficulty: easy
    difficultyRationale: "Standard squeeze argument; must also handle L = +-infinity."
    category: canonical
    type: proof
    tags: [functional-limits, squeeze-theorem, machinery]
    references: ["Exercise 20.16(a) (ross-20.16)"]
    problemLatex: |
      Show that if $\lim_{x\to a^+} f_1(x) = \lim_{x\to a^+} f_3(x) = L$ and if $f_1(x) \le f_2(x) \le f_3(x)$ for all $x$ in some interval $(a, b)$, then $\lim_{x\to a^+} f_2(x) = L$. This is called the squeeze lemma. *Warning*: This is not immediate from Exercise 20.16(a), because we are not assuming $\lim_{x\to a^+} f_2(x)$ exists; this must be proved.
    bookHint: |
      Suppose first that $L$ is finite. We use (1) in Corollary 20.8. Let $\epsilon > 0$. There exist $\delta_1 > 0$ and $\delta_3 > 0$ such that
      $$a < x < a + \delta_1 \quad\text{implies}\quad L - \epsilon < f_1(x) < L + \epsilon$$
      and
      $$a < x < a + \delta_3 \quad\text{implies}\quad L - \epsilon < f_3(x) < L + \epsilon.$$
      If $\delta = \min\{\delta_1, \delta_3\}$, then
      $$a < x < a + \delta \quad\text{implies}\quad L - \epsilon < f_2(x) < L + \epsilon.$$
      So by Corollary 20.8 we have $\lim_{x\to a^+} f_2(x) = L$.
      Suppose $L = +\infty$. Let $M > 0$. In view of Discussion 20.9, there exists $\delta > 0$ such that
      $$a < x < a + \delta \quad\text{implies}\quad f_1(x) > M.$$
      Then clearly
      $$a < x < a + \delta \quad\text{implies}\quad f_2(x) > M,$$
      and this shows $\lim_{x\to a^+} f_2(x) = +\infty$. The case $L = -\infty$ is similar.
    transcriptionNotes: "L may be finite or +-infinity in Ross's definition. bookHint (full solution) from PDF pp.392–393 (printed 383–384); it cites Corollary 20.8 (epsilon-delta form of one-sided limits) and Discussion 20.9 (infinite limits). Verified problem against page image."
    audit: ok


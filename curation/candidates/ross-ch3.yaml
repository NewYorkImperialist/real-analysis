  - cid: ross-17.11
    chapter: "3 Continuity"
    section: "§17 Continuous Functions"
    number: "Exercise 17.11"
    page: "132"
    pdfPage: 143
    verdict: consider
    machinery: "Sequential characterization refined: monotone sequences suffice, via monotone subsequence theorem and negation."
    standardResult: "continuity tested by monotone sequences"
    topic: continuity
    subtopics: [sequential-continuity, subsequences]
    skills: [contradiction, subsequence-extraction, negate-definition]
    difficulty: medium
    difficultyRationale: "Requires negating sequential continuity to get an epsilon-bad subsequence, then extracting a monotone subsequence."
    category: synthesis
    type: proof
    tags: [continuity, sequences, monotone-subsequence, contradiction]
    references: ["Theorem 11.4 (quoted)"]
    problemLatex: |
      Let $f$ be a real-valued function with $\operatorname{dom}(f) \subseteq \mathbb{R}$. Prove $f$ is continuous at $x_0$ if and only if, for every *monotonic* sequence $(x_n)$ in $\operatorname{dom}(f)$ converging to $x_0$, we have $\lim f(x_n) = f(x_0)$. *Hint*: Don't forget Theorem 11.4.
      *(Theorem 11.4: Every sequence $(s_n)$ has a monotonic subsequence.)*
    bookHint: |
      If $f$ is continuous at $x_0$ and if $(x_n)$ is a monotonic sequence in $\operatorname{dom}(f)$ converging to $x_0$, then we have $\lim f(x_n) = f(x_0)$ by Definition 17.1. Now assume
      $$\text{if } (x_n) \text{ is monotonic in } \operatorname{dom}(f) \text{ and } \lim x_n = x_0, \text{ then } \lim f(x_n) = f(x_0), \qquad (1)$$
      but $f$ is discontinuous at $x_0$. Then by Definition 17.1, there exists a sequence $(x_n)$ in $\operatorname{dom}(f)$ such that $\lim x_n = x_0$ but $(f(x_n))$ does not converge to $f(x_0)$. Negating Definition 17.1, we see there exists $\epsilon > 0$ such that
      $$\text{for each } N \text{ there is } n > N \text{ satisfying } |f(x_n) - f(x_0)| \ge \epsilon. \qquad (2)$$
      It is easy to use (2) to obtain a subsequence $(x_{n_k})$ of $(x_n)$ such that
      $$|f(x_{n_k}) - f(x_0)| \ge \epsilon \quad \text{for all } k. \qquad (3)$$
      Now Theorem 11.4 shows $(x_{n_k})$ has a monotonic subsequence $(x_{n_{k_j}})$. By (1) we have $\lim_{j\to\infty} f(x_{n_{k_j}}) = f(x_0)$, but by (3) we have $|f(x_{n_{k_j}}) - f(x_0)| \ge \epsilon$ for all $j$, a contradiction.
    transcriptionNotes: "Theorem 11.4 quoted verbatim. bookHint (a full solution) from PDF pp.388–389 (printed 379–380). Book's continuity is Definition 17.1 (sequential)."
    audit: ok


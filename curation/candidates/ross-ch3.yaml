    skills: [IVT-application, comparison-estimate]
    difficulty: easy
    difficultyRationale: "Needs an explicit bound showing the leading term dominates for |x| large, then IVT."
    category: canonical
    type: theorem-application
    tags: [IVT, polynomial, roots, estimate]
    references: []
    problemLatex: |
      Prove that a polynomial function $f$ of odd degree has at least one real root. *Hint*: It may help to consider first the case of a cubic, i.e., $f(x) = a_0 + a_1 x + a_2 x^2 + a_3 x^3$ where $a_3 \neq 0$.
    bookHint: |
      Let $f(x) = a_0 + a_1 x + \cdots + a_n x^n$ where $a_n \neq 0$ and $n$ is odd. We may suppose $a_n = 1$; otherwise we would work with $(1/a_n)f$. Since $f$ is continuous, Theorem 18.2 shows it suffices to show $f(x) < 0$ for some $x$ and $f(x) > 0$ for some other $x$. This is true because $\lim_{x\to\infty} f(x) = +\infty$ and $\lim_{x\to-\infty} f(x) = -\infty$ [remember $a_n = 1$], but we can avoid these limit notions as follows. Observe
      $$f(x) = x^n \left[1 + \frac{a_0 + a_1 x + \cdots + a_{n-1}x^{n-1}}{x^n}\right]. \qquad (1)$$
      Let $c = 1 + |a_0| + |a_1| + \cdots + |a_{n-1}|$. If $|x| > c$, then
      $$|a_0 + a_1 x + \cdots + a_{n-1}x^{n-1}| \le (|a_0| + |a_1| + \cdots + |a_{n-1}|)|x|^{n-1} < |x|^n,$$
      so the number in brackets in (1) is positive. Now if $x > c$, then $x^n > 0$, so $f(x) > 0$. And if $x < -c$, then $x^n < 0$ [why?], so $f(x) < 0$.
    transcriptionNotes: "bookHint (full solution) from PDF pp.389–390 (printed 380–381), verified against page image. Theorem 18.2 = Intermediate Value Theorem."

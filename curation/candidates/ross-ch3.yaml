    standardResult: "closure of a connected set is connected"
    topic: topology
    subtopics: [connectedness, interior-closure-boundary, metric-spaces]
    skills: [contradiction, open-set-argument]
    difficulty: medium
    difficultyRationale: "Must show a separation of E^- restricts to a separation of E, using that each open set meeting E^- meets E."
    category: canonical
    type: proof
    tags: [connectedness, closure, metric-space, topology]
    references: []
    problemLatex: |
      Prove that if $E$ is a connected subset of a metric space $(S, d)$, then its closure $E^-$ is also connected.
    bookHint: |
      Assume $E$ is connected but $E^-$ is not. Then there exist open sets $U_1$ and $U_2$ that separate $E^-$ as in Definition 22.1(a). Show that $U_1$ and $U_2$ separate $E$, which is a contradiction. Since $E$ satisfies (1) in Definition 22.1(a), it suffices to show $E \cap U_1 \neq \varnothing$ and $E \cap U_2 \neq \varnothing$. In fact, if $E \cap U_1 = \varnothing$, then $E^- \cap (S \setminus U_1)$ would be a closed set containing $E$, and it is smaller than $E^-$ since $E^- \cap U_1 \neq \varnothing$. This contradicts the definition of $E^-$ in Definition 13.8, so $E \cap U_1 \neq \varnothing$. Likewise $E \cap U_2 \neq \varnothing$.
    transcriptionNotes: "Ross's Definition 22.1(a): E is disconnected if there are open subsets U1, U2 of S with (E∩U1)∩(E∩U2) = ∅, E = (E∩U1)∪(E∩U2), E∩U1 ≠ ∅ and E∩U2 ≠ ∅; connected means not disconnected. E^- denotes closure. bookHint from PDF p.394 (printed 385)."
    audit: ok


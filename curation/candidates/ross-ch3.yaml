    problemLatex: |
      Let $E$ and $F$ be connected sets in some metric space.
      (a) Prove that if $E \cap F \neq \varnothing$, then $E \cup F$ is connected.
      (b) Give an example to show $E \cap F$ need not be connected. Incidentally, the empty set *is* connected.
    bookHint: |
      (a) Assume open sets $U_1$ and $U_2$ separate $E \cup F$ as in Definition 22.1(a). Consider $x \in E \cap F$; $x$ belongs to one of the open sets, say $x \in U_1$. Select $y$ in $(E \cup F) \cap U_2$. Then $y$ is in $E$ or $F$, say $y \in E$. Since $x \in E \cap U_1$ and $y \in E \cap U_2$, these sets are nonempty. Thus $U_1$ and $U_2$ separate $E$, and $E$ is not connected, a contradiction.

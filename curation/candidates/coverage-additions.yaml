    verdict: core
    machinery: "The IVT as a corollary of preservation of connected sets and the characterization of connected subsets of R as intervals."
    standardResult: "IVT follows from: continuous image of a connected set is connected"
    topic: continuity
    subtopics: [IVT, continuity-and-topology]
    skills: [theorem-application, contradiction]
    difficulty: easy
    difficultyRationale: "Apply Theorem 4.5.2 to E = [a,b] and read off the conclusion with the interval characterization of connected sets."
    category: canonical
    type: proof
    tags: [IVT, connectedness, image, continuity]
    references: ["Theorem 4.5.1 (quoted)", "Theorem 4.5.2 (quoted)", "Theorem 3.4.7 (quoted)"]
    problemLatex: |
      Show how the Intermediate Value Theorem follows as a corollary to Theorem 4.5.2.

      *(Theorem 4.5.1 (Intermediate Value Theorem): Let $f\colon [a, b] \to \mathbf{R}$ be continuous. If $L$ is a real number satisfying $f(a) < L < f(b)$ or $f(a) > L > f(b)$, then there exists a point $c \in (a, b)$ where $f(c) = L$.)*

      *(Theorem 4.5.2 (Preservation of Connected Sets): Let $f\colon G \to \mathbf{R}$ be continuous. If $E \subseteq G$ is connected, then $f(E)$ is connected as well.)*

      *(Theorem 3.4.7: A set $E \subseteq \mathbf{R}$ is connected if and only if whenever $a < c < b$ with $a, b \in E$, it follows that $c \in E$ as well.)*
    transcriptionNotes: "Theorems 4.5.1 (p. 136), 4.5.2 (p. 136) and 3.4.7 (p. 105) quoted verbatim; the book points to 3.4.7 just before the exercise ('In R, a set is connected if and only if it is a (possibly unbounded) interval. This fact, together with Theorem 4.5.2, leads to a short proof of the Intermediate Value Theorem (Exercise 4.5.1)'). Abbott's connectedness is Definition 3.4.4 (separated sets), quoted in abbott-3.4.6. Verified against page images (pdf 117, 147, 150)."

  - cid: lebl-3.5.4

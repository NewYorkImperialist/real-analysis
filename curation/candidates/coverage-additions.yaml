    machinery: "Negating convergence at infinity: an infinite limit is a form of divergence, not a limit in R."
    standardResult: "f(x) -> infinity as x -> infinity implies f has no finite limit at infinity"
    topic: continuity
    subtopics: [limits-at-infinity, functional-limits]
    skills: [negate-definition, contradiction]
    difficulty: introductory
    difficultyRationale: "Compare the two definitions with one well-chosen epsilon and N."
    category: canonical
    type: proof
    tags: [infinite-limit, limit-at-infinity, divergence, negation]
    references: ["Definition 3.5.1 (quoted)", "Definition 3.5.6 (quoted)"]
    problemLatex: |
      Let us justify terminology. Let $f\colon \mathbb{R} \to \mathbb{R}$ be a function such that $\lim_{x\to\infty} f(x) = \infty$ (diverges to infinity). Show that $f(x)$ diverges (i.e. does not converge) as $x \to \infty$.

      *(Definition 3.5.1, convergence part: Let $f\colon S \to \mathbb{R}$ be a function, where $\infty$ is a cluster point of $S$. If there exists an $L \in \mathbb{R}$ with the property that for every $\epsilon > 0$, there is an $M \in \mathbb{R}$ such that $|f(x) - L| < \epsilon$ whenever $x \in S$ and $x \geq M$, then we say $f(x)$ converges to $L$ as $x$ goes to $\infty$.)*

      *(Definition 3.5.6: Let $f\colon S \to \mathbb{R}$ be a function and suppose $S$ has $\infty$ as a cluster point. We say $f(x)$ diverges to infinity as $x$ goes to $\infty$ if for every $N \in \mathbb{R}$ there exists an $M \in \mathbb{R}$ such that $f(x) > N$ whenever $x \in S$ and $x \geq M$. We write $\lim_{x\to\infty} f(x) := \infty$.)*
    transcriptionNotes: "Definitions 3.5.1 (p. 145; the convergence sentence) and 3.5.6 (pp. 146–147) quoted verbatim, the latter's last sentence shortened to the notation. Verified against page images (pdf 145–148)."


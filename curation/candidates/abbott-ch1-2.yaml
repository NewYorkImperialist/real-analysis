      *(Theorem 2.8.1: Let $\{a_{ij} : i, j \in \mathbb{N}\}$ be a doubly indexed array of real numbers. If $\sum_{i=1}^{\infty} \sum_{j=1}^{\infty} |a_{ij}|$ converges, then both $\sum_{i=1}^{\infty} \sum_{j=1}^{\infty} a_{ij}$ and $\sum_{j=1}^{\infty} \sum_{i=1}^{\infty} a_{ij}$ converge to the same value. Moreover, $\lim_{n\to\infty} s_{nn} = \sum_{i=1}^{\infty} \sum_{j=1}^{\infty} a_{ij} = \sum_{j=1}^{\infty} \sum_{i=1}^{\infty} a_{ij}$, where $s_{nn} = \sum_{i=1}^{n} \sum_{j=1}^{n} a_{ij}$.)*


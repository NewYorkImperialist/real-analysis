    problemLatex: |
      **(Cut Property).** The Cut Property of the real numbers is the following:

      If $A$ and $B$ are nonempty, disjoint sets with $A \cup B = \mathbb{R}$ and $a < b$ for all $a \in A$ and $b \in B$, then there exists $c \in \mathbb{R}$ such that $x \le c$ whenever $x \in A$ and $x \ge c$ whenever $x \in B$.
      (a) Use the Axiom of Completeness to prove the Cut Property.
      (b) Show that the implication goes the other way; that is, assume $\mathbb{R}$ possesses the Cut Property and let $E$ be a nonempty set that is bounded above. Prove $\sup E$ exists.
      (c) The punchline of parts (a) and (b) is that the Cut Property could be used in place of the Axiom of Completeness as the fundamental axiom that distinguishes the real numbers from the rational numbers. To drive this point home, give a concrete example showing that the Cut Property is not a valid statement when $\mathbb{R}$ is replaced by $\mathbb{Q}$.


    problemLatex: |
      Here are two useful definitions:
      (i) A sequence $(a_n)$ is *eventually* in a set $A \subseteq \mathbb{R}$ if there exists an $N \in \mathbb{N}$ such that $a_n \in A$ for all $n \ge N$.
      (ii) A sequence $(a_n)$ is *frequently* in a set $A \subseteq \mathbb{R}$ if, for every $N \in \mathbb{N}$, there exists an $n \ge N$ such that $a_n \in A$.

      (a) Is the sequence $(-1)^n$ eventually or frequently in the set $\{1\}$?
      (b) Which definition is stronger? Does frequently imply eventually or does eventually imply frequently?
      (c) Give an alternate rephrasing of Definition 2.2.3B using either frequently or eventually. Which is the term we want?
      (d) Suppose an infinite number of terms of a sequence $(x_n)$ are equal to $2$. Is $(x_n)$ necessarily eventually in the interval $(1.9, 2.1)$? Is it frequently in $(1.9, 2.1)$?

      *(Definition 2.2.3B (Convergence of a Sequence: Topological Version): A sequence $(a_n)$ converges to $a$ if, given any $\epsilon$-neighborhood $V_\epsilon(a)$ of $a$, there exists a point in the sequence after which all of the terms are in $V_\epsilon(a)$. In other words, every $\epsilon$-neighborhood contains all but a finite number of the terms of $(a_n)$. Here $V_\epsilon(a) = \{x \in \mathbb{R} : |x - a| < \epsilon\}$.)*
    transcriptionNotes: "Definition 2.2.3B and the definition of V_eps(a) (Definition 2.2.4) quoted from p. 43."


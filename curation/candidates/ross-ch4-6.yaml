    skills: [contradiction, subsequence-extraction, bolzano-weierstrass]
    difficulty: hard
    difficultyRationale: "Rated on (a): contradiction with a subsequence argument that combines monotonicity and continuity at the limit point; (b) is a reduction to (a)."
    category: canonical
    type: proof
    tags: [Dini, uniform-convergence, compactness, monotone, Bolzano-Weierstrass]
    references: []
    problemLatex: |
      Let $(f_n)$ be a sequence of continuous functions on $[a, b]$.

      (a) Suppose that, for each $x$ in $[a, b]$, $(f_n(x))$ is a decreasing sequence of real numbers. Prove that if $f_n \to 0$ pointwise on $[a, b]$, then $f_n \to 0$ uniformly on $[a, b]$. *Hint*: If not, there exists $\epsilon > 0$ and a sequence $(x_n)$ in $[a, b]$ such that $f_n(x_n) \ge \epsilon$ for all $n$. Obtain a contradiction.

      (b) Suppose that, for each $x$ in $[a, b]$, $(f_n(x))$ is an increasing sequence of real numbers. Prove that if $f_n \to f$ pointwise on $[a, b]$ and if $f$ is continuous on $[a, b]$, then $f_n \to f$ uniformly on $[a, b]$. This is *Dini's theorem*.
    bookHint: |
      (a) Note $f_n(x) \ge 0$ for all $x$ and $n$. Assume $(f_n)$ does not converge to 0 uniformly on $[a, b]$. Then there exists $\epsilon > 0$ such that

      for each $N$ there exists $n > N$ and $x \in [a, b]$ such that $f_n(x) \ge \epsilon$. $\quad (1)$

      We claim

      for each $n \in \mathbb{N}$ there is $x_n \in [a, b]$ where $f_n(x_n) \ge \epsilon$. $\quad (2)$

      If not, there is $n_0 \in \mathbb{N}$ such that $f_{n_0}(x) < \epsilon$ for all $x \in [a, b]$. Since $(f_n(x))$ is decreasing for each $x$, we conclude $f_n(x) < \epsilon$ for all $x \in [a, b]$ and $n \ge n_0$. This clearly contradicts (1). We have now established the hint.

      Now by the Bolzano-Weierstrass theorem, the sequence $(x_n)$ given by (2) has a convergent subsequence $(x_{n_k})$: $x_{n_k} \to x_0$. Since $\lim f_n(x_0) = 0$, there exists $m$ such that $f_m(x_0) < \epsilon$. Since $x_{n_k} \to x_0$ and $f_m$ is continuous at $x_0$, we have $\lim_{k\to\infty} f_m(x_{n_k}) = f_m(x_0) < \epsilon$. So there exists $K$ such that

      $k > K$ implies $f_m(x_{n_k}) < \epsilon$.

      If $k > \max\{K, m\}$, then $n_k \ge k > m$, so

      $f_{n_k}(x_{n_k}) \le f_m(x_{n_k}) < \epsilon$.

      But $f_n(x_n) \ge \epsilon$ for *all* $n$, so we have a contradiction.

      (b) *Hint*: Show part (a) applies to the sequence $g_n$ where $g_n = f - f_n$.
    transcriptionNotes: "Verified against page image. bookHint verbatim from PDF p. 397 (printed 388) — a full solution of (a). In the printed hint, claim (2) reads 'for each n in N' with a plain italic N; rendered as \\mathbb{N} (obvious typo)."


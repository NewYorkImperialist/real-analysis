      (c) $\int_0^1 f_n(x)\,dx = \frac{n}{(n+1)(n+2)} \to 0 = \int_0^1 f(x)\,dx$.
    transcriptionNotes: "Verified against page image. bookHint verbatim from PDF pp. 395–396 (printed 386–387); it references Remark 24.4 (uniform convergence iff sup|f - f_n| -> 0; see ross-24.12)."


      Use Theorem 34.3 to prove Theorem 34.1 for the case $g'$ is continuous. *Hint*: Let $F(x) = \int_a^x g'$; then $F' = g'$. Apply Corollary 29.5.

      *(Theorem 34.1 [Fundamental Theorem of Calculus I]: If $g$ is a continuous function on $[a, b]$ that is differentiable on $(a, b)$, and if $g'$ is integrable on $[a, b]$, then $\int_a^b g' = g(b) - g(a)$.*

      *Theorem 34.3 [Fundamental Theorem of Calculus II]: Let $f$ be an integrable function on $[a, b]$. For $x$ in $[a, b]$, let $F(x) = \int_a^x f(t)\,dt$. Then $F$ is continuous on $[a, b]$. If $f$ is continuous at $x_0$ in $(a, b)$, then $F$ is differentiable at $x_0$ and $F'(x_0) = f(x_0)$.*

      *Corollary 29.5: Let $f$ and $g$ be differentiable functions on $(a, b)$ such that $f' = g'$ on $(a, b)$. Then there exists a constant $c$ such that $f(x) = g(x) + c$ for all $x \in (a, b)$.)*
    transcriptionNotes: "Verified against page image. Theorems 34.1, 34.3 and Corollary 29.5 quoted verbatim. No book hint."


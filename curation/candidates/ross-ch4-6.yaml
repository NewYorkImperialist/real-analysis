    problemLatex: |
      Let $f_n(x) = \frac{n + \cos x}{2n + \sin^2 x}$ for all real numbers $x$.

      (a) Show $(f_n)$ converges uniformly on $\mathbb{R}$. *Hint*: First decide what the limit function is; then show $(f_n)$ converges uniformly to it.

      (b) Calculate $\lim_{n\to\infty} \int_2^7 f_n(x)\,dx$. *Hint*: Don't integrate $f_n$.
    bookHint: |
      (a) Since $f_n(x) = (1 + (\cos x)/n)/(2 + (\sin^2 x)/n)$, we have $f_n \to \frac12$ pointwise. To obtain uniform convergence, show
      $$\left|f_n(x) - \frac12\right| = \left|\frac{2\cos x - \sin^2 x}{2(2n + \sin^2 x)}\right| \le \frac{3}{2(2n)} < \epsilon$$
      for all real numbers $x$ and all $n > \frac{3}{4\epsilon}$.

      (b) $\int_2^7 \frac12\,dx = \frac52$, by Theorem 25.2.
    transcriptionNotes: "Verified against page image. bookHint from PDF p. 396 (printed 387). Theorem 25.2: if continuous f_n -> f uniformly on [a,b] then the integrals converge."


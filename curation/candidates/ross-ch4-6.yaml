    transcriptionNotes: "Verified against page image. The bookHint is the book's printed answer to Exercise 33.11(c) (PDF p. 401, printed 392), which 33.10's in-exercise hint explicitly references; for sin(1/x) the oscillation bound on the middle interval changes (oscillation 2 instead of epsilon/4), so the epsilon/8 bookkeeping must be adapted. 33.11 itself (x sgn(sin 1/x)) skipped as the near-duplicate."


  - cid: ross-23.5
    chapter: "4 Sequences and Series of Functions"
    section: "§23 Power Series"
    number: "Exercise 23.5"
    page: "192"
    pdfPage: 202
    verdict: strong
    machinery: "Uses the Cauchy–Hadamard formula R = 1/limsup|a_n|^{1/n} with limsup arguments on subsequences."
    standardResult: "integer coefficients (infinitely many nonzero) or limsup|a_n|>0 forces R <= 1"
    topic: series
    subtopics: [power-series, limsup-liminf]
    skills: [limsup-estimate, subsequence-extraction]
    difficulty: easy
    difficultyRationale: "Short limsup argument once the Cauchy–Hadamard formula is in hand; (b) needs a subsequence bound and c^{1/n} -> 1."
    category: canonical
    type: proof
    tags: [power-series, radius-of-convergence, limsup, Cauchy-Hadamard]
    references: []
    problemLatex: |
      Consider a power series $\sum a_n x^n$ with radius of convergence $R$.

      (a) Prove that if all the coefficients $a_n$ are integers and if infinitely many of them are nonzero, then $R \le 1$.

      (b) Prove that if $\limsup |a_n| > 0$, then $R \le 1$.
    bookHint: |
      (a) Since $|a_n| \ge 1$ for infinitely many $n$, we have $\sup\{|a_n|^{1/n} : n > N\} \ge 1$ for all $N$. Thus $\beta = \limsup |a_n|^{1/n} \ge 1$; hence $R = \frac{1}{\beta} \le 1$.

      (b) Select $c$ so that $0 < c < \limsup |a_n|$. Then $\sup\{|a_n| : n > N\} > c$ for all $N$. A subsequence $(a_{n_k})$ of $(a_n)$ has the property that $|a_{n_k}| > c$ for all $k$. Since $|a_{n_k}|^{1/n_k} > (c)^{1/n_k}$ and $\lim_{k\to\infty} c^{1/n_k} = 1$ [by Theorem 9.7(d)], Theorem 12.1 shows $\limsup |a_{n_k}|^{1/n_k} \ge 1$. It follows that $\beta = \limsup |a_n|^{1/n} \ge 1$ [use Theorem 11.8]. Hence $R = \frac{1}{\beta} \le 1$.
    transcriptionNotes: "Verified against page image. bookHint verbatim from Selected Hints and Answers, PDF p. 395 (printed 386); it cites book theorems (9.7(d), 12.1, 11.8) by number. In Ross, R = 1/beta with beta = limsup |a_n|^{1/n} (Theorem 23.1)."


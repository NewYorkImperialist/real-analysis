    references: []
    problemLatex: |
      Let $f$ and $g$ be differentiable on an open interval $I$ and consider $a \in I$. Define $h$ on $I$ by the rules: $h(x) = f(x)$ for $x < a$, and $h(x) = g(x)$ for $x \ge a$. Prove $h$ is differentiable at $a$ if and only if both $f(a) = g(a)$ and $f'(a) = g'(a)$ hold. *Suggestion*: Draw a picture to see what is going on.
    bookHint: |
      Suppose $f(a) = g(a)$. Then
      $$\lim_{x\to a^+} \frac{h(x) - h(a)}{x - a} = g'(a) \quad \text{and} \quad \lim_{x\to a^-} \frac{h(x) - h(a)}{x - a} = f'(a). \quad (1)$$
      If also $f'(a) = g'(a)$, then Theorem 20.10 shows $h'(a)$ exists and, in fact, $h'(a) = f'(a) = g'(a)$.

      Now suppose $h$ is differentiable at $a$. Then $h$ is continuous at $a$ and so $f(a) = \lim_{x\to a^-} f(x) = \lim_{x\to a^-} h(x) = h(a) = g(a)$. Hence (1) holds. But the limits in (1) both equal $h'(a)$, so $f'(a) = g'(a)$.
    transcriptionNotes: "Verified against page image. bookHint from PDF pp. 399–400 (printed 390–391) — a full solution. Theorem 20.10: a two-sided limit exists iff both one-sided limits exist and are equal."


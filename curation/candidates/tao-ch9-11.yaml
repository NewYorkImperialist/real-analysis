      Prove Proposition 9.4.7. (Hint: this can largely be done by applying the previous propositions and lemmas. Note that to prove (a),(b), and (c) are equivalent, you do not have to prove all six equivalences, but you do have to prove at least three; for instance, showing that (a) implies (b), (b) implies (c), and (c) implies (a) will suffice, although this is not necessarily the shortest or simplest way to do this question.)

      *(Proposition 9.4.7 (Equivalent formulations of continuity), quoted: Let $X$ be a subset of $\mathbf{R}$, let $f : X \to \mathbf{R}$ be a function, and let $x_0$ be an element of $X$. Then the following four statements are logically equivalent:*

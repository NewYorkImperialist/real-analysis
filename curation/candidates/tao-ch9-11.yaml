      *(Proposition 11.10.1 (Integration by parts formula), quoted: Let $I = [a, b]$, and let $F : [a, b] \to \mathbf{R}$ and $G : [a, b] \to \mathbf{R}$ be differentiable functions on $[a, b]$ such that $F'$ and $G'$ are Riemann integrable on $I$. Then we have*

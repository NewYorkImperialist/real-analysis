      *(Theorem 10.1.15 (Chain rule), quoted: Let $X, Y$ be subsets of $\mathbf{R}$, let $x_0 \in X$ be a limit point of $X$, and let $y_0 \in Y$ be a limit point of $Y$. Let $f : X \to Y$ be a function such that $f(x_0) = y_0$, and such that $f$ is differentiable at $x_0$. Suppose that $g : Y \to \mathbf{R}$ is a function which is differentiable at $y_0$. Then the function $g \circ f : X \to \mathbf{R}$ is differentiable at $x_0$, and*

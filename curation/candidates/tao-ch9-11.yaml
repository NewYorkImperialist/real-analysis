    references: []
    problemLatex: |
      In this exercise we give an example of a function which has a discontinuity at every rational point, but is continuous at every irrational. Since the rationals are countable, we can write them as $\mathbf{Q} = \{q(0), q(1), q(2), \ldots\}$, where $q : \mathbf{N} \to \mathbf{Q}$ is a bijection from $\mathbf{N}$ to $\mathbf{Q}$. Now define a function $g : \mathbf{Q} \to \mathbf{R}$ by setting $g(q(n)) := 2^{-n}$ for each natural number $n$; thus $g$ maps $q(0)$ to $1$, $q(1)$ to $2^{-1}$, etc. Since $\sum_{n=0}^\infty 2^{-n}$ is absolutely convergent, we see that $\sum_{r\in\mathbf{Q}} g(r)$ is also absolutely convergent. Now define the function $f : \mathbf{R} \to \mathbf{R}$ by
      $$f(x) := \sum_{r\in\mathbf{Q}: r<x} g(r).$$
      Since $\sum_{r\in\mathbf{Q}} g(r)$ is absolutely convergent, we know that $f(x)$ is well-defined for every real number $x$.
      (a) Show that $f$ is strictly monotone increasing. (Hint: you will need Proposition 5.4.14.)
      (b) Show that for every rational number $r$, $f$ is discontinuous at $r$. (Hint: since $r$ is rational, $r = q(n)$ for some natural number $n$. Show that $f(x) \ge f(r) + 2^{-n}$ for all $x > r$.)
      (c) Show that for every irrational number $x$, $f$ is continuous at $x$. (Hint: first demonstrate that the functions
      $$f_n(x) := \sum_{r\in\mathbf{Q}: r<x,\, g(r)\ge 2^{-n}} g(r)$$
      are continuous at $x$, and that $|f(x) - f_n(x)| \le 2^{-n}$.)
    transcriptionNotes: "Verified on page images (PDF 259–260). Tao's N includes 0. Proposition 5.4.14 (in hint) is the density of Q: between any two reals there is a rational."


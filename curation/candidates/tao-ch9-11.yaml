      *(Proposition 9.9.8, quoted: Let $X$ be a subset of $\mathbf{R}$, and let $f : X \to \mathbf{R}$ be a function. Then the following two statements are logically equivalent:*
      *(a) $f$ is uniformly continuous on $X$.*
      *(b) Whenever $(x_n)_{n=0}^\infty$ and $(y_n)_{n=0}^\infty$ are two equivalent sequences consisting of elements of $X$, the sequences $(f(x_n))_{n=0}^\infty$ and $(f(y_n))_{n=0}^\infty$ are also equivalent.)*

      *(Definition 9.9.2 (Uniform continuity), quoted: Let $X$ be a subset of $\mathbf{R}$, and let $f : X \to \mathbf{R}$ be a function. We say that $f$ is uniformly continuous if, for every $\varepsilon > 0$, there exists a $\delta > 0$ such that $f(x)$ and $f(x_0)$ are $\varepsilon$-close whenever $x, x_0 \in X$ are two points in $X$ which are $\delta$-close.)*

      *(Definition 9.9.5 (Equivalent sequences), quoted: Let $m$ be an integer, let $(a_n)_{n=m}^\infty$ and $(b_n)_{n=m}^\infty$ be two sequences of real numbers, and let $\varepsilon > 0$ be given. We say that $(a_n)_{n=m}^\infty$ is $\varepsilon$-close to $(b_n)_{n=m}^\infty$ iff $a_n$ is $\varepsilon$-close to $b_n$ for each $n \ge m$. We say that $(a_n)_{n=m}^\infty$ is eventually $\varepsilon$-close to $(b_n)_{n=m}^\infty$ iff there exists an $N \ge m$ such that the sequences $(a_n)_{n=N}^\infty$ and $(b_n)_{n=N}^\infty$ are $\varepsilon$-close. Two sequences $(a_n)_{n=m}^\infty$ and $(b_n)_{n=m}^\infty$ are equivalent iff for each $\varepsilon > 0$, the sequences $(a_n)_{n=m}^\infty$ and $(b_n)_{n=m}^\infty$ are eventually $\varepsilon$-close.)*

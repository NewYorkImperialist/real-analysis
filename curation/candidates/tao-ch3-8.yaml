    tags: [Riemann-rearrangement, conditional-convergence, rearrangement]
    references: ["Theorem 8.2.8 and its proof sketch (quoted)", "Lemma 8.2.7 (see tao-8.2.4)"]
    problemLatex: |
      Explain the gaps marked (why?) in the proof of Theorem 8.2.8.

      *(Theorem 8.2.8: Let $\sum_{n=0}^\infty a_n$ be a series which is conditionally convergent, but not absolutely convergent, and let $L$ be any real number. Then there exists a bijection $f\colon \mathbb{N} \to \mathbb{N}$ such that $\sum_{m=0}^\infty a_{f(m)}$ converges conditionally to $L$.*

      *Proof. (Optional) We give a sketch of the proof, leaving the details to be filled in in Exercise 8.2.5. Let $A_+$ and $A_-$ be the sets in Lemma 8.2.7; from that lemma we know that $\sum_{n \in A_+} a_n$ and $\sum_{n \in A_-} a_n$ both fail to be absolutely convergent. In particular $A_+$ and $A_-$ are infinite (why?). By Proposition 8.1.5 we can then find increasing bijections $f_+\colon \mathbb{N} \to A_+$ and $f_-\colon \mathbb{N} \to A_-$. Thus the sums $\sum_{m=0}^\infty a_{f_+(m)}$ and $\sum_{m=0}^\infty a_{f_-(m)}$ both fail to be absolutely convergent (why?). The plan shall be to select terms from the divergent series $\sum_{m=0}^\infty a_{f_+(m)}$ and $\sum_{m=0}^\infty a_{f_-(m)}$ in a well-chosen order in order to keep their difference converging towards $L$.*

      *We define the sequence $n_0, n_1, n_2, \ldots$ of natural numbers recursively as follows. Suppose that $j$ is a natural number, and that $n_i$ has already been defined for all $i < j$ (this is vacuously true if $j = 0$). We then define $n_j$ by the following rule:*

      *(I) If $\sum_{0 \le i < j} a_{n_i} < L$, then we set* $$n_j := \min\{n \in A_+ : n \ne n_i \text{ for all } i < j\}.$$

      *(II) If instead $\sum_{0 \le i < j} a_{n_i} \ge L$, then we set* $$n_j := \min\{n \in A_- : n \ne n_i \text{ for all } i < j\}.$$

      *Note that this recursive definition is well-defined because $A_+$ and $A_-$ are infinite, and so the sets $\{n \in A_+ : n \ne n_i \text{ for all } i < j\}$ and $\{n \in A_- : n \ne n_i \text{ for all } i < j\}$ are never empty. (Intuitively, we add a non-negative number to the series whenever the partial sum is too low, and add a negative number when the sum is too high.) One can then verify the following claims:*

      *• The map $j \mapsto n_j$ is injective. (Why?)*

      *• Case I occurs an infinite number of times, and Case II also occurs an infinite number of times. (Why? prove by contradiction.)*

      *• The map $j \mapsto n_j$ is surjective. (Why?)*

      *• We have $\lim_{j\to\infty} a_{n_j} = 0$. (Why? Note from Corollary 7.2.6 that $\lim_{n\to\infty} a_n = 0$.)*

      *• We have $\lim_{j\to\infty} \sum_{0 \le i < j} a_{n_i} = L$. (Why?)*

      *The claim then follows by setting $f(i) := n_i$ for all $i$.)*
    transcriptionNotes: "Theorem 8.2.8 and its full proof sketch (pp.193-194) quoted verbatim, verified against page image. One unambiguous typo fixed inside the quote: the book prints 'the sets {n ∈ A+ : ...} and n_j := min{n ∈ A− : ...} are never empty'; the stray 'n_j := min' was removed. Lemma 8.2.7 (A_± parts diverge) quoted in tao-8.2.4; Proposition 8.1.5 (increasing bijection N → infinite subset of N) quoted in tao-8.1.4. Long context; curator may prefer another source's direct statement of Riemann's theorem."


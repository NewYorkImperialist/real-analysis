      *(Definition 6.1.5 (Convergence of sequences): Let $\varepsilon > 0$ be a real number, and let $L$ be a real number. A sequence $(a_n)_{n=N}^\infty$ of real numbers is said to be $\varepsilon$-close to $L$ iff $a_n$ is $\varepsilon$-close to $L$ for every $n \ge N$, i.e., we have $|a_n - L| \le \varepsilon$ for every $n \ge N$. We say that a sequence $(a_n)_{n=m}^\infty$ is eventually $\varepsilon$-close to $L$ iff there exists an $N \ge m$ such that $(a_n)_{n=N}^\infty$ is $\varepsilon$-close to $L$. We say that a sequence $(a_n)_{n=m}^\infty$ converges to $L$ iff it is eventually $\varepsilon$-close to $L$ for every real $\varepsilon > 0$.)*
    transcriptionNotes: "Definition 6.1.5 (p.128) quoted verbatim since the exercise only has content relative to it. Low value outside Tao's framework."


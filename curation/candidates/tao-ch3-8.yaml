      *(Proposition 8.1.4 (Well ordering principle): Let $X$ be a non-empty subset of the natural numbers $\mathbb{N}$. Then there exists exactly one element $n \in X$ such that $n \le m$ for all $m \in X$. In other words, every non-empty set of natural numbers has a minimum element.)*


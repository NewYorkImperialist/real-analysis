  - cid: tao-6.1.8
    chapter: "6 Limits of sequences"
    section: "6.1 Convergence and limit laws"
    number: "Exercise 6.1.8"
    page: "133"
    pdfPage: 150
    verdict: strong
    machinery: "Full proof of the limit laws, including the bounded-away-from-zero lemma for reciprocals."
    standardResult: "algebraic limit theorem for sequences (sum, product, quotient, max/min)"
    topic: sequences
    subtopics: [limit-laws]
    skills: [epsilon-N-proof, triangle-inequality, bounded-away-from-zero]
    difficulty: easy
    difficultyRationale: "Each part is a standard ε–N estimate; the quotient part (e) is the hardest essential piece."
    category: canonical
    type: proof
    tags: [limit-laws, epsilon-N, machinery]
    references: ["Theorem 6.1.19 (quoted)"]
    problemLatex: |
      Prove Theorem 6.1.19. (Hint: you can use some parts of the theorem to prove others, e.g., (b) can be used to prove (c); (a),(c) can be used to prove (d); and (b), (e) can be used to prove (f). The proofs are similar to those of Lemma 5.3.6, Proposition 5.3.10, and Lemma 5.3.15. For (e), you may need to first prove the auxiliary result that any sequence whose elements are non-zero, and which converges to a non-zero limit, is bounded away from zero.)

      *(Theorem 6.1.19 (Limit Laws): Let $(a_n)_{n=m}^\infty$ and $(b_n)_{n=m}^\infty$ be convergent sequences of real numbers, and let $x, y$ be the real numbers $x := \lim_{n\to\infty} a_n$ and $y := \lim_{n\to\infty} b_n$.*

      *(a) The sequence $(a_n + b_n)_{n=m}^\infty$ converges to $x + y$; in other words,* $$\lim_{n\to\infty}(a_n + b_n) = \lim_{n\to\infty} a_n + \lim_{n\to\infty} b_n.$$

      *(b) The sequence $(a_n b_n)_{n=m}^\infty$ converges to $xy$; in other words,* $$\lim_{n\to\infty}(a_n b_n) = \left(\lim_{n\to\infty} a_n\right)\left(\lim_{n\to\infty} b_n\right).$$

      *(c) For any real number $c$, the sequence $(c a_n)_{n=m}^\infty$ converges to $cx$; in other words,* $$\lim_{n\to\infty}(c a_n) = c \lim_{n\to\infty} a_n.$$

      *(d) The sequence $(a_n - b_n)_{n=m}^\infty$ converges to $x - y$; in other words,* $$\lim_{n\to\infty}(a_n - b_n) = \lim_{n\to\infty} a_n - \lim_{n\to\infty} b_n.$$

      *(e) Suppose that $y \ne 0$, and that $b_n \ne 0$ for all $n \ge m$. Then the sequence $(b_n^{-1})_{n=m}^\infty$ converges to $y^{-1}$; in other words,* $$\lim_{n\to\infty} b_n^{-1} = \left(\lim_{n\to\infty} b_n\right)^{-1}.$$

      *(f) Suppose that $y \ne 0$, and that $b_n \ne 0$ for all $n \ge m$. Then the sequence $(a_n/b_n)_{n=m}^\infty$ converges to $x/y$; in other words,* $$\lim_{n\to\infty} \frac{a_n}{b_n} = \frac{\lim_{n\to\infty} a_n}{\lim_{n\to\infty} b_n}.$$

      *(g) The sequence $(\max(a_n, b_n))_{n=m}^\infty$ converges to $\max(x, y)$; in other words,* $$\lim_{n\to\infty} \max(a_n, b_n) = \max\left(\lim_{n\to\infty} a_n, \lim_{n\to\infty} b_n\right).$$

      *(h) The sequence $(\min(a_n, b_n))_{n=m}^\infty$ converges to $\min(x, y)$; in other words,* $$\lim_{n\to\infty} \min(a_n, b_n) = \min\left(\lim_{n\to\infty} a_n, \lim_{n\to\infty} b_n\right).$$ *)*
    transcriptionNotes: "Theorem 6.1.19 (pp.131-132) quoted verbatim. The hint's references to Lemma 5.3.6, Proposition 5.3.10, Lemma 5.3.15 (Tao's Cauchy-sequence construction) are left as printed; they are not needed to understand the task."


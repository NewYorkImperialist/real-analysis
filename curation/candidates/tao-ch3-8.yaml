  - cid: tao-6.4.3
    chapter: "6 Limits of sequences"
    section: "6.4 Limsup, liminf, and limit points"
    number: "Exercise 6.4.3"
    page: "147"
    pdfPage: 164
    verdict: core
    machinery: "Foundational properties of limsup/liminf from the inf-sup definition: ordering, extremal limit points, and the convergence criterion limsup = liminf."
    standardResult: "limsup/liminf are the largest/smallest limit points; a_n → c iff limsup = liminf = c"
    topic: sequences
    subtopics: [limsup-liminf]
    skills: [sup-approximation, epsilon-N-proof, unwrap-definition]
    difficulty: medium
    difficultyRationale: "Four parts; (e) (finite L+ is a limit point) and (f) require combining the eventually-below and infinitely-often-above properties."
    category: canonical
    type: proof
    tags: [limsup, liminf, limit-point, convergence, machinery]
    references: ["Proposition 6.4.12 (quoted)", "Definition 6.4.6 (quoted)", "Definition 6.4.1 (quoted, unwrapped form)"]
    problemLatex: |
      Prove parts (c),(d),(e),(f) of Proposition 6.4.12. (Hint: you can use earlier parts of the proposition to prove later ones.)

      *(Definition 6.4.6 (Limit superior and limit inferior): Suppose that $(a_n)_{n=m}^\infty$ is a sequence. We define a new sequence $(a_N^+)_{N=m}^\infty$ by the formula $a_N^+ := \sup(a_n)_{n=N}^\infty$. ... We then define the limit superior of the sequence $(a_n)_{n=m}^\infty$, denoted $\limsup_{n\to\infty} a_n$, by the formula $\limsup_{n\to\infty} a_n := \inf(a_N^+)_{N=m}^\infty$. Similarly, we can define $a_N^- := \inf(a_n)_{n=N}^\infty$ and define the limit inferior of the sequence $(a_n)_{n=m}^\infty$, denoted $\liminf_{n\to\infty} a_n$, by the formula $\liminf_{n\to\infty} a_n := \sup(a_N^-)_{N=m}^\infty$.)*

      *(Limit point, from the text after Definition 6.4.1: $x$ is a limit point of $(a_n)_{n=m}^\infty$ if, for every $\varepsilon > 0$ and every $N \ge m$, there exists an $n \ge N$ such that $|a_n - x| \le \varepsilon$.)*

      *(Proposition 6.4.12: Let $(a_n)_{n=m}^\infty$ be a sequence of real numbers, let $L^+$ be the limit superior of this sequence, and let $L^-$ be the limit inferior of this sequence (thus both $L^+$ and $L^-$ are extended real numbers).*

      *(a) For every $x > L^+$, there exists an $N \ge m$ such that $a_n < x$ for all $n \ge N$. (In other words, for every $x > L^+$, the elements of the sequence $(a_n)_{n=m}^\infty$ are eventually less than $x$.) Similarly, for every $y < L^-$ there exists an $N \ge m$ such that $a_n > y$ for all $n \ge N$.*

      *(b) For every $x < L^+$, and every $N \ge m$, there exists an $n \ge N$ such that $a_n > x$. (In other words, for every $x < L^+$, the elements of the sequence $(a_n)_{n=m}^\infty$ exceed $x$ infinitely often.) Similarly, for every $y > L^-$ and every $N \ge m$, there exists an $n \ge N$ such that $a_n < y$.*

      *(c) We have $\inf(a_n)_{n=m}^\infty \le L^- \le L^+ \le \sup(a_n)_{n=m}^\infty$.*

      *(d) If $c$ is any limit point of $(a_n)_{n=m}^\infty$, then we have $L^- \le c \le L^+$.*

      *(e) If $L^+$ is finite, then it is a limit point of $(a_n)_{n=m}^\infty$. Similarly, if $L^-$ is finite, then it is a limit point of $(a_n)_{n=m}^\infty$.*

      *(f) Let $c$ be a real number. If $(a_n)_{n=m}^\infty$ converges to $c$, then we must have $L^+ = L^- = c$. Conversely, if $L^+ = L^- = c$, then $(a_n)_{n=m}^\infty$ converges to $c$.)*
    transcriptionNotes: "Proposition 6.4.12 (pp.143-144) and Definition 6.4.6 (p.141) quoted verbatim; the '...' in Def 6.4.6 omits one informal sentence ('More informally, a_N^+ is the supremum of all the elements in the sequence from a_N onwards.'). Sups/infs are taken in the extended reals, so a_N^+ may be +∞. Parts (a),(b) are proved in the book and may be used."


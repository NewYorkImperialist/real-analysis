  - cid: tao-6.3.4
    chapter: "6 Limits of sequences"
    section: "6.3 Suprema and infima of sequences"
    number: "Exercise 6.3.4"
    page: "139"
    pdfPage: 156
    verdict: strong
    machinery: "Divergence of x^n for x>1 by contradiction with limit laws; the lesson that one cannot assume a limit exists before manipulating it."
    standardResult: "x^n diverges for x>1; fallacy of assuming the limit exists"
    topic: sequences
    subtopics: [divergence, limit-laws]
    skills: [contradiction, limit-laws]
    difficulty: easy
    difficultyRationale: "Short contradiction argument plus a conceptual diagnosis of a fallacious proof."
    category: canonical
    type: conceptual
    tags: [divergence, geometric-sequence, limit-laws, fallacy]
    references: ["Proposition 6.3.10 (quoted)", "Example 1.2.3 (quoted)"]
    problemLatex: |
      Explain why Proposition 6.3.10 fails when $x > 1$. In fact, show that the sequence $(x^n)_{n=1}^\infty$ diverges when $x > 1$. (Hint: prove by contradiction and use the identity $(1/x)^n x^n = 1$ and the limit laws in Theorem 6.1.19.) Compare this with the argument in Example 1.2.3; can you now explain the flaws in the reasoning in that example?

      *(Proposition 6.3.10: Let $0 < x < 1$. Then we have $\lim_{n\to\infty} x^n = 0$.)*

      *(Example 1.2.3 (Divergent sequences): Here is a slight variation of the previous example. Let $x$ be a real number, and let $L$ be the limit* $$L = \lim_{n\to\infty} x^n.$$ *Changing variables $n = m + 1$, we have* $$L = \lim_{m+1\to\infty} x^{m+1} = \lim_{m+1\to\infty} x \times x^m = x \lim_{m+1\to\infty} x^m.$$ *But if $m + 1 \to \infty$, then $m \to \infty$, thus* $$\lim_{m+1\to\infty} x^m = \lim_{m\to\infty} x^m = \lim_{n\to\infty} x^n = L,$$ *and thus* $$xL = L.$$ *At this point we could cancel the $L$'s and conclude that $x = 1$ for an arbitrary real number $x$, which is absurd. But since we are already aware of the division by zero problem, we could be a little smarter and conclude instead that either $x = 1$, or $L = 0$. In particular we seem to have shown that* $$\lim_{n\to\infty} x^n = 0 \text{ for all } x \ne 1.$$ *But this conclusion is absurd if we apply it to certain values of $x$, for instance by specializing to the case $x = 2$ we could conclude that the sequence $1, 2, 4, 8, \ldots$ converges to zero, and by specializing to the case $x = -1$ we conclude that the sequence $1, -1, 1, -1, \ldots$ also converges to zero. These conclusions appear to be absurd; what is the problem with the above argument? (See Exercise 6.3.4 for an answer.))*
    transcriptionNotes: "Proposition 6.3.10 (p.138) and Example 1.2.3 (pp.4-5) quoted verbatim. The book's proof of Prop 6.3.10 (monotone convergence gives existence of L, then xL = L) is what 'fails' for x>1; not quoted."


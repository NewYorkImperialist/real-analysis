      *(Exercise 4.4.2, quoted in part: a sequence $a_0, a_1, a_2, \ldots$ of numbers (natural numbers, integers, rationals, or reals) is said to be in infinite descent if we have $a_n > a_{n+1}$ for all natural numbers $n$ (i.e., $a_0 > a_1 > a_2 > \ldots$). The principle of infinite descent: it is not possible to have a sequence of natural numbers which is in infinite descent.)*

      *(Theorem 5.5.9 (Existence of least upper bound), quoted: Let $E$ be a non-empty subset of $\mathbf{R}$. If $E$ has an upper bound, (i.e., $E$ has some upper bound $M$), then it must have exactly one least upper bound.)*

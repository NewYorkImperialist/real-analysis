      To gain a deeper understanding of the relationship between $\epsilon$ and $\delta$ in the definition of continuity, let's explore some modest variations of Definition 4.3.1. In all of these, let $f$ be a function defined on all of $\mathbb{R}$.

      (a) Let's say $f$ is *onetinuous* at $c$ if for all $\epsilon > 0$ we can choose $\delta = 1$ and it follows that $|f(x) - f(c)| < \epsilon$ whenever $|x - c| < \delta$. Find an example of a function that is onetinuous on all of $\mathbb{R}$.

      (b) Let's say $f$ is *equaltinuous* at $c$ if for all $\epsilon > 0$ we can choose $\delta = \epsilon$ and it follows that $|f(x) - f(c)| < \epsilon$ whenever $|x - c| < \delta$. Find an example of a function that is equaltinuous on $\mathbb{R}$ that is nowhere onetinuous, or explain why there is no such function.

      (c) Let's say $f$ is *lesstinuous* at $c$ if for all $\epsilon > 0$ we can choose $0 < \delta < \epsilon$ and it follows that $|f(x) - f(c)| < \epsilon$ whenever $|x - c| < \delta$. Find an example of a function that is lesstinuous on $\mathbb{R}$ that is nowhere equaltinuous, or explain why there is no such function.

      (d) Is every lesstinuous function continuous? Is every continuous function lesstinuous? Explain.

      *(Definition 4.3.1: A function $f\colon A \to \mathbb{R}$ is continuous at a point $c \in A$ if, for all $\epsilon > 0$, there exists a $\delta > 0$ such that whenever $|x - c| < \delta$ (and $x \in A$) it follows that $|f(x) - f(c)| < \epsilon$.)*
    transcriptionNotes: "Definition 4.3.1 quoted verbatim from p. 122."


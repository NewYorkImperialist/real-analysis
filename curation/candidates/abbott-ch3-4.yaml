    problemLatex: |
      Prove Theorem 3.4.6.

      *(Theorem 3.4.6: A set $E \subseteq \mathbb{R}$ is connected if and only if, for all nonempty disjoint sets $A$ and $B$ satisfying $E = A \cup B$, there always exists a convergent sequence $(x_n) \to x$ with $(x_n)$ contained in one of $A$ or $B$, and $x$ an element of the other.)*

      *(Definition 3.4.4: Two nonempty sets $A, B \subseteq \mathbb{R}$ are separated if $\overline{A} \cap B$ and $A \cap \overline{B}$ are both empty. A set $E \subseteq \mathbb{R}$ is disconnected if it can be written as $E = A \cup B$, where $A$ and $B$ are nonempty separated sets. A set that is not disconnected is called a connected set.)*
    transcriptionNotes: "Theorem 3.4.6 and Definition 3.4.4 quoted verbatim from pp. 104–105 (PDF 116–117)."


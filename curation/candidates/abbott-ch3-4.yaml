    problemLatex: |
      *(Definition 4.6.5: Let $f$ be defined on $\mathbb{R}$, and let $\alpha > 0$. The function $f$ is $\alpha$-continuous at $x \in \mathbb{R}$ if there exists a $\delta > 0$ such that for all $y, z \in (x - \delta, x + \delta)$ it follows that $|f(y) - f(z)| < \alpha$.)*

      Given a function $f$ on $\mathbb{R}$, define $D_f^\alpha$ to be the set of points where the function $f$ fails to be $\alpha$-continuous. In other words,
      $$D_f^\alpha = \{x \in \mathbb{R} : f \text{ is not } \alpha\text{-continuous at } x\}.$$

      Prove that, for a fixed $\alpha > 0$, the set $D_f^\alpha$ is closed.

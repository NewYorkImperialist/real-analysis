      *(Lemma 7.5.7: Let $(X,d_X)$ and $(Y,d_Y)$ be metric spaces. A function $f\colon X \to Y$ is continuous at $c \in X$ if and only if for every open neighborhood $U$ of $f(c)$ in $Y$, the set $f^{-1}(U)$ contains an open neighborhood of $c$ in $X$.)*

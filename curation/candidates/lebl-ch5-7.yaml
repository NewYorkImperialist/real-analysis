      *(Exercise 5.1.7: Suppose $f\colon [a,b] \to \mathbb{R}$ is Riemann integrable. Let $\epsilon > 0$ be given. Then show that there exists a partition $P = \{x_0, x_1, \ldots, x_n\}$ such that for every set of numbers $\{c_1, c_2, \ldots, c_n\}$ with $c_k \in [x_{k-1}, x_k]$ for all $k$, we have $\left| \int_a^b f - \sum_{k=1}^n f(c_k)\Delta x_k \right| < \epsilon$.)*
    transcriptionNotes: "Referenced Exercises 5.1.12 (Challenging) and 5.1.7 quoted verbatim from p. 190 and p. 189 (5.1.12's opening 'Generalize the previous exercise.' omitted). The essential hard step is the content of 5.1.12; the curator may prefer to present 5.1.12+5.1.13 as one item."


    problemLatex: |
      Let $f\colon (a,b) \to \mathbb{R}$ be a uniformly continuous function. Finish the proof of Proposition 3.4.6 by showing that the limit $\displaystyle\lim_{x\to b} f(x)$ exists.

      (Proposition 3.4.6: A function $f\colon (a,b) \to \mathbb{R}$ is uniformly continuous if and only if the limits
      $$L_a := \lim_{x\to a} f(x) \quad\text{and}\quad L_b := \lim_{x\to b} f(x)$$
      exist and the function $\widetilde{f}\colon [a,b] \to \mathbb{R}$ defined by
      $$\widetilde{f}(x) := \begin{cases} f(x) & \text{if } x \in (a,b), \\ L_a & \text{if } x = a, \\ L_b & \text{if } x = b \end{cases}$$
      is continuous.)
    transcriptionNotes: "Proposition 3.4.6 quoted verbatim from p. 140. The book's proof (before this exercise) treats the limit at a; the exercise asks for the symmetric limit at b — effectively a standalone problem: uniformly continuous on (a,b) implies lim_{x->b} f(x) exists."


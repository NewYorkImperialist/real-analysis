      Prove the $n$th *derivative test*. Suppose $n \in \mathbb{N}$, $x_0 \in (a,b)$, and $f\colon (a,b) \to \mathbb{R}$ is $n$ times continuously differentiable, with $f^{(k)}(x_0) = 0$ for $k = 1, 2, \ldots, n-1$, and $f^{(n)}(x_0) \neq 0$. Prove:

      a) If $n$ is odd, then $f$ has neither a relative minimum, nor a maximum at $x_0$.
      b) If $n$ is even, then $f$ has a strict relative minimum at $x_0$ if $f^{(n)}(x_0) > 0$ and a strict relative maximum at $x_0$ if $f^{(n)}(x_0) < 0$.


    difficultyRationale: "Direct definition; (d) needs crude bounding of numerator and denominator."
    category: canonical
    type: proof
    tags: [epsilon-N, limit-definition, machinery]
    references: []
    problemLatex: |
      Formal proofs are required in the following exercises.
      Prove the following:
      (a) $\lim \frac{(-1)^n}{n} = 0$
      (b) $\lim \frac{1}{n^{1/3}} = 0$
      (c) $\lim \frac{2n - 1}{3n + 2} = \frac{2}{3}$
      (d) $\lim \frac{n + 6}{n^2 - 6} = 0$
    bookHint: |
      (a) Formal Proof. Let $\epsilon > 0$. Let $N = \frac{1}{\epsilon}$. Then $n > N$ implies $|\frac{(-1)^n}{n} - 0| = \frac{1}{n} < \epsilon$.
      (b) Discussion. We want $n^{-1/3} < \epsilon$ or $\frac{1}{n} < \epsilon^3$ or $1/\epsilon^3 < n$. So for each $\epsilon > 0$, let $N = 1/\epsilon^3$. You should write out the formal proof.
      (c) Discussion. We want $|\frac{2n-1}{3n+2} - \frac{2}{3}| < \epsilon$ or $|\frac{-7}{(3n+2)\cdot 3}| < \epsilon$ or $\frac{7}{3(3n+2)} < \epsilon$ or $\frac{7}{3\epsilon} < 3n + 2$ or $\frac{7}{9\epsilon} - \frac{2}{3} < n$. So set $N$ equal to $\frac{7}{9\epsilon} - \frac{2}{3}$.
      (d) Discussion. We want $(n + 6)/(n^2 - 6) < \epsilon$; we assume $n > 2$ so that absolute values can be dropped. As in Example 3 we observe $n + 6 \le 7n$ and $n^2 - 6 \ge \frac{1}{2}n^2$ provided $n > 3$. So it suffices to get $7n/(\frac{1}{2}n^2) < \epsilon$ [for $n > 3$] or $\frac{14}{\epsilon} < n$. So try $N = \max\{3, \frac{14}{\epsilon}\}$.
    transcriptionNotes: "The sentence 'Formal proofs are required in the following exercises.' precedes the §8 exercise list in the book. bookHint from PDF pp. 379–380. Representative of 8.2."

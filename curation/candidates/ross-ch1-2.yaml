    references: ["Denseness of Q 4.7 (quoted)"]
    problemLatex: |
      Consider $a, b \in \mathbb{R}$ where $a < b$. Use Denseness of $\mathbb{Q}$ 4.7 to show there are infinitely many rationals between $a$ and $b$.
      *(Denseness of $\mathbb{Q}$ 4.7: If $a, b \in \mathbb{R}$ and $a < b$, then there is a rational $r \in \mathbb{Q}$ such that $a < r < b$.)*
    bookHint: |
      Proof. By 4.7 there is a rational $r_1$ such that $a < r_1 < b$. By 4.7 again, there is a rational $r_2$ such that $a < r_2 < r_1$. We continue by induction: If rationals $r_1, \ldots, r_n$ have been selected so that $a < r_n < r_{n-1} < \cdots < r_2 < r_1$, then 4.7 applies to $a < r_n$ to yield a rational $r_{n+1}$ such that $a < r_{n+1} < r_n$. This process yields an infinite set $\{r_1, r_2, \ldots\}$ in $\mathbb{Q} \cap (a, b)$.
      Alternative Proof. Assume $\mathbb{Q} \cap (a, b)$ is finite. The set is nonempty by 4.7. Let $c = \min(\mathbb{Q} \cap (a, b))$. Then $a < c$, so by 4.7 there is a rational $r$ such that $a < r < c$. Then $r$ belongs to $\mathbb{Q} \cap (a, b)$, so $c \le r$, a contradiction.
    transcriptionNotes: "Statement of 4.7 quoted from the book's theorem (PDF 37). bookHint from PDF pp. 378–379."

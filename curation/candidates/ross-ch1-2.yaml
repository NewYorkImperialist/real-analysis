    tags: [metric, completeness, R^k]
    references: []
    problemLatex: |
      For points $\mathbf{x}, \mathbf{y}$ in $\mathbb{R}^k$, let
      $$d_1(\mathbf{x}, \mathbf{y}) = \max\{|x_j - y_j| : j = 1, 2, \ldots, k\}$$
      and
      $$d_2(\mathbf{x}, \mathbf{y}) = \sum_{j=1}^{k} |x_j - y_j|.$$
      (a) Show $d_1$ and $d_2$ are metrics for $\mathbb{R}^k$.
      (b) Show $d_1$ and $d_2$ are complete metrics on $\mathbb{R}^k$.
    bookHint: |
      (a) It is clear that $d_1$ and $d_2$ satisfy D1 and D2 of Definition 13.1. If $\mathbf{x}, \mathbf{y}, \mathbf{z} \in \mathbb{R}^k$, then for each $j = 1, 2, \ldots, k$,
      $$|x_j - z_j| \le |x_j - y_j| + |y_j - z_j| \le d_1(\mathbf{x}, \mathbf{y}) + d_1(\mathbf{y}, \mathbf{z}),$$
      so $d_1(\mathbf{x}, \mathbf{z}) \le d_1(\mathbf{x}, \mathbf{y}) + d_1(\mathbf{y}, \mathbf{z})$. So $d_1$ satisfies the triangle inequality and a similar argument works for $d_2$; give it.
      (b) For the completeness of $d_1$ we use Theorem 13.4 and the inequalities
      $$d_1(\mathbf{x}, \mathbf{y}) \le d(\mathbf{x}, \mathbf{y}) \le \sqrt{k}\, d_1(\mathbf{x}, \mathbf{y}).$$
      In fact, if $(\mathbf{x}_n)$ is Cauchy for $d_1$, then the second inequality shows $(\mathbf{x}_n)$ is Cauchy for $d$. Hence by Theorem 13.4, for some $\mathbf{x} \in \mathbb{R}^k$ we have $\lim d(\mathbf{x}_n, \mathbf{x}) = 0$. By the first inequality, we also have $\lim d_1(\mathbf{x}_n, \mathbf{x}) = 0$, i.e., $(\mathbf{x}_n)$ converges to $\mathbf{x}$ in the metric $d_1$. For $d_2$, use the completeness of $d_1$ and the inequalities $d_1(\mathbf{x}, \mathbf{y}) \le d_2(\mathbf{x}, \mathbf{y}) \le k\, d_1(\mathbf{x}, \mathbf{y})$.
    transcriptionNotes: "Book uses bold x, y for points of R^k; rendered as \\mathbf. bookHint from PDF pp. 384–385 (Theorem 13.4: R^k with the Euclidean metric d is complete)."

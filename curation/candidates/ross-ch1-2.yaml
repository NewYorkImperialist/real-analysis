  - cid: ross-15.7
    chapter: "2 Sequences"
    section: "§15 Alternating Series and Integral Tests"
    number: "Exercise 15.7"
    page: "109"
    pdfPage: 121
    verdict: core
    machinery: "Cauchy-criterion tail estimate for decreasing terms: n a_n → 0."
    standardResult: "a_n decreasing and sum a_n converges ⇒ n a_n → 0"
    topic: series
    subtopics: [convergence-tests]
    skills: [cauchy-criterion, block-estimate]
    difficulty: medium
    difficultyRationale: "Requires the idea of bounding (n−N)a_n by a Cauchy block and then handling n > 2N."
    category: synthesis
    type: proof
    tags: [Cauchy-criterion, monotone-terms, harmonic-series]
    references: []
    problemLatex: |
      (a) Prove if $(a_n)$ is a decreasing sequence of real numbers and if $\sum a_n$ converges, then $\lim n a_n = 0$. Hint: Consider $|a_{N+1} + a_{N+2} + \cdots + a_n|$ for suitable $N$.
      (b) Use (a) to give another proof that $\sum \frac{1}{n}$ diverges.
    bookHint: |
      (a) Proof. Let $\epsilon > 0$. By the Cauchy criterion, there exists $N$ such that $n \ge m > N$ implies $|\sum_{k=m}^{n} a_k| < \frac{\epsilon}{2}$. In particular,
      $$n > N \quad\text{implies}\quad a_{N+1} + \cdots + a_n < \frac{\epsilon}{2}.$$
      So $n > N$ implies
      $$(n - N)a_n \le a_{N+1} + \cdots + a_n < \frac{\epsilon}{2}.$$
      If $n > 2N$, then $n < 2(n - N)$, so $n a_n < 2(n - N)a_n < \epsilon$. This proves $\lim(n a_n) = 0$.
    transcriptionNotes: "Note: a decreasing sequence with convergent series has a_n ≥ 0 (since a_n → 0). bookHint from PDF p. 387 (verified against image)."

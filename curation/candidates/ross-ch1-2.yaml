    tags: [compactness, sequential-compactness, Heine-Borel, Bolzano-Weierstrass]
    references: []
    problemLatex: |
      Let $E$ be a subset of $\mathbb{R}^k$. Show that $E$ is compact if and only if every sequence in $E$ has a subsequence converging to a point in $E$.
    bookHint: |
      Suppose $E$ is compact, hence closed and bounded by Theorem 13.12. Consider a sequence $(\mathbf{x}_n)$ in $E$. By Theorem 13.5, a subsequence of $(\mathbf{x}_n)$ converges to some $\mathbf{x}$ in $\mathbb{R}^k$. Since $E$ is closed, $\mathbf{x}$ must be *in* $E$; see Proposition 13.9(b).
      Suppose every sequence in $E$ has a subsequence converging to a point *in* $E$. By Theorem 13.12, it suffices to show $E$ is closed and bounded. If $E$ were unbounded, $E$ would contain a sequence $(\mathbf{x}_n)$ where $\lim d(\mathbf{x}_n, \mathbf{0}) = +\infty$ and then no subsequence would converge at all. Thus $E$ is bounded. If $E$ were nonclosed, then by Proposition 13.9 there would be a convergent sequence $(\mathbf{x}_n)$ in $E$ such that $\mathbf{x} = \lim \mathbf{x}_n \notin E$. Since every subsequence would also converge to $\mathbf{x} \notin E$, we would have a contradiction.
    transcriptionNotes: "Compact = every open cover has a finite subcover (Definition 13.11). bookHint from PDF p. 385 (Theorem 13.12 = Heine–Borel; Theorem 13.5 = Bolzano–Weierstrass in R^k)."

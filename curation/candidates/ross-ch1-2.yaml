  - cid: ross-8.1
    chapter: "2 Sequences"
    section: "§8 A Discussion about Proofs"
    number: "Exercise 8.1"
    page: "44"
    pdfPage: 56
    verdict: core
    machinery: "Formal epsilon-N proofs of limits from the definition."
    standardResult: "epsilon-N proofs of explicit limits"
    topic: sequences

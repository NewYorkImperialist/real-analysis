  - cid: ross-4.7
    chapter: "1 Introduction"
    section: "§4 The Completeness Axiom"
    number: "Exercise 4.7"
    page: "27"
    pdfPage: 39
    verdict: strong
    machinery: "Monotonicity of sup/inf under inclusion; sup of a union — least-upper-bound arguments."
    standardResult: "S ⊆ T ⇒ inf T ≤ inf S ≤ sup S ≤ sup T; sup(S∪T)=max(sup S, sup T)"
    topic: real-numbers
    subtopics: [supremum-infimum]
    skills: [least-upper-bound-argument]
    difficulty: easy
    difficultyRationale: "Requires both directions of a sup equality via the least-upper-bound property."
    category: canonical
    type: proof
    tags: [supremum, infimum, machinery]
    references: []
    problemLatex: |
      Let $S$ and $T$ be nonempty bounded subsets of $\mathbb{R}$.
      (a) Prove if $S \subseteq T$, then $\inf T \le \inf S \le \sup S \le \sup T$.
      (b) Prove $\sup(S \cup T) = \max\{\sup S, \sup T\}$. Note: In part (b), do not assume $S \subseteq T$.
    bookHint: |
      (a) Suppose $S \subseteq T$. Since $\sup T \ge t$ for all $t \in T$ we obviously have $\sup T \ge s$ for all $s \in S$. So $\sup T$ is an upper bound for the set $S$. Hence $\sup T$ is $\ge$ the least upper bound for $S$, i.e., $\sup T \ge \sup S$. A similar argument shows $\inf T \le \inf S$; give it.
      (b) Since $S \subseteq S \cup T$, $\sup S \le \sup(S \cup T)$ by (a). Similarly $\sup T \le \sup(S \cup T)$, so $\max\{\sup S, \sup T\} \le \sup(S \cup T)$. Since $\sup(S \cup T)$ is the least upper bound for $S \cup T$, we will have equality here provided we show: $\max\{\sup S, \sup T\}$ is an upper bound for the set $S \cup T$. This is easy. If $x \in S$, then $x \le \sup S \le \max\{\sup S, \sup T\}$ and if $x \in T$, then $x \le \sup T \le \max\{\sup S, \sup T\}$. That is, $x \le \max\{\sup S, \sup T\}$ for all $x \in S \cup T$.
    transcriptionNotes: "bookHint from PDF p. 378."

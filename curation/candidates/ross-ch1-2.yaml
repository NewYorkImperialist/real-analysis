    tags: [absolute-value, triangle-inequality, machinery]
    references: []
    problemLatex: |
      (a) Show $|b| \le a$ if and only if $-a \le b \le a$.
      (b) Prove $||a| - |b|| \le |a - b|$ for all $a, b \in \mathbb{R}$.
    bookHint: |
      (a) If $|b| \le a$, then $-a \le -|b|$, so $-a \le -|b| \le b \le |b| \le a$. Now suppose $-a \le b \le a$. If $b \ge 0$, then $|b| = b \le a$. If $b < 0$, then $|b| = -b \le a$; the last inequality holds by Theorem 3.2(i) since $-a \le b$.
      (b) By (a), it suffices to prove $-|a - b| \le |a| - |b| \le |a - b|$. Each of these inequalities follows from the triangle inequality: $|b| = |(b - a) + a| \le |b - a| + |a| = |a - b| + |a|$ which implies the first inequality; $|a| = |(a - b) + b| \le |a - b| + |b|$ which implies the second inequality.
    transcriptionNotes: "bookHint from PDF pp. 377–378."

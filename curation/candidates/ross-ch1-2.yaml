    problemLatex: |
      (a) Consider three sequences $(a_n)$, $(b_n)$ and $(s_n)$ such that $a_n \le s_n \le b_n$ for all $n$ and $\lim a_n = \lim b_n = s$. Prove $\lim s_n = s$. This is called the "squeeze lemma."

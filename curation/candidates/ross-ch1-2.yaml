    bookHint: |
      (a) Let $\epsilon > 0$. Our goal is to show $s - \epsilon < s_n < s + \epsilon$ for large $n$. Since $\lim a_n = s$, there exists $N_1$ so that $|a_n - s| < \epsilon$ for $n > N_1$. In particular,
      $$n > N_1 \quad\text{implies}\quad s - \epsilon < a_n. \qquad (1)$$
      Likewise there exists $N_2$ so that $|b_n - s| < \epsilon$ for $n > N_2$, so
      $$n > N_2 \quad\text{implies}\quad b_n < s + \epsilon. \qquad (2)$$
      Now
      $$n > \max\{N_1, N_2\} \quad\text{implies}\quad s - \epsilon < a_n \le s_n \le b_n < s + \epsilon;$$
      hence $|s - s_n| < \epsilon$.

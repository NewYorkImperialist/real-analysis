      *(Exercise 6.2.14: A sequence of functions $(f_n)$ defined on a set $E \subseteq \mathbb{R}$ is called equicontinuous if for every $\epsilon > 0$ there exists a $\delta > 0$ such that $|f_n(x) - f_n(y)| < \epsilon$ for all $n \in \mathbb{N}$ and $|x - y| < \delta$ in $E$. Exercise 6.2.13 shows: if $A$ is countable and $|f_n(x)| \le M$ for all $n$ and $x \in A$, then some subsequence of $(f_n)$ converges pointwise on $A$.)*


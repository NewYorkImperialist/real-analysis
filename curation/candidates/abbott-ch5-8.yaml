      Review the definition of uniform continuity (Definition 4.4.4). Given a differentiable function $f\colon A \to \mathbb{R}$, let's say that $f$ is *uniformly differentiable* on $A$ if, given $\epsilon > 0$ there exists a $\delta > 0$ such that
      $$\left| \frac{f(x) - f(y)}{x - y} - f'(y) \right| < \epsilon \quad \text{whenever } 0 < |x - y| < \delta.$$

      (a) Is $f(x) = x^2$ uniformly differentiable on $\mathbb{R}$? How about $g(x) = x^3$?

      (b) Show that if a function is uniformly differentiable on an interval $A$, then the derivative must be continuous on $A$.

      (c) Is there a theorem analogous to Theorem 4.4.7 for differentiation? Are functions that are differentiable on a closed interval $[a,b]$ necessarily uniformly differentiable?

      *(Theorem 4.4.7 (Uniform Continuity on Compact Sets): A function that is continuous on a compact set $K$ is uniformly continuous on $K$.)*
    transcriptionNotes: "Theorem 4.4.7 quoted verbatim from p. 133 (pdf 144). Definition 4.4.4 is the standard definition of uniform continuity and is left as a reference."


      (b) Let $\epsilon > 0$. By equicontinuity, there exists a $\delta > 0$ such that
      $$|g_k(x) - g_k(y)| < \frac{\epsilon}{3}$$
      for all $|x - y| < \delta$ and $k \in \mathbb{N}$. Using this $\delta$, let $r_1, r_2, \ldots, r_m$ be a finite collection of rational points with the property that the union of the neighborhoods $V_\delta(r_i)$ contains $[0,1]$.

      Explain why there must exist an $N \in \mathbb{N}$ such that
      $$|g_s(r_i) - g_t(r_i)| < \frac{\epsilon}{3}$$
      for all $s, t \ge N$ and $r_i$ in the finite subset of $[0,1]$ just described. Why does having the set $\{r_1, r_2, \ldots, r_m\}$ be finite matter?

      (c) Finish the argument by showing that, for an arbitrary $x \in [0,1]$,
      $$|g_s(x) - g_t(x)| < \epsilon$$
